<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Helix Jump 3D</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0d0f17;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #game-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    /* Top Navigation Bar */
    #top-bar {
      position: absolute;
      top: 14px;
      left: 0;
      width: 100%;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
      pointer-events: auto;
    }

    .home-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #fff;
      text-decoration: none;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(10px);
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 14px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: 0.2s;
    }

    .home-btn:active {
      transform: scale(0.95);
      background: rgba(255, 255, 255, 0.25);
    }

    .profile-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 5px 14px 5px 6px;
      border-radius: 25px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
    }

    .profile-badge img {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid #ff416c;
    }

    /* HUD (Score & Progress) */
    #hud {
      position: absolute;
      top: 70px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 10;
      pointer-events: none;
      width: 80%;
      max-width: 320px;
    }

    #score-val {
      font-size: 52px;
      font-weight: 900;
      color: #ffffff;
      line-height: 1;
      margin-bottom: 12px;
      text-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
    }

    .progress-bar-wrap {
      display: flex;
      align-items: center;
      width: 100%;
      gap: 10px;
    }

    .level-num {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #ff5e3a;
      color: #fff;
      font-weight: 800;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .level-num.next {
      background: rgba(255, 255, 255, 0.2);
    }

    .bar-bg {
      flex: 1;
      height: 8px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      overflow: hidden;
    }

    .bar-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #ff5e3a, #ff2a6d);
      transition: width 0.3s ease;
    }

    /* Game Over / Victory Modal */
    #modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(8, 10, 16, 0.85);
      backdrop-filter: blur(8px);
      z-index: 25;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .modal-box {
      background: #141724;
      border: 2px solid #ff416c;
      padding: 30px 24px;
      border-radius: 24px;
      text-align: center;
      width: 85%;
      max-width: 320px;
      box-shadow: 0 0 35px rgba(255, 65, 108, 0.35);
    }

    .modal-box h2 {
      font-size: 26px;
      color: #fff;
      margin-bottom: 10px;
    }

    .modal-box p {
      color: #aaa;
      font-size: 15px;
      margin-bottom: 24px;
    }

    .play-btn {
      width: 100%;
      padding: 14px;
      border-radius: 30px;
      background: linear-gradient(45deg, #ff416c, #ff4b2b);
      border: none;
      color: #fff;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(255, 65, 108, 0.4);
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div id="top-bar">
    <a href="index.html" class="home-btn">⬅ Home</a>
    <div class="profile-badge">
      <img src="insta.jpg" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3135/3135715.png'" alt="Satish" />
      <span>@_satish_official_16</span>
    </div>
  </div>

  <!-- HUD -->
  <div id="hud">
    <div id="score-val">0</div>
    <div class="progress-bar-wrap">
      <div class="level-num" id="curr-lvl">1</div>
      <div class="bar-bg">
        <div class="bar-fill" id="progress-fill"></div>
      </div>
      <div class="level-num next" id="next-lvl">2</div>
    </div>
  </div>

  <!-- Game Over Modal -->
  <div id="modal">
    <div class="modal-box">
      <h2 id="modal-title">GAME OVER 💥</h2>
      <p id="modal-desc">You landed on a trap! Final Score: 0</p>
      <button class="play-btn" onclick="restartGame()">PLAY AGAIN</button>
    </div>
  </div>

  <canvas id="game-canvas"></canvas>

  <script>
    // --- THREE.JS SCENE SETUP ---
    const canvas = document.getElementById('game-canvas');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0e111a);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    // Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const sun = new THREE.DirectionalLight(0xffffff, 0.9);
    sun.position.set(10, 25, 20);
    scene.add(sun);

    // --- GAME CONSTANTS ---
    const TOTAL_FLOORS = 15;
    const FLOOR_GAP = 7.5;
    const POLE_RADIUS = 1.4;
    const PLAT_RADIUS = 5.2;
    const BALL_RADIUS = 0.5;
    const SEGMENTS_PER_RING = 12; // 30 degrees each
    const ARC = (Math.PI * 2) / SEGMENTS_PER_RING;

    // Center Pillar
    const poleGeo = new THREE.CylinderGeometry(POLE_RADIUS, POLE_RADIUS, TOTAL_FLOORS * FLOOR_GAP + 20, 32);
    const poleMat = new THREE.MeshStandardMaterial({ color: 0x1f2330, roughness: 0.5 });
    const pole = new THREE.Mesh(poleGeo, poleMat);
    pole.position.y = -(TOTAL_FLOORS * FLOOR_GAP) / 2;
    scene.add(pole);

    // Rotating World Group
    const helixGroup = new THREE.Group();
    scene.add(helixGroup);

    // Materials
    const normalMat = new THREE.MeshStandardMaterial({ color: 0xf5b041, roughness: 0.3 }); // Yellow
    const trapMat = new THREE.MeshStandardMaterial({ color: 0xe74c3c, roughness: 0.2 });   // Red
    const finishMat = new THREE.MeshStandardMaterial({ color: 0x2ecc71, roughness: 0.2 }); // Green
    const splatMat = new THREE.MeshBasicMaterial({ color: 0x00f2fe, depthWrite: false });  // Cyan splatters

    // --- BUILD HELIX LEVELS ---
    let floors = [];

    function buildLevel() {
      // Clear old meshes
      while (helixGroup.children.length > 0) {
        helixGroup.remove(helixGroup.children[0]);
      }
      floors = [];

      for (let f = 0; f < TOTAL_FLOORS; f++) {
        const floorY = -f * FLOOR_GAP;
        const floorData = { y: floorY, index: f, segments: [], passed: false };

        if (f === TOTAL_FLOORS - 1) {
          // Finish Platform (Solid green)
          const finishGeo = new THREE.CylinderGeometry(PLAT_RADIUS, PLAT_RADIUS, 0.45, 32);
          const finishMesh = new THREE.Mesh(finishGeo, finishMat);
          finishMesh.position.y = floorY;
          helixGroup.add(finishMesh);
          floorData.isFinish = true;
        } else {
          // Regular floor with holes and traps
          // 2 or 3 empty slots for easy dropping
          const holeStart = Math.floor(Math.random() * SEGMENTS_PER_RING);
          const holeSize = 3; // 3 slots wide = 90 degree clear hole!
          const trapSlot = (holeStart + 5 + Math.floor(Math.random() * 3)) % SEGMENTS_PER_RING;

          for (let s = 0; s < SEGMENTS_PER_RING; s++) {
            // Check if slot is inside hole
            let isHole = false;
            for (let h = 0; h < holeSize; h++) {
              if (s === (holeStart + h) % SEGMENTS_PER_RING) isHole = true;
            }
            if (isHole) continue; // Skip rendering mesh (creates actual hole)

            const isTrap = (f > 0 && s === trapSlot);
            const segGeo = new THREE.CylinderGeometry(
              PLAT_RADIUS, PLAT_RADIUS, 0.45, 12, 1, false,
              s * ARC, ARC * 0.98
            );
            const segMesh = new THREE.Mesh(segGeo, isTrap ? trapMat : normalMat);
            segMesh.position.y = floorY;
            helixGroup.add(segMesh);

            floorData.segments.push({
              startAngle: s * ARC,
              endAngle: (s + 1) * ARC,
              isTrap: isTrap
            });
          }
        }
        floors.push(floorData);
      }
    }

    // --- BALL CREATION ---
    const ballGeo = new THREE.SphereGeometry(BALL_RADIUS, 32, 32);
    const ballMat = new THREE.MeshStandardMaterial({
      color: 0x00f2fe,
      emissive: 0x00a8b5,
      emissiveIntensity: 0.3,
      roughness: 0.1
    });
    const ball = new THREE.Mesh(ballGeo, ballMat);
    scene.add(ball);

    // Ball & Camera State
    const ballZ = (PLAT_RADIUS + POLE_RADIUS) / 2;
    let ballY = 2;
    let ballVY = 0;
    const gravity = -0.016;
    const bounceForce = 0.33;

    let score = 0;
    let passedCount = 0;
    let isGameOver = false;

    // Steady camera that locks to current target floor
    let cameraTargetY = 4;
    camera.position.set(0, 4, 15);
    camera.lookAt(0, 1, 0);

    // --- SPLATTER EFFECT ON BOUNCE ---
    function addSplatter(yPos) {
      const splatGeo = new THREE.CircleGeometry(0.55 + Math.random() * 0.3, 16);
      splatGeo.rotateX(-Math.PI / 2);
      const splatMesh = new THREE.Mesh(splatGeo, splatMat);
      splatMesh.position.set(0, yPos + 0.24, ballZ);
      // Attach to helix so it rotates with tower
      helixGroup.add(splatMesh);
      // Keep it relative to current rotation
      splatMesh.rotation.y = -helixGroup.rotation.y;
    }

    // --- CONTROLS (TOUCH & DRAG) ---
    let isDragging = false;
    let lastX = 0;

    window.addEventListener('pointerdown', (e) => {
      isDragging = true;
      lastX = e.clientX;
    });

    window.addEventListener('pointermove', (e) => {
      if (!isDragging || isGameOver) return;
      const dx = e.clientX - lastX;
      helixGroup.rotation.y += dx * 0.008; // Smooth rotational sensitivity
      lastX = e.clientX;
    });

    window.addEventListener('pointerup', () => isDragging = false);
    window.addEventListener('pointercancel', () => isDragging = false);

    // --- GAME ENGINE LOOP ---
    function updatePhysics() {
      if (isGameOver) return;

      ballVY += gravity;
      ballY += ballVY;
      ball.position.set(0, ballY, ballZ);

      // Check collision with floors
      for (let i = 0; i < floors.length; i++) {
        const fl = floors[i];
        const floorSurface = fl.y + 0.22;

        // Has the ball hit the plane of this floor while moving downward?
        if (ballY - BALL_RADIUS <= floorSurface && (ballY - ballVY - BALL_RADIUS) >= floorSurface - 0.5) {
          if (fl.isFinish) {
            // Won!
            triggerModal("LEVEL CLEAR! 🏆", "Amazing run! Final Score: " + score);
            return;
          }

          // Calculate current angle of the tower beneath the ball
          let currentAngle = (-helixGroup.rotation.y) % (Math.PI * 2);
          if (currentAngle < 0) currentAngle += Math.PI * 2;

          // Check if ball lands on a solid segment
          const hitSegment = fl.segments.find(seg => currentAngle >= seg.startAngle && currentAngle < seg.endAngle);

          if (hitSegment) {
            if (hitSegment.isTrap) {
              triggerModal("GAME OVER 💥", "You landed on a trap! Final Score: " + score);
              return;
            } else {
              // Bounce!
              ballY = floorSurface + BALL_RADIUS;
              ballVY = bounceForce;
              addSplatter(fl.y);
              break;
            }
          }
        }

        // Check if ball successfully fell below this floor without bouncing
        if (!fl.passed && ballY < fl.y - 0.4) {
          fl.passed = true;
          passedCount++;
          score += 10;
          document.getElementById('score-val').innerText = score;
          document.getElementById('progress-fill').style.width = (passedCount / (TOTAL_FLOORS - 1)) * 100 + "%";

          // Lower camera smoothly to next floor
          cameraTargetY = fl.y - 3.5;
        }
      }

      // Smooth camera follow without shaking or dropping off screen
      camera.position.y += (cameraTargetY - camera.position.y) * 0.08;
      camera.lookAt(0, camera.position.y - 2.8, 0);
    }

    function triggerModal(title, desc) {
      isGameOver = true;
      document.getElementById('modal-title').innerText = title;
      document.getElementById('modal-desc').innerText = desc;
      document.getElementById('modal').style.display = 'flex';
    }

    window.restartGame = function() {
      isGameOver = false;
      score = 0;
      passedCount = 0;
      ballY = 2;
      ballVY = 0;
      cameraTargetY = 4;
      camera.position.set(0, 4, 15);
      helixGroup.rotation.y = 0;
      document.getElementById('score-val').innerText = '0';
      document.getElementById('progress-fill').style.width = '0%';
      document.getElementById('modal').style.display = 'none';
      buildLevel();
    };

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Start
    buildLevel();

    function loop() {
      requestAnimationFrame(loop);
      updatePhysics();
      renderer.render(scene, camera);
    }
    loop();
  </script>
</body>
</html>
