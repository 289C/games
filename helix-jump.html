<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Helix Jump 3D Pro</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 30%, #1a1c29, #090a10);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #game-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    /* Top Navigation Bar */
    #header-bar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 60px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.7) 0%, transparent 100%);
      pointer-events: auto;
    }

    .back-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #fff;
      text-decoration: none;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 14px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      cursor: pointer;
      transition: 0.2s ease;
    }

    .back-btn:hover, .back-btn:active {
      background: rgba(255, 255, 255, 0.3);
      transform: scale(0.96);
    }

    .game-logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .game-logo img {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      box-shadow: 0 0 12px rgba(255, 75, 43, 0.6);
    }

    .game-logo span {
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 0.5px;
      background: linear-gradient(45deg, #ff416c, #ff4b2b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    /* Score & Level Display */
    #ui-hud {
      position: absolute;
      top: 70px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 10;
      pointer-events: none;
    }

    #score-val {
      font-size: 48px;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
    }

    #level-badge {
      font-size: 14px;
      font-weight: 700;
      color: #00f2fe;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    /* Game Over / Win Overlay */
    #overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(8, 10, 16, 0.85);
      backdrop-filter: blur(8px);
      z-index: 20;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    #overlay h1 {
      font-size: 40px;
      margin-bottom: 8px;
    }

    #overlay p {
      color: #aaa;
      margin-bottom: 24px;
    }

    #restart-btn {
      padding: 12px 32px;
      border-radius: 30px;
      background: linear-gradient(45deg, #ff416c, #ff4b2b);
      border: none;
      color: #fff;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(255, 65, 108, 0.5);
    }
  </style>
</head>
<body>

  <!-- Top Navigation Header -->
  <header id="header-bar">
    <a href="index.html" class="back-btn">🔙 Back</a>
    <div class="game-logo">
      <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/poke-ball.png" alt="Helix Jump" />
      <span>Helix 3D</span>
    </div>
  </header>

  <!-- Game HUD -->
  <div id="ui-hud">
    <div id="level-badge">Level 1</div>
    <div id="score-val">0</div>
  </div>

  <!-- Game Over Screen -->
  <div id="overlay">
    <h1 id="overlay-title">GAME OVER</h1>
    <p id="overlay-score">Score: 0</p>
    <button id="restart-btn" onclick="resetGame()">PLAY AGAIN</button>
  </div>

  <!-- Canvas -->
  <canvas id="game-canvas"></canvas>

  <script>
    // --- 3D ENGINE & SCENE SETUP ---
    const canvas = document.getElementById('game-canvas');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0e1017, 0.015);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    // Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(10, 20, 15);
    scene.add(dirLight);

    // --- GAME CONSTANTS ---
    const TOTAL_FLOORS = 15;
    const FLOOR_SPACING = 9;
    const POLE_RADIUS = 1.8;
    const PLATFORM_RADIUS = 6.2;
    const BALL_RADIUS = 0.55;

    // Central Pillar
    const poleGeo = new THREE.CylinderGeometry(POLE_RADIUS, POLE_RADIUS, TOTAL_FLOORS * FLOOR_SPACING + 20, 32);
    const poleMat = new THREE.MeshStandardMaterial({ color: 0x222633, roughness: 0.5 });
    const pole = new THREE.Mesh(poleGeo, poleMat);
    pole.position.y = -(TOTAL_FLOORS * FLOOR_SPACING) / 2;
    scene.add(pole);

    // Group for all rotating platforms
    const helixGroup = new THREE.Group();
    scene.add(helixGroup);

    // Platform Slices Generation
    const safeMat = new THREE.MeshStandardMaterial({ color: 0xff4b2b, roughness: 0.3 });
    const dangerMat = new THREE.MeshStandardMaterial({ color: 0x111318, roughness: 0.8 }); // Black/red danger zone
    const finishMat = new THREE.MeshStandardMaterial({ color: 0x00f2fe, roughness: 0.2 });

    const platforms = [];

    function buildHelix() {
      helixGroup.clear();
      platforms.length = 0;

      for (let f = 0; f < TOTAL_FLOORS; f++) {
        const floorY = -f * FLOOR_SPACING;
        const floorObj = { y: floorY, segments: [] };

        if (f === TOTAL_FLOORS - 1) {
          // Finish Platform
          const geo = new THREE.CylinderGeometry(PLATFORM_RADIUS, PLATFORM_RADIUS, 0.6, 32, 1, false, 0, Math.PI * 2);
          const mesh = new THREE.Mesh(geo, finishMat);
          mesh.position.y = floorY;
          helixGroup.add(mesh);
          floorObj.isFinish = true;
        } else {
          // Segments with gap and danger zone
          const segmentCount = 10;
          const openSlot = Math.floor(Math.random() * segmentCount);
          const dangerSlot = (openSlot + 2 + Math.floor(Math.random() * (segmentCount - 4))) % segmentCount;

          for (let s = 0; s < segmentCount; s++) {
            if (s === openSlot || s === (openSlot + 1) % segmentCount) continue; // 2 slots wide empty drop hole

            const isDanger = (f > 1 && s === dangerSlot);
            const arcLength = (Math.PI * 2) / segmentCount;
            const geo = new THREE.CylinderGeometry(
              PLATFORM_RADIUS, PLATFORM_RADIUS, 0.5, 16, 1, false, 
              s * arcLength, arcLength * 0.96
            );
            const mesh = new THREE.Mesh(geo, isDanger ? dangerMat : safeMat);
            mesh.position.y = floorY;
            helixGroup.add(mesh);

            floorObj.segments.push({
              startAngle: s * arcLength,
              endAngle: (s + 1) * arcLength,
              isDanger: isDanger
            });
          }
        }
        platforms.push(floorObj);
      }
    }

    // --- BALL CREATION ---
    const ballGeo = new THREE.SphereGeometry(BALL_RADIUS, 32, 32);
    const ballMat = new THREE.MeshStandardMaterial({ color: 0xffd700, roughness: 0.1, metalness: 0.2 });
    const ball = new THREE.Mesh(ballGeo, ballMat);
    ball.position.set(0, 3, (PLATFORM_RADIUS + POLE_RADIUS) / 2);
    scene.add(ball);

    // --- GAME STATE ---
    let ballVY = 0;
    const gravity = -0.015;
    const bounceVelocity = 0.32;
    let score = 0;
    let currentFloorIndex = 0;
    let isGameOver = false;

    // Camera initial position
    camera.position.set(0, 7, 18);
    camera.lookAt(0, 2, 0);

    // --- CONTROLS (TOUCH & DRAG) ---
    let isDragging = false;
    let previousX = 0;

    window.addEventListener('pointerdown', (e) => {
      isDragging = true;
      previousX = e.clientX;
    });

    window.addEventListener('pointermove', (e) => {
      if (!isDragging || isGameOver) return;
      const deltaX = e.clientX - previousX;
      helixGroup.rotation.y += deltaX * 0.009;
      previousX = e.clientX;
    });

    window.addEventListener('pointerup', () => isDragging = false);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- COLLISION & GAME MECHANICS ---
    function updateGame() {
      if (isGameOver) return;

      ballVY += gravity;
      ball.position.y += ballVY;

      // Check collision with the current and next floor
      platforms.forEach((platform) => {
        const distY = ball.position.y - (platform.y + 0.3);

        if (distY <= BALL_RADIUS && distY >= -0.6 && ballVY < 0) {
          if (platform.isFinish) {
            triggerWin();
            return;
          }

          // Calculate current angle on helix relative to ball position (fixed at angle 0 in world space)
          let currentAngle = (-helixGroup.rotation.y) % (Math.PI * 2);
          if (currentAngle < 0) currentAngle += Math.PI * 2;

          let hitSegment = platform.segments.find(seg => 
            currentAngle >= seg.startAngle && currentAngle <= seg.endAngle
          );

          if (hitSegment) {
            if (hitSegment.isDanger) {
              triggerGameOver();
            } else {
              // Bounce
              ballVY = bounceVelocity;
              ball.position.y = platform.y + 0.3 + BALL_RADIUS;
            }
          } else {
            // Fell through hole
            if (ball.position.y < platform.y - 1 && currentFloorIndex <= platform.y) {
              score += 10;
              document.getElementById('score-val').innerText = score;
              currentFloorIndex = platform.y - FLOOR_SPACING;
            }
          }
        }
      });

      // Smooth Camera tracking down
      const targetCamY = ball.position.y + 5;
      camera.position.y += (targetCamY - camera.position.y) * 0.08;
      camera.lookAt(0, ball.position.y - 1, 0);
    }

    function triggerGameOver() {
      isGameOver = true;
      document.getElementById('overlay-title').innerText = 'GAME OVER';
      document.getElementById('overlay-score').innerText = 'Final Score: ' + score;
      document.getElementById('overlay').style.display = 'flex';
    }

    function triggerWin() {
      isGameOver = true;
      document.getElementById('overlay-title').innerText = 'LEVEL CLEAR!';
      document.getElementById('overlay-score').innerText = 'Awesome! Score: ' + score;
      document.getElementById('overlay').style.display = 'flex';
    }

    window.resetGame = function() {
      isGameOver = false;
      score = 0;
      currentFloorIndex = 0;
      ballVY = 0;
      ball.position.set(0, 3, (PLATFORM_RADIUS + POLE_RADIUS) / 2);
      helixGroup.rotation.y = 0;
      document.getElementById('score-val').innerText = '0';
      document.getElementById('overlay').style.display = 'none';
      buildHelix();
    };

    // Initialize
    buildHelix();

    // Render loop
    function animate() {
      requestAnimationFrame(animate);
      updateGame();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
