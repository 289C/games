<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Helix Jump 3D Pro - Arcade Hub</title>

  <!-- Three.js 3D Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(18, 24, 38, 0.92);
      --border: rgba(255, 255, 255, 0.14);
      --cyan: #00f2fe;
      --gold: #ffd700;
      --red: #ff3838;
      --green: #2ecc71;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    body {
      background: radial-gradient(circle at 50% 15%, #182236 0%, #060810 100%);
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 10px 16px;
      overflow: hidden;
    }

    /* Top Navigation Bar */
    .top-nav {
      width: 95%;
      max-width: 440px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
      z-index: 20;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: #fff;
      text-decoration: none;
      font-size: 12px;
      font-weight: 800;
      padding: 6px 14px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 14px rgba(0,0,0,0.4);
    }

    /* Pinned Instagram Header */
    .ig-header {
      width: 95%;
      max-width: 440px;
      margin-bottom: 6px;
      padding: 6px 14px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 50px;
      backdrop-filter: blur(14px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.6);
      z-index: 10;
    }

    .ig-profile {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dp-frame {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      padding: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .dp-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    .ig-name {
      font-size: 12px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .verified {
      background: #0095f6;
      color: #fff;
      font-size: 8px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .follow-btn {
      background: linear-gradient(135deg, #f58529, #dd2a7b, #8134af);
      color: #fff;
      text-decoration: none;
      font-size: 10px;
      font-weight: 800;
      padding: 5px 12px;
      border-radius: 20px;
    }

    /* Level Progress Indicator */
    .progress-bar-wrap {
      width: 95%;
      max-width: 440px;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .level-badge {
      font-size: 12px;
      font-weight: 900;
      color: var(--cyan);
      background: rgba(0, 242, 254, 0.15);
      border: 1px solid var(--cyan);
      padding: 2px 8px;
      border-radius: 12px;
    }

    .progress-track {
      flex: 1;
      height: 8px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--cyan), var(--gold));
      transition: width 0.15s ease;
    }

    /* 3D Game Canvas Frame */
    .canvas-container {
      position: relative;
      width: min(96vw, 440px);
      height: calc(min(96vw, 440px) * (16 / 10));
      border: 2px solid rgba(255, 255, 255, 0.14);
      border-radius: 20px;
      overflow: hidden;
      background: #090c14;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9), 0 0 30px rgba(0, 242, 254, 0.15);
    }

    #canvas3d {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Overlays */
    .hud-overlay {
      position: absolute;
      top: 12px;
      left: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
      z-index: 5;
    }

    .current-score {
      font-size: 34px;
      font-weight: 900;
      letter-spacing: 1px;
      text-shadow: 0 4px 14px rgba(0, 0, 0, 0.9);
    }

    .fireball-pill {
      margin-top: 4px;
      background: linear-gradient(135deg, #ff5722, #ff007f);
      color: #fff;
      font-size: 11px;
      font-weight: 900;
      padding: 3px 12px;
      border-radius: 20px;
      opacity: 0;
      transform: scale(0.8);
      transition: opacity 0.2s, transform 0.2s;
      box-shadow: 0 0 15px rgba(255, 87, 34, 0.9);
    }

    .fireball-pill.active {
      opacity: 1;
      transform: scale(1);
    }

    .swipe-hint {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 800;
      pointer-events: none;
      white-space: nowrap;
    }

    .score-pop {
      position: absolute;
      font-size: 20px;
      font-weight: 900;
      color: var(--gold);
      pointer-events: none;
      animation: floatPop 0.6s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
    }

    @keyframes floatPop {
      0% { transform: translate(-50%, 0) scale(0.7); opacity: 1; }
      100% { transform: translate(-50%, -40px) scale(1.2); opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="top-nav">
    <a href="index.html" class="back-btn">← Back to Hub</a>
    <div style="font-size:11px; font-weight:800; color:rgba(255,255,255,0.7);">VOODOO STYLE 3D</div>
  </div>

  <header class="ig-header">
    <div class="ig-profile">
      <div class="dp-frame">
        <img src="Insta.jpg" alt="DP" class="dp-img" onerror="this.onerror=null; this.src='insta.jpg';" />
      </div>
      <div>
        <div class="ig-name">@_satish_official_16 <span class="verified">✓</span></div>
        <div style="font-size:9px; color:rgba(255,255,255,0.6);">Helix Jump Championship</div>
      </div>
    </div>
    <a href="https://instagram.com/_satish_official_16" target="_blank" class="follow-btn">Follow ↗</a>
  </header>

  <div class="progress-bar-wrap">
    <span class="level-badge" id="currentLvlBadge">LVL 1</span>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <span class="level-badge" id="nextLvlBadge" style="border-color:var(--gold); color:var(--gold);">LVL 2</span>
  </div>

  <div class="canvas-container" id="gameFrame">
    <div class="hud-overlay">
      <div class="current-score" id="scoreVal">0</div>
      <div class="fireball-pill" id="fireballPill">🔥 FIREBALL BLAST MODE!</div>
    </div>
    <div class="swipe-hint" id="swipeHint">↔️ DRAG TO ROTATE TOWER</div>
    <canvas id="canvas3d"></canvas>
  </div>

  <script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playTone(freq, type = 'sine', duration = 0.08, gainVal = 0.25) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      g.gain.setValueAtTime(gainVal, audioCtx.currentTime);
      g.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(g);
      g.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    const Sound = {
      bounce: () => playTone(280, 'triangle', 0.08, 0.3),
      passTier: () => playTone(650, 'sine', 0.1, 0.25),
      fireballSmash: () => { playTone(120, 'sawtooth', 0.25, 0.4); playTone(880, 'sine', 0.15, 0.3); },
      fail: () => playTone(85, 'sawtooth', 0.4, 0.5),
      win: () => { playTone(523, 'sine', 0.12); setTimeout(() => playTone(659, 'sine', 0.12), 100); setTimeout(() => playTone(784, 'sine', 0.2), 200); }
    };

    let scene, camera, renderer;
    let towerGroup, ballMesh;
    const tiers = [];
    const particles = [];

    let currentLevel = 1;
    let score = 0;
    const TOTAL_TIERS = 24;
    const TIER_SPACING = 3.2;
    const BALL_RADIUS = 0.36;
    const BALL_FORWARD_Z = 2.4;

    const ballPhys = {
      y: 1.6,
      vy: 0,
      gravity: -0.015,
      bounceStrength: 0.30,
      comboTiersPassed: 0,
      isFireball: false
    };

    function init3D() {
      const frame = document.getElementById('gameFrame');
      const canvas = document.getElementById('canvas3d');

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0a0e1a);
      scene.fog = new THREE.FogExp2(0x0a0e1a, 0.018);

      camera = new THREE.PerspectiveCamera(50, frame.clientWidth / frame.clientHeight, 0.1, 200);
      camera.position.set(0, 4.2, 10.5);
      camera.lookAt(0, 0, 0);

      renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(frame.clientWidth, frame.clientHeight);

      const ambient = new THREE.AmbientLight(0xffffff, 0.75);
      scene.add(ambient);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
      dirLight.position.set(5, 20, 10);
      scene.add(dirLight);

      towerGroup = new THREE.Group();
      const coreGeo = new THREE.CylinderGeometry(1.2, 1.2, TOTAL_TIERS * TIER_SPACING + 14, 32);
      const coreMat = new THREE.MeshStandardMaterial({ color: 0x3d4756, roughness: 0.4 });
      const coreMesh = new THREE.Mesh(coreGeo, coreMat);
      coreMesh.position.y = - (TOTAL_TIERS * TIER_SPACING) / 2;
      towerGroup.add(coreMesh);
      scene.add(towerGroup);

      const ballGeo = new THREE.SphereGeometry(BALL_RADIUS, 24, 24);
      const ballMat = new THREE.MeshStandardMaterial({
        color: 0x00f2fe,
        emissive: 0x00a8ff,
        emissiveIntensity: 0.35,
        roughness: 0.2
      });
      ballMesh = new THREE.Mesh(ballGeo, ballMat);
      ballMesh.position.set(0, 1.6, BALL_FORWARD_Z);
      scene.add(ballMesh);

      buildLevel(currentLevel);
      bindDragControls();
      window.addEventListener('resize', onResize);
      animate();
    }

    function buildLevel(lvl) {
      tiers.forEach(t => towerGroup.remove(t.group));
      tiers.length = 0;

      const themes = [
        { safe: 0x2ecc71, hazard: 0xff3838 },
        { safe: 0xffd700, hazard: 0x9b59b6 },
        { safe: 0x00f2fe, hazard: 0xff007f },
        { safe: 0xff9f43, hazard: 0xee5253 }
      ];
      const theme = themes[(lvl - 1) % themes.length];

      for (let i = 0; i < TOTAL_TIERS; i++) {
        const tierGroup = new THREE.Group();
        const tierY = -i * TIER_SPACING;
        tierGroup.position.y = tierY;

        const gapSlot = Math.floor(Math.random() * 8);
        const hazardSlot = (gapSlot + 4) % 8;
        const segments = [];

        for (let s = 0; s < 8; s++) {
          if (s === gapSlot) continue;

          const isHazard = (s === hazardSlot) && (i > 0);
          const segMesh = createSectorMesh(isHazard ? theme.hazard : theme.safe, isHazard);

          segMesh.rotation.y = s * (Math.PI / 4);
          segMesh.userData = { slot: s, isHazard, intact: true };
          tierGroup.add(segMesh);
          segments.push(segMesh);
        }

        tierGroup.rotation.y = Math.random() * Math.PI * 2;
        towerGroup.add(tierGroup);

        tiers.push({
          group: tierGroup,
          y: tierY,
          gapSlot: gapSlot,
          segments: segments,
          cleared: false
        });
      }

      // Finish Base Platform
      const finishGeo = new THREE.CylinderGeometry(3.6, 3.6, 0.6, 32);
      const finishMat = new THREE.MeshStandardMaterial({ color: 0xffd700, roughness: 0.2 });
      const finishMesh = new THREE.Mesh(finishGeo, finishMat);
      finishMesh.position.y = -TOTAL_TIERS * TIER_SPACING;
      towerGroup.add(finishMesh);

      // Reset Ball State
      ballPhys.y = 1.6;
      ballPhys.vy = 0;
      ballPhys.comboTiersPassed = 0;
      setFireballMode(false);
      updateProgress();
    }

    function createSectorMesh(color, isHazard) {
      const shape = new THREE.Shape();
      const inner = 1.25;
      const outer = 3.6;
      const angleSpan = (Math.PI / 4) - 0.04;

      shape.moveTo(inner, 0);
      shape.lineTo(outer, 0);
      shape.absarc(0, 0, outer, 0, angleSpan, false);
      shape.lineTo(inner * Math.cos(angleSpan), inner * Math.sin(angleSpan));
      shape.absarc(0, 0, inner, angleSpan, 0, true);
      shape.closePath();

      const extrudeSettings = { depth: 0.35, bevelEnabled: true, bevelSegments: 2, steps: 1, bevelSize: 0.04, bevelThickness: 0.04 };
      const geo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
      geo.rotateX(-Math.PI / 2); // Lay horizontal

      const mat = new THREE.MeshStandardMaterial({
        color: color,
        roughness: 0.3,
        metalness: isHazard ? 0.35 : 0.05
      });

      return new THREE.Mesh(geo, mat);
    }

    let isDragging = false;
    let prevTouchX = 0;

    function bindDragControls() {
      const frame = document.getElementById('gameFrame');

      const onStart = (clientX) => {
        isDragging = true;
        prevTouchX = clientX;
        document.getElementById('swipeHint').style.display = 'none';
      };

      const onMove = (clientX) => {
        if (!isDragging) return;
        const deltaX = clientX - prevTouchX;
        prevTouchX = clientX;
        towerGroup.rotation.y += deltaX * 0.009;
      };

      const onEnd = () => { isDragging = false; };

      frame.addEventListener('pointerdown', e => onStart(e.clientX));
      window.addEventListener('pointermove', e => onMove(e.clientX));
      window.addEventListener('pointerup', onEnd);
      window.addEventListener('pointercancel', onEnd);
    }

    function updatePhysics() {
      ballPhys.vy += ballPhys.gravity;
      ballPhys.y += ballPhys.vy;

      const tierIdx = Math.floor((-ballPhys.y + 0.35) / TIER_SPACING);
      const tier = tiers[tierIdx];

      if (tier) {
        const tierSurfaceY = tier.y + 0.35;
        const ballBottomY = ballPhys.y - BALL_RADIUS;

        // Collision Check Window
        if (ballBottomY <= tierSurfaceY && ballBottomY >= tierSurfaceY - 0.45 && ballPhys.vy < 0) {
          // Ball is located at angle = 0 in world space (along Z+ axis)
          const angleUnderBall = ((-towerGroup.rotation.y - tier.group.rotation.y) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
          const currentSlot = Math.floor(angleUnderBall / (Math.PI / 4)) % 8;

          if (currentSlot === tier.gapSlot) {
            // Passed cleanly through the empty gap!
            if (!tier.cleared) {
              tier.cleared = true;
              ballPhys.comboTiersPassed++;
              score += 15 * ballPhys.comboTiersPassed;
              Sound.passTier();
              showScorePopup(`+${15 * ballPhys.comboTiersPassed}`);

              if (ballPhys.comboTiersPassed >= 3) {
                setFireballMode(true);
              }
            }
          } else {
            // Hit a solid platform tile
            const hitSeg = tier.segments.find(s => s.userData.slot === currentSlot && s.userData.intact);

            if (ballPhys.isFireball) {
              Sound.fireballSmash();
              shatterTier(tier);
              score += 80;
              ballPhys.vy = -0.16;
              setFireballMode(false);
              showScorePopup('+80 BLAST! 🔥');
            } else if (hitSeg && hitSeg.userData.isHazard) {
              triggerGameOver();
              return;
            } else {
              // Solid safe bounce
              ballPhys.y = tierSurfaceY + BALL_RADIUS;
              ballPhys.vy = ballPhys.bounceStrength;
              ballPhys.comboTiersPassed = 0;
              setFireballMode(false);
              Sound.bounce();
              createPaintSplat(tierSurfaceY + 0.01, tier.group);
            }
          }
        }
      }

      // Check Finish Platform
      if (ballPhys.y <= -TOTAL_TIERS * TIER_SPACING + 0.6) {
        triggerVictory();
        return;
      }

      ballMesh.position.y = ballPhys.y;

      // Smooth Camera Tracking
      const targetCamY = THREE.MathUtils.lerp(camera.position.y, ballPhys.y + 3.0, 0.08);
      camera.position.y = targetCamY;
      camera.lookAt(0, targetCamY - 3.0, 0);

      document.getElementById('scoreVal').textContent = score;
      updateProgress();

      // Particle physics
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.position.add(p.userData.vel);
        p.userData.vel.y += -0.015;
        p.userData.life -= 0.03;
        p.material.opacity = p.userData.life;
        if (p.userData.life <= 0) {
          scene.remove(p);
          particles.splice(i, 1);
        }
      }
    }

    function setFireballMode(active) {
      ballPhys.isFireball = active;
      const pill = document.getElementById('fireballPill');
      if (active) {
        pill.classList.add('active');
        ballMesh.material.color.setHex(0xff5722);
        ballMesh.material.emissive.setHex(0xff007f);
      } else {
        pill.classList.remove('active');
        ballMesh.material.color.setHex(0x00f2fe);
        ballMesh.material.emissive.setHex(0x00a8ff);
      }
    }

    function createPaintSplat(surfaceY, parentTier) {
      const splatGeo = new THREE.CircleGeometry(0.32, 16);
      const splatMat = new THREE.MeshBasicMaterial({ color: 0x00f2fe, side: THREE.DoubleSide });
      const splat = new THREE.Mesh(splatGeo, splatMat);
      splat.rotation.x = -Math.PI / 2;
      splat.position.set(0, surfaceY - parentTier.position.y, BALL_FORWARD_Z);
      parentTier.add(splat);
    }

    function shatterTier(tier) {
      tier.segments.forEach(seg => {
        seg.userData.intact = false;
        seg.visible = false;
        for (let i = 0; i < 4; i++) {
          const geo = new THREE.BoxGeometry(0.4, 0.2, 0.4);
          const mat = new THREE.MeshBasicMaterial({ color: seg.material.color, transparent: true });
          const p = new THREE.Mesh(geo, mat);
          p.position.set(ballMesh.position.x, ballPhys.y, ballMesh.position.z);
          p.userData = {
            vel: new THREE.Vector3((Math.random() - 0.5) * 0.2, 0.15 + Math.random() * 0.1, (Math.random() - 0.5) * 0.2),
            life: 1.0
          };
          scene.add(p);
          particles.push(p);
        }
      });
    }

    function updateProgress() {
      const prog = Math.min(100, Math.max(0, (Math.abs(ballPhys.y) / (TOTAL_TIERS * TIER_SPACING)) * 100));
      document.getElementById('progressFill').style.width = prog + '%';
    }

    function triggerGameOver() {
      Sound.fail();
      alert(`💥 GAME OVER!\nFinal Score: ${score}`);
      score = 0;
      buildLevel(currentLevel);
    }

    function triggerVictory() {
      Sound.win();
      alert(`🎉 LEVEL ${currentLevel} CLEARED!\nProceeding to Level ${currentLevel + 1}!`);
      currentLevel++;
      document.getElementById('currentLvlBadge').textContent = `LVL ${currentLevel}`;
      document.getElementById('nextLvlBadge').textContent = `LVL ${currentLevel + 1}`;
      buildLevel(currentLevel);
    }

    function showScorePopup(txt) {
      const frame = document.getElementById('gameFrame');
      const pop = document.createElement('div');
      pop.className = 'score-pop';
      pop.textContent = txt;
      pop.style.left = '50%';
      pop.style.top = '35%';
      frame.appendChild(pop);
      setTimeout(() => pop.remove(), 600);
    }

    function onResize() {
      const frame = document.getElementById('gameFrame');
      renderer.setSize(frame.clientWidth, frame.clientHeight);
      camera.aspect = frame.clientWidth / frame.clientHeight;
      camera.updateProjectionMatrix();
    }

    function animate() {
      requestAnimationFrame(animate);
      updatePhysics();
      renderer.render(scene, camera);
    }

    window.onload = init3D;
  </script>
</body>
</html>
