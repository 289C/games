<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>HOLE.IO 2 - City</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #7da06d;
      color: #fff;
      touch-action: none;
    }

    /* Top Header Navigation */
    .top-nav {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 54px;
      background: rgba(14, 16, 24, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 14px;
      z-index: 100;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    }

    .nav-btn, .insta-btn {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      padding: 6px 12px;
      border-radius: 20px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .insta-img {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid #e1306c;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 7px;
      background: rgba(0, 0, 0, 0.5);
      padding: 5px 12px;
      border-radius: 12px;
      font-size: 11px;
      letter-spacing: 1.2px;
      font-weight: 800;
    }

    .online-indicator {
      width: 8px;
      height: 8px;
      background-color: #00ff88;
      border-radius: 50%;
      box-shadow: 0 0 8px #00ff88;
      animation: pulse 1.6s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 0.7; }
      50% { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(0.9); opacity: 0.7; }
    }

    /* In-Game Score HUD */
    .hud-container {
      position: absolute;
      top: 64px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 50;
      pointer-events: none;
    }

    .hud-col {
      text-align: center;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
    }

    .hud-lbl {
      font-size: 11px;
      font-weight: 700;
      color: #cbd5e1;
      letter-spacing: 1px;
    }

    .hud-num {
      font-size: 26px;
      font-weight: 900;
      color: #ffffff;
    }

    #gameCanvas {
      width: 100vw;
      height: 100vh;
      display: block;
    }

    /* Screen Overlays */
    .screen-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgba(10, 12, 18, 0.88);
      backdrop-filter: blur(8px);
      z-index: 200;
    }

    .hidden {
      display: none !important;
    }

    .card {
      width: 90%;
      max-width: 400px;
      background: #181926;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 26px 20px;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
      pointer-events: auto;
    }

    .title {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #c084fc, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 10px;
      pointer-events: auto;
      touch-action: manipulation;
    }

    .btn:active {
      transform: scale(0.98);
      filter: brightness(0.9);
    }

    .btn-purple {
      background: #8b5cf6;
      color: #fff;
    }

    .btn-gray {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    .input-box {
      width: 100%;
      padding: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      color: #fff;
      font-size: 15px;
      margin: 10px 0;
      outline: none;
      text-align: center;
    }

    .leaderboard-box {
      max-height: 180px;
      overflow-y: auto;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 12px;
      padding: 6px 12px;
      margin: 12px 0;
      text-align: left;
    }

    .lb-item {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      font-size: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .lb-active {
      color: #a855f7;
      font-weight: 800;
    }

    .float-fx {
      position: absolute;
      font-weight: 900;
      font-size: 20px;
      color: #fbbf24;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
      pointer-events: none;
      animation: floatUp 0.8s ease-out forwards;
      z-index: 80;
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-40px); }
    }
  </style>
</head>
<body>

  <!-- Header Navigation -->
  <header class="top-nav">
    <button id="backBtn" class="nav-btn">&#128281; Back</button>
    <div class="status-badge">
      <span class="online-indicator"></span>
      <span>ONLINE</span>
    </div>
    <a href="https://www.instagram.com/_satish_official_16?stkn=MTNzNXZ2cWpkdmRtNA==" target="_blank" rel="noopener noreferrer" class="insta-btn">
      <img src="Insta.jpg" alt="Instagram" class="insta-img" onerror="this.style.display='none'" />
      <span>@_satish_official_16</span>
    </a>
  </header>

  <!-- Live In-Game HUD -->
  <div id="gameHUD" class="hud-container hidden">
    <div class="hud-col">
      <div class="hud-lbl">SCORE</div>
      <div id="hudScore" class="hud-num">0</div>
    </div>
    <div class="hud-col">
      <div class="hud-lbl">TIME</div>
      <div id="hudTime" class="hud-num">120</div>
    </div>
    <div class="hud-col">
      <div class="hud-lbl">SIZE</div>
      <div id="hudSize" class="hud-num">2.4m</div>
    </div>
  </div>

  <canvas id="gameCanvas"></canvas>
  <div id="fxLayer"></div>

  <!-- Start Menu Screen -->
  <div id="lobbyScreen" class="screen-overlay">
    <div class="card">
      <h1 class="title">HOLE.IO 2</h1>
      <p style="color: #94a3b8; font-size: 13px; margin-bottom: 12px;">Swallow the entire city and grow!</p>
      
      <input type="text" id="playerName" class="input-box" value="Player" maxlength="12" placeholder="Your Name" />
      
      <button id="btnSolo" type="button" class="btn btn-purple">Play Solo (vs Bots)</button>
      <button id="btnRoom" type="button" class="btn btn-gray">Generate Room Code</button>
      
      <div id="roomCodeDisplay" style="margin-top: 10px; font-size: 14px; color:#d8b4fe;" class="hidden">
        Room Code: <strong id="generatedCode" style="font-size: 20px; letter-spacing: 2px;"></strong>
      </div>
    </div>
  </div>

  <!-- Game Over Screen -->
  <div id="gameOverScreen" class="screen-overlay hidden">
    <div class="card">
      <h2 style="font-size: 26px; font-weight: 900; margin-bottom: 6px;">TIME'S UP</h2>
      <div style="font-size: 38px; font-weight: 900; color: #a855f7;" id="endScore">0</div>
      <div style="font-size: 14px; color: #94a3b8; margin-bottom: 12px;" id="endSize">Hole size: 20.0m</div>

      <div class="leaderboard-box" id="leaderboardList"></div>

      <button id="btnRestart" type="button" class="btn btn-purple">Play Again</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let screenW = canvas.width = window.innerWidth;
    let screenH = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      screenW = canvas.width = window.innerWidth;
      screenH = canvas.height = window.innerHeight;
    });

    const BLOCK_SIZE = 340;
    const ROAD_WIDTH = 130;
    const WORLD_COLS = 12;
    const WORLD_ROWS = 12;
    const WORLD_W = WORLD_COLS * (BLOCK_SIZE + ROAD_WIDTH);
    const WORLD_H = WORLD_ROWS * (BLOCK_SIZE + ROAD_WIDTH);

    let isPlaying = false;
    let matchTime = 120;
    let timerInterval = null;

    let player;
    let opponents = [];
    let vehicles = [];
    let humans = [];
    let cityProps = [];

    let camera = { x: 0, y: 0 };
    let joystick = {
      active: false,
      baseX: 0,
      baseY: 0,
      stickX: 0,
      stickY: 0,
      dirX: 0,
      dirY: 0
    };

    function handleJoy(cx, cy) {
      if (!isPlaying) return;
      if (!joystick.active) {
        joystick.active = true;
        joystick.baseX = cx;
        joystick.baseY = cy;
      }
      const dx = cx - joystick.baseX;
      const dy = cy - joystick.baseY;
      const dist = Math.hypot(dx, dy);
      const maxR = 48;

      if (dist > maxR) {
        joystick.stickX = joystick.baseX + (dx / dist) * maxR;
        joystick.stickY = joystick.baseY + (dy / dist) * maxR;
      } else {
        joystick.stickX = cx;
        joystick.stickY = cy;
      }

      if (dist > 5) {
        joystick.dirX = dx / dist;
        joystick.dirY = dy / dist;
      } else {
        joystick.dirX = 0;
        joystick.dirY = 0;
      }
    }

    function resetJoy() {
      joystick.active = false;
      joystick.dirX = 0;
      joystick.dirY = 0;
    }

    canvas.addEventListener('touchstart', e => {
      if (e.touches.length > 0) handleJoy(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: false });

    canvas.addEventListener('touchmove', e => {
      e.preventDefault();
      if (e.touches.length > 0) handleJoy(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: false });

    canvas.addEventListener('touchend', resetJoy);
    canvas.addEventListener('touchcancel', resetJoy);

    canvas.addEventListener('mousedown', e => handleJoy(e.clientX, e.clientY));
    window.addEventListener('mousemove', e => { if (joystick.active) handleJoy(e.clientX, e.clientY); });
    window.addEventListener('mouseup', resetJoy);

    class BlackHole {
      constructor(x, y, radius, color, name, isBot = false) {
        this.x = x;
        this.y = y;
        this.radius = radius;
        this.targetRadius = radius;
        this.color = color;
        this.name = name;
        this.isBot = isBot;
        this.score = 0;
        this.speed = 3.6;
        this.targetX = x;
        this.targetY = y;
      }

      update() {
        this.radius += (this.targetRadius - this.radius) * 0.1;
        this.speed = Math.max(1.9, 4.0 - this.radius / 150);

        if (this.isBot) {
          if (Math.hypot(this.targetX - this.x, this.targetY - this.y) < 50 || Math.random() < 0.02) {
            this.targetX = Math.max(200, Math.min(WORLD_W - 200, this.x + (Math.random() - 0.5) * 800));
            this.targetY = Math.max(200, Math.min(WORLD_H - 200, this.y + (Math.random() - 0.5) * 800));
          }
          const angle = Math.atan2(this.targetY - this.y, this.targetX - this.x);
          this.x += Math.cos(angle) * (this.speed * 0.75);
          this.y += Math.sin(angle) * (this.speed * 0.75);
        } else {
          if (joystick.dirX !== 0 || joystick.dirY !== 0) {
            this.x += joystick.dirX * this.speed;
            this.y += joystick.dirY * this.speed;
          }
        }

        this.x = Math.max(this.radius, Math.min(WORLD_W - this.radius, this.x));
        this.y = Math.max(this.radius, Math.min(WORLD_H - this.radius, this.y));
      }

      draw(camX, camY) {
        const sx = this.x - camX;
        const sy = this.y - camY;

        ctx.save();
        ctx.beginPath();
        ctx.arc(sx, sy, this.radius + 6, 0, Math.PI * 2);
        ctx.fillStyle = '#c026d3';
        ctx.fill();

        ctx.beginPath();
        ctx.arc(sx, sy, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#260d36';
        ctx.fill();

        ctx.beginPath();
        ctx.arc(sx, sy, this.radius * 0.72, 0, Math.PI * 2);
        ctx.fillStyle = '#170724';
        ctx.fill();

        ctx.beginPath();
        ctx.arc(sx, sy, this.radius * 0.48, 0, Math.PI * 2);
        ctx.fillStyle = '#050209';
        ctx.fill();
        ctx.restore();
      }
    }

    class Vehicle {
      constructor(type) {
        this.type = type;
        this.isFalling = false;
        this.fall = 1.0;
        this.targetHole = null;
        this.init();
      }

      init() {
        this.isFalling = false;
        this.fall = 1.0;
        this.targetHole = null;
        this.horizontal = Math.random() < 0.5;

        if (this.type === 'bus') {
          this.w = 70;
          this.h = 24;
          this.color = '#eab308';
          this.reqRadius = 46;
          this.points = 120;
          this.speed = (Math.random() * 0.8 + 1.2) * (Math.random() < 0.5 ? 1 : -1);
        } else {
          this.w = 34;
          this.h = 18;
          const colors = ['#ef4444', '#3b82f6', '#10b981', '#f97316'];
          this.color = colors[Math.floor(Math.random() * colors.length)];
          this.reqRadius = 30;
          this.points = 50;
          this.speed = (Math.random() * 1.2 + 1.8) * (Math.random() < 0.5 ? 1 : -1);
        }

        if (this.horizontal) {
          const row = Math.floor(Math.random() * WORLD_ROWS);
          this.y = row * (BLOCK_SIZE + ROAD_WIDTH) + BLOCK_SIZE + ROAD_WIDTH / 2;
          this.x = Math.random() * WORLD_W;
        } else {
          const col = Math.floor(Math.random() * WORLD_COLS);
          this.x = col * (BLOCK_SIZE + ROAD_WIDTH) + BLOCK_SIZE + ROAD_WIDTH / 2;
          this.y = Math.random() * WORLD_H;
          const temp = this.w;
          this.w = this.h;
          this.h = temp;
        }
      }

      update() {
        if (this.isFalling) {
          this.fall -= 0.05;
          if (this.targetHole) {
            this.x += (this.targetHole.x - this.x) * 0.15;
            this.y += (this.targetHole.y - this.y) * 0.15;
          }
          return;
        }
        if (this.horizontal) {
          this.x += this.speed;
          if (this.x < 0) this.x = WORLD_W;
          if (this.x > WORLD_W) this.x = 0;
        } else {
          this.y += this.speed;
          if (this.y < 0) this.y = WORLD_H;
          if (this.y > WORLD_H) this.y = 0;
        }
      }

      draw(camX, camY) {
        const sx = this.x - camX;
        const sy = this.y - camY;

        ctx.save();
        ctx.translate(sx, sy);
        if (this.isFalling) ctx.scale(Math.max(0, this.fall), Math.max(0, this.fall));

        ctx.fillStyle = 'rgba(0,0,0,0.28)';
        ctx.fillRect(-this.w / 2 + 3, -this.h / 2 + 3, this.w, this.h);

        ctx.fillStyle = this.color;
        ctx.fillRect(-this.w / 2, -this.h / 2, this.w, this.h);

        ctx.fillStyle = '#bae6fd';
        if (this.w > this.h) {
          ctx.fillRect(-this.w / 2 + 4, -this.h / 2 + 3, this.w - 8, this.h - 6);
        } else {
          ctx.fillRect(-this.w / 2 + 3, -this.h / 2 + 4, this.w - 6, this.h - 8);
        }
        ctx.restore();
      }
    }

    class Human {
      constructor() {
        this.x = Math.random() * WORLD_W;
        this.y = Math.random() * WORLD_H;
        this.radius = 6;
        this.reqRadius = 14;
        this.points = 15;
        this.color = Math.random() < 0.5 ? '#f43f5e' : '#06b6d4';
        this.speed = 0.7;
        this.angle = Math.random() * Math.PI * 2;
        this.isFalling = false;
        this.fall = 1.0;
        this.targetHole = null;
      }

      update() {
        if (this.isFalling) {
          this.fall -= 0.08;
          if (this.targetHole) {
            this.x += (this.targetHole.x - this.x) * 0.18;
            this.y += (this.targetHole.y - this.y) * 0.18;
          }
          return;
        }
        this.x += Math.cos(this.angle) * this.speed;
        this.y += Math.sin(this.angle) * this.speed;
        if (Math.random() < 0.02) this.angle = Math.random() * Math.PI * 2;
      }

      draw(camX, camY) {
        const sx = this.x - camX;
        const sy = this.y - camY;
        ctx.save();
        ctx.translate(sx, sy);
        if (this.isFalling) ctx.scale(Math.max(0, this.fall), Math.max(0, this.fall));
        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.restore();
      }
    }

    class CityBuilding {
      constructor(x, y, w, h, isTree = false) {
        this.x = x;
        this.y = y;
        this.w = w;
        this.h = h;
        this.isTree = isTree;
        this.isFalling = false;
        this.fall = 1.0;
        this.angle = 0;
        this.tiltSpeed = (Math.random() - 0.5) * 0.12;
        this.targetHole = null;

        if (isTree) {
          this.radius = 16;
          this.reqRadius = 24;
          this.points = 25;
        } else {
          this.radius = Math.max(w, h) / 2;
          this.reqRadius = this.radius * 0.95;
          this.points = 350;
        }
      }

      update() {
        if (this.isFalling) {
          this.fall -= 0.035; // sinking into the hole
          this.angle += this.tiltSpeed;
          if (this.targetHole) {
            // Gravitational pull toward the center of the black hole
            this.x += (this.targetHole.x - this.x) * 0.12;
            this.y += (this.targetHole.y - this.y) * 0.12;
          }
        }
      }

      draw(camX, camY) {
        const sx = this.x - camX;
        const sy = this.y - camY;

        ctx.save();
        ctx.translate(sx, sy);
        if (this.isFalling) {
          ctx.rotate(this.angle);
          ctx.scale(Math.max(0, this.fall), Math.max(0, this.fall));
        }

        if (this.isTree) {
          ctx.fillStyle = 'rgba(0,0,0,0.2)';
          ctx.beginPath();
          ctx.arc(2, 2, 14, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#22c55e';
          ctx.beginPath();
          ctx.arc(0, 0, 14, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.fillStyle = 'rgba(0,0,0,0.25)';
          ctx.fillRect(-this.w / 2 + 6, -this.h / 2 + 6, this.w, this.h);

          ctx.fillStyle = '#64748b';
          ctx.fillRect(-this.w / 2, -this.h / 2, this.w, this.h);

          ctx.fillStyle = '#94a3b8';
          ctx.fillRect(-this.w / 2, -this.h / 2, this.w, 14);

          ctx.fillStyle = '#fef08a';
          for (let row = 18; row < this.h - 8; row += 16) {
            for (let col = 8; col < this.w - 8; col += 14) {
              ctx.fillRect(-this.w / 2 + col, -this.h / 2 + row, 8, 8);
            }
          }
        }
        ctx.restore();
      }
    }

    function buildCity() {
      cityProps = [];
      vehicles = [];
      humans = [];

      for (let r = 0; r < WORLD_ROWS; r++) {
        for (let c = 0; c < WORLD_COLS; c++) {
          const bx = c * (BLOCK_SIZE + ROAD_WIDTH) + BLOCK_SIZE / 2;
          const by = r * (BLOCK_SIZE + ROAD_WIDTH) + BLOCK_SIZE / 2;

          cityProps.push(new CityBuilding(bx, by, 120, 100, false));
          cityProps.push(new CityBuilding(bx - 90, by - 90, 0, 0, true));
          cityProps.push(new CityBuilding(bx + 90, by + 90, 0, 0, true));
        }
      }

      for (let i = 0; i < 45; i++) vehicles.push(new Vehicle('car'));
      for (let i = 0; i < 18; i++) vehicles.push(new Vehicle('bus'));
      for (let i = 0; i < 100; i++) humans.push(new Human());
    }

    function spawnBots() {
      opponents = [];
      const roster = ['Crimson', 'Emerald', 'Volt', 'Nova'];
      const colors = ['#dc2626', '#16a34a', '#ca8a04', '#db2777'];

      roster.forEach((name, i) => {
        opponents.push(new BlackHole(
            Math.random() * (WORLD_W - 400) + 200,
          Math.random() * (WORLD_H - 400) + 200,
          24,
          colors[i],
          name,
          true
        ));
      });
    }

    function drawRealCityGround(camX, camY) {
      ctx.fillStyle = '#86a873';
      ctx.fillRect(0, 0, screenW, screenH);

      const step = BLOCK_SIZE + ROAD_WIDTH;
      const startCol = Math.floor(camX / step) - 1;
      const endCol = Math.floor((camX + screenW) / step) + 1;
      const startRow = Math.floor(camY / step) - 1;
      const endRow = Math.floor((camY + screenH) / step) + 1;

      for (let r = startRow; r <= endRow; r++) {
        for (let c = startCol; c <= endCol; c++) {
          const bx = c * step - camX;
          const by = r * step - camY;

          ctx.fillStyle = '#d5dbdb';
          ctx.fillRect(bx - 12, by - 12, BLOCK_SIZE + 24, BLOCK_SIZE + 24);

          ctx.fillStyle = '#9cb988';
          ctx.fillRect(bx, by, BLOCK_SIZE, BLOCK_SIZE);

          ctx.fillStyle = '#8eae7b';
          ctx.fillRect(bx + 16, by + 16, BLOCK_SIZE - 32, BLOCK_SIZE - 32);

          const rx = bx + BLOCK_SIZE;
          const ry = by + BLOCK_SIZE;

          ctx.fillStyle = '#ffffff';
          for (let i = 0; i < BLOCK_SIZE; i += 40) {
            ctx.fillRect(bx + i, ry + ROAD_WIDTH / 2 - 2, 22, 4);
          }
          for (let i = 0; i < BLOCK_SIZE; i += 40) {
            ctx.fillRect(rx + ROAD_WIDTH / 2 - 2, by + i, 4, 22);
          }

          for (let w = 0; w < 4; w++) {
            ctx.fillRect(rx + 12 + w * 26, by + 4, 14, 26);
            ctx.fillRect(bx + 4, ry + 12 + w * 26, 26, 14);
          }
        }
      }
    }

    function drawVirtualController() {
      if (!joystick.active) return;

      ctx.save();
      ctx.beginPath();
      ctx.arc(joystick.baseX, joystick.baseY, 52, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(joystick.stickX, joystick.stickY, 26, 0, Math.PI * 2);
      ctx.fillStyle = '#a855f7';
      ctx.fill();
      ctx.shadowColor = '#c084fc';
      ctx.shadowBlur = 10;
      ctx.restore();
    }

    function showPopup(x, y, txt) {
      const el = document.createElement('div');
      el.className = 'float-fx';
      el.textContent = txt;
      el.style.left = `${x}px`;
      el.style.top = `${y}px`;
      document.getElementById('fxLayer').appendChild(el);
      setTimeout(() => el.remove(), 800);
    }

    function gameLoop() {
      if (!isPlaying) return;

      player.update();
      opponents.forEach(b => b.update());

      camera.x += (player.x - screenW / 2 - camera.x) * 0.12;
      camera.y += (player.y - screenH / 2 - camera.y) * 0.12;

      const holes = [player, ...opponents];

      // Vehicles
      for (let i = vehicles.length - 1; i >= 0; i--) {
        const v = vehicles[i];
        v.update();
        if (v.isFalling && v.fall <= 0) {
          v.init();
          continue;
        }
        if (!v.isFalling) {
          holes.forEach(hole => {
            if (Math.hypot(hole.x - v.x, hole.y - v.y) < hole.radius && hole.radius > v.reqRadius) {
              v.isFalling = true;
              v.targetHole = hole;
              hole.score += v.points;
              hole.targetRadius += 0.6;
              if (hole === player) {
                showPopup(v.x - camera.x, v.y - camera.y, `+${v.points}`);
                document.getElementById('hudScore').textContent = player.score;
                document.getElementById('hudSize').textContent = `${(player.radius / 10).toFixed(1)}m`;
              }
            }
          });
        }
      }

      // Humans
      for (let i = humans.length - 1; i >= 0; i--) {
        const h = humans[i];
        h.update();
        if (h.isFalling && h.fall <= 0) {
          humans.splice(idx, 1);
          continue;
        }
        if (!h.isFalling) {
          holes.forEach(hole => {
            if (Math.hypot(hole.x - h.x, hole.y - h.y) < hole.radius) {
              h.isFalling = true;
              h.targetHole = hole;
              hole.score += h.points;
              hole.targetRadius += 0.2;
              if (hole === player) {
                showPopup(h.x - camera.x, h.y - camera.y, `+${h.points}`);
                document.getElementById('hudScore').textContent = player.score;
              }
            }
          });
        }
      }

      // City Buildings & Trees (Falling & Suction Physics)
      for (let i = cityProps.length - 1; i >= 0; i--) {
        const p = cityProps[i];
        p.update();
        if (p.isFalling && p.fall <= 0) {
          cityProps.splice(i, 1);
          continue;
        }
        if (!p.isFalling) {
          holes.forEach(hole => {
            if (Math.hypot(hole.x - p.x, hole.y - p.y) < hole.radius && hole.radius > p.reqRadius) {
              p.isFalling = true;
              p.targetHole = hole;
              hole.score += p.points;
              hole.targetRadius += 1.8;
              if (hole === player) {
                showPopup(p.x - camera.x, p.y - camera.y, `+${p.points}`);
                document.getElementById('hudScore').textContent = player.score;
                document.getElementById('hudSize').textContent = `${(player.radius / 10).toFixed(1)}m`;
              }
            }
          });
        }
      }

      // Opponents
      opponents.forEach(bot => {
        if (Math.hypot(player.x - bot.x, player.y - bot.y) < player.radius && player.radius > bot.radius * 1.2) {
          player.score += bot.score + 500;
          player.targetRadius += 6;
          showPopup(bot.x - camera.x, bot.y - camera.y, `SWALLOWED ${bot.name}!`);
          bot.x = Math.random() * WORLD_W;
          bot.y = Math.random() * WORLD_H;
          bot.radius = 24;
          bot.targetRadius = 24;
          bot.score = 0;
        }
      });
    }

    function render() {
      ctx.clearRect(0, 0, screenW, screenH);

      if (isPlaying) {
        // 1. Draw city ground, roads, sidewalks
        drawRealCityGround(camera.x, camera.y);

        // 2. Draw ground objects that are NOT falling yet
        cityProps.filter(p => !p.isFalling).forEach(p => p.draw(camera.x, camera.y));
        vehicles.filter(v => !v.isFalling).forEach(v => v.draw(camera.x, camera.y));
        humans.filter(h => !h.isFalling).forEach(h => h.draw(camera.x, camera.y));

        // 3. Draw black holes (outer ring & background)
        opponents.forEach(b => b.draw(camera.x, camera.y));
        player.draw(camera.x, camera.y);

        // 4. Clip falling objects INSIDE the black hole boundary so they fall into the void
        const allHoles = [player, ...opponents];
        allHoles.forEach(hole => {
          const sx = hole.x - camera.x;
          const sy = hole.y - camera.y;

          ctx.save();
          // Create clipping mask matching the black hole opening
          ctx.beginPath();
          ctx.arc(sx, sy, hole.radius, 0, Math.PI * 2);
          ctx.clip();

          // Draw falling tumbling objects masked inside the hole
          cityProps.filter(p => p.isFalling && p.targetHole === hole).forEach(p => p.draw(camera.x, camera.y));
          vehicles.filter(v => v.isFalling && v.targetHole === hole).forEach(v => v.draw(camera.x, camera.y));
          humans.filter(h => h.isFalling && h.targetHole === hole).forEach(h => h.draw(camera.x, camera.y));

          ctx.restore();
        });

        // 5. Draw on-screen virtual joystick
        drawVirtualController();
      }

      requestAnimationFrame(render);
    }


    function saveAndGetLeaderboard(name, score) {
      let list = JSON.parse(localStorage.getItem('hole_city_scores') || '[]');
      if (list.length === 0) {
        list = [
          { name: 'satish', score: 26822 },
          { name: 'ganesh', score: 26737 },
          { name: 'nithesh', score: 26135 },
          { name: 'kiran', score: 26079 },
          { name: 'sai', score: 25935 },
          { name: 'balaji', score: 25798 },
          { name: 'MartHorn', score: 25667 },
          { name: 'LynxScan', score: 25636 },
          { name: 'WackFalc', score: 25597 }
        ];
      }
      list.push({ name, score });
      list.sort((a, b) => b.score - a.score);

      const rank = list.findIndex(i => i.name === name && i.score === score) + 1;
      const top10 = list.slice(0, 10);
      localStorage.setItem('hole_city_scores', JSON.stringify(top10));
      return { rank, top10 };
    }

    function startMatch() {
      isPlaying = true;
      matchTime = 120;

      const pName = document.getElementById('playerName').value.trim() || 'You';
      player = new BlackHole(WORLD_W / 2, WORLD_H / 2, 24, '#a855f7', pName, false);

      buildCity();
      spawnBots();

      document.getElementById('hudScore').textContent = '0';
      document.getElementById('hudTime').textContent = '120';
      document.getElementById('hudSize').textContent = '2.4m';

      document.getElementById('lobbyScreen').classList.add('hidden');
      document.getElementById('gameOverScreen').classList.add('hidden');
      document.getElementById('gameHUD').classList.remove('hidden');

      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        matchTime--;
        document.getElementById('hudTime').textContent = matchTime;
        if (matchTime <= 0) endGame();
      }, 1000);
    }

    function endGame() {
      isPlaying = false;
      clearInterval(timerInterval);

      document.getElementById('gameHUD').classList.add('hidden');
      document.getElementById('gameOverScreen').classList.remove('hidden');

      document.getElementById('endScore').textContent = player.score;
      document.getElementById('endSize').textContent = `Hole size ${(player.radius / 10).toFixed(1)}m`;

      const { rank, top10 } = saveAndGetLeaderboard(player.name, player.score);
      const listEl = document.getElementById('leaderboardList');
      listEl.innerHTML = '';

      top10.forEach((item, i) => {
        const isUser = item.name === player.name && item.score === player.score;
        listEl.innerHTML += `
          <div class="lb-item ${isUser ? 'lb-active' : ''}">
            <span>#${i + 1} ${item.name}</span>
            <span>${item.score}</span>
          </div>
        `;
      });

      if (rank > 10) {
        listEl.innerHTML += `
          <div class="lb-item lb-active">
            <span>#Top 10+ (${rank}) ${player.name}</span>
            <span>${player.score}</span>
          </div>
        `;
      }
    }

    const soloBtn = document.getElementById('btnSolo');
    soloBtn.addEventListener('click', startMatch);
    soloBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      startMatch();
    });

    const roomBtn = document.getElementById('btnRoom');
    function handleRoom() {
      const code = Math.random().toString(36).substring(2, 8).toUpperCase();
      document.getElementById('generatedCode').textContent = code;
      document.getElementById('roomCodeDisplay').classList.remove('hidden');
      setTimeout(startMatch, 1600);
    }
    roomBtn.addEventListener('click', handleRoom);
    roomBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      handleRoom();
    });

    const restartBtn = document.getElementById('btnRestart');
    function handleRestart() {
      document.getElementById('gameOverScreen').classList.add('hidden');
      document.getElementById('lobbyScreen').classList.remove('hidden');
    }
    restartBtn.addEventListener('click', handleRestart);
    restartBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      handleRestart();
    });

    document.getElementById('backBtn').addEventListener('click', () => {
      if (window.history.length > 1) window.history.back();
      else window.location.href = 'index.html';
    });
  </script>
