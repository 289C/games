<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Hole City 3D</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0d17;
      color: #fff;
      touch-action: none;
    }

    /* Top Navigation Bar */
    .top-nav {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: rgba(14, 16, 28, 0.75);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
      z-index: 100;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .nav-btn, .insta-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: #ffffff;
      padding: 8px 14px;
      border-radius: 20px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .nav-btn:hover, .insta-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateY(-1px);
    }

    .insta-img {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid #e1306c;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.45);
      padding: 6px 14px;
      border-radius: 14px;
      font-size: 11px;
      letter-spacing: 1.5px;
      font-weight: 800;
      border: 1px solid rgba(0, 255, 136, 0.2);
    }

    .online-indicator {
      width: 9px;
      height: 9px;
      background-color: #00ff88;
      border-radius: 50%;
      box-shadow: 0 0 10px #00ff88;
      animation: radarPulse 1.6s infinite ease-in-out;
    }

    @keyframes radarPulse {
      0% { transform: scale(0.9); opacity: 0.6; box-shadow: 0 0 4px #00ff88; }
      50% { transform: scale(1.3); opacity: 1; box-shadow: 0 0 12px #00ff88; }
      100% { transform: scale(0.9); opacity: 0.6; box-shadow: 0 0 4px #00ff88; }
    }

    /* Live HUD */
    .hud-container {
      position: absolute;
      top: 72px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 50;
      pointer-events: none;
    }

    .hud-box {
      background: rgba(14, 16, 28, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 6px 16px;
      border-radius: 14px;
      text-align: center;
    }

    .hud-label {
      font-size: 10px;
      color: #94a3b8;
      letter-spacing: 1.2px;
    }

    .hud-val {
      font-size: 22px;
      font-weight: 900;
      color: #fff;
    }

    #gameCanvas {
      width: 100vw;
      height: 100vh;
      display: block;
      background: #141724;
    }

    /* Screen Overlays */
    .screen-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgba(8, 10, 20, 0.86);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 200;
    }

    .hidden {
      display: none !important;
    }

    .glass-panel {
      width: 90%;
      max-width: 420px;
      background: rgba(23, 26, 45, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 28px;
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.8);
      padding: 28px 22px;
      text-align: center;
    }

    .badge-online-glow {
      display: inline-block;
      font-size: 10px;
      font-weight: 800;
      color: #a855f7;
      letter-spacing: 2px;
      background: rgba(168, 85, 247, 0.12);
      padding: 4px 10px;
      border-radius: 20px;
      margin-bottom: 8px;
    }

    .game-title {
      font-size: 36px;
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #c084fc, #6366f1, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .game-subtitle {
      color: #94a3b8;
      font-size: 13px;
      margin: 6px 0 20px;
    }

    .input-group {
      margin-bottom: 16px;
      text-align: left;
    }

    .input-group label {
      font-size: 11px;
      color: #94a3b8;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .input-group input, .join-box input {
      width: 100%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 12px 14px;
      border-radius: 14px;
      color: #fff;
      font-size: 15px;
      margin-top: 5px;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-group input:focus, .join-box input:focus {
      border-color: #8b5cf6;
    }

    .button-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 14px;
    }

    .btn {
      padding: 14px 20px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      border: none;
      transition: transform 0.15s ease;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: linear-gradient(135deg, #9333ea, #6366f1);
      color: #fff;
      box-shadow: 0 6px 20px rgba(124, 58, 237, 0.45);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .join-box {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .btn-accent {
      background: #2563eb;
      color: #fff;
    }

    .room-display {
      margin-top: 16px;
      padding: 12px;
      background: rgba(147, 51, 234, 0.15);
      border: 1px solid rgba(147, 51, 234, 0.3);
      border-radius: 14px;
      font-size: 13px;
    }

    .room-display strong {
      display: block;
      font-size: 24px;
      color: #d8b4fe;
      letter-spacing: 4px;
      margin: 4px 0;
    }

    .room-display small {
      color: #94a3b8;
      font-size: 11px;
    }

    /* Leaderboard */
    .finish-title {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 1.5px;
    }

    .final-stats {
      display: flex;
      justify-content: space-around;
      margin: 16px 0 20px;
      gap: 12px;
    }

    .score-chip {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px;
      border-radius: 14px;
    }

    .chip-label {
      display: block;
      font-size: 10px;
      color: #94a3b8;
      letter-spacing: 1px;
    }

    .final-score-num {
      font-size: 26px;
      font-weight: 900;
      color: #38bdf8;
    }

    .final-size-num {
      font-size: 22px;
      font-weight: 900;
      color: #e2e8f0;
    }

    .leaderboard-section {
      text-align: left;
      margin-bottom: 20px;
    }

    .lb-header {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 700;
      color: #94a3b8;
      letter-spacing: 1px;
      padding: 0 8px 6px;
    }

    .leaderboard-list {
      max-height: 190px;
      overflow-y: auto;
      border-radius: 14px;
      background: rgba(0, 0, 0, 0.35);
      padding: 6px 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .lb-row {
      display: flex;
      justify-content: space-between;
      padding: 7px 4px;
      font-size: 13.5px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .lb-row:last-child {
      border-bottom: none;
    }

    .lb-row.active-user {
      color: #38bdf8;
      font-weight: 800;
      background: rgba(56, 189, 248, 0.12);
      border-radius: 8px;
      padding: 7px 8px;
    }

    .lb-rank-badge {
      font-weight: 800;
      margin-right: 6px;
      color: #facc15;
    }

    .floating-notifications {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 60;
    }

    .float-msg {
      position: absolute;
      font-weight: 900;
      font-size: 17px;
      color: #38bdf8;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
      animation: swallowFloat 0.9s cubic-bezier(0.1, 0.8, 0.2, 1) forwards;
    }

    @keyframes swallowFloat {
      0% { opacity: 1; transform: translateY(0) scale(0.85); }
      100% { opacity: 0; transform: translateY(-50px) scale(1.3); }
    }
  </style>
</head>
<body>

  <!-- Top Header Navigation -->
  <header class="top-nav">
    <button id="backBtn" class="nav-btn" title="Back">&#128281; Back</button>
    
    <div class="status-badge">
      <span class="online-indicator"></span>
      <span id="roomStatus">ONLINE</span>
    </div>

    <!-- Instagram Link with Profile Handle & Logo -->
    <a id="instaLink" href="https://www.instagram.com/_satish_official_16?stkn=MTNzNXZ2cWpkdmRtNA==" target="_blank" rel="noopener noreferrer" class="insta-btn">
      <img src="Insta.jpg" alt="Instagram" class="insta-img" onerror="this.style.display='none'" />

  <!-- Live In-Game HUD -->

  <!-- Game Surface Canvas -->

  <div id="lobbyScreen" class="screen-overlay">

  <!-- Game Over Screen & Leaderboard (Top 10 & Top 10+) -->

      <h2 class="finish-title">MATCH FINISHED</h2>
      
      <div class="final-stats">

      <div class="leaderboard-section">

  <!-- Floating Text Layer -->
  <div id="notificationLayer" class="floating-notifications"></div>

  <!-- Game Engine Code -->
  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let screenWidth = (canvas.width = window.innerWidth);
    let screenHeight = (canvas.height = window.innerHeight);

    window.addEventListener('resize', () => {
      screenWidth = canvas.width = window.innerWidth;
      screenHeight = canvas.height = window.innerHeight;
    });

    const WORLD_SIZE = 3600;
    let gameTimer = 60;
    let timerInterval = null;
    let isPlaying = false;
    let gameMode = 'solo';

    let player;
    let opponents = [];
    let cityProps = [];
    let camera = { x: 0, y: 0 };
    let inputPos = { x: screenWidth / 2, y: screenHeight / 2 };

    const lobbyScreen = document.getElementById('lobbyScreen');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const gameHUD = document.getElementById('gameHUD');
    const hudScore = document.getElementById('hudScore');
    const hudTime = document.getElementById('hudTime');
    const hudSize = document.getElementById('hudSize');
    const endScore = document.getElementById('endScore');
    const endSize = document.getElementById('endSize');
    const leaderboardList = document.getElementById('leaderboardList');
    const roomCodeDisplay = document.getElementById('roomCodeDisplay');
    const generatedCode = document.getElementById('generatedCode');
    const notificationLayer = document.getElementById('notificationLayer');

    document.getElementById('backBtn').addEventListener('click', () => {
      if (isPlaying) {
        if (confirm('Leave match and return to menu?')) {
          endGame();
          lobbyScreen.classList.remove('hidden');
          gameOverScreen.classList.add('hidden');
          gameHUD.classList.add('hidden');
        }
      } else {
        if (window.history.length > 1) {
          window.history.back();
        } else {
          window.location.href = 'index.html';
        }
      }
    });

    /* Leaderboard Storage */
    const LEADERBOARD_KEY = 'city_hole_top10_records';

    function getStoredScores() {
      const data = localStorage.getItem(LEADERBOARD_KEY);
      if (!data) {
        return [
          { name: 'NexusSwallow', score: 18400 },
          { name: 'DarkHorizon', score: 16100 },
          { name: 'VoidWalker', score: 14750 },
          { name: 'CityCrusher', score: 13300 },
          { name: 'BlackOrb_X', score: 11900 },
          { name: 'AbyssPrime', score: 10400 },
          { name: 'MegaGravity', score: 9200 },
          { name: 'CosmoEater', score: 8100 },
          { name: 'MetroTitan', score: 7050 },
          { name: 'Quasar99', score: 6200 }
        ];
      }
      return JSON.parse(data);
    }

    function recordScore(playerName, finalScore) {
      let list = getStoredScores();
      list.push({ name: playerName, score: finalScore });
      list.sort((a, b) => b.score - a.score);

      const rank = list.findIndex(e => e.name === playerName && e.score === finalScore) + 1;
      const top10 = list.slice(0, 10);
      localStorage.setItem(LEADERBOARD_KEY, JSON.stringify(top10));

      return { rank, top10 };
    }

    function displayLeaderboard(playerName, finalScore) {
      const { rank, top10 } = recordScore(playerName, finalScore);
      leaderboardList.innerHTML = '';

      top10.forEach((item, index) => {
        const isCurrent = item.name === playerName && item.score === finalScore;
        const row = document.createElement('div');
        row.className = `lb-row ${isCurrent ? 'active-user' : ''}`;
        row.innerHTML = `
          <span><span class="lb-rank-badge">#${index + 1}</span> ${item.name}</span>
          <span>${item.score.toLocaleString()}</span>
        `;
        leaderboardList.appendChild(row);
      });

      if (rank > 10) {
        const overflowRow = document.createElement('div');
        overflowRow.className = 'lb-row active-user';
        overflowRow.innerHTML = `
          <span><span class="lb-rank-badge">#Top 10+</span> (${rank}) ${playerName}</span>
          <span>${finalScore.toLocaleString()}</span>
        `;
        leaderboardList.appendChild(overflowRow);
      }
    }

    /* Hole Entities */
    class BlackHole {
      constructor(x, y, radius, themeColor, name, isBot = false) {
        this.x = x;
        this.y = y;
        this.radius = radius;
        this.targetRadius = radius;
        this.themeColor = themeColor;
        this.name = name;
        this.isBot = isBot;
        this.score = 0;
        this.speed = 3.8;
        this.targetX = x;
        this.targetY = y;
        this.pulse = Math.random() * Math.PI;
      }

      update() {
        this.radius += (this.targetRadius - this.radius) * 0.12;
        this.pulse += 0.06;
        this.speed = Math.max(1.8, 4.0 - this.radius / 140);

        if (this.isBot) {
          const distToTarget = Math.hypot(this.targetX - this.x, this.targetY - this.y);
          if (distToTarget < 60 || Math.random() < 0.02) {
            this.targetX = Math.max(150, Math.min(WORLD_SIZE - 150, this.x + (Math.random() - 0.5) * 800));
            this.targetY = Math.max(150, Math.min(WORLD_SIZE - 150, this.y + (Math.random() - 0.5) * 800));
          }
          const angle = Math.atan2(this.targetY - this.y, this.targetX - this.x);
          this.x += Math.cos(angle) * (this.speed * 0.78);
          this.y += Math.sin(angle) * (this.speed * 0.78);
        } else {
          const dx = inputPos.x + camera.x - this.x;
          const dy = inputPos.y + camera.y - this.y;
          const dist = Math.hypot(dx, dy);

          if (dist > 12) {
            this.x += (dx / dist) * this.speed;
            this.y += (dy / dist) * this.speed;
          }
        }

        this.x = Math.max(this.radius, Math.min(WORLD_SIZE - this.radius, this.x));
        this.y = Math.max(this.radius, Math.min(WORLD_SIZE - this.radius, this.y));
      }

      draw(camX, camY) {
        const sx = this.x - camX;
        const sy = this.y - camY;
        const glow = Math.sin(this.pulse) * 4;

        ctx.save();
        ctx.beginPath();
        ctx.arc(sx, sy, this.radius + 6 + glow, 0, Math.PI * 2);
        ctx.fillStyle = this.themeColor + '38';
        ctx.fill();

        ctx.beginPath();
        ctx.arc(sx, sy, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#05060b';
        ctx.fill();
        ctx.lineWidth = 4;
        ctx.strokeStyle = this.themeColor;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(sx, sy, this.radius * 0.85, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 12px -apple-system, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(this.name, sx, sy - this.radius - 9);
        ctx.restore();
      }
    }

    /* City Props */
    class CityProp {
      constructor(x, y, kind) {
        this.x = x;
        this.y = y;
        this.kind = kind;
        this.isFalling = false;
        this.fallProgress = 1.0;

        switch (kind) {
          case 'cone':
            this.radius = 12;
            this.reqHoleRadius = 16;
            this.points = 10;
            this.color = '#f97316';
            break;
          case 'tree':
            this.radius = 20;
            this.reqHoleRadius = 28;
            this.points = 35;
            this.color = '#10b981';
            break;
          case 'car':
            this.radius = 34;
            this.reqHoleRadius = 45;
            this.points = 110;
            this.color = '#ef4444';
            break;
          case 'building':
            this.radius = 75;
        this.reqHoleRadius = 90;
        this.points = 400;
        this.color = '#6366f1';
        break;
    }
  }

  draw(camX, camY) {
    const sx = this.x - camX;
    const sy = this.y - camY;

    ctx.save();
    ctx.translate(sx, sy);

    if (this.isFalling) {
      ctx.scale(this.fallProgress, this.fallProgress);
      this.fallProgress -= 0.08;
    }

    if (this.kind === 'building') {
      const w = this.radius * 1.5;
      const h = this.radius * 1.5;
      const depth = 28;

      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.fillRect(-w / 2 + 8, -h / 2 + 8, w, h);

      ctx.fillStyle = '#312e81';
      ctx.fillRect(-w / 2, -h / 2 - depth, w, h);

      ctx.fillStyle = '#4f46e5';
      ctx.fillRect(-w / 2, -h / 2 - depth, w, 20);

      ctx.fillStyle = '#fef08a';
      for (let r = 0; r < 3; r++) {
        for (let c = 0; c < 3; c++) {
          ctx.fillRect(-w / 2 + 12 + c * 24, -h / 2 - depth + 28 + r * 18, 12, 10);
        }
      }
    } else if (this.kind === 'car') {
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.fillRect(-22, -12, 44, 24);

      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.roundRect(-20, -14, 40, 26, 6);
      ctx.fill();

      ctx.fillStyle = '#93c5fd';
      ctx.fillRect(-8, -10, 16, 18);
    } else if (this.kind === 'tree') {
      ctx.fillStyle = 'rgba(0,0,0,0.2)';
      ctx.beginPath();
      ctx.arc(4, 4, this.radius, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#059669';
      ctx.beginPath();
      ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#34d399';
      ctx.beginPath();
      ctx.arc(-4, -4, this.radius * 0.55, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  }
}

function populateCity() {
  cityProps = [];
  const kinds = ['cone', 'tree', 'car', 'building'];
  for (let i = 0; i < 480; i++) {
    const kind = kinds[Math.floor(Math.random() * kinds.length)];
    const x = Math.random() * (WORLD_SIZE - 200) + 100;
    const y = Math.random() * (WORLD_SIZE - 200) + 100;
    cityProps.push(new CityProp(x, y, kind));
  }
}

function spawnOpponents() {
  opponents = [];
  const roster = [
    { name: 'ShadowOrbit', color: '#ef4444' },
    { name: 'ApexSwallow', color: '#10b981' },
    { name: 'TitanZone', color: '#eab308' },
    { name: 'Vortex_99', color: '#ec4899' },
    { name: 'DarkDrift', color: '#06b6d4' }
  ];

  roster.forEach(item => {
    const x = Math.random() * (WORLD_SIZE - 300) + 150;
    const y = Math.random() * (WORLD_SIZE - 300) + 150;
    opponents.push(new BlackHole(x, y, 22, item.color, item.name, true));
  });
}

function spawnPointsPopup(x, y, text) {
  const el = document.createElement('div');
  el.className = 'float-msg';
  el.textContent = text;
  el.style.left = `${x}px`;
  el.style.top = `${y}px`;
  notificationLayer.appendChild(el);
  setTimeout(() => el.remove(), 900);
}

window.addEventListener('mousemove', e => {
  inputPos.x = e.clientX;
  inputPos.y = e.clientY;
});

window.addEventListener('touchmove', e => {
  if (e.touches.length > 0) {
    inputPos.x = e.touches[0].clientX;
    inputPos.y = e.touches[0].clientY;
  }
}, { passive: true });

function updateLoop() {
  if (!isPlaying) return;

  player.update();
  opponents.forEach(bot => bot.update());

  camera.x += (player.x - screenWidth / 2 - camera.x) * 0.12;
  camera.y += (player.y - screenHeight / 2 - camera.y) * 0.12;

  const allHoles = [player, ...opponents];

  for (let i = cityProps.length - 1; i >= 0; i--) {
    const prop = cityProps[i];

    if (prop.isFalling && prop.fallProgress <= 0) {
      cityProps.splice(i, 1);
      continue;
    }

    allHoles.forEach(hole => {
      const dist = Math.hypot(hole.x - prop.x, hole.y - prop.y);
      if (dist < hole.radius && hole.radius > prop.reqHoleRadius && !prop.isFalling) {
        prop.isFalling = true;
        hole.score += prop.points;
        hole.targetRadius += prop.points * 0.045;

        if (hole === player) {
          spawnPointsPopup(prop.x - camera.x, prop.y - camera.y, `+${prop.points}`);
          hudScore.textContent = player.score;
          hudSize.textContent = (player.radius / 10).toFixed(1) + 'm';
        }
      }
    });
  }

  for (let bot of opponents) {
    const dist = Math.hypot(player.x - bot.x, player.y - bot.y);
    if (dist < player.radius && player.radius > bot.radius * 1.25) {
      player.score += bot.score + 600;
      player.targetRadius += 10;
      spawnPointsPopup(bot.x - camera.x, bot.y - camera.y, `SWALLOWED ${bot.name}!`);

      bot.x = Math.random() * (WORLD_SIZE - 200) + 100;
      bot.y = Math.random() * (WORLD_SIZE - 200) + 100;
      bot.radius = 22;
      bot.targetRadius = 22;
      bot.score = 0;
    }
  }
}

function drawCityStreets(camX, camY) {
  const block = 160;
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
  ctx.lineWidth = 1.5;

  const offsetX = -(camX % block);
  const offsetY = -(camY % block);

  for (let x = offsetX; x < screenWidth; x += block) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, screenHeight);
    ctx.stroke();
  }
  for (let y = offsetY; y < screenHeight; y += block) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(screenWidth, y);
    ctx.stroke();
  }
}

function renderFrame() {
  ctx.clearRect(0, 0, screenWidth, screenHeight);

  if (isPlaying) {
    drawCityStreets(camera.x, camera.y);
    cityProps.forEach(prop => prop.draw(camera.x, camera.y));
    opponents.forEach(bot => bot.draw(camera.x, camera.y));
    player.draw(camera.x, camera.y);
  }

  requestAnimationFrame(renderFrame);
}

setInterval(updateLoop, 1000 / 60);
requestAnimationFrame(renderFrame);

function startMatch(mode) {
  gameMode = mode;
  isPlaying = true;
  gameTimer = 60;

  const pName = document.getElementById('playerName').value.trim() || 'Player';
  player = new BlackHole(WORLD_SIZE / 2, WORLD_SIZE / 2, 22, '#a855f7', pName, false);

  populateCity();
  spawnOpponents();

  hudScore.textContent = '0';
  hudTime.textContent = '60';
  hudSize.textContent = '2.2m';

  lobbyScreen.classList.add('hidden');
  gameOverScreen.classList.add('hidden');
  gameHUD.classList.remove('hidden');

  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    gameTimer--;
    hudTime.textContent = gameTimer;
    if (gameTimer <= 0) {
      endGame();
    }
  }, 1000);
}

function endGame() {
  isPlaying = false;
  clearInterval(timerInterval);

  gameHUD.classList.add('hidden');
  gameOverScreen.classList.remove('hidden');

  endScore.textContent = player.score.toLocaleString();
  endSize.textContent = `${(player.radius / 10).toFixed(1)}m`;

  displayLeaderboard(player.name, player.score);
}

function makeRoomCode() {
  return Math.random().toString(36).substring(2, 8).toUpperCase();
}

document.getElementById('btnSolo').addEventListener('click', () => {
  startMatch('solo');
});

document.getElementById('btnCreateRoom').addEventListener('click', () => {
  const code = makeRoomCode();
  generatedCode.textContent = code;
  roomCodeDisplay.classList.remove('hidden');

  setTimeout(() => {
    startMatch('room');
  }, 1800);
});

document.getElementById('btnJoinRoom').addEventListener('click', () => {
  const code = document.getElementById('roomCodeInput').value.trim();
  if (code.length === 6) {
    startMatch('room');
  } else {
    alert('Please enter a valid 6-digit room code.');
  }
});

document.getElementById('btnRestart').addEventListener('click', () => {
  gameOverScreen.classList.add('hidden');
  lobbyScreen.classList.remove('hidden');
});
</script>
