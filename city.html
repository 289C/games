<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>HOLE.IO 2 - City Multiplayer</title>
  <!-- PeerJS P2P Networking -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #638454;
      color: #fff;
      touch-action: none;
    }

    /* Top Navigation */
    .top-nav {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 56px;
      background: rgba(14, 16, 24, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 14px;
      z-index: 100;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }

    .nav-btn, .insta-btn {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      padding: 6px 14px;
      border-radius: 20px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: transform 0.2s ease;
    }

    .nav-btn:active, .insta-btn:active {
      transform: scale(0.95);
    }

    .insta-img {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid #e1306c;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 7px;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 5px 12px;
      border-radius: 14px;
      font-size: 11px;
      letter-spacing: 1.2px;
      font-weight: 800;
    }

    .online-indicator {
      width: 8px;
      height: 8px;
      background-color: #00ff88;
      border-radius: 50%;
      box-shadow: 0 0 10px #00ff88;
      animation: livePulse 1.6s infinite ease-in-out;
    }

    @keyframes livePulse {
      0%, 100% { transform: scale(0.9); opacity: 0.6; }
      50% { transform: scale(1.3); opacity: 1; box-shadow: 0 0 14px #00ff88; }
    }

    /* In-Game HUD */
    .hud-container {
      position: absolute;
      top: 66px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 50;
      pointer-events: none;
    }

    .hud-col {
      text-align: center;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.95);
    }

    .hud-lbl {
      font-size: 11px;
      font-weight: 800;
      color: #94a3b8;
      letter-spacing: 1.5px;
    }

    .hud-num {
      font-size: 28px;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 0 15px rgba(255,255,255,0.4);
    }

    #gameCanvas {
      width: 100vw;
      height: 100vh;
      display: block;
    }

    /* Modal Screens */
    .screen-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, rgba(15, 23, 42, 0.92) 0%, rgba(2, 6, 23, 0.97) 100%);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 200;
    }

    .hidden {
      display: none !important;
    }

    .card {
      width: 90%;
      max-width: 390px;
      background: rgba(24, 25, 38, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 28px;
      padding: 26px 20px;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(168, 85, 247, 0.2);
      animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      from { transform: scale(0.85); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .title {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #38bdf8, #a855f7, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }

    .btn {
      width: 100%;
      padding: 13px;
      border-radius: 14px;
      border: none;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 10px;
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-purple {
      background: linear-gradient(135deg, #9333ea, #7c3aed);
      color: #fff;
      box-shadow: 0 4px 15px rgba(147, 51, 234, 0.4);
    }

    .btn-gray {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    .btn-green {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
    }

    .input-box {
      width: 100%;
      padding: 12px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      color: #fff;
      font-size: 15px;
      margin: 8px 0;
      outline: none;
      text-align: center;
      font-weight: 700;
    }

    .room-actions {
      display: flex;
      gap: 10px;
    }

    .leaderboard-box {
      max-height: 180px;
      overflow-y: auto;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 6px 14px;
      margin: 12px 0;
      text-align: left;
    }

    .lb-item {
      display: flex;
      justify-content: space-between;
      padding: 7px 0;
      font-size: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .lb-active {
      color: #38bdf8;
      font-weight: 800;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
    }

    /* Floating Score VFX */
    .float-fx {
      position: absolute;
      font-weight: 900;
      font-size: 22px;
      color: #facc15;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
      pointer-events: none;
      animation: floatUp 0.85s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      z-index: 80;
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-48px) scale(1.25); }
    }
  </style>
</head>
<body>

  <header class="top-nav">
    <button id="backBtn" class="nav-btn">&#128281; Back</button>
    <div class="status-badge">
      <span class="online-indicator"></span>
      <span id="navStatus">ONLINE</span>
    </div>
    <a href="https://www.instagram.com/_satish_official_16?stkn=MTNzNXZ2cWpkdmRtNA==" target="_blank" rel="noopener noreferrer" class="insta-btn">
      <img src="Insta.jpg" alt="Instagram" class="insta-img" onerror="this.style.display='none'" />
      <span>@_satish_official_16</span>
    </a>
  </header>

  <div id="gameHUD" class="hud-container hidden">
    <div class="hud-col">
      <div class="hud-lbl">SCORE</div>
      <div id="hudScore" class="hud-num">0</div>
    </div>
    <div class="hud-col">
      <div class="hud-lbl">TIME</div>
      <div id="hudTime" class="hud-num">120</div>
    </div>
    <div class="hud-col">
      <div class="hud-lbl">SIZE</div>
      <div id="hudSize" class="hud-num">2.4m</div>
    </div>
  </div>

  <canvas id="gameCanvas"></canvas>
  <div id="fxLayer"></div>

  <!-- Lobby Screen -->
  <div id="lobbyScreen" class="screen-overlay">
    <div class="card">
      <h1 class="title">HOLE.IO 2</h1>
      <p style="color: #94a3b8; font-size: 13px; margin-bottom: 10px;">Swallow the city and grow larger!</p>
      
      <input type="text" id="playerName" class="input-box" value="Satish" maxlength="12" placeholder="Your Name" />
      
      <button id="btnSolo" type="button" class="btn btn-purple">Play Solo (vs Bots)</button>

      <div style="margin: 12px 0 6px 0; border-top: 1px solid rgba(255,255,255,0.12); padding-top: 10px;">
        <span style="font-size: 12px; color: #cbd5e1; font-weight: 700; letter-spacing: 0.5px;">PLAY 1v1 WITH FRIENDS</span>
      </div>

      <div class="room-actions">
        <button id="btnCreateRoom" type="button" class="btn btn-gray">Create Room</button>
        <button id="btnJoinRoom" type="button" class="btn btn-green">Join Room</button>
      </div>

      <div id="joinInputSec" class="hidden" style="margin-top: 10px;">
        <input type="text" id="joinCodeInput" class="input-box" placeholder="Enter Room Code" maxlength="6" style="text-transform: uppercase;" />
        <button id="btnConnectRoom" type="button" class="btn btn-purple">Enter Match</button>
      </div>
      
      <div id="roomCodeDisplay" style="margin-top: 12px; font-size: 14px; color:#d8b4fe;" class="hidden">
        Room Code: <strong id="generatedCode" style="font-size: 24px; letter-spacing: 2px; color:#38bdf8;"></strong>
        <div style="font-size: 12px; color: #a1a1aa; margin-top: 4px;">Share this code with your friend!</div>
      </div>
    </div>
  </div>

  <!-- Game Over Screen -->
  <div id="gameOverScreen" class="screen-overlay hidden">
    <div class="card">
      <h2 style="font-size: 26px; font-weight: 900; margin-bottom: 4px;">TIME'S UP!</h2>
      <div style="font-size: 42px; font-weight: 900; color: #38bdf8;" id="endScore">0</div>
      <div style="font-size: 14px; color: #94a3b8; margin-bottom: 12px;" id="endSize">Hole size: 2.4m</div>

      <div class="leaderboard-box" id="leaderboardList"></div>

      <button id="btnRestart" type="button" class="btn btn-purple">Play Again</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let screenW = canvas.width = window.innerWidth;
    let screenH = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      screenW = canvas.width = window.innerWidth;
      screenH = canvas.height = window.innerHeight;
    });

    const BLOCK_SIZE = 340;
    const ROAD_WIDTH = 130;
    const WORLD_COLS = 12;
    const WORLD_ROWS = 12;
    const WORLD_W = WORLD_COLS * (BLOCK_SIZE + ROAD_WIDTH);
    const WORLD_H = WORLD_ROWS * (BLOCK_SIZE + ROAD_WIDTH);

    let isPlaying = false;
    let matchTime = 120;
    let timerInterval = null;

    let player = null;
    let opponents = [];
    let vehicles = [];
    let humans = [];
    let cityProps = [];

    // PeerJS Networking with STUN servers
    let peer = null;
    let peerConn = null;
    let remoteFriend = null;

    const peerConfig = {
      config: {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' },
          { urls: 'stun:stun2.l.google.com:19302' }
        ]
      }
    };

    let camera = { x: 0, y: 0 };
    let joystick = {
      active: false,
      baseX: 0,
      baseY: 0,
      stickX: 0,
      stickY: 0,
      dirX: 0,
      dirY: 0
    };

    function handleJoy(cx, cy) {
      if (!isPlaying) return;
      if (!joystick.active) {
        joystick.active = true;
        joystick.baseX = cx;
        joystick.baseY = cy;
      }
      const dx = cx - joystick.baseX;
      const dy = cy - joystick.baseY;
      const dist = Math.hypot(dx, dy);
      const maxR = 48;

      if (dist > maxR) {
        joystick.stickX = joystick.baseX + (dx / dist) * maxR;
        joystick.stickY = joystick.baseY + (dy / dist) * maxR;
      } else {
        joystick.stickX = cx;
        joystick.stickY = cy;
      }

      if (dist > 5) {
        joystick.dirX = dx / dist;
        joystick.dirY = dy / dist;
      } else {
        joystick.dirX = 0;
        joystick.dirY = 0;
      }
    }

    function resetJoy() {
      joystick.active = false;
      joystick.dirX = 0;
      joystick.dirY = 0;
    }

    canvas.addEventListener('touchstart', e => {
      if (e.touches.length > 0) handleJoy(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: false });

    canvas.addEventListener('touchmove', e => {
      e.preventDefault();
      if (e.touches.length > 0) handleJoy(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: false });

    canvas.addEventListener('touchend', resetJoy);
    canvas.addEventListener('touchcancel', resetJoy);

    canvas.addEventListener('mousedown', e => handleJoy(e.clientX, e.clientY));
    window.addEventListener('mousemove', e => { if (joystick.active) handleJoy(e.clientX, e.clientY); });
    window.addEventListener('mouseup', resetJoy);

    class BlackHole {
      constructor(x, y, radius, color, name, isBot = false, isRemote = false) {
        this.x = x;
        this.y = y;
        this.radius = radius;
        this.targetRadius = radius;
        this.color = color;
        this.name = name;
        this.isBot = isBot;
        this.isRemote = isRemote;
        this.score = 0;
        this.speed = 3.6;
        this.targetX = x;
        this.targetY = y;
        this.vortexAngle = 0;
      }

      update() {
        this.radius += (this.targetRadius - this.radius) * 0.1;
        this.speed = Math.max(2.0, 4.2 - this.radius / 140);
        this.vortexAngle += 0.05;

        if (this.isBot) {
          if (Math.hypot(this.targetX - this.x, this.targetY - this.y) < 50 || Math.random() < 0.02) {
            this.targetX = Math.max(200, Math.min(WORLD_W - 200, this.x + (Math.random() - 0.5) * 800));
            this.targetY = Math.max(200, Math.min(WORLD_H - 200, this.y + (Math.random() - 0.5) * 800));
          }
          const angle = Math.atan2(this.targetY - this.y, this.targetX - this.x);
          this.x += Math.cos(angle) * (this.speed * 0.75);
          this.y += Math.sin(angle) * (this.speed * 0.75);
        } else if (!this.isRemote) {
          if (joystick.dirX !== 0 || joystick.dirY !== 0) {
            this.x += joystick.dirX * this.speed;
            this.y += joystick.dirY * this.speed;
          }
        }

        this.x = Math.max(this.radius, Math.min(WORLD_W - this.radius, this.x));
        this.y = Math.max(this.radius, Math.min(WORLD_H - this.radius, this.y));
      }

      draw(camX, camY) {
        const sx = this.x - camX;
        const sy = this.y - camY;

        ctx.save();
        // Neon Glow Rim
        ctx.beginPath();
        ctx.arc(sx, sy, this.radius + 6, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 18;
        ctx.fill();

        // Outer Vortex
        ctx.beginPath();
        ctx.arc(sx, sy, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#260d36';
        ctx.shadowBlur = 0;
        ctx.fill();

        // Swirling Inner Depth
        ctx.beginPath();
        ctx.arc(sx, sy, this.radius * 0.72, 0, Math.PI * 2);
        ctx.fillStyle = '#140520';
        ctx.fill();

        // Abyss Core
        ctx.beginPath();
        ctx.arc(sx, sy, this.radius * 0.45, 0, Math.PI * 2);
        ctx.fillStyle = '#000000';
        ctx.fill();

        // Player Tag
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 13px sans-serif';
        ctx.textAlign = 'center';
        ctx.shadowColor = '#000';
        ctx.shadowBlur = 6;
        ctx.fillText(this.name, sx, sy - this.radius - 12);
        ctx.restore();
      }
    }

    class Vehicle {
      constructor(type) {
        this.type = type;
        this.isFalling = false;
        this.fall = 1.0;
        this.targetHole = null;
        this.init();
      }

      init() {
        this.isFalling = false;
        this.fall = 1.0;
        this.targetHole = null;
        this.horizontal = Math.random() < 0.5;

        if (this.type === 'bus') {
          this.w = 70;
          this.h = 24;
          this.color = '#eab308';
          this.reqRadius = 46;
          this.points = 120;
          this.speed = (Math.random() * 0.8 + 1.2) * (Math.random() < 0.5 ? 1 : -1);
        } else {
          this.w = 34;
          this.h = 18;
          const colors = ['#ef4444', '#3b82f6', '#10b981', '#f97316'];
          this.color = colors[Math.floor(Math.random() * colors.length)];
          this.reqRadius = 30;
          this.points = 50;
          this.speed = (Math.random() * 1.2 + 1.8) * (Math.random() < 0.5 ? 1 : -1);
        }

        if (this.horizontal) {
          const row = Math.floor(Math.random() * WORLD_ROWS);
          this.y = row * (BLOCK_SIZE + ROAD_WIDTH) + BLOCK_SIZE + ROAD_WIDTH / 2;
          this.x = Math.random() * WORLD_W;
        } else {
          const col = Math.floor(Math.random() * WORLD_COLS);
          this.x = col * (BLOCK_SIZE + ROAD_WIDTH) + BLOCK_SIZE + ROAD_WIDTH / 2;
          this.y = Math.random() * WORLD_H;
          const temp = this.w;
          this.w = this.h;
          this.h = temp;
        }
      }

      update() {
        if (this.isFalling) {
          this.fall -= 0.06;
          if (this.targetHole) {
            this.x += (this.targetHole.x - this.x) * 0.18;
            this.y += (this.targetHole.y - this.y) * 0.18;
          }
          return;
        }
        if (this.horizontal) {
          this.x += this.speed;
          if (this.x < 0) this.x = WORLD_W;
          if (this.x > WORLD_W) this.x = 0;
        } else {
          this.y += this.speed;
          if (this.y < 0) this.y = WORLD_H;
          if (this.y > WORLD_H) this.y = 0;
        }
      }

      draw(camX, camY) {
        const sx = this.x - camX;
        const sy = this.y - camY;

        ctx.save();
        ctx.translate(sx, sy);
        if (this.isFalling) ctx.scale(Math.max(0, this.fall), Math.max(0, this.fall));

        ctx.fillStyle = 'rgba(0,0,0,0.28)';
        ctx.fillRect(-this.w / 2 + 3, -this.h / 2 + 3, this.w, this.h);

        ctx.fillStyle = this.color;
        ctx.fillRect(-this.w / 2, -this.h / 2, this.w, this.h);

        ctx.fillStyle = '#bae6fd';
        if (this.w > this.h) {
          ctx.fillRect(-this.w / 2 + 4, -this.h / 2 + 3, this.w - 8, this.h - 6);
        } else {
          ctx.fillRect(-this.w / 2 + 3, -this.h / 2 + 4, this.w - 6, this.h - 8);
        }
        ctx.restore();
      }
    }

    class Human {
      constructor() {
        this.x = Math.random() * WORLD_W;
        this.y = Math.random() * WORLD_H;
        this.radius = 6;
        this.reqRadius = 14;
        this.points = 15;
        this.color = Math.random() < 0.5 ? '#f43f5e' : '#06b6d4';
        this.speed = 0.8;
        this.angle = Math.random() * Math.PI * 2;
        this.isFalling = false;
        this.fall = 1.0;
        this.targetHole = null;
      }

      update() {
        if (this.isFalling) {
          this.fall -= 0.08;
          if (this.targetHole) {
            this.x += (this.targetHole.x - this.x) * 0.2;
            this.y += (this.targetHole.y - this.y) * 0.2;
          }
          return;
        }
        this.x += Math.cos(this.angle) * this.speed;
        this.y += Math.sin(this.angle) * this.speed;
        if (Math.random() < 0.02) this.angle = Math.random() * Math.PI * 2;
      }

      draw(camX, camY) {
        const sx = this.x - camX;
        const sy = this.y - camY;
        ctx.save();
        ctx.translate(sx, sy);
        if (this.isFalling) ctx.scale(Math.max(0, this.fall), Math.max(0, this.fall));
        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.restore();
      }
    }

    class CityBuilding {
      constructor(x, y, w, h, isTree = false) {
        this.x = x;
        this.y = y;
        this.w = w;
        this.h = h;
        this.isTree = isTree;
        this.isFalling = false;
        this.fall = 1.0;
        this.angle = 0;
            this.tiltSpeed = (Math.random() - 0.5) * 0.12;
        this.targetHole = null;

        if (isTree) {
          this.radius = 16;
          this.reqRadius = 24;
          this.points = 25;
        } else {
          this.radius = Math.max(w, h) / 2;
          this.reqRadius = this.radius * 0.95;
          this.points = 350;
        }
      }

      update() {
        if (this.isFalling) {
          this.fall -= 0.04;
          this.angle += this.tiltSpeed;
          if (this.targetHole) {
            this.x += (this.targetHole.x - this.x) * 0.14;
            this.y += (this.targetHole.y - this.y) * 0.14;
          }
        }
      }

      draw(camX, camY) {
        const sx = this.x - camX;
        const sy = this.y - camY;

        ctx.save();
        ctx.translate(sx, sy);
        if (this.isFalling) {
          ctx.rotate(this.angle);
          ctx.scale(Math.max(0, this.fall), Math.max(0, this.fall));
        }

        if (this.isTree) {
          ctx.fillStyle = 'rgba(0,0,0,0.2)';
          ctx.beginPath();
          ctx.arc(2, 2, 14, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#22c55e';
          ctx.beginPath();
          ctx.arc(0, 0, 14, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.fillStyle = 'rgba(0,0,0,0.25)';
          ctx.fillRect(-this.w / 2 + 6, -this.h / 2 + 6, this.w, this.h);

          ctx.fillStyle = '#64748b';
          ctx.fillRect(-this.w / 2, -this.h / 2, this.w, this.h);

          ctx.fillStyle = '#94a3b8';
          ctx.fillRect(-this.w / 2, -this.h / 2, this.w, 14);

          ctx.fillStyle = '#fef08a';
          for (let row = 18; row < this.h - 8; row += 16) {
            for (let col = 8; col < this.w - 8; col += 14) {
              ctx.fillRect(-this.w / 2 + col, -this.h / 2 + row, 8, 8);
            }
          }
        }
        ctx.restore();
      }
    }

    function buildCity() {
      cityProps = [];
      vehicles = [];
      humans = [];

      for (let r = 0; r < WORLD_ROWS; r++) {
        for (let c = 0; c < WORLD_COLS; c++) {
          const bx = c * (BLOCK_SIZE + ROAD_WIDTH) + BLOCK_SIZE / 2;
          const by = r * (BLOCK_SIZE + ROAD_WIDTH) + BLOCK_SIZE / 2;

          cityProps.push(new CityBuilding(bx, by, 120, 100, false));
          cityProps.push(new CityBuilding(bx - 90, by - 90, 0, 0, true));
          cityProps.push(new CityBuilding(bx + 90, by + 90, 0, 0, true));
        }
      }

      for (let i = 0; i < 45; i++) vehicles.push(new Vehicle('car'));
      for (let i = 0; i < 18; i++) vehicles.push(new Vehicle('bus'));
      for (let i = 0; i < 100; i++) humans.push(new Human());
    }

    function spawnBots() {
      opponents = [];
      const roster = ['Ganesh', 'Durga', 'Sai', 'Nithesh', 'Balaji', 'Kiran'];
      const colors = ['#dc2626', '#16a34a', '#ca8a04', '#db2777', '#0284c7', '#ea580c'];

      roster.forEach((name, i) => {
        opponents.push(new BlackHole(
          Math.random() * (WORLD_W - 400) + 200,
          Math.random() * (WORLD_H - 400) + 200,
          24,
          colors[i % colors.length],
          name,
          true,
          false
        ));
      });
    }

    function drawRealCityGround(camX, camY) {
      ctx.fillStyle = '#7da06d';
      ctx.fillRect(0, 0, screenW, screenH);

      const step = BLOCK_SIZE + ROAD_WIDTH;
      const startCol = Math.floor(camX / step) - 1;
      const endCol = Math.floor((camX + screenW) / step) + 1;
      const startRow = Math.floor(camY / step) - 1;
      const endRow = Math.floor((camY + screenH) / step) + 1;

      for (let r = startRow; r <= endRow; r++) {
        for (let c = startCol; c <= endCol; c++) {
          const bx = c * step - camX;
          const by = r * step - camY;

          ctx.fillStyle = '#d1d5db';
          ctx.fillRect(bx - 12, by - 12, BLOCK_SIZE + 24, BLOCK_SIZE + 24);

          ctx.fillStyle = '#9cb988';
          ctx.fillRect(bx, by, BLOCK_SIZE, BLOCK_SIZE);

          ctx.fillStyle = '#8eae7b';
          ctx.fillRect(bx + 16, by + 16, BLOCK_SIZE - 32, BLOCK_SIZE - 32);

          const rx = bx + BLOCK_SIZE;
          const ry = by + BLOCK_SIZE;

          ctx.fillStyle = '#ffffff';
          for (let i = 0; i < BLOCK_SIZE; i += 40) {
            ctx.fillRect(bx + i, ry + ROAD_WIDTH / 2 - 2, 22, 4);
          }
          for (let i = 0; i < BLOCK_SIZE; i += 40) {
            ctx.fillRect(rx + ROAD_WIDTH / 2 - 2, by + i, 4, 22);
          }

          for (let w = 0; w < 4; w++) {
            ctx.fillRect(rx + 12 + w * 26, by + 4, 14, 26);
            ctx.fillRect(bx + 4, ry + 12 + w * 26, 26, 14);
          }
        }
      }
    }

    function drawVirtualController() {
      if (!joystick.active) return;

      ctx.save();
      ctx.beginPath();
      ctx.arc(joystick.baseX, joystick.baseY, 52, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(joystick.stickX, joystick.stickY, 26, 0, Math.PI * 2);
      ctx.fillStyle = '#a855f7';
      ctx.fill();
      ctx.shadowColor = '#c084fc';
      ctx.shadowBlur = 12;
      ctx.restore();
    }

    function showPopup(x, y, txt) {
      const el = document.createElement('div');
      el.className = 'float-fx';
      el.textContent = txt;
      el.style.left = `${x}px`;
      el.style.top = `${y}px`;
      document.getElementById('fxLayer').appendChild(el);
      setTimeout(() => el.remove(), 850);
    }

    function gameLoop() {
      if (!isPlaying || !player) return;

      player.update();
      opponents.forEach(b => b.update());

      camera.x += (player.x - screenW / 2 - camera.x) * 0.14;
      camera.y += (player.y - screenH / 2 - camera.y) * 0.14;

      const holes = [player, ...opponents];

      // Broadcast 1v1 positions
      if (peerConn && peerConn.open) {
        peerConn.send({
          type: 'pos',
          x: player.x,
          y: player.y,
          r: player.radius,
          score: player.score,
          name: player.name
        });
      }

      // Vehicles
      for (let i = vehicles.length - 1; i >= 0; i--) {
        const v = vehicles[i];
        v.update();
        if (v.isFalling && v.fall <= 0) {
          v.init();
          continue;
        }
        if (!v.isFalling) {
          holes.forEach(hole => {
            if (Math.hypot(hole.x - v.x, hole.y - v.y) < hole.radius && hole.radius > v.reqRadius) {
              v.isFalling = true;
              v.targetHole = hole;
              hole.score += v.points;
              hole.targetRadius += 0.6;
              if (hole === player) {
                showPopup(v.x - camera.x, v.y - camera.y, `+${v.points}`);
                document.getElementById('hudScore').textContent = player.score;
                document.getElementById('hudSize').textContent = `${(player.radius / 10).toFixed(1)}m`;
              }
            }
          });
        }
      }

      // Humans
      for (let i = humans.length - 1; i >= 0; i--) {
        const h = humans[i];
        h.update();
        if (h.isFalling && h.fall <= 0) {
          humans.splice(i, 1);
          continue;
        }
        if (!h.isFalling) {
          holes.forEach(hole => {
            if (Math.hypot(hole.x - h.x, hole.y - h.y) < hole.radius) {
              h.isFalling = true;
              h.targetHole = hole;
              hole.score += h.points;
              hole.targetRadius += 0.25;
              if (hole === player) {
                showPopup(h.x - camera.x, h.y - camera.y, `+${h.points}`);
                document.getElementById('hudScore').textContent = player.score;
              }
            }
          });
        }
      }

      // City Buildings & Trees
      for (let i = cityProps.length - 1; i >= 0; i--) {
        const p = cityProps[i];
        p.update();
        if (p.isFalling && p.fall <= 0) {
          cityProps.splice(i, 1);
          continue;
        }
        if (!p.isFalling) {
          holes.forEach(hole => {
            if (Math.hypot(hole.x - p.x, hole.y - p.y) < hole.radius && hole.radius > p.reqRadius) {
              p.isFalling = true;
              p.targetHole = hole;
              hole.score += p.points;
              hole.targetRadius += 1.8;
              if (hole === player) {
                showPopup(p.x - camera.x, p.y - camera.y, `+${p.points}`);
                document.getElementById('hudScore').textContent = player.score;
                document.getElementById('hudSize').textContent = `${(player.radius / 10).toFixed(1)}m`;
              }
            }
          });
        }
      }

      // Swallowing Opponents
      opponents.forEach(bot => {
        if (Math.hypot(player.x - bot.x, player.y - bot.y) < player.radius && player.radius > bot.radius * 1.2) {
          player.score += bot.score + 500;
          player.targetRadius += 6;
          showPopup(bot.x - camera.x, bot.y - camera.y, `SWALLOWED ${bot.name}!`);
          bot.x = Math.random() * WORLD_W;
          bot.y = Math.random() * WORLD_H;
          bot.radius = 24;
          bot.targetRadius = 24;
          bot.score = 0;
        }
      });
    }

    function render() {
      ctx.clearRect(0, 0, screenW, screenH);

      if (isPlaying && player) {
        drawRealCityGround(camera.x, camera.y);

        cityProps.filter(p => !p.isFalling).forEach(p => p.draw(camera.x, camera.y));
        vehicles.filter(v => !v.isFalling).forEach(v => v.draw(camera.x, camera.y));
        humans.filter(h => !h.isFalling).forEach(h => h.draw(camera.x, camera.y));

        opponents.forEach(b => b.draw(camera.x, camera.y));
        player.draw(camera.x, camera.y);

        cityProps.filter(p => p.isFalling).forEach(p => p.draw(camera.x, camera.y));
        vehicles.filter(v => v.isFalling).forEach(v => v.draw(camera.x, camera.y));
        humans.filter(h => h.isFalling).forEach(h => h.draw(camera.x, camera.y));

        drawVirtualController();
      }

      requestAnimationFrame(render);
    }

    setInterval(gameLoop, 1000 / 60);
    requestAnimationFrame(render);

    function saveAndGetLeaderboard(name, score) {
      let list = [
        { name: 'Satish', score: 26820 },
        { name: 'Ganesh', score: 24730 },
        { name: 'Durga', score: 21130 },
        { name: 'Sai', score: 18070 },
        { name: 'Nithesh', score: 15930 },
        { name: 'Balaji', score: 14200 },
        { name: 'Kiran', score: 12500 }
      ];

      try {
        const saved = localStorage.getItem('hole_city_scores');
        if (saved) list = JSON.parse(saved);
      } catch (e) {
        console.warn('Storage error:', e);
      }

      list.push({ name: name || 'Satish', score: score || 0 });
      list.sort((a, b) => b.score - a.score);

      const rank = list.findIndex(i => i.name === name && i.score === score) + 1;
      const topList = list.slice(0, 6);

      try {
        localStorage.setItem('hole_city_scores', JSON.stringify(topList));
      } catch (e) {}

      return { rank, topList };
    }

    function startMatch(withBots = true) {
      isPlaying = true;
      matchTime = 120;

      const pName = document.getElementById('playerName').value.trim() || 'Satish';
      player = new BlackHole(WORLD_W / 2, WORLD_H / 2, 24, '#a855f7', pName, false, false);

      camera.x = player.x - screenW / 2;
      camera.y = player.y - screenH / 2;

      buildCity();

      if (withBots) {
        spawnBots();
      } else {
        opponents = [];
      }

      document.getElementById('hudScore').textContent = '0';
      document.getElementById('hudTime').textContent = '120';
      document.getElementById('hudSize').textContent = '2.4m';

      document.getElementById('lobbyScreen').classList.add('hidden');
      document.getElementById('gameOverScreen').classList.add('hidden');
      document.getElementById('gameHUD').classList.remove('hidden');

      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        matchTime--;
        document.getElementById('hudTime').textContent = matchTime;
        if (matchTime <= 0) endGame();
      }, 1000);
    }

    function endGame() {
      isPlaying = false;
      clearInterval(timerInterval);

      const hud = document.getElementById('gameHUD');
      const overScreen = document.getElementById('gameOverScreen');
      if (hud) hud.classList.add('hidden');
      if (overScreen) overScreen.classList.remove('hidden');

      const finalScore = player ? player.score : 0;
      const finalRadius = player ? (player.radius / 10).toFixed(1) : '2.4';

      const scoreEl = document.getElementById('endScore');
      const sizeEl = document.getElementById('endSize');
      if (scoreEl) scoreEl.textContent = finalScore;
      if (sizeEl) sizeEl.textContent = `Hole size: ${finalRadius}m`;

      const listEl = document.getElementById('leaderboardList');
      if (listEl) {
        listEl.innerHTML = '';
        const { rank, topList } = saveAndGetLeaderboard(player ? player.name : 'Satish', finalScore);

        topList.forEach((item, index) => {
          const isMe = player && item.name === player.name && item.score === finalScore;
          listEl.innerHTML += `
            <div class="lb-item ${isMe ? 'lb-active' : ''}">
              <span>#${index + 1} ${item.name}</span>
              <span>${item.score}</span>
            </div>
          `;
        });
      }

      if (peerConn) {
        try { peerConn.close(); } catch(e) {}
      }
    }

    // ==========================================
    // Real 1v1 Room Code System (PeerJS)
    // ==========================================
    function onConnectionEstablished() {
      const badge = document.querySelector('.status-badge span:last-child');
      if (badge) badge.textContent = '1v1 LIVE';

      document.getElementById('lobbyScreen').classList.add('hidden');
      startMatch(false);

      if (!remoteFriend) {
        remoteFriend = new BlackHole(WORLD_W / 2 + 140, WORLD_H / 2 + 140, 24, '#06b6d4', 'Friend', false, true);
        opponents.push(remoteFriend);
      }
    }

    function setupPeerConnection(conn) {
      peerConn = conn;

      if (peerConn.open) {
        onConnectionEstablished();
      } else {
        peerConn.on('open', onConnectionEstablished);
      }

      peerConn.on('data', (data) => {
        if (data.type === 'pos' && remoteFriend) {
          remoteFriend.x = data.x;
          remoteFriend.y = data.y;
          remoteFriend.radius = data.r;
          remoteFriend.score = data.score;
          if (data.name) remoteFriend.name = data.name;
        }
      });

      peerConn.on('close', () => {
        alert('Friend left match.');
        location.reload();
      });

      peerConn.on('error', (err) => {
        console.error('Conn err:', err);
      });
    }

    // 1. Host creates room
    function handleCreateRoom() {
      const code = Math.random().toString(36).substring(2, 8).toUpperCase();
      document.getElementById('generatedCode').textContent = code;
      document.getElementById('roomCodeDisplay').classList.remove('hidden');
      document.getElementById('joinInputSec').classList.add('hidden');

      if (peer) peer.destroy();
      peer = new Peer('hole2-' + code, peerConfig);

      peer.on('open', () => {
        const badge = document.querySelector('.status-badge span:last-child');
        if (badge) badge.textContent = 'ROOM READY';
      });

      peer.on('connection', (conn) => {
        setupPeerConnection(conn);
      });

      peer.on('error', (err) => {
        console.error('Peer error:', err);
      });
    }

    document.getElementById('btnCreateRoom').addEventListener('click', handleCreateRoom);
    document.getElementById('btnCreateRoom').addEventListener('touchend', (e) => {
      e.preventDefault();
      handleCreateRoom();
    });

    // 2. Friend opens join box
    function handleJoinToggle() {
      document.getElementById('joinInputSec').classList.remove('hidden');
      document.getElementById('roomCodeDisplay').classList.add('hidden');
    }
    document.getElementById('btnJoinRoom').addEventListener('click', handleJoinToggle);
    document.getElementById('btnJoinRoom').addEventListener('touchend', (e) => {
      e.preventDefault();
      handleJoinToggle();
    });

    // 3. Friend joins with code
    function handleConnectRoom() {
      const connectBtn = document.getElementById('btnConnectRoom');
      const input = document.getElementById('joinCodeInput');
      const code = input.value.trim().toUpperCase();

      if (!code || code.length < 4) {
        alert('Please enter a valid room code.');
        return;
      }

      connectBtn.textContent = 'Connecting...';
      connectBtn.disabled = true;

      if (peer) peer.destroy();
      peer = new Peer(peerConfig);

      peer.on('open', () => {
        const conn = peer.connect('hole2-' + code, { reliable: true });
        setupPeerConnection(conn);
      });

      peer.on('error', (err) => {
        console.error('Peer err:', err);
        connectBtn.textContent = 'Enter Match';
        connectBtn.disabled = false;
        alert('Could not join room. Make sure both devices are opened in Google Chrome.');
      });
    }

    document.getElementById('btnConnectRoom').addEventListener('click', handleConnectRoom);
    document.getElementById('btnConnectRoom').addEventListener('touchend', (e) => {
      e.preventDefault();
      handleConnectRoom();
    });

    // Solo Mode Button
    const soloBtn = document.getElementById('btnSolo');
    soloBtn.addEventListener('click', () => startMatch(true));
    soloBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      startMatch(true);
    });

    // Restart Button
    const restartBtn = document.getElementById('btnRestart');
    function handleRestart() {
      document.getElementById('gameOverScreen').classList.add('hidden');
      document.getElementById('lobbyScreen').classList.remove('hidden');
    }
    restartBtn.addEventListener('click', handleRestart);
    restartBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      handleRestart();
    });

    // Back to index.html Button
    document.getElementById('backBtn').addEventListener('click', () => {
      if (window.history.length > 1) window.history.back();
      else window.location.href = 'index.html';
    });
  </script>
</body>
