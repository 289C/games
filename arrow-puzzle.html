<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Tap Away Arrows - 1000 Levels</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #f8fafc;
      color: #1e293b;
      font-family: 'Outfit', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
      touch-action: manipulation;
    }

    /* Top Instagram Header */
    .insta-bar-wrap {
      width: 100%;
      max-width: 420px;
      padding: 10px 14px 4px;
      display: flex;
      justify-content: center;
    }

    .insta-bar {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 8px 14px;
      border-radius: 18px;
      background: #ffffff;
      text-decoration: none;
      color: #0f172a;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      border: 1.5px solid #e2e8f0;
      overflow: hidden;
      transition: transform 0.15s ease;
    }

    .insta-bar:active {
      transform: scale(0.97);
    }

    .insta-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .insta-icon-ring {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 10px rgba(220, 39, 67, 0.4);
    }

    .insta-icon-ring svg {
      width: 20px;
      height: 20px;
      stroke: #fff;
    }

    .insta-name {
      font-weight: 800;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .insta-badge {
      width: 14px;
      height: 14px;
      background: #0084ff;
      border-radius: 50%;
      color: #fff;
      font-size: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .insta-tag {
      font-size: 11px;
      color: #64748b;
    }

    .insta-btn {
      background: linear-gradient(135deg, #e1306c, #833ab4);
      color: #fff;
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Screen Views */
    .view {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
    }

    /* Level Selector Screen */
    #levelsScreen {
      padding: 12px 16px;
    }

    .levels-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      margin: 10px 0 14px;
    }

    .levels-title {
      font-size: 22px;
      font-weight: 900;
      color: #0f172a;
    }

    .page-nav {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 700;
      color: #475569;
    }

    .page-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-weight: bold;
    }

    .levels-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      width: 100%;
    }

    .lvl-box {
      aspect-ratio: 1;
      border-radius: 14px;
      background: #ffffff;
      border: 2px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 15px;
      color: #334155;
      cursor: pointer;
      box-shadow: 0 3px 8px rgba(0,0,0,0.03);
      position: relative;
    }

    .lvl-box.locked {
      background: #f1f5f9;
      color: #94a3b8;
      border-color: #e2e8f0;
      cursor: not-allowed;
    }

    .lvl-box.completed {
      background: #eff6ff;
      border-color: #3b82f6;
      color: #1d4ed8;
    }

    .lvl-box.completed::after {
      content: '★';
      font-size: 9px;
      color: #f59e0b;
      position: absolute;
      bottom: 2px;
    }

    /* Gameplay Screen */
    #gameScreen {
      display: none;
      padding: 4px 14px 14px;
      justify-content: space-between;
    }

    .game-top-nav {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .circle-icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #fff;
      border: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
      color: #1e293b;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    }

    .game-meta-hud {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .hud-badge {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      padding: 5px 12px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .hearts {
      font-size: 20px;
      letter-spacing: 2px;
    }

    canvas {
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.05);
      border: 2px solid #e2e8f0;
    }

    /* Bottom Action Controls */
    .bottom-bar {
      display: flex;
      gap: 32px;
      align-items: center;
      justify-content: center;
      margin-top: 10px;
    }

    .action-btn {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: #ffffff;
      border: 2px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      cursor: pointer;
      position: relative;
      box-shadow: 0 4px 14px rgba(0,0,0,0.06);
    }

    .action-btn:active {
      transform: scale(0.92);
    }

    .badge-count {
      position: absolute;
      top: -2px;
      right: -2px;
      background: #0084ff;
      color: #fff;
      font-size: 11px;
      font-weight: 900;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #fff;
    }

    /* Victory Modal Overlay */
    #victoryOverlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 132, 255, 0.94);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      color: #fff;
      text-align: center;
      padding: 20px;
    }

    #victoryOverlay h2 {
      font-size: 32px;
      font-weight: 900;
      margin-bottom: 8px;
    }

    #victoryOverlay p {
      font-size: 16px;
      opacity: 0.9;
      margin-bottom: 24px;
    }

    .vic-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 24px;
      width: 90%;
      max-width: 320px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.25);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .vic-btn {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      border: none;
    }

    .btn-next { background: #0084ff; color: #fff; }
    .btn-menu { background: #f1f5f9; color: #334155; }
  </style>
</head>
<body>

  <!-- Top Instagram Bar -->
  <div class="insta-bar-wrap">
    <a href="https://instagram.com/_satish_official_16" target="_blank" rel="noopener" class="insta-bar">
      <div class="insta-left">
        <div class="insta-icon-ring">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
          </svg>
        </div>
        <div>
          <div class="insta-name">@_satish_official_16 <span class="insta-badge">✓</span></div>
          <div class="insta-tag">Follow Developer on Instagram</div>
        </div>
      </div>
      <div class="insta-btn">Follow ↗</div>
    </a>
  </div>

  <!-- Screen 1: 1,000 Levels Selector -->
  <div class="view" id="levelsScreen">
    <div class="levels-header">
      <a href="index.html" class="circle-icon-btn" style="text-decoration: none;">‹</a>
      <div class="levels-title">Levels (1 - 1000)</div>
      <div class="page-nav">
        <button class="page-btn" id="prevPage">◀</button>
        <span id="pageTxt">1 / 50</span>
        <button class="page-btn" id="nextPage">▶</button>
      </div>
    </div>
    <div class="levels-grid" id="levelsGrid"></div>
  </div>

  <!-- Screen 2: Gameplay Canvas -->
  <div class="view" id="gameScreen">
    <div class="game-top-nav">
      <button class="circle-icon-btn" onclick="openLevelsMenu()">◀</button>
      <div style="text-align: center;">
        <div style="font-size: 11px; font-weight: 700; color: #64748b;">TRAIN YOUR BRAIN</div>
        <div style="font-size: 18px; font-weight: 900;" id="hudLevelTxt">Level 1</div>
      </div>
      <button class="circle-icon-btn" onclick="openLevelsMenu()">☰</button>
    </div>

    <div class="game-meta-hud">
      <div class="hud-badge">↗ <span id="arrowsLeftTxt">0</span></div>
      <div class="hearts" id="heartsTxt">❤️❤️❤️</div>
      <div class="hud-badge" id="diffBadge">Normal</div>
    </div>

    <canvas id="gameCanvas" width="340" height="420"></canvas>

    <div class="bottom-bar">
      <button class="action-btn" id="hintBtn">
        💡
        <div class="badge-count" id="hintCount">2</div>
      </button>
      <button class="action-btn" id="restartBtn">🔄</button>
    </div>
  </div>

  <!-- Victory Overlay -->
  <div id="victoryOverlay">
    <h2>Train Your Brain</h2>
    <p>Level Completed!</p>
    <div class="vic-card">
      <div style="font-size: 40px; margin-bottom: 4px;">🎉</div>
      <button class="vic-btn btn-next" onclick="nextLevelAction()">Next Level</button>
      <button class="vic-btn btn-menu" onclick="openLevelsMenu()">Level Select</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let currentLevel = 1;
    let unlockedLevel = parseInt(localStorage.getItem("arrowUnlockedLevel") || "1");
    let completedLevels = new Set(JSON.parse(localStorage.getItem("arrowCompletedLevels") || "[]"));

    let currentPage = Math.floor((currentLevel - 1) / 20) + 1;
    const totalLevels = 1000;
    const perPage = 20;

    let lives = 3;
    let hints = 2;
    let arrows = [];
    let animId = null;

    const cols = 6;
    const rows = 8;
    const stepX = 46;
    const stepY = 46;
    const offX = 35;
    const offY = 45;

    // Seeded Random Function
    function seededRandom(seed) {
      const x = Math.sin(seed++) * 10000;
      return x - Math.floor(x);
    }

    // Render Menu Grids
    function renderLevelGrid() {
      const grid = document.getElementById("levelsGrid");
      grid.innerHTML = "";

      const start = (currentPage - 1) * perPage + 1;
      const end = Math.min(start + perPage - 1, totalLevels);
      document.getElementById("pageTxt").textContent = `${currentPage} / ${Math.ceil(totalLevels / perPage)}`;

      for (let i = start; i <= end; i++) {
        const box = document.createElement("div");
        box.className = "lvl-box";
        box.textContent = i;

        if (i > unlockedLevel) {
          box.classList.add("locked");
          box.textContent = "🔒";
        } else {
          if (completedLevels.has(i)) box.classList.add("completed");
          box.onclick = () => loadLevel(i);
        }
        grid.appendChild(box);
      }
    }

    document.getElementById("prevPage").onclick = () => {
      if (currentPage > 1) {
        currentPage--;
        renderLevelGrid();
      }
    };

    document.getElementById("nextPage").onclick = () => {
      if (currentPage < Math.ceil(totalLevels / perPage)) {
        currentPage++;
        renderLevelGrid();
      }
    };

    function openLevelsMenu() {
      document.getElementById("gameScreen").style.display = "none";
      document.getElementById("victoryOverlay").style.display = "none";
      document.getElementById("levelsScreen").style.display = "flex";
      cancelAnimationFrame(animId);
      renderLevelGrid();
    }

    // Reverse Solvable Labyrinth Puzzle Generator
    function loadLevel(lvl) {
      currentLevel = lvl;
      document.getElementById("levelsScreen").style.display = "none";
      document.getElementById("victoryOverlay").style.display = "none";
      document.getElementById("gameScreen").style.display = "flex";

      document.getElementById("hudLevelTxt").textContent = `Level ${lvl}`;
      const diffBadge = document.getElementById("diffBadge");
      diffBadge.textContent = lvl >= 400 ? "Hard" : (lvl >= 150 ? "Tricky" : "Normal");

      lives = 3;
      updateHearts();

      let seed = lvl * 31337;
      const rnd = () => seededRandom(seed++);

      const arrowCount = Math.min(4 + Math.floor(lvl / 15), 18);
      arrows = [];

      const grid = Array.from({ length: rows }, () => Array(cols).fill(null));
      const dirs = [
        { name: "UP", dx: 0, dy: -1 },
        { name: "DOWN", dx: 0, dy: 1 },
        { name: "LEFT", dx: -1, dy: 0 },
        { name: "RIGHT", dx: 1, dy: 0 }
      ];

      for (let i = 0; i < arrowCount; i++) {
        let dir = dirs[Math.floor(rnd() * dirs.length)];
        let startX, startY;

        if (dir.name === "RIGHT") { startX = cols - 1; startY = Math.floor(rnd() * rows); }
        else if (dir.name === "LEFT") { startX = 0; startY = Math.floor(rnd() * rows); }
        else if (dir.name === "DOWN") { startX = Math.floor(rnd() * cols); startY = rows - 1; }
        else { startX = Math.floor(rnd() * cols); startY = 0; }

        let cx = startX;
        let cy = startY;
        if (grid[cy][cx] !== null) {
          let found = false;
          for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
              if (grid[r][c] === null) { cx = c; cy = r; found = true; break; }
            }
            if (found) break;
          }
          if (!found) break;
        }

        const pathLength = Math.min(2 + Math.floor(lvl / 50) + Math.floor(rnd() * 3), 6);
        let currentGridPath = [{ x: cx, y: cy }];
        grid[cy][cx] = i;

        for (let step = 1; step < pathLength; step++) {
          const validMoves = dirs.map(d => ({ x: cx - d.dx, y: cy - d.dy }))
            .filter(pos => pos.x >= 0 && pos.x < cols && pos.y >= 0 && pos.y < rows && grid[pos.y][pos.x] === null);

          if (validMoves.length === 0) break;
          const nextMove = validMoves[Math.floor(rnd() * validMoves.length)];
          cx = nextMove.x;
          cy = nextMove.y;
          grid[cy][cx] = i;
          currentGridPath.push({ x: cx, y: cy });
        }

        currentGridPath.reverse();
        const pixelPoints = currentGridPath.map(p => ({
          x: offX + p.x * stepX,
          y: offY + p.y * stepY
        }));

        arrows.push({
          id: i,
          points: pixelPoints,
          dir: dir.name,
          flying: false,
          shake: 0,
          cleared: false,
          hinted: false
        });
                arrows.push({
          id: i,
          points: pixelPoints,
          dir: dir.name,
          flying: false,
          shake: 0,
          scale: 1,       // <-- SWELL ANIMATION
          ripple: 0,      // <-- RIPPLE RING EFFECT
          cleared: false,
          hinted: false
        });
        
      }

      updateRemainingArrows();
      cancelAnimationFrame(animId);
      gameLoop();
    }

    function updateHearts() {
      document.getElementById("heartsTxt").textContent = "❤️".repeat(Math.max(lives, 0));
    }

    function updateRemainingArrows() {
      const active = arrows.filter(a => !a.cleared).length;
      document.getElementById("arrowsLeftTxt").textContent = active;
      if (active === 0) {
        setTimeout(handleVictory, 300);
      }
    }

    function isArrowUnblocked(arrow) {
      const head = arrow.points[arrow.points.length - 1];
      for (let other of arrows) {
        if (other === arrow || other.cleared || other.flying) continue;

        for (let p of other.points) {
          if (arrow.dir === "RIGHT" && p.y === head.y && p.x > head.x) return false;
          if (arrow.dir === "LEFT" && p.y === head.y && p.x < head.x) return false;
          if (arrow.dir === "DOWN" && p.x === head.x && p.y > head.y) return false;
          if (arrow.dir === "UP" && p.x === head.x && p.y < head.y) return false;
        }
      }
      return true;
    }

    function handleCanvasTap(e) {
      const rect = canvas.getBoundingClientRect();
      const clickX = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
      const clickY = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top;

      for (let arrow of arrows) {
        if (arrow.cleared || arrow.flying) continue;

        let hit = false;
        for (let p of arrow.points) {
          if (Math.hypot(p.x - clickX, p.y - clickY) < 26) {
            hit = true;
            break;
          }
        }

        if (hit) {
          if (isArrowUnblocked(arrow)) {
            arrow.flying = true;
          } else {
            arrow.shake = 10;
            lives--;
            updateHearts();
            if (lives <= 0) {
              alert("Out of lives! Level resets.");
              loadLevel(currentLevel);
            }
          }
          break;
        }
      }
    }

    canvas.addEventListener("pointerdown", handleCanvasTap);

    document.getElementById("hintBtn").onclick = () => {
      if (hints <= 0) return;
      const free = arrows.find(a => !a.cleared && !a.flying && isArrowUnblocked(a));
      if (free) {
        free.hinted = true;
        hints--;
        document.getElementById("hintCount").textContent = hints;
      }
    };

    document.getElementById("restartBtn").onclick = () => loadLevel(currentLevel);

    function handleVictory() {
      completedLevels.add(currentLevel);
      if (currentLevel >= unlockedLevel && unlockedLevel < totalLevels) {
        unlockedLevel = currentLevel + 1;
      }
      localStorage.setItem("arrowUnlockedLevel", unlockedLevel.toString());
      localStorage.setItem("arrowCompletedLevels", JSON.stringify(Array.from(completedLevels)));

      document.getElementById("victoryOverlay").style.display = "flex";
    }

    function nextLevelAction() {
      if (currentLevel < totalLevels) {
        loadLevel(currentLevel + 1);
      } else {
        openLevelsMenu();
      }
    }

    // Canvas Rendering Loop
    function gameLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Dots Matrix
      ctx.fillStyle = "#e2e8f0";
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          ctx.beginPath();
          ctx.arc(offX + c * stepX, offY + r * stepY, 2.5, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // Render Arrows
      arrows.forEach(arrow => {
        if (arrow.cleared) return;

        ctx.save();
        let offXAnim = 0;
        if (arrow.shake > 0) {
          offXAnim = Math.sin(arrow.shake * 2) * 5;
          arrow.shake--;
        }

        if (arrow.flying) {
          const speed = 16;
          if (arrow.dir === "RIGHT") arrow.points.forEach(p => p.x += speed);
          if (arrow.dir === "LEFT") arrow.points.forEach(p => p.x -= speed);
          if (arrow.dir === "DOWN") arrow.points.forEach(p => p.y += speed);
          if (arrow.dir === "UP") arrow.points.forEach(p => p.y -= speed);

          const head = arrow.points[arrow.points.length - 1];
          if (head.x < -70 || head.x > canvas.width + 70 || head.y < -70 || head.y > canvas.height + 70) {
            arrow.cleared = true;
            updateRemainingArrows();
          }
        }

        ctx.translate(offXAnim, 0);
        ctx.strokeStyle = arrow.flying ? "#0084ff" : (arrow.hinted ? "#00c853" : (arrow.shake > 0 ? "#ef4444" : "#1e293b"));
        ctx.fillStyle = ctx.strokeStyle;
        ctx.lineWidth = 4.5;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";

        ctx.beginPath();
        ctx.moveTo(arrow.points[0].x, arrow.points[0].y);
        for (let i = 1; i < arrow.points.length; i++) {
          ctx.lineTo(arrow.points[i].x, arrow.points[i].y);
        }

        const head = arrow.points[arrow.points.length - 1];
        let ex = head.x;
        let ey = head.y;
        if (arrow.dir === "RIGHT") ex += 22;
        if (arrow.dir === "LEFT") ex -= 22;
        if (arrow.dir === "DOWN") ey += 22;
        if (arrow.dir === "UP") ey -= 22;

        ctx.lineTo(ex, ey);
        ctx.stroke();

        ctx.beginPath();
        if (arrow.dir === "RIGHT") {
          ctx.moveTo(ex + 7, ey); ctx.lineTo(ex - 6, ey - 6); ctx.lineTo(ex - 6, ey + 6);
        } else if (arrow.dir === "LEFT") {
          ctx.moveTo(ex - 7, ey); ctx.lineTo(ex + 6, ey - 6); ctx.lineTo(ex + 6, ey + 6);
        } else if (arrow.dir === "UP") {
          ctx.moveTo(ex, ey - 7); ctx.lineTo(ex - 6, ey + 6); ctx.lineTo(ex + 6, ey + 6);
        } else if (arrow.dir === "DOWN") {
          ctx.moveTo(ex, ey + 7); ctx.lineTo(ex - 6, ey - 6); ctx.lineTo(ex + 6, ey - 6);
        }
        ctx.fill();

        ctx.restore();
      });

      animId = requestAnimationFrame(gameLoop);
    }

    renderLevelGrid();
  </script>
</body>
</html>
