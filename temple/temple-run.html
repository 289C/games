<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Runner - High Fidelity</title>
    <style>
        :root { --neon-cyan: #00f2ff; --neon-green: #00ff8c; --gold: #ffcc00; }
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Arial Black', sans-serif; }
        
        /* High-End Game UI from Video */
        #game-ui { position: absolute; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        
        .top-left { position: absolute; top: 20px; left: 20px; display: flex; gap: 10px; }
        .profile { width: 60px; height: 60px; border: 2px solid #fff; border-radius: 8px; background: url('https://api.dicebear.com/7.x/avataaars/svg?seed=Felix') center/cover; }
        .energy-container { display: flex; flex-direction: column; gap: 5px; }
        .bar-bg { width: 140px; height: 10px; background: rgba(255,255,255,0.2); border: 1px solid #fff; border-radius: 3px; overflow: hidden; }
        .bar-fill { height: 100%; width: 80%; background: linear-gradient(90deg, #ff8000, #ffcc00); }

        .top-center { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); text-align: center; color: white; }
        .progress-line { width: 250px; height: 4px; background: rgba(255,255,255,0.3); position: relative; margin-top: 10px; }
        .progress-dot { width: 12px; height: 12px; background: var(--gold); border-radius: 50%; position: absolute; top: -4px; left: 10%; box-shadow: 0 0 10px var(--gold); }

        .top-right { position: absolute; top: 20px; right: 20px; text-align: right; color: white; }
        .score-num { font-size: 36px; font-weight: 900; font-style: italic; text-shadow: 0 0 15px var(--neon-cyan); }
        .mult { color: #ff8000; font-size: 24px; margin-right: 10px; }

        .bottom-left { position: absolute; bottom: 30px; left: 20px; }
        .health-bar { width: 180px; height: 15px; background: rgba(0,0,0,0.5); border: 2px solid #fff; position: relative; }
        .health-fill { height: 100%; width: 70%; background: linear-gradient(90deg, #0044ff, #00f2ff); box-shadow: 0 0 15px var(--neon-cyan); }

        /* Overlays */
        #loading { position: absolute; width: 100%; height: 100%; background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; z-index: 100; }
        #game-over { position: absolute; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; flex-direction: column; justify-content: center; align-items: center; color: white; z-index: 200; }
        
        button { padding: 15px 40px; font-size: 20px; background: var(--neon-green); border: none; cursor: pointer; font-weight: bold; border-radius: 50px; text-transform: uppercase; margin-top: 20px; }
        
        .speed-vignette { position: absolute; top:0; left:0; width:100%; height:100%; pointer-events: none; transition: box-shadow 0.2s; z-index: 5; }
    </style>
</head>
<body>

    <div id="loading">
        <h1 style="letter-spacing: 10px;">CYBER RUNNER</h1>
        <div style="width: 200px; height: 4px; background: #222;"><div id="load-bar" style="width: 0%; height: 100%; background: var(--neon-cyan);"></div></div>
    </div>

    <div class="speed-vignette" id="vfx"></div>

    <div id="game-ui">
        <div class="top-left">
            <div class="profile"></div>
            <div class="energy-container">
                <div class="bar-bg"><div class="bar-fill"></div></div>
                <div style="color:var(--gold); font-size: 14px;">🪙 <span id="coins-ui">1211</span></div>
            </div>
        </div>

        <div class="top-center">
            <div style="font-size: 12px; opacity: 0.8;">LEVEL 12</div>
            <div class="progress-line"><div class="progress-dot"></div></div>
        </div>

        <div class="top-right">
            <span class="mult">x2</span>
            <div id="score-ui" class="score-num">000.00</div>
        </div>

        <div class="bottom-left">
            <div class="health-bar"><div class="health-fill" id="energy-bar"></div></div>
        </div>
    </div>

    <div id="game-over">
        <h1 style="color: #ff0044; font-size: 60px;">CONNECTION LOST</h1>
        <h2 id="final-stats"></h2>
        <button onclick="location.reload()">REBOOT SYSTEM</button>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // --- Configuration & URLs ---
        const ASSETS = {
            player: 'https://threejs.org/examples/models/gltf/RobotExpressive/RobotExpressive.glb',
            coinSound: 'https://actions.google.com/sounds/v1/foley/refrigerator_ice_clink.ogg'
        };

        const LANES = [-4, 0, 4];
        let state = { lane: 1, score: 0, coins: 1211, speed: 0.8, dead: false, jumping: false, sliding: false };

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000505);
        scene.fog = new THREE.FogExp2(0x000505, 0.02);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // --- High-End Neon Lighting ---
        const ambient = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambient);
        const pointLight = new THREE.PointLight(0x00f2ff, 10, 50);
        pointLight.position.set(0, 5, 5);
        scene.add(pointLight);

        // --- Loader & Assets ---
        const manager = new THREE.LoadingManager();
        const loader = new GLTFLoader(manager);
        let player, mixer, anims = {};

        manager.onProgress = (u, l, t) => document.getElementById('load-bar').style.width = (l/t*100)+'%';
        manager.onLoad = () => {
            document.getElementById('loading').style.display = 'none';
            animate();
        };

        // Load Character
        loader.load(ASSETS.player, (gltf) => {
            player = gltf.scene;
            player.scale.set(0.5, 0.5, 0.5);
            player.rotation.y = Math.PI;
            scene.add(player);
            mixer = new THREE.AnimationMixer(player);
            gltf.animations.forEach(a => anims[a.name.toLowerCase()] = mixer.clipAction(a));
            if(anims['running']) anims['running'].play();
        });

        // --- Procedural Online Track (Cyber Grid) ---
        const trackSegments = [];
        const obstacles = [];
        const coins = [];

        function createTrack(z) {
            const group = new THREE.Group();
            
            // Neon Grid Floor
            const geo = new THREE.PlaneGeometry(12, 30);
            const mat = new THREE.MeshStandardMaterial({ 
                color: 0x000000, 
                emissive: 0x00f2ff, 
                emissiveIntensity: 0.2,
                wireframe: true 
            });
            const grid = new THREE.Mesh(geo, mat);
            grid.rotation.x = -Math.PI / 2;
            group.add(grid);

            // Side Railings (Glowing Lines)
            const railGeo = new THREE.BoxGeometry(0.2, 0.2, 30);
            const railMat = new THREE.MeshBasicMaterial({ color: 0x00f2ff });
            const railL = new THREE.Mesh(railGeo, railMat);
            railL.position.set(-6, 0.1, 0);
            group.add(railL);
            const railR = railL.clone();
            railR.position.set(6, 0.1, 0);
            group.add(railR);

            group.position.z = z;
            scene.add(group);
            trackSegments.push(group);
        }

        for(let i=0; i<10; i++) createTrack(-i * 30);

        function spawnProps(z) {
            const lane = LANES[Math.floor(Math.random() * 3)];
            
            // Neon Obstacle (Red Gate)
            const isHigh = Math.random() > 0.7;
            const obsGeo = isHigh ? new THREE.TorusGeometry(3, 0.1, 8, 20) : new THREE.BoxGeometry(3, 0.8, 0.5);
            const obsMat = new THREE.MeshBasicMaterial({ color: 0xff0044 });
            const obs = new THREE.Mesh(obsGeo, obsMat);
            obs.position.set(lane, isHigh ? 3 : 0.4, z);
            obs.userData.type = isHigh ? 'slide' : 'jump';
            scene.add(obs);
            obstacles.push(obs);

            // Coin (Gold Hexagon)
            const cGeo = new THREE.CylinderGeometry(0.5, 0.5, 0.1, 6);
            const cMat = new THREE.MeshStandardMaterial({ color: 0xffcc00, emissive: 0xff8800 });
            const coin = new THREE.Mesh(cGeo, cMat);
            coin.rotation.x = Math.PI / 2;
            coin.position.set(LANES[Math.floor(Math.random()*3)], 1.5, z - 10);
            scene.add(coin);
            coins.push(coin);
        }

        // --- Input Controls ---
        window.onkeydown = (e) => {
            if (state.dead) return;
            if ((e.key==='a' || e.key==='ArrowLeft') && state.lane > 0) state.lane--;
            if ((e.key==='d' || e.key==='ArrowRight') && state.lane < 2) state.lane++;
            if ((e.key==='w' || e.key==='ArrowUp') && !state.jumping) {
                state.jumping = true;
                if(anims['jump']) anims['jump'].reset().play();
                setTimeout(() => { state.jumping = false; }, 800);
            }
            if ((e.key==='s' || e.key==='ArrowDown') && !state.sliding) {
                state.sliding = true;
                player.scale.y = 0.25; // Visual slide
                setTimeout(() => { state.sliding = false; player.scale.y = 0.5; }, 800);
            }
        };

        // --- Main Game Loop ---
        const clock = new THREE.Clock();
        function animate() {
            if (state.dead) return;
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            if (mixer) mixer.update(delta);

            // Speed & Score
            state.speed += 0.0001;
            state.score += state.speed;
            document.getElementById('score-ui').innerText = state.score.toFixed(2);
            
            // Motion Blur / Speed FX
            camera.fov = 75 + (state.speed * 15);
            camera.updateProjectionMatrix();
            document.getElementById('vfx').style.boxShadow = `inset 0 0 ${state.speed*120}px rgba(0,242,255,0.4)`;

            // Player smooth movement
            const tx = LANES[state.lane];
            player.position.x = THREE.MathUtils.lerp(player.position.x, tx, 0.15);
            if(state.jumping) player.position.y = Math.sin(Date.now()*0.008) * 3.5;
            else player.position.y = THREE.MathUtils.lerp(player.position.y, 0, 0.1);

            // Track Recycling
            trackSegments.forEach(seg => {
                seg.position.z += state.speed * 40 * delta;
                if(seg.position.z > 30) {
                    seg.position.z = Math.min(...trackSegments.map(s => s.position.z)) - 30;
                    spawnProps(seg.position.z - 20);
                }
            });

            // Collision Detection
            obstacles.forEach((obs, i) => {
                obs.position.z += state.speed * 40 * delta;
                const dZ = Math.abs(obs.position.z - player.position.z);
                const dX = Math.abs(obs.position.x - player.position.x);
                if(dZ < 1 && dX < 1.5) {
                    const fail = (obs.userData.type === 'jump' && !state.jumping) || (obs.userData.type === 'slide' && !state.sliding);
                    if(fail) { 
                        state.dead = true; 
                        document.getElementById('game-over').style.display='flex'; 
                        document.getElementById('final-stats').innerText = `SCORE: ${state.score.toFixed(0)} | COINS: ${state.coins}`;
                    }
                }
                if(obs.position.z > 15) { scene.remove(obs); obstacles.splice(i, 1); }
            });

            // Coin Collection
            coins.forEach((c, i) => {
                c.position.z += state.speed * 40 * delta;
                c.rotation.y += 0.1;
                if(player.position.distanceTo(c.position) < 1.5) {
                    state.coins += 10;
                    document.getElementById('coins-ui').innerText = state.coins;
                    scene.remove(c);
                    coins.splice(i, 1);
                }
                if(c.position.z > 15) { scene.remove(c); coins.splice(i, 1); }
            });

            // Dynamic Camera Follow
            camera.position.set(player.position.x * 0.5, 5, 11);
            camera.lookAt(player.position.x, 2, -5);

            renderer.render(scene, camera);
        }

        window.onresize = () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        };
    </script>
</body>
</html>
