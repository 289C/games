<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Arcade Runner - Pro Edition</title>
    <style>
        :root { --neon-cyan: #00f3ff; --neon-pink: #ff0055; --gold: #ffd700; }
        body { margin: 0; overflow: hidden; background: #05050a; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        
        #ui {
            position: absolute; top: 25px; left: 25px; color: white;
            font-size: 20px; text-shadow: 0 0 10px rgba(0,243,255,0.5); pointer-events: none;
            display: flex; flex-direction: column; gap: 8px; z-index: 10;
        }
        .stat-label { font-size: 12px; color: var(--neon-cyan); text-transform: uppercase; letter-spacing: 3px; font-weight: 700; }
        .stat-value { font-size: 32px; font-weight: 900; }
        .coin-text { color: var(--gold); text-shadow: 0 0 10px rgba(255,215,0,0.6); }

        #loading-screen {
            position: absolute; width: 100%; height: 100%; background: radial-gradient(circle, #1a1a2e, #05050a);
            display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; z-index: 100;
        }
        .progress-bar { width: 280px; height: 10px; background: rgba(255,255,255,0.1); margin-top: 25px; border-radius: 10px; overflow: hidden; border: 1px solid rgba(0,243,255,0.3); }
        #progress { width: 0%; height: 100%; background: var(--neon-cyan); box-shadow: 0 0 20px var(--neon-cyan); transition: width 0.3s ease; }

        #game-over {
            position: absolute; width: 100%; height: 100%; background: rgba(5,5,10,0.9);
            display: none; flex-direction: column; justify-content: center; align-items: center; color: white; z-index: 90;
            backdrop-filter: blur(8px);
        }
        
        .speed-vignette {
            position: absolute; top:0; left:0; width:100%; height:100%; pointer-events: none;
            box-shadow: inset 0 0 120px rgba(0,243,255,0); transition: box-shadow 0.3s;
        }

        button {
            padding: 16px 45px; font-size: 20px; background: linear-gradient(45deg, var(--neon-cyan), #0066ff); color: white; border: none;
            cursor: pointer; font-weight: 800; margin-top: 25px; border-radius: 50px; letter-spacing: 1px;
            box-shadow: 0 0 25px rgba(0,243,255,0.4); transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover { transform: scale(1.08); box-shadow: 0 0 35px rgba(0,243,255,0.8); }
    </style>
</head>
<body>

    <div id="loading-screen">
        <h1 style="letter-spacing: 6px; color: var(--neon-cyan); text-shadow: 0 0 20px rgba(0,243,255,0.5);">CYBER RUNNER</h1>
        <div class="progress-bar"><div id="progress"></div></div>
        <p id="loading-msg" style="color: #8888aa; margin-top: 15px; font-size: 14px; letter-spacing: 1px;">Loading assets...</p>
    </div>

    <div class="speed-vignette" id="vignette"></div>

    <div id="ui">
        <div>
            <div class="stat-label">Distance</div>
            <div id="score" class="stat-value">0m</div>
        </div>
        <div>
            <div class="stat-label">Credits</div>
            <div id="coins" class="stat-value coin-text">0</div>
        </div>
        <div>
            <div class="stat-label">Speed Multiplier</div>
            <div id="speed-val" class="stat-value" style="color: var(--neon-pink);">1.0x</div>
        </div>
    </div>

    <div id="game-over">
        <h1 style="color: var(--neon-pink); font-size: 65px; margin-bottom: 0; text-shadow: 0 0 30px rgba(255,0,85,0.6);">SYSTEM CRASH</h1>
        <p style="letter-spacing: 4px; color: #aaa; margin-top: 10px;">CONNECTION TERMINATED</p>
        <h2 id="final-stats" style="letter-spacing: 2px; margin: 20px 0;">DISTANCE: 0m | CREDITS: 0</h2>
        <button onclick="location.reload()">RE-INITIATE</button>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // --- Game Config & Variables ---
        const LANES = [-3, 0, 3];
        let currentLane = 1;
        let score = 0;
        let coinCount = 0;
        let speed = 0.6;
        const maxSpeed = 2.2;
        let isDead = false;
        let isJumping = false;
        let isSliding = false;

        // Sound Effects (Web Audio API Synthesizers)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTone(freq, type, duration) {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        // --- Three.js Scene Setup ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x05050a);
        scene.fog = new THREE.FogExp2(0x05050a, 0.018);

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.0);
        scene.add(ambientLight);

        const sun = new THREE.DirectionalLight(0x00f3ff, 2.0);
        sun.position.set(10, 30, 15);
        sun.castShadow = true;
        scene.add(sun);

        const pinkLight = new THREE.PointLight(0xff0055, 3, 50);
        pinkLight.position.set(-10, 5, -10);
        scene.add(pinkLight);

        // --- Loading Manager ---
        const manager = new THREE.LoadingManager();
        manager.onProgress = (url, items, total) => {
            const pct = Math.round((items / total) * 100);
            document.getElementById('progress').style.width = pct + '%';
        };
        manager.onLoad = () => {
            document.getElementById('loading-screen').style.display = 'none';
            animate();
        };

        const loader = new GLTFLoader(manager);
        let playerModel, mixer, animations = {};

        // Load Character from file (girl.glb)
        loader.load('girl.glb', (gltf) => {
            playerModel = gltf.scene;
            playerModel.scale.set(0.4, 0.4, 0.4);
            playerModel.position.set(0, 0, 0);
            playerModel.rotation.y = Math.PI; 
            playerModel.traverse(c => { if(c.isMesh) c.castShadow = true; });
            scene.add(playerModel);
            mixer = new THREE.AnimationMixer(playerModel);
            gltf.animations.forEach(clip => { animations[clip.name] = mixer.clipAction(clip); });
            if(gltf.animations[0]) animations[gltf.animations[0].name].play();
        }, undefined, (error) => {
            console.error('Error loading girl.glb:', error);
            // Fallback placeholder model if file is missing
            playerModel = new THREE.Mesh(new THREE.BoxGeometry(1,2,1), new THREE.MeshStandardMaterial({color: 0x00f3ff}));
            scene.add(playerModel);
            manager.itemLoaded('girl.glb');
        });

        // --- Procedural Glowing Arcade Track Generation ---
        const trackSegments = [];
        const segmentCount = 14;
        const segmentLength = 25;

        function createTrackSegment(zPos) {
            const group = new THREE.Group();
            
            // Main Road Platform
            const roadGeo = new THREE.BoxGeometry(10, 0.6, segmentLength);
            const roadMat = new THREE.MeshStandardMaterial({ color: 0x0c0c16, roughness: 0.6 });
            const road = new THREE.Mesh(roadGeo, roadMat);
            road.receiveShadow = true;
            group.add(road);

            // Glowing Neon Side Rails
            const railGeo = new THREE.BoxGeometry(0.2, 1.2, segmentLength);
            const railMat = new THREE.MeshBasicMaterial({ color: 0x00f3ff });
            const leftRail = new THREE.Mesh(railGeo, railMat); leftRail.position.set(-5, 0.5, 0);
            const rightRail = new THREE.Mesh(railGeo, railMat); rightRail.position.set(5, 0.5, 0);
            group.add(leftRail);
            group.add(rightRail);

            // Center Lane Dividers
            const lineGeo = new THREE.BoxGeometry(0.08, 0.65, segmentLength);
            const lineMat = new THREE.MeshBasicMaterial({ color: 0xff0055 });
            const line1 = new THREE.Mesh(lineGeo, lineMat); line1.position.set(-1.5, 0.05, 0);
            const line2 = new THREE.Mesh(lineGeo, lineMat); line2.position.set(1.5, 0.05, 0);
            group.add(line1);
            group.add(line2);

            group.position.z = zPos;
            scene.add(group);
            trackSegments.push(group);
        }

        for (let i = 0; i < segmentCount; i++) {
            createTrackSegment(-i * segmentLength);
        }

        // --- Obstacles & Collectibles ---
        const obstacles = [];
        const coins = [];

        function spawnProps(z) {
            const lane = LANES[Math.floor(Math.random() * 3)];
            
            // Neon Barrier Obstacles
            if (Math.random() > 0.25) {
                const isHigh = Math.random() > 0.7;
                const obs = new THREE.Mesh(
                    new THREE.BoxGeometry(2.4, isHigh ? 3.2 : 0.9, 0.8),
                    new THREE.MeshStandardMaterial({ color: 0xff0055, emissive: 0x550022, roughness: 0.2 })
                );
                obs.position.set(lane, isHigh ? 2.4 : 0.45, z);
                obs.userData.type = isHigh ? 'high' : 'low';
                scene.add(obs);
                obstacles.push(obs);
            }

            // Glowing Floating Credits (Coins)
            const coinGeo = new THREE.CylinderGeometry(0.45, 0.45, 0.12, 18);
            const coinMat = new THREE.MeshStandardMaterial({ color: 0xffd700, emissive: 0xaa8800, roughness: 0.1 });
            const coin = new THREE.Mesh(coinGeo, coinMat);
            coin.rotation.x = Math.PI / 2;
            coin.position.set(LANES[Math.floor(Math.random() * 3)], 1.3, z - 12);
            scene.add(coin);
            coins.push(coin);
        }

        // --- Touch & Keyboard Controls ---
        window.addEventListener('keydown', (e) => {
            if (isDead) return;
            if ((e.key === 'ArrowLeft' || e.key === 'a') && currentLane > 0) { currentLane--; playTone(400, 'sine', 0.1); }
            if ((e.key === 'ArrowRight' || e.key === 'd') && currentLane < 2) { currentLane++; playTone(450, 'sine', 0.1); }
            
            if ((e.key === 'ArrowUp' || e.key === 'w') && !isJumping) {
                isJumping = true;
                playTone(600, 'triangle', 0.2);
                setTimeout(() => isJumping = false, 700);
            }

            if ((e.key === 'ArrowDown' || e.key === 's') && !isSliding) {
                isSliding = true;
                playTone(300, 'sawtooth', 0.15);
                if (playerModel) playerModel.scale.set(0.4, 0.16, 0.4); 
                setTimeout(() => { if (playerModel) playerModel.scale.set(0.4, 0.4, 0.4); isSliding = false; }, 600);
            }
        });

        // Mobile touch swipe support
        let touchStartX = 0, touchStartY = 0;
        window.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY; });
        window.addEventListener('touchend', e => {
            if (isDead) return;
            let diffX = e.changedTouches[0].clientX - touchStartX;
            let diffY = e.changedTouches[0].clientY - touchStartY;
            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (diffX > 40 && currentLane < 2) { currentLane++; playTone(450, 'sine', 0.1); }
                else if (diffX < -40 && currentLane > 0) { currentLane--; playTone(400, 'sine', 0.1); }
            } else {
                if (diffY < -40 && !isJumping) { isJumping = true; playTone(600, 'triangle', 0.2); setTimeout(() => isJumping = false, 700); }
                else if (diffY > 40 && !isSliding) { isSliding = true; playTone(300, 'sawtooth', 0.15); if(playerModel) playerModel.scale.set(0.4,0.16,0.4); setTimeout(()=>{if(playerModel)playerModel.scale.set(0.4,0.4,0.4);isSliding=false;},600); }
            }
        });

        // --- Core Game Loop ---
        const clock = new THREE.Clock();

        function animate() {
            if (isDead) return;
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            if (mixer) {
                mixer.update(delta);
                mixer.timeScale = speed * 1.4; 
            }

            if (speed < maxSpeed) speed += 0.00007;
            
            // Dynamic FOV and Speed Vignette Glow
            camera.fov = 65 + (speed * 12);
            camera.updateProjectionMatrix();
            document.getElementById('vignette').style.boxShadow = `inset 0 0 ${speed * 90}px rgba(0,243,255,${(speed-0.5)*0.3})`;
            document.getElementById('speed-val').innerText = (speed * 2).toFixed(1) + "x";

            // Smooth Player Movement across lanes & jump arcs
            if (playerModel) {
                const targetX = LANES[currentLane];
                playerModel.position.x = THREE.MathUtils.lerp(playerModel.position.x, targetX, 0.22);
                playerModel.rotation.z = (playerModel.position.x - targetX) * 0.1; // Banking lean
                
                if (isJumping) {
                    playerModel.position.y = Math.sin((Date.now() * 0.007)) * 2.8;
                    if(playerModel.position.y < 0) playerModel.position.y = 0;
                } else {
                    playerModel.position.y = THREE.MathUtils.lerp(playerModel.position.y, 0, 0.3);
                }
            }

            // Endless Track Loop
            trackSegments.forEach(seg => {
                seg.position.z += speed * 42 * delta;
                if (seg.position.z > 25) {
                    let minZ = Math.min(...trackSegments.map(s => s.position.z));
                    seg.position.z = minZ - segmentLength;
                    spawnProps(seg.position.z - 15);
                }
            });

            // Coin Collection & Animation
            coins.forEach((coin, i) => {
                coin.position.z += speed * 42 * delta;
                coin.rotation.z += 0.15; 
                
                if (playerModel && coin.position.distanceTo(playerModel.position) < 1.6) {
                    coinCount++;
                    playTone(880, 'sine', 0.1);
                    document.getElementById('coins').innerText = coinCount;
                    scene.remove(coin);
                    coins.splice(i, 1);
                }
                if(coin.position.z > 10) { scene.remove(coin); coins.splice(i, 1); }
            });

            // Precise Collision Detection
            obstacles.forEach((obs, index) => {
                obs.position.z += speed * 42 * delta;
                if (playerModel) {
                    const distZ = Math.abs(obs.position.z - playerModel.position.z);
                    const distX = Math.abs(obs.position.x - playerModel.position.x);
                    
                    if (distZ < 0.9 && distX < 1.0) {
                        const isHigh = obs.userData.type === 'high';
                        if ((isHigh && !isSliding) || (!isHigh && !isJumping)) {
                            endGame();
                        }
                    }
                }
                if (obs.position.z > 10) { 
                    scene.remove(obs); 
                    obstacles.splice(index, 1); 
                    score += 10; 
                    document.getElementById('score').innerText = score + "m";
                }
            });

            // Cinematic Chase Camera Position
            camera.position.set(0, 4.2, 8.5);
            camera.lookAt(0, 1.2, -4);

            renderer.render(scene, camera);
        }

        function endGame() {
            isDead = true;
            playTone(120, 'sawtooth', 0.5);
            document.getElementById('game-over').style.display = 'flex';
            document.getElementById('final-stats').innerText = `DISTANCE: ${score}m | CREDITS: ${coinCount}`;
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
