<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Super Matino Adventure</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      background: radial-gradient(circle at top, #161936, #080915 90%);
      color: #fff;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow-x: hidden;
      padding-bottom: 20px;
    }

    /* Instagram Top Header */
    .ig-banner {
      width: 92%;
      max-width: 440px;
      margin: 12px auto 8px;
      padding: 8px 14px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .ig-profile {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .ig-badge {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 16px;
    }
    .ig-text {
      text-align: left;
      line-height: 1.2;
    }
    .ig-handle {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .verified-dot {
      width: 13px;
      height: 13px;
      background: #0095f6;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
    }
    .ig-sub {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.6);
    }
    .ig-btn {
      background: #e1306c;
      color: #fff;
      text-decoration: none;
      font-size: 11px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 20px;
      transition: transform 0.2s;
    }
    .ig-btn:active {
      transform: scale(0.92);
    }

    /* Game Logo Box */
    .brand-logo {
      width: 140px;
      height: 48px;
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 18px;
      color: #0b1021;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3);
      margin-bottom: 6px;
    }

    /* HUD Bar */
    .hud {
      width: 92%;
      max-width: 440px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 800;
      color: #38ef7d;
      text-shadow: 0 2px 4px rgba(0,0,0,0.6);
    }
    .hud-stat {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #fff;
    }

    /* Canvas Frame */
    .canvas-container {
      width: 92%;
      max-width: 440px;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7), 0 0 0 2px rgba(255, 255, 255, 0.15);
      position: relative;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Controls Surface */
    .controls-panel {
      width: 92%;
      max-width: 440px;
      margin-top: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 10px;
    }
    .d-pad, .action-pad {
      display: flex;
      gap: 14px;
    }
    .ctrl-btn {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      cursor: pointer;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4);
      transition: transform 0.08s ease, background 0.1s;
    }
    .ctrl-btn:active {
      transform: scale(0.88);
    }
    .btn-dir {
      background: #2b2e4a;
      color: #fff;
    }
    .btn-bomb {
      background: radial-gradient(circle, #ff6b6b, #c92a2a);
      color: #fff;
    }
    .btn-jump {
      background: radial-gradient(circle, #20c997, #099268);
      color: #fff;
    }

    /* Modal Screens */
    .modal {
      position: absolute;
      inset: 0;
      background: rgba(10, 12, 28, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      z-index: 100;
    }
    .modal h2 {
      font-size: 24px;
      margin-bottom: 8px;
    }
    .modal p {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 16px;
    }
    .action-btn {
      background: linear-gradient(135deg, #11998e, #38ef7d);
      border: none;
      padding: 10px 24px;
      border-radius: 25px;
      color: #0d2818;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Instagram Header Bar -->
  <div class="ig-banner">
    <div class="ig-profile">
      <div class="ig-badge">S</div>
      <div class="ig-text">
        <div class="ig-handle">@_satish_official_16 <span class="verified-dot">✓</span></div>
        <div class="ig-sub">Developer on Instagram</div>
      </div>
    </div>
    <a href="https://instagram.com/_satish_official_16" target="_blank" class="ig-btn">Follow ↗</a>
  </div>

  <div class="brand-logo">Just Run</div>

  <!-- Realtime HUD -->
  <div class="hud">
    <div class="hud-stat">❤️ <span id="livesDisplay">3</span></div>
    <div class="hud-stat">🪙 <span id="coinsDisplay">0</span></div>
    <div id="biomeDisplay">Verdant Valley | Level 1</div>
  </div>

  <!-- Game Canvas -->
  <div class="canvas-container">
    <canvas id="gameCanvas" width="480" height="270"></canvas>
    
    <div id="overlayModal" class="modal">
      <h2 id="modalTitle">Victory!</h2>
      <p id="modalDesc">Biome conquered. Gear up for the next challenge.</p>
      <button class="action-btn" id="modalBtn" onclick="modalAction()">Continue</button>
    </div>
  </div>

  <!-- Dual Touch Controller -->
  <div class="controls-panel">
    <div class="d-pad">
      <div class="ctrl-btn btn-dir" id="btnLeft">◀</div>
      <div class="ctrl-btn btn-dir" id="btnRight">▶</div>
    </div>
    <div class="action-pad">
      <div class="ctrl-btn btn-bomb" id="btnBomb">💣</div>
      <div class="ctrl-btn btn-jump" id="btnJump">⬆</div>
    </div>
  </div>

  <script>
    // Sound Generator (Web Audio API)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playTone(freq, duration = 0.1, type = 'sine') {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    // Biome Definitions
    const BIOMES = [
      { name: "Verdant Valley", type: "ground", sky: "#5c94fc", ground: "#885522", top: "#44b822", gravity: 0.45, jumpPower: -8.5, enemySpeed: 1.1, enemyType: "crawler" },
      { name: "Deep Atlantis", type: "water", sky: "#004b91", ground: "#7a5c37", top: "#00c3ff", gravity: 0.24, jumpPower: -6.4, enemySpeed: 0.9, enemyType: "diver" },
      { name: "Cavern Underpass", type: "underground", sky: "#130f1c", ground: "#2b2533", top: "#453b52", gravity: 0.44, jumpPower: -8.4, enemySpeed: 1.3, enemyType: "crawler" },
      { name: "Stratosphere Skylands", type: "air", sky: "#88ccff", ground: "#e2e8f0", top: "#ffffff", gravity: 0.38, jumpPower: -9.2, enemySpeed: 1.4, enemyType: "flier" },
      { name: "Infernal Volcano", type: "ground", sky: "#3b1111", ground: "#290c0c", top: "#e03e1b", gravity: 0.46, jumpPower: -8.6, enemySpeed: 1.6, enemyType: "crawler" },
      { name: "Cyber Matrix", type: "air", sky: "#050512", ground: "#0f172a", top: "#00f0ff", gravity: 0.40, jumpPower: -8.8, enemySpeed: 1.8, enemyType: "flier" }
    ];

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const W = canvas.width;
    const H = canvas.height;

    // Game Variables
    let currentLevel = 1;
    const TOTAL_LEVELS = 1000;
    let lives = 3;
    let coins = 0;
    let cameraX = 0;
    let gameOver = false;

    // Input States
    const keys = { left: false, right: false };

    // Player State
    const player = {
      x: 40,
      y: 180,
      w: 16,
      h: 22,
      vx: 0,
      vy: 0,
      facing: 1,
      grounded: false,
      powered: false
    };

    let platforms = [];
    let movingPlatforms = [];
    let mysteryBlocks = [];
    let coinsList = [];
    let hazards = [];
    let jumpPads = [];
    let enemies = [];
    let bombs = [];
    let particles = [];
    let flagPole = { x: 1200, y: 0, w: 10, h: 220 };

    // Procedural Level Engine (1000 Unique Configurations)
    function initLevel(lvl) {
      currentLevel = lvl;
      const bIndex = (lvl - 1) % BIOMES.length;
      const biome = BIOMES[bIndex];

      document.getElementById('biomeDisplay').textContent = biome.name;
      document.getElementById('livesDisplay').textContent = lives;
      document.getElementById('coinsDisplay').textContent = coins;

      player.x = 40;
      player.y = 100;
      player.vx = 0;
      player.vy = 0;
      cameraX = 0;

      platforms = [];
      movingPlatforms = [];
      mysteryBlocks = [];
      coinsList = [];
      hazards = [];
      jumpPads = [];
      enemies = [];
      bombs = [];
      particles = [];

      let curX = 0;
      const trackLength = 14 + Math.min(30, Math.floor(lvl * 0.4)); // Expands progressively

      for (let i = 0; i < trackLength; i++) {
        let platWidth = Math.max(90, 190 - (lvl * 0.35) + (Math.sin(i + lvl) * 40));
        let platY = H - 35;

        // Altitude changes based on track types
        if (biome.type === "air") {
          platY = H - 40 - ((i % 4) * 32);
          platWidth = Math.max(70, platWidth * 0.7);
        } else if (biome.type === "underground") {
          platY = H - 30 - ((i % 3) * 24);
        }

        platforms.push({ x: curX, y: platY, w: platWidth, h: H - platY + 100 });

        // Add Floating / Moving Platforms in higher stages
        if (lvl > 2 && i % 3 === 0) {
          const moveRange = lvl > 5 ? 40 : 0;
          movingPlatforms.push({
            originX: curX + 20,
            x: curX + 20,
            y: platY - 60,
            w: 48,
            h: 12,
            range: moveRange,
            speed: 0.8 + (lvl * 0.02),
            dir: 1
          });
        }

        // Mystery Item Boxes
        if (i % 2 === 1) {
          mysteryBlocks.push({
            x: curX + (platWidth / 2) - 10,
            y: platY - 55,
            w: 18,
            h: 18,
            hit: false,
            content: (i % 4 === 1 && lvl > 3) ? "power" : "coin"
          });
        }

        // Jump Launch Pads (Introduced after level 4)
        if (lvl > 4 && i % 5 === 2) {
          jumpPads.push({
            x: curX + 15,
            y: platY - 6,
            w: 20,
            h: 6
          });
        }

        // Hazards (Spikes) in Underground/Infernal tracks
        if ((biome.type === "underground" || lvl > 6) && i % 4 === 2) {
          hazards.push({
            x: curX + platWidth - 30,
            y: platY - 10,
            w: 18,
            h: 10
          });
        }

        // Scattered Coins
        coinsList.push({
          x: curX + (platWidth * 0.3),
          y: platY - 30,
          w: 10,
          h: 10,
          collected: false
        });

        // Enemies
        if (i > 0 && Math.random() < Math.min(0.85, 0.4 + (lvl * 0.03))) {
          enemies.push({
            x: curX + platWidth - 25,
            y: platY - 20,
            w: 18,
            h: 18,
            vx: -biome.enemySpeed,
            minX: curX,
            maxX: curX + platWidth - 18,
            alive: true,
            type: biome.enemyType
          });
        }

        // Pitfall Gap Scaling
        const gap = Math.min(100, (biome.type === "air" ? 55 : 35) + Math.floor(lvl * 0.5));
        curX += platWidth + gap;
      }

      // End Goal Flag
      flagPole.x = curX + 40;
      flagPole.y = H - 180;
      platforms.push({ x: curX - 20, y: H - 35, w: 140, h: 100 });
    }

    // Touch Binding Utility
    function bindTouch(id, onDown, onUp) {
      const el = document.getElementById(id);
      el.addEventListener('touchstart', (e) => { e.preventDefault(); onDown(); }, { passive: false });
      el.addEventListener('touchend', (e) => { e.preventDefault(); onUp(); }, { passive: false });
      el.addEventListener('mousedown', (e) => { e.preventDefault(); onDown(); });
      el.addEventListener('mouseup', (e) => { e.preventDefault(); onUp(); });
    }

    bindTouch('btnLeft', () => { keys.left = true; player.facing = -1; }, () => { keys.left = false; });
    bindTouch('btnRight', () => { keys.right = true; player.facing = 1; }, () => { keys.right = false; });

    bindTouch('btnJump', () => {
      if (player.grounded) {
        const biome = BIOMES[(currentLevel - 1) % BIOMES.length];
        player.vy = biome.jumpPower;
        player.grounded = false;
        playTone(520, 0.15);
        if ("vibrate" in navigator) navigator.vibrate(20);
      }
    }, () => {});

    bindTouch('btnBomb', () => {
      bombs.push({
        x: player.x + (player.facing * 14),
        y: player.y + 4,
        vx: player.facing * 5.5,
        vy: -3,
        timer: 60
      });
      playTone(320, 0.12, 'sawtooth');
    }, () => {});

    // Keyboard Fallback
    window.addEventListener('keydown', (e) => {
      if (e.code === 'ArrowLeft' || e.key === 'a') { keys.left = true; player.facing = -1; }
      if (e.code === 'ArrowRight' || e.key === 'd') { keys.right = true; player.facing = 1; }
      if ((e.code === 'Space' || e.code === 'ArrowUp') && player.grounded) {
        const biome = BIOMES[(currentLevel - 1) % BIOMES.length];
        player.vy = biome.jumpPower;
        player.grounded = false;
        playTone(520, 0.15);
      }
      if (e.code === 'KeyB') {
        bombs.push({ x: player.x + (player.facing * 14), y: player.y + 4, vx: player.facing * 5.5, vy: -3, timer: 60 });
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'ArrowLeft' || e.key === 'a') keys.left = false;
      if (e.code === 'ArrowRight' || e.key === 'd') keys.right = false;
    });

    function spawnSparks(x, y, color) {
      for (let i = 0; i < 8; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 4,
          vy: (Math.random() - 0.5) * 4,
          life: 18,
          color
        });
      }
    }

    // Main Game Cycle
    function update() {
      if (gameOver) return;

      const biome = BIOMES[(currentLevel - 1) % BIOMES.length];

      // Horizontal Motion
      if (keys.left) player.vx = -3.2;
      else if (keys.right) player.vx = 3.2;
      else player.vx *= 0.78;

      player.x += player.vx;

      // Gravity Application
      player.vy += biome.gravity;
      player.y += player.vy;

      // Platform Collisions (Static)
      player.grounded = false;
      for (let p of platforms) {
        if (player.x + player.w > p.x && player.x < p.x + p.w &&
            player.y + player.h >= p.y && player.y + player.h <= p.y + 12 && player.vy >= 0) {
          player.y = p.y - player.h;
          player.vy = 0;
          player.grounded = true;
        }
      }

      // Moving Platforms
      for (let mp of movingPlatforms) {
        if (mp.range > 0) {
          mp.x += mp.speed * mp.dir;
          if (mp.x > mp.originX + mp.range || mp.x < mp.originX - mp.range) mp.dir *= -1;
        }
        if (player.x + player.w > mp.x && player.x < mp.x + mp.w &&
            player.y + player.h >= mp.y && player.y + player.h <= mp.y + 10 && player.vy >= 0) {
          player.y = mp.y - player.h;
          player.vy = 0;
          player.grounded = true;
          player.x += mp.speed * mp.dir; // Ride the platform
        }
      }

      // Jump Pads Interaction
      for (let pad of jumpPads) {
        if (player.x + player.w > pad.x && player.x < pad.x + pad.w &&
            player.y + player.h >= pad.y && player.y + player.h <= pad.y + 8) {
          player.vy = -10.5; // Super spring bounce
          playTone(700, 0.2);
          if ("vibrate" in navigator) navigator.vibrate(30);
        }
      }

      // Hazards Interaction
      for (let hz of hazards) {
        if (player.x + player.w > hz.x && player.x < hz.x + hz.w &&
            player.y + player.h > hz.y + 2 && player.y < hz.y + hz.h) {
          triggerDeath();
          return;
        }
      }

      // Mystery Blocks Collision
      for (let b of mysteryBlocks) {
        if (player.x + player.w > b.x && player.x < b.x + b.w &&
            player.y <= b.y + b.h && player.y >= b.y && player.vy < 0) {
          player.vy = 1;
          if (!b.hit) {
            b.hit = true;
            coins += 5;
            document.getElementById('coinsDisplay').textContent = coins;
            playTone(880, 0.2);
            spawnSparks(b.x + 9, b.y, "#ffd700");
          }
        }
      }

      // Coins Collection
      for (let c of coinsList) {
        if (!c.collected && player.x + player.w > c.x && player.x < c.x + c.w &&
            player.y + player.h > c.y && player.y < c.y + c.h) {
          c.collected = true;
          coins += 1;
          document.getElementById('coinsDisplay').textContent = coins;
          playTone(900, 0.08);
        }
      }

      // Enemy Logic
      for (let e of enemies) {
        if (!e.alive) continue;
        e.x += e.vx;
        if (e.x <= e.minX || e.x >= e.maxX) e.vx *= -1;

        // Player stomp or touch
        if (player.x + player.w > e.x && player.x < e.x + e.w &&
            player.y + player.h >= e.y && player.y < e.y + e.h) {
          if (player.vy > 0 && player.y + player.h <= e.y + 10) {
            e.alive = false;
            player.vy = -5.5;
            playTone(600, 0.1);
            spawnSparks(e.x + 9, e.y + 9, "#ff4757");
          } else {
            triggerDeath();
            return;
          }
        }
      }

      // Bombs Handling
      for (let i = bombs.length - 1; i >= 0; i--) {
        const b = bombs[i];
        b.x += b.vx;
        b.y += b.vy;
        b.vy += 0.3;
        b.timer--;

        // Explode on enemies
        for (let e of enemies) {
          if (e.alive && b.x > e.x && b.x < e.x + e.w && b.y > e.y && b.y < e.y + e.h) {
            e.alive = false;
            b.timer = 0;
            spawnSparks(e.x + 9, e.y + 9, "#ff6b6b");
            playTone(180, 0.25, 'sawtooth');
          }
        }

        if (b.timer <= 0) {
          spawnSparks(b.x, b.y, "#ffa502");
          bombs.splice(i, 1);
        }
      }

      // Particles Update
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
      }

      // Camera Follow
      if (player.x - cameraX > W * 0.45) {
        cameraX = player.x - W * 0.45;
      } else if (player.x - cameraX < W * 0.2 && cameraX > 0) {
        cameraX = Math.max(0, player.x - W * 0.2);
      }

      // Pitfall Fall Check
      if (player.y > H + 40) {
        triggerDeath();
        return;
      }

      // Level Complete Check
      if (player.x >= flagPole.x) {
        triggerVictory();
      }
    }

    function triggerDeath() {
      lives--;
      document.getElementById('livesDisplay').textContent = lives;
      playTone(150, 0.4, 'triangle');
      if ("vibrate" in navigator) navigator.vibrate([80, 40, 80]);

      if (lives <= 0) {
        gameOver = true;
        showModal("Game Over", "Your journey ended here.", "Play Again", () => {
          lives = 3;
          coins = 0;
          gameOver = false;
          initLevel(1);
        });
      } else {
        initLevel(currentLevel);
      }
    }

    function triggerVictory() {
      gameOver = true;
      playTone(750, 0.3);
      showModal("Clear!", "Track finished! Step into the next zone.", "Next Stage", () => {
        gameOver = false;
        if (currentLevel < TOTAL_LEVELS) {
          initLevel(currentLevel + 1);
        } else {
          showModal("Legendary!", "You completed all 1,000 stages!", "Restart", () => {
            lives = 3;
            coins = 0;
            gameOver = false;
            initLevel(1);
          });
        }
      });
    }

    let activeModalCb = null;
    function showModal(title, desc, btnText, callback) {
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalDesc').textContent = desc;
      document.getElementById('modalBtn').textContent = btnText;
      document.getElementById('overlayModal').style.display = 'flex';
      activeModalCb = callback;
    }

    function modalAction() {
      document.getElementById('overlayModal').style.display = 'none';
      if (activeModalCb) activeModalCb();
    }

    // Render Canvas
    function draw() {
      const biome = BIOMES[(currentLevel - 1) % BIOMES.length];

      // Sky Background
      ctx.fillStyle = biome.sky;
      ctx.fillRect(0, 0, W, H);

      ctx.save();
      ctx.translate(-Math.floor(cameraX), 0);

      // Render Static Platforms
      for (let p of platforms) {
        ctx.fillStyle = biome.ground;
        ctx.fillRect(p.x, p.y, p.w, p.h);
        ctx.fillStyle = biome.top;
        ctx.fillRect(p.x, p.y, p.w, 6);
      }

      // Render Moving Platforms
      for (let mp of movingPlatforms) {
        ctx.fillStyle = "#ced4da";
        ctx.fillRect(mp.x, mp.y, mp.w, mp.h);
        ctx.fillStyle = "#748ffc";
        ctx.fillRect(mp.x, mp.y, mp.w, 3);
      }

      // Jump Spring Pads
      for (let jp of jumpPads) {
        ctx.fillStyle = "#ff922b";
        ctx.fillRect(jp.x, jp.y, jp.w, jp.h);
      }

      // Hazard Spikes
      for (let hz of hazards) {
        ctx.fillStyle = "#fa5252";
        ctx.beginPath();
        ctx.moveTo(hz.x, hz.y + hz.h);
        ctx.lineTo(hz.x + hz.w / 2, hz.y);
        ctx.lineTo(hz.x + hz.w, hz.y + hz.h);
        ctx.fill();
      }

      // Mystery Blocks
      for (let b of mysteryBlocks) {
        ctx.fillStyle = b.hit ? "#868e96" : "#fcc419";
        ctx.fillRect(b.x, b.y, b.w, b.h);
        if (!b.hit) {
          ctx.fillStyle = "#5c3d00";
          ctx.font = "bold 11px sans-serif";
          ctx.fillText("?", b.x + 5, b.y + 13);
        }
      }

      // Coins
      for (let c of coinsList) {
        if (!c.collected) {
          ctx.fillStyle = "#ffd43b";
          ctx.beginPath();
          ctx.arc(c.x + 5, c.y + 5, 5, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // Enemies
      for (let e of enemies) {
        if (e.alive) {
          ctx.fillStyle = e.type === "flier" ? "#e599f7" : "#4dabf7";
          ctx.beginPath();
          ctx.arc(e.x + 9, e.y + 9, 9, 0, Math.PI * 2);
          ctx.fill();
          // Eye
          ctx.fillStyle = "#000";
          ctx.fillRect(e.x + (e.vx > 0 ? 11 : 4), e.y + 6, 3, 3);
        }
      }

      // Bombs
      for (let b of bombs) {
        ctx.fillStyle = "#212529";
        ctx.beginPath();
        ctx.arc(b.x, b.y, 5, 0, Math.PI * 2);
        ctx.fill();
      }

      // Goal Flag
      ctx.fillStyle = "#fff";
      ctx.fillRect(flagPole.x, flagPole.y, 4, flagPole.h);
      ctx.fillStyle = "#40c057";
      ctx.beginPath();
      ctx.moveTo(flagPole.x + 4, flagPole.y + 10);
      ctx.lineTo(flagPole.x + 30, flagPole.y + 24);
      ctx.lineTo(flagPole.x + 4, flagPole.y + 38);
      ctx.fill();

      // Sparks / Particles
      for (let p of particles) {
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 2.5, 2.5);
      }

      // Draw Matino Character
      ctx.fillStyle = "#ff6b6b"; // Cap
      ctx.fillRect(player.x + 2, player.y, player.w - 4, 6);
      ctx.fillStyle = "#ffe066"; // Face
      ctx.fillRect(player.x + 3, player.y + 6, player.w - 6, 7);
      ctx.fillStyle = "#339af0"; // Body Overalls
      ctx.fillRect(player.x + 1, player.y + 13, player.w - 2, 9);

      ctx.restore();
    }

    // Engine Loop
    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    // Initialize Game
    initLevel(1);
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
;
