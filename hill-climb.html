<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Hill Climb Motorcycle</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #48dbfb;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #gameCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    /* --- TOP BAR --- */
    #top-bar {
      position: absolute;
      top: 14px;
      left: 0;
      width: 100%;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 100;
      pointer-events: auto;
    }

    .home-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #ffffff;
      text-decoration: none;
      background: rgba(18, 22, 34, 0.75);
      backdrop-filter: blur(10px);
      padding: 8px 16px;
      border-radius: 30px;
      font-weight: 800;
      font-size: 14px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .home-btn:active {
      transform: scale(0.95);
      background: rgba(255, 255, 255, 0.25);
    }

    .profile-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(18, 22, 34, 0.8);
      backdrop-filter: blur(10px);
      padding: 4px 14px 4px 5px;
      border-radius: 40px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      text-decoration: none;
      cursor: pointer;
    }

    .avatar-wrapper {
      position: relative;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .insta-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: conic-gradient(#f09433, #e6683c, #dc2743, #cc2366, #bc1888, #f09433);
      animation: spin 3s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    .avatar-wrapper img {
      position: relative;
      width: 27px;
      height: 27px;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid #111;
    }

    .profile-name {
      font-size: 13px;
      font-weight: 800;
      color: #fff;
    }

    /* --- HUD DASHBOARD --- */
    #hud {
      position: absolute;
      top: 68px;
      left: 16px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }

    .stat-pill {
      background: rgba(18, 22, 34, 0.75);
      backdrop-filter: blur(8px);
      padding: 6px 14px;
      border-radius: 20px;
      color: #fff;
      font-weight: 800;
      font-size: 14px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      width: fit-content;
    }

    .fuel-bar {
      width: 120px;
      height: 12px;
      background: rgba(0, 0, 0, 0.6);
      border-radius: 10px;
      overflow: hidden;
      border: 1.5px solid #fff;
    }

    #fuel-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #ff4757, #2ed573);
      transition: width 0.1s linear;
    }

    /* --- CONTROLS --- */
    #controls {
      position: absolute;
      bottom: 24px;
      left: 0;
      width: 100%;
      padding: 0 24px;
      display: flex;
      justify-content: space-between;
      z-index: 20;
      pointer-events: none;
    }

    .pedal {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: rgba(18, 22, 34, 0.85);
      border: 3.5px solid #ffffff;
      color: #ffffff;
      font-weight: 900;
      font-size: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
      transition: transform 0.08s ease;
    }

    .pedal:active, .pedal.active {
      transform: scale(0.92);
      background: #ff4757;
    }

    .pedal.gas:active, .pedal.gas.active {
      background: #2ed573;
    }

    /* --- GAME OVER MODAL --- */
    #modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(10, 12, 20, 0.85);
      backdrop-filter: blur(10px);
      z-index: 1000;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .modal-box {
      background: #191c2b;
      border: 2px solid #ff4757;
      padding: 30px;
      border-radius: 24px;
      text-align: center;
      width: 85%;
      max-width: 320px;
      color: #fff;
    }

    .modal-box h2 {
      font-size: 26px;
      margin-bottom: 8px;
    }

    .modal-box p {
      color: #a4b0be;
      margin-bottom: 20px;
      font-size: 15px;
    }

    .modal-btn {
      width: 100%;
      padding: 14px;
      border-radius: 30px;
      border: none;
      background: linear-gradient(45deg, #ff4757, #ff6b81);
      color: #fff;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header id="top-bar">
    <a href="index.html" class="home-btn">
      <span>⬅</span>
      <span>Home</span>
    </a>

    <a href="https://www.instagram.com/_satish_official_16?stkn=MTNzNXZ2cWpkdmRtNA==" target="_blank" rel="noopener noreferrer" class="profile-badge">
      <div class="avatar-wrapper">
        <div class="insta-ring"></div>
        <img src="Insta.jpg" onerror="this.onerror=null; this.src='insta.jpg';" alt="Satish" />
      </div>
      <span class="profile-name">@_satish_official_16</span>
      <span>✨</span>
    </a>
  </header>

  <div id="hud">
    <div class="stat-pill">🪙 <span id="coins-val">0</span></div>
    <div class="stat-pill">🚩 <span id="dist-val">0 m</span></div>
    <div class="stat-pill">
      ⛽
      <div class="fuel-bar">
        <div id="fuel-fill"></div>
      </div>
    </div>
  </div>

  <div id="controls">
    <div class="pedal" id="btn-brake">
      <span>BRAKE</span>
      <span style="font-size: 10px; opacity: 0.8;">REVERSE</span>
    </div>
    <div class="pedal gas" id="btn-gas">
      <span>GAS</span>
      <span style="font-size: 10px; opacity: 0.8;">FORWARD</span>
    </div>
  </div>

  <div id="modal">
    <div class="modal-box">
      <h2 id="modal-title">DRIVER DOWN! 💥</h2>
      <p id="modal-sub">Distance: 0m | Coins: 0</p>
      <button class="modal-btn" onclick="resetGame()">PLAY AGAIN</button>
    </div>
  </div>

  <canvas id="gameCanvas"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // --- CONTINUOUS PROCEDURAL ROAD FUNCTION ---
    // Mathematically seamless rolling asphalt road with no drops
    function getTerrainY(x) {
      const base = 500;
      const wave1 = Math.sin(x * 0.003) * 75;
      const wave2 = Math.cos(x * 0.008) * 45;
      const wave3 = Math.sin(x * 0.001) * 60;
      return base + wave1 + wave2 + wave3;
    }

    // --- BIKE DEFINITION & CONSTANTS ---
    const bike = {
      x: 100,
      y: getTerrainY(100) - 40,
      vx: 0,
      vy: 0,
      angle: 0,
      angularVelocity: 0,
      wheelBase: 65,
      wheelRadius: 18
    };

    let fuel = 100;
    let coins = 0;
    let distance = 0;
    let isGameOver = false;

    // Camera targets
    let camX = 0;
    let camY = 0;

    const input = { gas: false, brake: false };

    // --- ROAD COINS & FUEL CONTAINERS ---
    const pickups = [];
    for (let x = 400; x < 50000; x += 180 + Math.random() * 120) {
      const isFuel = Math.random() < 0.22;
      pickups.push({
        x: x,
        y: getTerrainY(x) - 35,
        type: isFuel ? 'fuel' : 'coin',
        collected: false
      });
    }

    // --- CONTROLS BINDINGS ---
    window.addEventListener('keydown', (e) => {
      if (e.code === 'ArrowRight' || e.code === 'KeyD') input.gas = true;
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') input.brake = true;
    });
    window.addEventListener('keyup', (e) => {
      if (e.code === 'ArrowRight' || e.code === 'KeyD') input.gas = false;
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') input.brake = false;
    });

    const bindTouch = (el, key) => {
      el.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        input[key] = true;
        el.classList.add('active');
      });
      const stop = () => {
        input[key] = false;
        el.classList.remove('active');
      };
      el.addEventListener('pointerup', stop);
      el.addEventListener('pointercancel', stop);
      el.addEventListener('pointerleave', stop);
    };
    bindTouch(document.getElementById('btn-gas'), 'gas');
    bindTouch(document.getElementById('btn-brake'), 'brake');

    // --- GAME RESET ---
    window.resetGame = function() {
      document.getElementById('modal').style.display = 'none';
      bike.x = 100;
      bike.y = getTerrainY(100) - 40;
      bike.vx = 0;
      bike.vy = 0;
      bike.angle = 0;
      bike.angularVelocity = 0;
      fuel = 100;
      coins = 0;
      distance = 0;
      isGameOver = false;
      pickups.forEach(p => p.collected = false);
    };

    function triggerGameOver(reason) {
      if (isGameOver) return;
      isGameOver = true;
      document.getElementById('modal-title').innerText = reason;
      document.getElementById('modal-sub').innerText = `Distance: ${Math.floor(distance)}m | Coins: ${coins}`;
      document.getElementById('modal').style.display = 'flex';
    }

    // --- PHYSICS ENGINE ---
    function updatePhysics() {
      if (isGameOver) return;

      // Gravity
      bike.vy += 0.28;

      const halfB = bike.wheelBase / 2;
      const cosA = Math.cos(bike.angle);
      const sinA = Math.sin(bike.angle);

      const rearX = bike.x - halfB * cosA;
      const rearY = bike.y - halfB * sinA + 10;
      const frontX = bike.x + halfB * cosA;
      const frontY = bike.y + halfB * sinA + 10;

      const groundRear = getTerrainY(rearX) - bike.wheelRadius;
      const groundFront = getTerrainY(frontX) - bike.wheelRadius;

      let groundedWheels = 0;

      // Suspension spring response
      if (rearY >= groundRear) {
        bike.vy -= (rearY - groundRear) * 0.45;
        groundedWheels++;
      }
      if (frontY >= groundFront) {
        bike.vy -= (frontY - groundFront) * 0.45;
        groundedWheels++;
      }

      // Driving force
      if (fuel > 0) {
        if (input.gas) {
          fuel -= 0.08;
          if (groundedWheels > 0) {
            bike.vx += 0.42 * cosA;
            bike.vy += 0.42 * sinA;
          } else {
            bike.angularVelocity += 0.0035; // Tilt up
          }
        }
        if (input.brake) {
          fuel -= 0.04;
          if (groundedWheels > 0) {
            bike.vx -= 0.3 * cosA;
            bike.vy -= 0.3 * sinA;
          } else {
            bike.angularVelocity -= 0.0035; // Tilt down
          }
        }
      } else if (groundedWheels === 0 && Math.abs(bike.vx) < 0.2) {
        triggerGameOver("OUT OF FUEL! ⛽");
      }

      // Position update
      bike.x += bike.vx;
      bike.y += bike.vy;

      // Slope alignment
      const groundSlope = (groundFront - groundRear) / bike.wheelBase;
      const targetAngle = Math.atan(groundSlope);

      if (groundedWheels > 0) {
        bike.angle += (targetAngle - bike.angle) * 0.25;
        bike.angularVelocity *= 0.65;
        bike.vx *= 0.985;
      } else {
        bike.angle += bike.angularVelocity;
        bike.angularVelocity *= 0.99;
      }

      // Crash if head touches ground
      const headX = bike.x - Math.sin(bike.angle) * 36;
      const headY = bike.y - Math.cos(bike.angle) * 36;
      if (headY > getTerrainY(headX) - 5) {
        triggerGameOver("DRIVER CRASHED! 💥");
      }

      // Distance & HUD
      distance = Math.max(distance, (bike.x - 100) / 40);
      document.getElementById('dist-val').innerText = Math.floor(distance) + ' m';
      document.getElementById('fuel-fill').style.width = Math.max(0, fuel) + '%';

      // Pickups check
      pickups.forEach(p => {
        if (!p.collected && Math.hypot(bike.x - p.x, bike.y - p.y) < 45) {
          p.collected = true;
          if (p.type === 'coin') {
            coins += 25;
            document.getElementById('coins-val').innerText = coins;
          } else {
            fuel = Math.min(100, fuel + 50);
          }
        }
      });
    }

    // --- RENDER SCENE ---
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Smooth camera interpolation
      const targetCamX = canvas.width * 0.35 - bike.x;
      const targetCamY = canvas.height * 0.65 - bike.y;
      camX += (targetCamX - camX) * 0.1;
      camY += (targetCamY - camY) * 0.1;

      ctx.save();
      ctx.translate(camX, camY);

      const renderLeft = bike.x - canvas.width * 0.6;
      const renderRight = bike.x + canvas.width * 0.8;

      // 1. Underground Dirt / Bedrock
      ctx.beginPath();
      ctx.moveTo(renderLeft, getTerrainY(renderLeft));
      for (let x = renderLeft; x < renderRight; x += 15) {
        ctx.lineTo(x, getTerrainY(x));
      }
      ctx.lineTo(renderRight, bike.y + 1200);
      ctx.lineTo(renderLeft, bike.y + 1200);
      ctx.closePath();
      ctx.fillStyle = '#533b24';
      ctx.fill();

      // 2. Green Grass Shoulder
      ctx.lineWidth = 26;
      ctx.strokeStyle = '#2ed573';
      ctx.stroke();

      // 3. Asphalt Road Layer
      ctx.lineWidth = 14;
      ctx.strokeStyle = '#2f3542';
      ctx.stroke();

      // 4. Yellow Center Road Dashes
      ctx.save();
      ctx.lineWidth = 2.5;
      ctx.setLineDash([16, 16]);
      ctx.strokeStyle = '#ffa502';
      ctx.stroke();
      ctx.restore();

      // 5. Pickups
      pickups.forEach(p => {
        if (!p.collected && p.x > renderLeft && p.x < renderRight) {
          if (p.type === 'coin') {
            ctx.beginPath();
            ctx.arc(p.x, p.y, 14, 0, Math.PI * 2);
            ctx.fillStyle = '#ffa502';
            ctx.fill();
            ctx.lineWidth = 2.5;
            ctx.strokeStyle = '#ffffff';
            ctx.stroke();

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 12px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('$', p.x, p.y);
          } else {
            ctx.fillStyle = '#ff4757';
            ctx.fillRect(p.x - 12, p.y - 15, 24, 30);
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 9px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('GAS', p.x, p.y);
          }
        }
      });

      // 6. Draw Red Classic Motorcycle
      ctx.save();
      ctx.translate(bike.x, bike.y);
      ctx.rotate(bike.angle);

      const rearWX = -bike.wheelBase / 2;
      const frontWX = bike.wheelBase / 2;
      const wheelWY = 10;

      // Wheel Renderer
      const drawWheel = (wx, wy) => {
        ctx.save();
        ctx.translate(wx, wy);

        // Tire
        ctx.beginPath();
        ctx.arc(0, 0, bike.wheelRadius, 0, Math.PI * 2);
        ctx.fillStyle = '#111317';
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#050608';
        ctx.stroke();

        // Rim
        ctx.beginPath();
        ctx.arc(0, 0, bike.wheelRadius - 3.5, 0, Math.PI * 2);
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#e4e7eb';
        ctx.stroke();

        // Hub
        ctx.beginPath();
        ctx.arc(0, 0, 4, 0, Math.PI * 2);
        ctx.fillStyle = '#9aa0a6';
        ctx.fill();

        // Rotating Spokes
        const spin = bike.x * 0.12;
        for (let s = 0; s < 8; s++) {
          const a = spin + (s * (Math.PI * 2 / 8));
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(Math.cos(a) * (bike.wheelRadius - 4), Math.sin(a) * (bike.wheelRadius - 4));
          ctx.strokeStyle = '#f1f3f4';
          ctx.lineWidth = 1.2;
          ctx.stroke();
        }
        ctx.restore();
      };

      drawWheel(rearWX, wheelWY);
      drawWheel(frontWX, wheelWY);

      // Frame & Exhaust
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#d2dae2';
      ctx.beginPath();
      ctx.moveTo(rearWX, wheelWY);
      ctx.lineTo(0, 4);
      ctx.lineTo(frontWX, wheelWY);
      ctx.stroke();

      // Exhaust pipe
      ctx.lineWidth = 3.5;
      ctx.strokeStyle = '#ced6e0';
      ctx.beginPath();
      ctx.moveTo(6, 6);
      ctx.lineTo(-6, 12);
      ctx.lineTo(rearWX - 8, 12);
      ctx.stroke();

      // Chrome Engine Block
      ctx.fillStyle = '#747d8c';
      ctx.fillRect(-8, -2, 18, 14);

      // Red Fuel Tank
      ctx.fillStyle = '#e82222';
      ctx.beginPath();
      ctx.moveTo(-2, -18);
      ctx.lineTo(16, -18);
      ctx.quadraticCurveTo(22, -10, 14, -4);
      ctx.lineTo(-4, -4);
      ctx.closePath();
      ctx.fill();

      // Leather Seat
      ctx.fillStyle = '#1e272e';
      ctx.fillRect(-22, -14, 22, 6);

      // Handlebars & Headlight
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = '#d2dae2';
      ctx.beginPath();
      ctx.moveTo(frontWX, wheelWY);
      ctx.lineTo(frontWX - 8, -22);
      ctx.lineTo(frontWX - 14, -26);
      ctx.stroke();

      // Headlight
      ctx.beginPath();
      ctx.arc(frontWX + 2, -18, 4.5, -Math.PI / 2, Math.PI / 2);
      ctx.fillStyle = '#fff200';
      ctx.fill();

      // Biker Rider
      ctx.strokeStyle = '#1e272e';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(-10, -12);
      ctx.lineTo(-2, 0);
      ctx.lineTo(0, 8);
      ctx.stroke();

      // Torso
      ctx.lineWidth = 7;
      ctx.beginPath();
      ctx.moveTo(-10, -12);
      ctx.lineTo(2, -24);
      ctx.stroke();

      // Helmet
      ctx.beginPath();
      ctx.arc(4, -32, 7.5, 0, Math.PI * 2);
      ctx.fillStyle = '#e82222';
      ctx.fill();

      // Visor
      ctx.beginPath();
      ctx.arc(7, -32, 4, -Math.PI / 4, Math.PI / 4);
      ctx.strokeStyle = '#00f2fe';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.restore();
      ctx.restore();
    }

    // --- GAME LOOP ---
    function loop() {
      requestAnimationFrame(loop);
      updatePhysics();
      draw();
    }
    loop();
  </script>
</body>
</html>
