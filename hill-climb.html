<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Hill Climb Racing - Motorcycle Edition</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #70c5ce;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #gameCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    /* --- TOP BAR (HOME + INSTAGRAM) --- */
    #top-bar {
      position: absolute;
      top: 14px;
      left: 0;
      width: 100%;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 999;
      pointer-events: auto;
      animation: slideDownBar 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes slideDownBar {
      from { transform: translateY(-50px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .home-btn {
      display: flex;
      align-items: center;
      gap: 7px;
      color: #ffffff;
      text-decoration: none;
      background: rgba(20, 24, 38, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 7px 16px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 13.5px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      transition: all 0.2s ease;
    }

    .home-btn:active {
      transform: scale(0.95);
      background: rgba(255, 255, 255, 0.25);
    }

    .profile-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(18, 20, 32, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 4px 14px 4px 5px;
      border-radius: 40px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
      transition: transform 0.2s ease;
    }

    .profile-badge:active {
      transform: scale(0.96);
    }

    .avatar-wrapper {
      position: relative;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .insta-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: conic-gradient(#f09433, #e6683c, #dc2743, #cc2366, #bc1888, #f09433);
      animation: rotateRing 3s linear infinite;
    }

    @keyframes rotateRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .avatar-wrapper img {
      position: relative;
      width: 27px;
      height: 27px;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid #0f121d;
    }

    .profile-name {
      font-size: 13px;
      font-weight: 800;
      color: #fff;
      letter-spacing: 0.3px;
      background: linear-gradient(90deg, #ffffff 0%, #ff8da1 50%, #ffffff 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: textShine 4s linear infinite;
    }

    @keyframes textShine {
      0% { background-position: 0% center; }
      100% { background-position: 200% center; }
    }

    /* --- GAME DASHBOARD / HUD --- */
    #hud {
      position: absolute;
      top: 66px;
      left: 16px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }

    .stat-pill {
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(8px);
      padding: 6px 14px;
      border-radius: 20px;
      color: #fff;
      font-weight: 800;
      font-size: 14px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .fuel-container {
      width: 140px;
      height: 14px;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 10px;
      overflow: hidden;
      border: 1.5px solid #fff;
    }

    #fuel-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #ff3838, #2ed573);
      transition: width 0.1s linear;
    }

    /* --- PEDALS (MOBILE TOUCH) --- */
    #controls {
      position: absolute;
      bottom: 24px;
      left: 0;
      width: 100%;
      padding: 0 24px;
      display: flex;
      justify-content: space-between;
      z-index: 10;
      pointer-events: none;
    }

    .pedal {
      width: 85px;
      height: 85px;
      border-radius: 50%;
      background: rgba(20, 24, 38, 0.75);
      backdrop-filter: blur(10px);
      border: 3px solid #fff;
      color: #fff;
      font-weight: 900;
      font-size: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
      transition: transform 0.1s ease;
    }

    .pedal:active, .pedal.active {
      transform: scale(0.92);
      background: #ff4757;
    }

    .pedal.gas:active, .pedal.gas.active {
      background: #2ed573;
    }

    /* --- GAME OVER MODAL --- */
    #modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(10, 12, 18, 0.85);
      backdrop-filter: blur(10px);
      z-index: 1000;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .modal-box {
      background: #191c2b;
      border: 2px solid #ff4757;
      padding: 30px;
      border-radius: 24px;
      text-align: center;
      width: 85%;
      max-width: 320px;
      color: #fff;
      box-shadow: 0 0 35px rgba(255, 71, 87, 0.35);
    }

    .modal-box h2 {
      font-size: 26px;
      margin-bottom: 10px;
    }

    .modal-box p {
      color: #a4b0be;
      margin-bottom: 20px;
      font-size: 15px;
    }

    .modal-btn {
      width: 100%;
      padding: 14px;
      border-radius: 30px;
      border: none;
      background: linear-gradient(45deg, #ff4757, #ff6b81);
      color: #fff;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header id="top-bar">
    <a href="index.html" class="home-btn">
      <span>⬅</span>
      <span>Home</span>
    </a>

    <a href="https://www.instagram.com/_satish_official_16?stkn=MTNzNXZ2cWpkdmRtNA==" target="_blank" rel="noopener noreferrer" class="profile-badge">
      <div class="avatar-wrapper">
        <div class="insta-ring"></div>
        <img src="Insta.jpg" onerror="this.onerror=null; this.src='insta.jpg';" alt="Satish" />
      </div>
      <span class="profile-name">@_satish_official_16</span>
      <span>✨</span>
    </a>
  </header>

  <div id="hud">
    <div class="stat-pill">
      <span>🪙</span>
      <span id="coins-val">0</span>
    </div>
    <div class="stat-pill">
      <span>🚩</span>
      <span id="dist-val">0 m</span>
    </div>
    <div class="stat-pill">
      <span>⛽ FUEL</span>
      <div class="fuel-container">
        <div id="fuel-fill"></div>
      </div>
    </div>
  </div>

  <div id="controls">
    <div class="pedal" id="btn-brake">
      <span>BRAKE</span>
      <span style="font-size: 11px; opacity: 0.7;">REVERSE</span>
    </div>
    <div class="pedal gas" id="btn-gas">
      <span>GAS</span>
      <span style="font-size: 11px; opacity: 0.7;">FORWARD</span>
    </div>
  </div>

  <div id="modal">
    <div class="modal-box">
      <h2 id="modal-title">DRIVER DOWN! 💥</h2>
      <p id="modal-sub">Distance: 0m | Coins: 0</p>
      <button class="modal-btn" onclick="resetGame()">PLAY AGAIN</button>
    </div>
  </div>

  <canvas id="gameCanvas"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // --- SOUND SYNTHESIS ---
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let actx = null;

    function initAudio() {
      if (!actx) actx = new AudioContext();
      if (actx.state === 'suspended') actx.resume();
    }

    function playTone(freq, duration, type='sine') {
      try {
        initAudio();
        const osc = actx.createOscillator();
        const gain = actx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, actx.currentTime);
        gain.gain.setValueAtTime(0.12, actx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + duration);
        osc.connect(gain);
        gain.connect(actx.destination);
        osc.start();
        osc.stop(actx.currentTime + duration);
      } catch (e) {}
    }

    // --- TERRAIN FUNCTION ---
    function getTerrainY(x) {
      if (x < 150) return 400; // Flat initial spawn
      return 400 + Math.sin(x * 0.004) * 85 + Math.sin(x * 0.012) * 45 + Math.cos(x * 0.0018) * 90;
    }

    // --- BIKE STATE & 2D PHYSICS ---
    const car = {
      x: 100,
      y: 350,
      vx: 0,
      vy: 0,
      angle: 0,
      angularVelocity: 0,
      wheelBase: 70,       // Wheelbase matching motorcycle
      wheelRadius: 17,     // Classic wheel radius
      bodyWidth: 80,
      bodyHeight: 28
    };

    let fuel = 100;
    let coins = 0;
    let distance = 0;
    let isGameOver = false;

    const input = { gas: false, brake: false };

    // --- PICKUPS (Coins & Fuel Cans) ---
    const pickups = [];
    for (let x = 350; x < 25000; x += 180 + Math.random() * 120) {
      const isFuel = Math.random() < 0.22;
      pickups.push({
        x: x,
        y: getTerrainY(x) - 40,
        type: isFuel ? 'fuel' : 'coin',
        collected: false
      });
    }

    // --- KEYBOARD LISTENERS ---
    window.addEventListener('keydown', (e) => {
      initAudio();
      if (e.code === 'ArrowRight' || e.code === 'KeyD') input.gas = true;
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') input.brake = true;
    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'ArrowRight' || e.code === 'KeyD') input.gas = false;
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') input.brake = false;
    });

    // --- TOUCH PEDAL CONTROLS ---
    const btnGas = document.getElementById('btn-gas');
    const btnBrake = document.getElementById('btn-brake');

    const bindTouchPedal = (btn, key) => {
      btn.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        initAudio();
        input[key] = true;
        btn.classList.add('active');
      });
      const release = () => {
        input[key] = false;
        btn.classList.remove('active');
      };
      btn.addEventListener('pointerup', release);
      btn.addEventListener('pointercancel', release);
      btn.addEventListener('pointerleave', release);
    };

    bindTouchPedal(btnGas, 'gas');
    bindTouchPedal(btnBrake, 'brake');

    // --- RESTART GAME ---
    window.resetGame = function() {
      document.getElementById('modal').style.display = 'none';
      car.x = 100;
      car.y = 350;
      car.vx = 0;
      car.vy = 0;
      car.angle = 0;
      car.angularVelocity = 0;
      fuel = 100;
      coins = 0;
      distance = 0;
      isGameOver = false;
      pickups.forEach(p => p.collected = false);
    };

    function triggerGameOver(reason) {
      if (isGameOver) return;
      isGameOver = true;
      playTone(130, 0.4, 'sawtooth');
      document.getElementById('modal-title').innerText = reason;
      document.getElementById('modal-sub').innerText = `Distance: ${Math.floor(distance)}m | Coins: ${coins}`;
      document.getElementById('modal').style.display = 'flex';
    }

    // --- PHYSICS UPDATE ---
    function updatePhysics() {
      if (isGameOver) return;

      // Gravity
      car.vy += 0.28;

      const halfB = car.wheelBase / 2;
      const cosA = Math.cos(car.angle);
      const sinA = Math.sin(car.angle);

      // Contact points of wheels
      const rearX = car.x - halfB * cosA;
      const rearY = car.y - halfB * sinA + 12;
      const frontX = car.x + halfB * cosA;
      const frontY = car.y + halfB * sinA + 12;

      const groundRear = getTerrainY(rearX) - car.wheelRadius;
      const groundFront = getTerrainY(frontX) - car.wheelRadius;

      let grounded = 0;

      if (rearY >= groundRear) {
        car.vy -= (rearY - groundRear) * 0.4;
        grounded++;
      }

      if (frontY >= groundFront) {
        car.vy -= (frontY - groundFront) * 0.4;
        grounded++;
      }

      // Gas / Brake engine
      if (fuel > 0) {
        if (input.gas) {
          fuel -= 0.085;
          if (grounded > 0) {
            car.vx += 0.40 * cosA;
            car.vy += 0.40 * sinA;
          } else {
            // Mid-air pitch up (wheelie)
            car.angularVelocity += 0.0035;
          }
        }
        if (input.brake) {
          fuel -= 0.04;
          if (grounded > 0) {
            car.vx -= 0.28 * cosA;
            car.vy -= 0.28 * sinA;
          } else {
            // Mid-air pitch down (endo)
            car.angularVelocity -= 0.0035;
          }
        }
      } else if (grounded === 0 && Math.abs(car.vx) < 0.2) {
        triggerGameOver("OUT OF FUEL! ⛽");
      }

      // Update position
      car.x += car.vx;
      car.y += car.vy;

      // Angular physics & ground friction
      const groundSlope = (groundFront - groundRear) / car.wheelBase;
      const targetAngle = Math.atan(groundSlope);

      if (grounded > 0) {
        car.angle += (targetAngle - car.angle) * 0.25;
        car.angularVelocity *= 0.65;
        car.vx *= 0.985;
      } else {
        car.angle += car.angularVelocity;
        car.angularVelocity *= 0.99;
      }

      // Driver head crash
      const driverHeadY = car.y - Math.cos(car.angle) * 35;
      const groundAtHead = getTerrainY(car.x);
      if (driverHeadY > groundAtHead - 8) {
        triggerGameOver("DRIVER CRASHED! 💥");
      }

      // Track distance & fuel
      distance = Math.max(distance, (car.x - 100) / 40);
      document.getElementById('dist-val').innerText = Math.floor(distance) + ' m';
      document.getElementById('fuel-fill').style.width = Math.max(0, fuel) + '%';

      // Pickup collisions
      pickups.forEach(p => {
        if (!p.collected && Math.hypot(car.x - p.x, car.y - p.y) < 45) {
          p.collected = true;
          if (p.type === 'coin') {
            coins += 25;
            document.getElementById('coins-val').innerText = coins;
            playTone(880, 0.12, 'square');
          } else if (p.type === 'fuel') {
            fuel = Math.min(100, fuel + 45);
            playTone(440, 0.25, 'sine');
          }
        }
      });
    }

    // --- DRAW SCENE ---
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Camera Follow
      ctx.save();
      const camX = canvas.width * 0.3 - car.x;
      const camY = canvas.height * 0.62 - car.y;
      ctx.translate(camX, camY);

      // 1. Terrain
      ctx.beginPath();
      const startX = car.x - canvas.width * 0.6;
      const endX = car.x + canvas.width * 0.9;

      ctx.moveTo(startX, getTerrainY(startX));
      for (let x = startX; x < endX; x += 15) {
        ctx.lineTo(x, getTerrainY(x));
      }
      ctx.lineTo(endX, car.y + 1200);
      ctx.lineTo(startX, car.y + 1200);
      ctx.closePath();

      ctx.fillStyle = '#6b4f2c';
      ctx.fill();

      // Grass Edge
      ctx.lineWidth = 14;
      ctx.strokeStyle = '#2ed573';
      ctx.stroke();

      // 2. Pickups
      pickups.forEach(p => {
        if (!p.collected && p.x > startX && p.x < endX) {
          if (p.type === 'coin') {
            ctx.beginPath();
            ctx.arc(p.x, p.y, 14, 0, Math.PI * 2);
            ctx.fillStyle = '#ffa502';
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#fff';
            ctx.stroke();

            ctx.fillStyle = '#fff';
            ctx.font = 'bold 12px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('$', p.x, p.y);
          } else {
            ctx.fillStyle = '#ff4757';
            ctx.fillRect(p.x - 12, p.y - 15, 24, 30);
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 9px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('GAS', p.x, p.y);
          }
        }
      });

      // 3. Draw Red Classic Motorcycle
      ctx.save();
      ctx.translate(car.x, car.y);
      ctx.rotate(car.angle);

      const rearWX = -car.wheelBase / 2;
      const frontWX = car.wheelBase / 2;
      const wheelWY = 12;

      // Wheel Spoke Renderer
      const drawChromeSpokeWheel = (wx, wy) => {
        ctx.save();
        ctx.translate(wx, wy);

        // Tire
        ctx.beginPath();
        ctx.arc(0, 0, car.wheelRadius, 0, Math.PI * 2);
        ctx.fillStyle = '#111317';
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#050608';
        ctx.stroke();

        // Rim
        ctx.beginPath();
        ctx.arc(0, 0, car.wheelRadius - 3.5, 0, Math.PI * 2);
        ctx.lineWidth = 2.2;
        ctx.strokeStyle = '#e4e7eb';
        ctx.stroke();

        // Hub
        ctx.beginPath();
        ctx.arc(0, 0, 4.5, 0, Math.PI * 2);
        ctx.fillStyle = '#9aa0a6';
        ctx.fill();

        // Rotating Spokes
        const spin = car.x * 0.12;
        for (let s = 0; s < 10; s++) {
          const a = spin + (s * (Math.PI * 2 / 10));
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(Math.cos(a) * (car.wheelRadius - 4), Math.sin(a) * (car.wheelRadius - 4));
          ctx.strokeStyle = '#f1f3f4';
          ctx.lineWidth = 1.2;
          ctx.stroke();
        }

        ctx.restore();
      };

      drawChromeSpokeWheel(rearWX, wheelWY);
      drawChromeSpokeWheel(frontWX, wheelWY);

      // Carrier & Frame
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = '#d2dae2';
      ctx.beginPath();
      ctx.moveTo(rearWX, wheelWY);
      ctx.lineTo(rearWX + 8, -6);
      ctx.lineTo(rearWX - 6, -10);
      ctx.lineTo(-4, -10);
      ctx.stroke();

      // Fenders
      ctx.lineWidth = 3.5;
      ctx.strokeStyle = '#2f3542';
      ctx.beginPath();
      ctx.arc(rearWX, wheelWY, car.wheelRadius + 2.5, -Math.PI * 0.95, -Math.PI * 0.15);
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(frontWX, wheelWY, car.wheelRadius + 2.5, -Math.PI * 0.85, -Math.PI * 0.25);
      ctx.stroke();

      // Chrome Exhaust Pipe
      ctx.lineWidth = 4;
      ctx.strokeStyle = '#f1f2f6';
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(10, 8);
      ctx.lineTo(-2, 14);
      ctx.lineTo(rearWX - 10, 14);
      ctx.stroke();

      // Engine Block & Horizontal Fins
      ctx.fillStyle = '#ced6e0';
      ctx.beginPath();
      ctx.roundRect(-8, -2, 22, 16, 3);
      ctx.fill();
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = '#747d8c';
      ctx.stroke();

      ctx.strokeStyle = '#57606f';
      ctx.lineWidth = 1.2;
      for (let fY = 1; fY <= 12; fY += 2.5) {
        ctx.beginPath();
        ctx.moveTo(-6, fY);
        ctx.lineTo(12, fY);
        ctx.stroke();
      }

      // Battery Panel
      ctx.fillStyle = '#1e272e';
      ctx.beginPath();
      ctx.roundRect(-16, -6, 12, 12, 2);
      ctx.fill();

      // Red Classic Fuel Tank
      ctx.fillStyle = '#e82222';
      ctx.beginPath();
      ctx.moveTo(0, -18);
      ctx.lineTo(18, -18);
        ctx.quadraticCurveTo(24, -10, 16, -4);
      ctx.lineTo(-4, -4);
      ctx.quadraticCurveTo(-6, -16, 0, -18);
      ctx.closePath();
      ctx.fill();

      ctx.lineWidth = 1.5;
      ctx.strokeStyle = '#ff7675';
      ctx.stroke();

      // Fuel Tank Cap
      ctx.fillStyle = '#dfe4ea';
      ctx.fillRect(8, -20, 5, 2.5);

      // Long Leather Bench Seat
      ctx.fillStyle = '#1e272e';
      ctx.beginPath();
      ctx.roundRect(-24, -15, 28, 8, [4, 4, 2, 2]);
      ctx.fill();
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 1;
      ctx.stroke();

      // Front Fork & Handlebars
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#d2dae2';
      ctx.beginPath();
      ctx.moveTo(frontWX, wheelWY);
      ctx.lineTo(frontWX - 8, -22);
      ctx.stroke();

      ctx.strokeStyle = '#2f3542';
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.moveTo(frontWX - 12, -22);
      ctx.lineTo(frontWX - 16, -26);
      ctx.stroke();

      // Chrome Round Headlight
      ctx.beginPath();
      ctx.arc(frontWX + 2, -18, 5, -Math.PI / 2, Math.PI / 2);
      ctx.fillStyle = '#fff200';
      ctx.fill();
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = '#dfe4ea';
      ctx.stroke();

      // Biker Rider
      ctx.strokeStyle = '#2f3542';
      ctx.lineWidth = 4.5;
      ctx.beginPath();
      ctx.moveTo(-10, -12);
      ctx.lineTo(-2, 0);
      ctx.lineTo(-1, 9);
      ctx.stroke();

      ctx.strokeStyle = '#1e272e';
      ctx.lineWidth = 7;
      ctx.beginPath();
      ctx.moveTo(-10, -14);
      ctx.lineTo(2, -26);
      ctx.stroke();

      ctx.strokeStyle = '#1e272e';
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.moveTo(2, -24);
      ctx.lineTo(frontWX - 15, -24);
      ctx.stroke();

      // Helmet
      ctx.beginPath();
      ctx.arc(5, -35, 8, 0, Math.PI * 2);
      ctx.fillStyle = '#e82222';
      ctx.fill();

      // Visor
      ctx.beginPath();
      ctx.arc(8, -35, 4.5, -Math.PI / 4, Math.PI / 4);
      ctx.strokeStyle = '#00f2fe';
      ctx.lineWidth = 2.5;
      ctx.stroke();

      ctx.restore();
      ctx.restore();
    }

    // --- GAME LOOP ---
    function loop() {
      requestAnimationFrame(loop);
      updatePhysics();
      draw();
    }
    loop();
  </script>
</body>
</html>
