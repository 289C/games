<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Interactive Celebration</title>
  <!-- Three.js and Canvas Confetti -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #0b0c10; color: #fff; }
    #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

    /* UI Overlay */
    .hud {
      position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
      z-index: 10; text-align: center; pointer-events: none; width: 90%; max-width: 500px;
    }
    .hud h1 { font-size: 1.8rem; color: #66fcf1; text-shadow: 0 0 12px rgba(102, 252, 241, 0.6); }
    .hud p { font-size: 0.95rem; color: #c5c6c7; margin-top: 6px; }

    /* Interactive Buttons */
    .controls {
      position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
      z-index: 10; display: flex; gap: 12px;
    }
    .btn {
      padding: 12px 24px; border: none; border-radius: 25px;
      background: linear-gradient(135deg, #45a29e, #66fcf1); color: #0b0c10;
      font-weight: 700; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn:hover { transform: scale(1.05); box-shadow: 0 0 15px rgba(102, 252, 241, 0.5); }

    /* Pop-up Message Modal for Balloon Text */
    #note-modal {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.8);
      background: rgba(20, 20, 30, 0.92); border: 1px solid #66fcf1; border-radius: 16px;
      padding: 24px; text-align: center; z-index: 20; max-width: 320px; width: 85%;
      box-shadow: 0 0 30px rgba(102, 252, 241, 0.3); opacity: 0; pointer-events: none;
      transition: 0.3s ease-in-out;
    }
    #note-modal.active { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }
    #note-modal h3 { color: #ffe600; margin-bottom: 8px; }
    #note-modal p { font-size: 1.05rem; color: #fff; margin-bottom: 16px; }

    /* Final Card Container */
    #final-view {
      position: absolute; bottom: 15%; left: 50%; transform: translateX(-50%);
      text-align: center; z-index: 10; background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.2); backdrop-filter: blur(8px);
      padding: 20px 30px; border-radius: 12px; display: none; width: 85%; max-width: 420px;
    }
    #final-view h2 { color: #ff007f; margin-bottom: 8px; }
  </style>
</head>
<body>

  <div id="canvas-container"></div>

  <div class="hud">
    <h1 id="title-text">Stage 1: Blow the Candles 🎂</h1>
    <p id="sub-text">Blow directly into your mic or click below to blow out the candles!</p>
  </div>

  <div class="controls" id="btn-group">
    <button class="btn" id="mic-btn" onclick="startMicDetection()">Enable Mic 🎙️</button>
    <button class="btn" id="blow-btn" onclick="extinguishCandles()">Manual Blow 💨</button>
  </div>

  <!-- Note Reveal Modal -->
  <div id="note-modal">
    <h3 id="modal-tag">Surprise! 🎈</h3>
    <p id="modal-text">Default Text</p>
    <button class="btn" onclick="closeModal()">Next Balloon</button>
  </div>

  <!-- Final Stage Screen -->
  <div id="final-view">
    <h2 id="final-receiver">Dear Friend,</h2>
    <p id="final-message" style="margin-bottom: 12px; color: #ddd;"></p>
    <p id="final-sender" style="color: #66fcf1; font-weight: bold;"></p>
  </div>

  <script>
    // URL Parameter Customization (e.g. ?name=Rohit&from=Satish&note=You+are+the+best)
    const urlParams = new URLSearchParams(window.location.search);
    const receiverName = urlParams.get('name') || "Special Friend";
    const senderName = urlParams.get('from') || "Your Best Buddy";
    const customFinalNote = urlParams.get('note') || "May this new year bring you limitless joy, peace, and milestone achievements!";
    
    // Custom messages inside the balloons
    const balloonWishes = [
      "Keep shining brighter every day! ⭐",
      "May all your coding bugs be squashed! 🚀",
      "Health, Wealth, and Pure Happiness! 🌟"
    ];

    let currentStage = 1;
    let scene, camera, renderer, cakeGroup, balloonsGroup = [];
    let candleLights = [], flameMeshes = [];
    let isBlownOut = false;
    let audioContext, analyser, microphone;

    // --- INIT THREE.JS SCENE ---
    function init() {
      const container = document.getElementById('canvas-container');
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 4, 12);
      camera.lookAt(0, 1, 0);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      container.appendChild(renderer.domElement);

      // Ambient & Spot Lighting
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
      scene.add(ambientLight);

      const spotLight = new THREE.SpotLight(0xfffaed, 1.2);
      spotLight.position.set(5, 12, 8);
      scene.add(spotLight);

      buildCake();
      window.addEventListener('resize', onWindowResize);
      window.addEventListener('pointerdown', onSceneClick);
      animate();
    }

    // --- STAGE 1: BUILD 3D CAKE ---
    function buildCake() {
      cakeGroup = new THREE.Group();

      // Plate
      const plateGeo = new THREE.CylinderGeometry(3.6, 3.2, 0.2, 32);
      const plateMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.3 });
      cakeGroup.add(new THREE.Mesh(plateGeo, plateMat));

      // Bottom Tier
      const tier1Geo = new THREE.CylinderGeometry(3, 3, 1.5, 32);
      const tier1Mat = new THREE.MeshStandardMaterial({ color: 0xff6b81, roughness: 0.4 });
      const tier1 = new THREE.Mesh(tier1Geo, tier1Mat);
      tier1.position.y = 0.85;
      cakeGroup.add(tier1);

      // Top Tier
      const tier2Geo = new THREE.CylinderGeometry(2, 2, 1.2, 32);
      const tier2Mat = new THREE.MeshStandardMaterial({ color: 0xfff0f5, roughness: 0.4 });
      const tier2 = new THREE.Mesh(tier2Geo, tier2Mat);
      tier2.position.y = 2.2;
      cakeGroup.add(tier2);

      // Candles with Flames
      const candlePositions = [[-0.7, 0], [0.7, 0], [0, 0.7], [0, -0.7]];
      candlePositions.forEach(([x, z]) => {
        // Wax Stick
        const stickGeo = new THREE.CylinderGeometry(0.08, 0.08, 0.8, 16);
        const stickMat = new THREE.MeshStandardMaterial({ color: 0x48dbfb });
        const stick = new THREE.Mesh(stickGeo, stickMat);
        stick.position.set(x, 3.2, z);
        cakeGroup.add(stick);

        // Flame
        const flameGeo = new THREE.SphereGeometry(0.12, 16, 16);
        flameGeo.scale(1, 1.8, 1);
        const flameMat = new THREE.MeshBasicMaterial({ color: 0xffa502 });
        const flame = new THREE.Mesh(flameGeo, flameMat);
        flame.position.set(x, 3.7, z);
        cakeGroup.add(flame);
        flameMeshes.push(flame);

        // Candle Light Glow
        const light = new THREE.PointLight(0xff7700, 1.5, 4);
        light.position.set(x, 3.8, z);
        cakeGroup.add(light);
        candleLights.push(light);
      });

      scene.add(cakeGroup);
    }

    // --- MICROPHONE BLOW DETECTION ---
    async function startMicDetection() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();
        microphone = audioContext.createMediaStreamSource(stream);
        microphone.connect(analyser);
        analyser.fftSize = 256;

        document.getElementById('mic-btn').innerText = "Mic Active 🎙️";
        listenAudioLevels();
      } catch (err) {
        alert("Microphone access denied or unsupported. Use the 'Manual Blow' button instead!");
      }
    }

    function listenAudioLevels() {
      if (isBlownOut) return;
      const bufferLength = analyser.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);
      analyser.getByteFrequencyData(dataArray);

      let sum = 0;
      for (let i = 0; i < bufferLength; i++) sum += dataArray[i];
      let average = sum / bufferLength;

      // Noise threshold when blowing directly into microphone
      if (average > 65) {
        extinguishCandles();
        return;
      }
      requestAnimationFrame(listenAudioLevels);
    }

    function extinguishCandles() {
      if (isBlownOut) return;
      isBlownOut = true;

      // Remove flame visuals & point lights
      flameMeshes.forEach(f => f.scale.set(0, 0, 0));
      candleLights.forEach(l => l.intensity = 0);

      // Trigger Confetti
      confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });

      // Transition to Stage 2 after 1.5 seconds
      setTimeout(() => {
        transitionToStage2();
      }, 1500);
    }

    // --- STAGE 2: 3D BALLOON POPPING GAME ---
    function transitionToStage2() {
      currentStage = 2;
      document.getElementById('title-text').innerText = "Stage 2: Tap the Balloons 🎈";
      document.getElementById('sub-text').innerText = "Click floating balloons to reveal secret wishes!";
      document.getElementById('btn-group').style.display = 'none';

      // Animate cake downward out of sight
      let removeCake = setInterval(() => {
        cakeGroup.position.y -= 0.15;
        if (cakeGroup.position.y < -8) {
          clearInterval(removeCake);
          scene.remove(cakeGroup);
          spawnBalloons();
        }
      }, 20);
    }

    function spawnBalloons() {
      const colors = [0xff4757, 0x2ed573, 0x1e90ff];
      const positions = [-2.8, 0, 2.8];

      positions.forEach((xPos, idx) => {
        const balloonNode = new THREE.Group();

        // Balloon Body
        const geo = new THREE.SphereGeometry(1, 32, 32);
        geo.scale(1, 1.25, 1);
        const mat = new THREE.MeshStandardMaterial({
          color: colors[idx],
          roughness: 0.2,
          metalness: 0.1
        });
        const mesh = new THREE.Mesh(geo, mat);
        balloonNode.add(mesh);

        // String
        const stringGeo = new THREE.CylinderGeometry(0.015, 0.015, 2, 8);
        const stringMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const stringMesh = new THREE.Mesh(stringGeo, stringMat);
        stringMesh.position.y = -2;
        balloonNode.add(stringMesh);

        balloonNode.position.set(xPos, -0.5, 0);
        balloonNode.userData = { id: idx, message: balloonWishes[idx] };

        scene.add(balloonNode);
        balloonsGroup.push(balloonNode);
      });
    }

    // --- CLICK / RAYCASTING INTERACTIONS ---
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    function onSceneClick(event) {
      if (currentStage !== 2) return;

      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(scene.children, true);

      if (intersects.length > 0) {
        // Find which balloon was clicked
        let obj = intersects[0].object;
        while (obj.parent && obj.parent !== scene) {
          obj = obj.parent;
        }

        const bIndex = balloonsGroup.indexOf(obj);
        if (bIndex > -1) {
          popBalloon(obj, bIndex);
        }
      }
    }

    function popBalloon(balloon, index) {
      // Confetti burst from balloon position
      confetti({ particleCount: 50, spread: 60, origin: { x: (balloon.position.x / 10) + 0.5, y: 0.5 } });

      // Show note
      document.getElementById('modal-text').innerText = balloon.userData.message;
      document.getElementById('note-modal').classList.add('active');

      scene.remove(balloon);
      balloonsGroup.splice(index, 1);

      if (balloonsGroup.length === 0) {
        setTimeout(transitionToStage3, 1000);
      }
    }

    function closeModal() {
      document.getElementById('note-modal').classList.remove('active');
    }

    // --- STAGE 3: FINAL NOTE VIEW ---
    function transitionToStage3() {
      currentStage = 3;
      closeModal();
      document.getElementById('title-text').innerText = `Celebration Completed! ✨`;
      document.getElementById('sub-text').innerText = "";

      const finalView = document.getElementById('final-view');
      document.getElementById('final-receiver').innerText = `To ${receiverName},`;
      document.getElementById('final-message').innerText = customFinalNote;
      document.getElementById('final-sender').innerText = `— Warmly sent by ${senderName}`;
      finalView.style.display = 'block';

      // Endless subtle celebration fireworks
      setInterval(() => {
        confetti({ particleCount: 30, spread: 360, startVelocity: 25, origin: { x: Math.random(), y: Math.random() * 0.5 } });
      }, 1200);
    }

    // --- ANIMATION LOOP ---
    function animate() {
      requestAnimationFrame(animate);

      // Flickering candle effect in Stage 1
      if (currentStage === 1 && !isBlownOut) {
        candleLights.forEach(l => {
          l.intensity = 1.2 + Math.sin(Date.now() * 0.02) * 0.3;
        });
      }

      // Gentle floating animation for balloons
      if (currentStage === 2) {
        balloonsGroup.forEach((b, i) => {
          b.position.y += Math.sin(Date.now() * 0.003 + i) * 0.005;
          b.rotation.y += 0.008;
        });
      }

      renderer.render(scene, camera);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    window.onload = init;
  </script>
</body>
</html>
