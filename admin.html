<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Video Upload</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1115;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
    }
    .box {
      background: #1a1d24;
      padding: 25px;
      border-radius: 12px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      border: 1px solid #2a2e39;
    }
    h2 { margin: 0 0 15px 0; font-size: 20px; }
    input, button {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 6px;
      font-size: 14px;
    }
    input[type="text"], input[type="password"] {
      background: #262a35;
      border: 1px solid #3b4252;
      color: #fff;
      outline: none;
    }
    input[type="file"] {
      background: #262a35;
      border: 1px dashed #4f5869;
      color: #aaa;
      padding: 10px;
      cursor: pointer;
    }
    button {
      background: #ff4757;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { background: #555; cursor: not-allowed; }
    .hidden { display: none !important; }
    .item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #2a2e39;
      padding: 10px 0;
      font-size: 14px;
    }
    .item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 250px; }
    .del-btn {
      background: #3b4252;
      color: #ff6b6b;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      width: auto;
      font-size: 12px;
      margin: 0;
    }
    .progress-bar {
      width: 100%;
      height: 8px;
      background: #262a35;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 8px;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: #2ed573;
      transition: width 0.2s;
    }
  </style>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
</head>
<body>

  <!-- LOGIN -->
  <div id="login-box" class="box">
    <h2>Owner Verification</h2>
    <input type="password" id="admin-pass" placeholder="Enter Owner Password">
    <button onclick="login()">Enter Dashboard</button>
    <p id="err" style="color: #ff6b6b; font-size: 13px; margin: 6px 0 0 0;"></p>
  </div>

  <!-- DASHBOARD -->
  <div id="dash-box" class="box hidden">
    <h2>Upload Video File</h2>
    <input type="text" id="v-title" placeholder="Video Title">
    <input type="file" id="v-file" accept="video/mp4,video/webm,video/ogg,video/*">
    
    <div id="progress-container" class="hidden">
      <div class="progress-bar">
        <div id="progress-fill" class="progress-fill"></div>
      </div>
      <p id="progress-status" style="font-size: 12px; color: #aaa; margin: 4px 0;">Uploading: 0%</p>
    </div>

    <button id="upload-btn" onclick="uploadVideoFile()">Upload to Website</button>

    <h3 style="margin-top: 25px; font-size: 16px; border-bottom: 1px solid #2a2e39; padding-bottom: 6px;">Manage Videos</h3>
    <div id="video-list"></div>

    <button onclick="logout()" style="background: #262a35; color: #bbb; border: 1px solid #3b4252; margin-top: 20px;">Log Out</button>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBzLchy5M2fLne4c7Ghw1KNN8wVrlZdd8M",
      authDomain: "friendsgame-872f5.firebaseapp.com",
      databaseURL: "https://friendsgame-872f5-default-rtdb.firebaseio.com",
      projectId: "friendsgame-872f5",
      storageBucket: "friendsgame-872f5.firebasestorage.app",
      messagingSenderId: "522534013233",
      appId: "1:522534013233:web:f5faa6e6795023d0420810",
      measurementId: "G-PW5H3G97QR"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const storage = firebase.storage();

    const ADMIN_PASSWORD = "@breakup";

    function login() {
      if (document.getElementById('admin-pass').value === ADMIN_PASSWORD) {
        sessionStorage.setItem('isOwner', 'true');
        showDash();
      } else {
        document.getElementById('err').innerText = 'Incorrect password';
      }
    }

    function showDash() {
      document.getElementById('login-box').classList.add('hidden');
      document.getElementById('dash-box').classList.remove('hidden');
      loadVideos();
    }

    function logout() {
      sessionStorage.removeItem('isOwner');
      location.reload();
    }

    function uploadVideoFile() {
      const title = document.getElementById('v-title').value.trim();
      const fileInput = document.getElementById('v-file');
      const file = fileInput.files[0];

      if (!title || !file) {
        alert("Please enter a title and select a video file.");
        return;
      }

      const uploadBtn = document.getElementById('upload-btn');
      const progressContainer = document.getElementById('progress-container');
      const progressFill = document.getElementById('progress-fill');
      const progressStatus = document.getElementById('progress-status');

      uploadBtn.disabled = true;
      progressContainer.classList.remove('hidden');

      const storageRef = storage.ref('videos/' + Date.now() + '_' + file.name);
      const uploadTask = storageRef.put(file);

      uploadTask.on('state_changed', 
        (snapshot) => {
          const percent = Math.round((snapshot.bytesTransferred / snapshot.totalBytes) * 100);
          progressFill.style.width = percent + '%';
          progressStatus.innerText = `Uploading: ${percent}%`;
        }, 
        (error) => {
          alert("Upload failed: " + error.message);
          uploadBtn.disabled = false;
        }, 
        () => {
          uploadTask.snapshot.ref.getDownloadURL().then((downloadURL) => {
            db.ref('videos').push({
              title: title,
              url: downloadURL,
              storagePath: storageRef.fullPath,
              timestamp: Date.now()
            }).then(() => {
              document.getElementById('v-title').value = '';
              fileInput.value = '';
              progressContainer.classList.add('hidden');
              progressFill.style.width = '0%';
              uploadBtn.disabled = false;
            });
          });
        }
      );
    }

    function loadVideos() {
      db.ref('videos').on('value', snapshot => {
        const list = document.getElementById('video-list');
        list.innerHTML = '';
        if (!snapshot.exists()) {
          list.innerHTML = '<p style="color:#777; font-size:13px;">No videos uploaded yet.</p>';
          return;
        }

        snapshot.forEach(child => {
          const item = child.val();
          const key = child.key;
          const row = document.createElement('div');
          row.className = 'item';
          row.innerHTML = `
            <span>${item.title}</span>
            <button class="del-btn" onclick="deleteVideo('${key}', '${item.storagePath || ''}')">Delete</button>
          `;
          list.appendChild(row);
        });
      });
    }

    function deleteVideo(key, path) {
      if (path) {
        storage.ref(path).delete().catch(() => {});
      }
      db.ref('videos/' + key).remove();
    }

    if (sessionStorage.getItem('isOwner') === 'true') {
      showDash();
    }
  </script>
</body>
</html>
