<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Temple Run 3D - Three.js</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #111; touch-action: none; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; color: white; }
        
        /* HUD */
        #hud { position: absolute; top: 20px; left: 20px; font-size: 24px; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); display: none; }
        .stat { margin-bottom: 5px; }
        .stat span { font-weight: bold; color: #ffd700; }

        /* Screens */
        .overlay { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            background: rgba(0,0,0,0.7); pointer-events: auto; text-align: center;
        }
        h1 { font-size: 48px; margin-bottom: 10px; color: #ffae00; text-transform: uppercase; letter-spacing: 5px; }
        p { font-size: 18px; margin-bottom: 30px; }
        button { 
            padding: 15px 40px; font-size: 20px; cursor: pointer; border: none; 
            background: #ffae00; color: white; border-radius: 50px; font-weight: bold;
            transition: transform 0.2s, background 0.2s;
        }
        button:hover { background: #ffca58; transform: scale(1.1); }
        #game-over-screen { display: none; }

        /* Controls Hint */
        .controls-hint { font-size: 14px; color: #aaa; margin-top: 20px; }
    </style>
</head>
<body>

    <div id="ui-layer">
        <!-- HUD -->
        <div id="hud">
            <div class="stat">SCORE: <span id="score-val">0</span></div>
            <div class="stat">COINS: <span id="coins-val">0</span></div>
        </div>

        <!-- Main Menu -->
        <div id="menu-screen" class="overlay">
            <h1>TEMPLE RUN</h1>
            <p>Escape the ancient ruins!</p>
            <button onclick="startGame()">START RUN</button>
            <div class="controls-hint">WASD / ARROWS to Move & Jump<br>Swipe on Mobile</div>
        </div>

        <!-- Game Over -->
        <div id="game-over-screen" class="overlay">
            <h1 style="color: #ff4444;">WRECKED!</h1>
            <p id="final-stats">Score: 0 | Coins: 0</p>
            <button onclick="startGame()">TRY AGAIN</button>
        </div>
    </div>

    <!-- Load Three.js from CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- Game Configuration ---
        const LANE_WIDTH = 3;
        const LANES = [-LANE_WIDTH, 0, LANE_WIDTH];
        const INITIAL_SPEED = 0.4;
        const MAX_SPEED = 1.2;
        const ACCELERATION = 0.0001;
        const JUMP_FORCE = 0.15;
        const GRAVITY = 0.008;

        // --- Variables ---
        let scene, camera, renderer, clock;
        let player, playerGroup, limbs = {};
        let trackSegments = [], obstacles = [], coins = [];
        let score = 0, coinCount = 0, speed = INITIAL_SPEED;
        let currentLane = 1; // 0: Left, 1: Center, 2: Right
        let isJumping = false, jumpVelocity = 0, isSliding = false;
        let gameState = 'MENU'; // MENU, PLAYING, GAMEOVER
        let nextSegmentZ = 0;

        // Mobile Controls
        let touchStart = { x: 0, y: 0 };

        init();
        animate();

        function init() {
            // Scene & Camera
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a1a);
            scene.fog = new THREE.FogExp2(0x1a1a1a, 0.02);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xffd700, 1);
            sunLight.position.set(5, 10, 5);
            sunLight.castShadow = true;
            scene.add(sunLight);

            createPlayer();
            resetGame();

            // Event Listeners
            window.addEventListener('keydown', handleKeyDown);
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('touchstart', e => { touchStart.x = e.touches[0].clientX; touchStart.y = e.touches[0].clientY; });
            window.addEventListener('touchend', handleTouchEnd);
        }

        function createPlayer() {
            playerGroup = new THREE.Group();
            
            // Simple Low-Poly Character
            const bodyGeo = new THREE.BoxGeometry(0.6, 0.8, 0.4);
            const bodyMat = new THREE.MeshPhongMaterial({ color: 0x3366ff });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.8;
            body.castShadow = true;
            playerGroup.add(body);

            const headGeo = new THREE.BoxGeometry(0.4, 0.4, 0.4);
            const headMat = new THREE.MeshPhongMaterial({ color: 0xffdbac });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 1.45;
            playerGroup.add(head);

            // Limbs
            const limbGeo = new THREE.BoxGeometry(0.2, 0.5, 0.2);
            limbs.leftLeg = new THREE.Mesh(limbGeo, bodyMat);
            limbs.leftLeg.position.set(-0.2, 0.3, 0);
            playerGroup.add(limbs.leftLeg);

            limbs.rightLeg = new THREE.Mesh(limbGeo, bodyMat);
            limbs.rightLeg.position.set(0.2, 0.3, 0);
            playerGroup.add(limbs.rightLeg);

            limbs.leftArm = new THREE.Mesh(limbGeo, bodyMat);
            limbs.leftArm.position.set(-0.45, 0.8, 0);
            playerGroup.add(limbs.leftArm);

            limbs.rightArm = new THREE.Mesh(limbGeo, bodyMat);
            limbs.rightArm.position.set(0.45, 0.8, 0);
            playerGroup.add(limbs.rightArm);

            scene.add(playerGroup);
            player = playerGroup;
        }

        function createTrackSegment(zPos) {
            const group = new THREE.Group();
            
            // Road
            const roadGeo = new THREE.PlaneGeometry(10, 40);
            const roadMat = new THREE.MeshPhongMaterial({ color: 0x444444 });
            const road = new THREE.Mesh(roadGeo, roadMat);
            road.rotation.x = -Math.PI / 2;
            road.receiveShadow = true;
            group.add(road);

            // Side Walls/Pillars
            for(let i = -20; i <= 20; i += 10) {
                const pillarGeo = new THREE.BoxGeometry(1, 4, 1);
                const pillarMat = new THREE.MeshPhongMaterial({ color: 0x222222 });
                const lp = new THREE.Mesh(pillarGeo, pillarMat);
                lp.position.set(-5.5, 2, i);
                group.add(lp);
                const rp = new THREE.Mesh(pillarGeo, pillarMat);
                rp.position.set(5.5, 2, i);
                group.add(rp);
            }

            group.position.z = zPos;
            scene.add(group);
            trackSegments.push(group);

            // Spawn Obstacles & Coins
            if (zPos < -20) {
                spawnProps(zPos);
            }
        }

        function spawnProps(zPos) {
            const laneIdx = Math.floor(Math.random() * 3);
            const type = Math.random();

            if (type > 0.3) { // Obstacle
                let obs;
                if (Math.random() > 0.5) {
                    // Jump hurdle
                    obs = new THREE.Mesh(new THREE.BoxGeometry(2.5, 0.8, 0.5), new THREE.MeshPhongMaterial({ color: 0xff4444 }));
                    obs.position.set(LANES[laneIdx], 0.4, zPos - Math.random() * 20);
                    obs.userData.type = 'jump';
                } else {
                    // Slide hurdle (High)
                    obs = new THREE.Mesh(new THREE.BoxGeometry(2.5, 2, 0.5), new THREE.MeshPhongMaterial({ color: 0xff4444 }));
                    obs.position.set(LANES[laneIdx], 2.5, zPos - Math.random() * 20);
                    obs.userData.type = 'slide';
                }
                scene.add(obs);
                obstacles.push(obs);
            }

            // Coins
            for (let i = 0; i < 3; i++) {
                const coin = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.3, 0.3, 0.1, 16),
                    new THREE.MeshPhongMaterial({ color: 0xffd700, emissive: 0xaa8800 })
                );
                coin.rotation.x = Math.PI / 2;
                coin.position.set(LANES[laneIdx], 0.8, zPos - (i * 3) - Math.random() * 10);
                scene.add(coin);
                coins.push(coin);
            }
        }

        function resetGame() {
            score = 0;
            coinCount = 0;
            speed = INITIAL_SPEED;
            currentLane = 1;
            nextSegmentZ = 0;
            player.position.set(0, 0, 0);
            
            // Clean arrays
            trackSegments.forEach(s => scene.remove(s));
            obstacles.forEach(o => scene.remove(o));
            coins.forEach(c => scene.remove(c));
            trackSegments = [];
            obstacles = [];
            coins = [];

            // Initial Track
            for (let i = 0; i < 5; i++) {
                createTrackSegment(nextSegmentZ);
                nextSegmentZ -= 40;
            }

            document.getElementById('score-val').innerText = "0";
            document.getElementById('coins-val').innerText = "0";
        }

        window.startGame = function() {
            resetGame();
            gameState = 'PLAYING';
            document.getElementById('menu-screen').style.display = 'none';
            document.getElementById('game-over-screen').style.display = 'none';
            document.getElementById('hud').style.display = 'block';
        }

        function gameOver() {
            gameState = 'GAMEOVER';
            document.getElementById('hud').style.display = 'none';
            document.getElementById('game-over-screen').style.display = 'flex';
            document.getElementById('final-stats').innerText = `Score: ${Math.floor(score)} | Coins: ${coinCount}`;
        }

        function handleKeyDown(e) {
            if (gameState !== 'PLAYING') return;
            if ((e.key === 'ArrowLeft' || e.key === 'a') && currentLane > 0) currentLane--;
            if ((e.key === 'ArrowRight' || e.key === 'd') && currentLane < 2) currentLane++;
            if ((e.key === 'ArrowUp' || e.key === 'w') && !isJumping) {
                isJumping = true;
                jumpVelocity = JUMP_FORCE;
            }
            if ((e.key === 'ArrowDown' || e.key === 's') && !isSliding) {
                isSliding = true;
                player.scale.y = 0.5;
                setTimeout(() => { player.scale.y = 1; isSliding = false; }, 700);
            }
        }

        function handleTouchEnd(e) {
            if (gameState !== 'PLAYING') return;
            const dx = e.changedTouches[0].clientX - touchStart.x;
            const dy = e.changedTouches[0].clientY - touchStart.y;
            if (Math.abs(dx) > Math.abs(dy)) {
                if (dx > 30 && currentLane < 2) currentLane++;
                else if (dx < -30 && currentLane > 0) currentLane--;
            } else {
                if (dy < -30 && !isJumping) { isJumping = true; jumpVelocity = JUMP_FORCE; }
                else if (dy > 30 && !isSliding) { 
                    isSliding = true; 
                    player.scale.y = 0.5; 
                    setTimeout(() => { player.scale.y = 1; isSliding = false; }, 700);
                }
            }
        }

        function updatePlayer() {
            // Horizontal Movement (Lerp to lane)
            const targetX = LANES[currentLane];
            player.position.x += (targetX - player.position.x) * 0.15;

            // Vertical Movement (Jump/Gravity)
            if (isJumping) {
                player.position.y += jumpVelocity;
                jumpVelocity -= GRAVITY;
                if (player.position.y <= 0) {
                    player.position.y = 0;
                    isJumping = false;
                }
            }

            // Animation
            const t = Date.now() * 0.01;
            if (!isJumping) {
                limbs.leftLeg.rotation.x = Math.sin(t) * 0.5;
                limbs.rightLeg.rotation.x = -Math.sin(t) * 0.5;
                limbs.leftArm.rotation.x = -Math.sin(t) * 0.5;
                limbs.rightArm.rotation.x = Math.sin(t) * 0.5;
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            if (gameState === 'PLAYING') {
                speed = Math.min(MAX_SPEED, speed + ACCELERATION);
                score += speed;
                document.getElementById('score-val').innerText = Math.floor(score);

                updatePlayer();
                
                // Move world logic: Instead of moving the player forever, 
                // we move the track and items towards the player for better precision.
                // But for simplicity in logic, we move player forward (Z negative)
                player.position.z -= speed;

                // Update Camera
                camera.position.set(player.position.x * 0.5, player.position.y + 3, player.position.z + 6);
                camera.lookAt(player.position.x, player.position.y + 1, player.position.z - 5);

                // Track Management
                if (player.position.z < nextSegmentZ + 120) {
                    createTrackSegment(nextSegmentZ);
                    nextSegmentZ -= 40;
                }

                // Collision Detection
                obstacles.forEach((obs, index) => {
                    if (Math.abs(obs.position.z - player.position.z) < 0.8) {
                        const hitX = Math.abs(obs.position.x - player.position.x) < 1.2;
                        const hitY = (obs.userData.type === 'jump' && player.position.y < 1.0) || 
                                     (obs.userData.type === 'slide' && player.position.y > 1.2);
                        
                        if (hitX && hitY) gameOver();
                    }
                    // Cleanup
                    if (obs.position.z > player.position.z + 10) {
                        scene.remove(obs);
                        obstacles.splice(index, 1);
                    }
                });

                coins.forEach((coin, index) => {
                    coin.rotation.y += 0.05;
                    if (player.position.distanceTo(coin.position) < 1.2) {
                        coinCount++;
                        document.getElementById('coins-val').innerText = coinCount;
                        scene.remove(coin);
                        coins.splice(index, 1);
                    }
                    if (coin.position.z > player.position.z + 10) {
                        scene.remove(coin);
                        coins.splice(index, 1);
                    }
                });

                // Memory Management: Remove old segments
                trackSegments.forEach((seg, i) => {
                    if (seg.position.z > player.position.z + 50) {
                        scene.remove(seg);
                        trackSegments.splice(i, 1);
                    }
                });
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
