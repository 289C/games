<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Level Devil 3D - 100 Levels Edition</title>

  <!-- Three.js 3D Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    :root {
      --bg: #07090e;
      --card-bg: rgba(18, 24, 38, 0.92);
      --border: rgba(255, 255, 255, 0.14);
      --cyan: #00f2fe;
      --pink: #ff007f;
      --gold: #ffd700;
      --red: #ff3838;
      --green: #2ecc71;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      background: radial-gradient(circle at 50% 10%, #151c30 0%, #06080d 100%);
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 10px 20px;
      overflow-x: hidden;
    }

    /* Pinned Instagram Header */
    .ig-header {
      width: 95%;
      max-width: 440px;
      margin-bottom: 10px;
      padding: 8px 16px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 50px;
      backdrop-filter: blur(14px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
      z-index: 10;
    }

    .ig-profile {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .dp-frame {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      padding: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .dp-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    .ig-name {
      font-size: 13px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .verified {
      background: #0095f6;
      color: #fff;
      font-size: 8px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .follow-btn {
      background: linear-gradient(135deg, #f58529, #dd2a7b, #8134af);
      color: #fff;
      text-decoration: none;
      font-size: 11px;
      font-weight: 800;
      padding: 6px 14px;
      border-radius: 20px;
      box-shadow: 0 2px 10px rgba(221, 42, 123, 0.4);
    }

    /* Game HUD */
    .hud-box {
      width: 95%;
      max-width: 440px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 10px 16px;
      margin-bottom: 10px;
    }

    .hud-stat {
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.5px;
    }

    /* 16:9 Screen Display */
    .screen-16-9 {
      position: relative;
      width: min(95vw, 440px);
      height: calc(min(95vw, 440px) * (9 / 16));
      border: 2px solid rgba(255, 255, 255, 0.16);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9), 0 0 25px rgba(0, 242, 254, 0.2);
      background: #06070a;
    }

    #canvas3d {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Troll Message Banner */
    #trollMsg {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%) scale(0);
      background: rgba(255, 56, 56, 0.95);
      color: #fff;
      font-size: 11px;
      font-weight: 900;
      padding: 4px 14px;
      border-radius: 20px;
      z-index: 20;
      letter-spacing: 0.5px;
      transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 0 18px rgba(255, 56, 56, 0.85);
      white-space: nowrap;
    }

    /* Controls */
    .controls-panel {
      width: 95%;
      max-width: 440px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 14px;
      padding: 0 4px;
    }

    .ctrl-group {
      display: flex;
      gap: 12px;
    }

    .ctrl-btn {
      width: 64px;
      height: 64px;
      border-radius: 20px;
      background: rgba(22, 28, 44, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      font-size: 24px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(8px);
      transition: transform 0.08s ease, background 0.08s ease;
    }

    .ctrl-btn:active {
      transform: scale(0.92);
      background: rgba(255, 255, 255, 0.25);
    }

    .btn-jump {
      width: 86px;
      background: linear-gradient(135deg, rgba(255, 56, 56, 0.85), #c0392b);
      border-color: rgba(255, 56, 56, 0.5);
      box-shadow: 0 6px 20px rgba(255, 56, 56, 0.4);
    }

    .btn-jump:active {
      background: #ff3838;
    }
  </style>
</head>
<body>

  <!-- Top Instagram Header -->
  <header class="ig-header">
    <div class="ig-profile">
      <div class="dp-frame">
        <img src="Insta.jpg" alt="DP" class="dp-img" onerror="this.onerror=null; this.src='insta.jpg';" />
      </div>
      <div>
        <div class="ig-name">@_satish_official_16 <span class="verified">✓</span></div>
        <div style="font-size:9px; color:rgba(255,255,255,0.6);" id="worldSubTitle">World 1 • The Deception Gap</div>
      </div>
    </div>
    <a href="https://instagram.com/_satish_official_16" target="_blank" class="follow-btn">Follow ↗</a>
  </header>

  <!-- Level & Death Stats Bar -->
  <div class="hud-box">
    <div class="hud-stat" style="color:var(--gold);" id="levelText">STAGE: LEVEL 1/100</div>
    <div class="hud-stat" style="color:var(--red);" id="deathText">DEATHS: 0</div>
  </div>

  <!-- 16:9 Screen Game Display -->
  <div class="screen-16-9" id="gameFrame">
    <div id="trollMsg">😈 VOID EXPANDED!</div>
    <canvas id="canvas3d"></canvas>
  </div>

  <!-- On-Screen Controls -->
  <div class="controls-panel">
    <div class="ctrl-group">
      <div class="ctrl-btn" id="btnLeft">◀</div>
      <div class="ctrl-btn" id="btnRight">▶</div>
    </div>
    <div class="ctrl-group">
      <div class="ctrl-btn btn-jump" id="btnJump">▲</div>
    </div>
  </div>

  <script>
    // Audio Synthesizer
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq, type = 'sine', duration = 0.08, gainVal = 0.2) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      g.gain.setValueAtTime(gainVal, audioCtx.currentTime);
      g.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      osc.connect(g);
      g.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    // 3D Scene Architecture
    let scene, camera, renderer;
    let playerGroup, playerBody, playerEye, playerPointLight;
    let flagGroup = null;
    let currentLevel = 1;
    let deaths = 0;

    const GRAVITY = -0.018;
    const HORIZONTAL_ACCEL = 0.04;
    const MAX_SPEED = 0.17;
    const FRICTION = 0.8;
    const JUMP_POWER = 0.40;

    const platforms = [];
    const spikes = [];
    const traps = [];
    const particles = [];

    const pState = {
      x: -7.5,
      y: 1.5,
      vx: 0,
      vy: 0,
      isGrounded: false,
      coyoteTimer: 0,
      jumpBuffer: 0,
      dead: false,
      scaleX: 1,
      scaleY: 1
    };

    const keys = { left: false, right: false, jump: false };

    // World Themes (10 Worlds x 10 Levels)
    const WORLDS = [
      { name: "The Deception Gap", glow: 0x00f2fe },
      { name: "Ceiling Crumbles", glow: 0xff007f },
      { name: "Runaway Flags", glow: 0xffd700 },
      { name: "Elevator Paradox", glow: 0x2ecc71 },
      { name: "Spike Ambush", glow: 0xff3838 },
      { name: "Gravity Shifts", glow: 0x9b59b6 },
      { name: "Ghost Stepping Stones", glow: 0x1abc9c },
      { name: "Troll Pressure Levers", glow: 0xe67e22 },
      { name: "Speed Runner Lasers", glow: 0xe84393 },
      { name: "The Final Master Gauntlet", glow: 0xf1c40f }
    ];

    function init3D() {
      const frame = document.getElementById('gameFrame');
      const canvas = document.getElementById('canvas3d');

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x06070a);
      scene.fog = new THREE.FogExp2(0x06070a, 0.022);

      camera = new THREE.PerspectiveCamera(46, 16 / 9, 0.1, 100);
      camera.position.set(0, 2.2, 17);
      camera.lookAt(0, 0.2, 0);

      renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(frame.clientWidth, frame.clientHeight);

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
      scene.add(ambientLight);

      const mainLight = new THREE.DirectionalLight(0xa5b1c2, 0.85);
      mainLight.position.set(5, 15, 12);
      scene.add(mainLight);

      // Player Setup
      playerGroup = new THREE.Group();
      
      const bodyGeo = new THREE.BoxGeometry(0.85, 0.85, 0.85);
      const bodyMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.15, metalness: 0.1 });
      playerBody = new THREE.Mesh(bodyGeo, bodyMat);
      playerGroup.add(playerBody);

      const eyeGeo = new THREE.BoxGeometry(0.12, 0.22, 0.08);
      const eyeMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
      playerEye = new THREE.Mesh(eyeGeo, eyeMat);
      playerEye.position.set(0.2, 0.12, 0.44);
      playerGroup.add(playerEye);

      playerPointLight = new THREE.PointLight(0x00f2fe, 1.4, 6);
      playerPointLight.position.set(0, 0, 0.6);
      playerGroup.add(playerPointLight);

      scene.add(playerGroup);

      bindControls();
      loadLevel(1);
      window.addEventListener('resize', onResize);
      animate();
    }

    function createPlatform(x, y, w, h, color = 0x1e2738, glowColor = 0x00f2fe) {
      const geo = new THREE.BoxGeometry(w, h, 2.2);
      const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.2 });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(x, y, 0);
      mesh.userData = { w, h, targetY: y, falling: false, isGhost: false };

      if (glowColor) {
        const borderGeo = new THREE.BoxGeometry(w, 0.08, 2.22);
        const borderMat = new THREE.MeshBasicMaterial({ color: glowColor, transparent: true, opacity: 0.85 });
        const border = new THREE.Mesh(borderGeo, borderMat);
        border.position.y = h / 2 + 0.02;
        mesh.add(border);
      }

      scene.add(mesh);
      platforms.push(mesh);
      return mesh;
    }

    function createSpike(x, y, scale = 1, pointingUp = true) {
      const geo = new THREE.ConeGeometry(0.32 * scale, 0.75 * scale, 4);
      const mat = new THREE.MeshStandardMaterial({
        color: 0xff3838,
        emissive: 0x7f0000,
        emissiveIntensity: 0.5,
        roughness: 0.2
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.rotation.y = Math.PI / 4;
      if (!pointingUp) mesh.rotation.z = Math.PI;
      mesh.position.set(x, y, 0);
      mesh.userData = { scale, active: false };
      scene.add(mesh);
      spikes.push(mesh);
      return mesh;
    }

    function createFlag(x, y) {
      const group = new THREE.Group();

      const poleGeo = new THREE.CylinderGeometry(0.06, 0.06, 2.4, 8);
      const poleMat = new THREE.MeshStandardMaterial({ color: 0xe0e0e0 });
      const pole = new THREE.Mesh(poleGeo, poleMat);
      pole.position.y = 1.2;
      group.add(pole);

      const clothGeo = new THREE.PlaneGeometry(0.95, 0.65);
      const clothMat = new THREE.MeshBasicMaterial({ color: 0xffd700, side: THREE.DoubleSide });
      const cloth = new THREE.Mesh(clothGeo, clothMat);
      cloth.position.set(0.48, 1.9, 0);
      group.add(cloth);

      const flagLight = new THREE.PointLight(0xffd700, 2.0, 7);
      flagLight.position.set(0.5, 2.0, 1);
      group.add(flagLight);

      group.position.set(x, y, 0);
      scene.add(group);
      flagGroup = group;
      return group;
    }

    function spawnParticles(x, y, colorHex, count = 12, speed = 0.15) {
      for (let i = 0; i < count; i++) {
        const size = 0.08 + Math.random() * 0.1;
        const geo = new THREE.BoxGeometry(size, size, size);
        const mat = new THREE.MeshBasicMaterial({ color: colorHex, transparent: true, opacity: 1 });
        const p = new THREE.Mesh(geo, mat);
        p.position.set(x, y, 0);
        const angle = Math.random() * Math.PI * 2;
        const vel = (0.5 + Math.random() * 0.5) * speed;
        p.userData = {
          vx: Math.cos(angle) * vel,
          vy: Math.sin(angle) * vel + 0.05,
          life: 1.0,
          decay: 0.035 + Math.random() * 0.02
        };
        scene.add(p);
        particles.push(p);
      }
    }

    function clearLevel() {
      platforms.forEach(p => scene.remove(p));
      spikes.forEach(s => scene.remove(s));
      particles.forEach(p => scene.remove(p));
      if (flagGroup) scene.remove(flagGroup);

      platforms.length = 0;
      spikes.length = 0;
      particles.length = 0;
      traps.length = 0;
      flagGroup = null;
    }

    // ==============================================================
    // 100 LEVEL MASTER LOGIC ARCHITECTURE
    // ==============================================================
    function loadLevel(lvl) {
      clearLevel();
      currentLevel = lvl;
      document.getElementById('levelText').textContent = `STAGE: LEVEL ${lvl}/100`;

      const worldIndex = Math.min(9, Math.floor((lvl - 1) / 10));
      const world = WORLDS[worldIndex];
      document.getElementById('worldSubTitle').textContent = `World ${worldIndex + 1} • ${world.name}`;
      playerPointLight.color.setHex(world.glow);

      pState.x = -7.5;
      pState.y = 1.5;
      pState.vx = 0;
      pState.vy = 0;
      pState.scaleX = 1;
      pState.scaleY = 1;
      pState.dead = false;
      playerGroup.visible = true;

      // Starting Platform
      createPlatform(-7.5, 0.0, 4.0, 1.2, 0x1e2738, world.glow);

      // World-Specific Mechanics across all 100 Levels
      if (worldIndex === 0) {
        // WORLD 1 (Levels 1-10): The Deception Gap
        const island = createPlatform(7.0, 0.0, 4.5, 1.2, 0x1e2738, world.glow);
        createFlag(7.5, 0.7);

        const step1 = createPlatform(-1.5, -5.0, 2.2, 0.8, 0x00f2fe, 0xffffff);
        const step2 = createPlatform(2.2, -5.0, 2.2, 0.8, 0x00f2fe, 0xffffff);
        step1.userData.targetY = 0.2;
        step2.userData.targetY = 0.5;

        let triggered = false;
        traps.push({
          triggered: false,
          check: () => pState.x > -5.0 && !triggered,
          action: () => {
            showTroll("GAP EXPANDED! BACK UP 🏃");
            island.position.x = 8.5;
          }
        });
        traps.push({
          triggered: false,
          check: () => pState.x < -7.8,
          action: () => {
            triggered = true;
            showTroll("STAIRS REVEALED! 🌟");
            island.position.x = 6.8;
            spawnParticles(-1.5, 0.2, 0x00f2fe, 15);
            spawnParticles(2.2, 0.5, 0x00f2fe, 15);
          }
        });

      } else if (worldIndex === 1) {
        // WORLD 2 (Levels 11-20): Ceiling Crumbles
        const fakeCeiling = createPlatform(0, 2.5, 5.0, 0.8, 0x242836, 0xff007f);
        createPlatform(0, -1.0, 6.0, 1.0, 0x1e2738, world.glow);
        createPlatform(7.5, 0.0, 4.0, 1.2, 0x1e2738, world.glow);
        createFlag(7.5, 0.7);

        traps.push({
          triggered: false,
          check: () => pState.x > -2.0 && pState.y > 1.2,
          action: () => {
            showTroll("CEILING COLLAPSED! 💥");
            fakeCeiling.userData.falling = true;
          }
        });

      } else if (worldIndex === 2) {
        // WORLD 3 (Levels 21-30): Runaway Flags
        createPlatform(0, 0.0, 18.0, 1.2, 0x1e2738, world.glow);
        createFlag(4.0, 0.7);

        let runawayDone = false;
        let freezeTimer = 0;

        traps.push({
          triggered: false,
          check: () => pState.x > -1.0 && !runawayDone,
          action: () => {
            showTroll("STOP MOVING! 🛑");
            flagGroup.position.x = 7.5;
            runawayDone = true;
          }
        });
        traps.push({
          triggered: false,
          check: () => {
            if (runawayDone && Math.abs(pState.vx) < 0.02 && pState.x > -2.5) {
              freezeTimer++;
              return freezeTimer > 35;
            }
            return false;
          },
          action: () => {
            showTroll("FLAG RETURNED! 🚩");
            flagGroup.position.x = pState.x + 1.2;
            spawnParticles(flagGroup.position.x, 0.5, 0xffd700, 20);
          }
        });

      } else if (worldIndex === 3) {
        // WORLD 4 (Levels 31-40): Elevator Paradox
        const elev = createPlatform(0, 0.0, 3.5, 1.0, 0x2ecc71, 0x2ecc71);
        createPlatform(7.5, 2.0, 4.0, 1.2, 0x1e2738, world.glow);
        createFlag(7.5, 2.7);

        traps.push({
          triggered: false,
          check: () => pState.x > -1.5,
          action: () => {
            showTroll("RIDING ELEVATOR! 🚀");
            elev.userData.targetY = 2.0;
          }
        });

      } else if (worldIndex === 4) {
        // WORLD 5 (Levels 41-50): Spike Ambush
        createPlatform(0, 0.0, 4.0, 1.2, 0x1e2738, world.glow);
        const s = createSpike(0, -3.0, 1.2);
        createPlatform(7.5, 0.0, 4.0, 1.2, 0x1e2738, world.glow);
        createFlag(7.5, 0.7);

        traps.push({
          triggered: false,
          check: () => pState.x > -2.5,
          action: () => {
            showTroll("SPIKE POPPING IN 0.4s! ⚠️");
            setTimeout(() => { s.position.y = 0.85; spawnParticles(0, 0.6, 0xff3838, 12); }, 400);
          }
        });

      } else if (worldIndex === 5) {
        // WORLD 6 (Levels 51-60): Gravity Shifts
        createSpike(0, 0.85, 1.3);
        const launch = createPlatform(-3.0, 0.0, 2.2, 1.2, 0x9b59b6, 0x9b59b6);
        createPlatform(7.5, 0.0, 4.0, 1.2, 0x1e2738, world.glow);
        createFlag(7.5, 0.7);

        traps.push({
          triggered: false,
          check: () => Math.abs(pState.x - launch.position.x) < 0.8,
          action: () => {
            showTroll("SUPER JUMP ENGAGED! 🦘");
            pState.vy = JUMP_POWER * 1.35;
            playBeep(480, 'sine', 0.15);
          }
        });

      } else if (worldIndex === 6) {
        // WORLD 7 (Levels 61-70): Ghost Stepping Stones
        const g1 = createPlatform(-1.0, 0.2, 2.0, 0.6, 0x111622, false);
        const g2 = createPlatform(3.0, 0.5, 2.0, 0.6, 0x111622, false);
        g1.visible = false;
        g2.visible = false;
        createPlatform(7.5, 0.0, 4.0, 1.2, 0x1e2738, world.glow);
        createFlag(7.5, 0.7);

        traps.push({
          triggered: false,
          check: () => pState.x > -4.0,
          action: () => {
            showTroll("GHOST BRIDGE ILLUMINATED! 👻");
            g1.visible = true;
            g2.visible = true;
            spawnParticles(-1.0, 0.2, 0x1abc9c, 10);
            spawnParticles(3.0, 0.5, 0x1abc9c, 10);
          }
        });

      } else if (worldIndex === 7) {
        // WORLD 8 (Levels 71-80): Troll Pressure Levers
        const barrier = createPlatform(2.0, 1.5, 0.8, 4.0, 0xff3838, 0xff3838);
        const button = createPlatform(-2.0, 0.0, 1.5, 0.4, 0xe67e22, 0xffd700);
        createPlatform(7.5, 0.0, 4.0, 1.2, 0x1e2738, world.glow);
        createFlag(7.5, 0.7);

        traps.push({
          triggered: false,
          check: () => Math.abs(pState.x - button.position.x) < 0.6 && pState.isGrounded,
          action: () => {
            showTroll("DOOR UNLOCKED! 🔓");
            barrier.position.y = -5.0;
            spawnParticles(2.0, 1.5, 0xe67e22, 14);
          }
        });

      } else if (worldIndex === 8) {
        // WORLD 9 (Levels 81-90): Speed Runner Lasers
        createPlatform(0, 0.0, 4.0, 1.2, 0x1e2738, world.glow);
        createPlatform(7.5, 0.0, 4.0, 1.2, 0x1e2738, world.glow);
        createFlag(7.5, 0.7);

        traps.push({
          triggered: false,
          check: () => pState.x > -3.0,
          action: () => {
            showTroll("SPRINT! RUN BEFORE FLOOR DROPS ⏱️");
            setTimeout(() => { platforms[1].userData.falling = true; }, 1200);
          }
        });

      } else {
        // WORLD 10 (Levels 91-100): The Final Master Gauntlet
        createPlatform(-2.0, 0.0, 2.5, 1.0, 0x1e2738, world.glow);
        createPlatform(2.0, 0.6, 2.5, 1.0, 0x1e2738, world.glow);
        createPlatform(7.5, 1.2, 3.5, 1.0, 0x1e2738, world.glow);
        createFlag(8.0, 1.9);

        traps.push({
          triggered: false,
          check: () => pState.x > -1.0,
          action: () => {
            showTroll(lvl === 100 ? "👑 FINAL STAGE: TRIUMPH!" : "PRECISION LEAP REQUIRED! 🎯");
          }
        });
      }
    }

    function showTroll(msg) {
      playBeep(260, 'triangle', 0.18);
      const box = document.getElementById('trollMsg');
      box.textContent = msg;
      box.style.transform = 'translateX(-50%) scale(1)';
      setTimeout(() => { box.style.transform = 'translateX(-50%) scale(0)'; }, 1400);
    }

    function triggerDeath() {
      if (pState.dead) return;
      pState.dead = true;
      playBeep(110, 'sawtooth', 0.35, 0.4);
      deaths++;
      document.getElementById('deathText').textContent = `DEATHS: ${deaths}`;
      spawnParticles(pState.x, pState.y, 0xff3838, 28, 0.22);
      playerGroup.visible = false;
      setTimeout(() => { loadLevel(currentLevel); }, 450);
    }

    function triggerVictory() {
      playBeep(784, 'sine', 0.15);
      setTimeout(() => playBeep(1046, 'sine', 0.25), 120);
      spawnParticles(flagGroup.position.x, flagGroup.position.y + 1, 0xffd700, 36, 0.25);
      currentLevel++;
      if (currentLevel > 100) {
        alert("👑 INCREDIBLE! YOU HAVE CONQUERED ALL 100 LEVELS OF LEVEL DEVIL 3D!");
        currentLevel = 1;
      }
      setTimeout(() => loadLevel(currentLevel), 350);
    }

    function updatePhysics() {
      if (pState.dead) return;

      // Platform Elevation Movement
      platforms.forEach(p => {
        if (p.userData.falling) {
          p.position.y -= 0.16;
        } else if (p.userData.targetY !== undefined && Math.abs(p.position.y - p.userData.targetY) > 0.02) {
          p.position.y += (p.userData.targetY - p.position.y) * 0.14;
        }
      });

      // Air and Ground Movement
      if (keys.left) pState.vx = Math.max(-MAX_SPEED, pState.vx - HORIZONTAL_ACCEL);
      else if (keys.right) pState.vx = Math.min(MAX_SPEED, pState.vx + HORIZONTAL_ACCEL);
      else pState.vx *= FRICTION;

      // Jump Buffering & Coyote Mechanics
      if (pState.isGrounded) pState.coyoteTimer = 7;
      else if (pState.coyoteTimer > 0) pState.coyoteTimer--;

      if (keys.jump) pState.jumpBuffer = 6;
      else if (pState.jumpBuffer > 0) pState.jumpBuffer--;

      if (pState.jumpBuffer > 0 && pState.coyoteTimer > 0) {
        pState.vy = JUMP_POWER;
        pState.isGrounded = false;
        pState.coyoteTimer = 0;
        pState.jumpBuffer = 0;
        pState.scaleX = 0.75;
        pState.scaleY = 1.35;
        playBeep(340, 'square', 0.08);
        spawnParticles(pState.x, pState.y - 0.4, 0xffffff, 6, 0.06);
      }

      pState.vy += GRAVITY;
      pState.x += pState.vx;
      pState.y += pState.vy;
      pState.isGrounded = false;

      // AABB Box Collisions
      const pBoxRadius = 0.42;
      platforms.forEach(p => {
        if (!p.visible) return;
        const halfW = p.userData.w / 2;
        const halfH = p.userData.h / 2;

        const minX = p.position.x - halfW;
        const maxX = p.position.x + halfW;
        const topY = p.position.y + halfH;
        const botY = p.position.y - halfH;

        if (pState.x + pBoxRadius > minX && pState.x - pBoxRadius < maxX) {
          if (pState.y - pBoxRadius <= topY && pState.y - pBoxRadius >= topY - 0.48 && pState.vy <= 0) {
            pState.y = topY + pBoxRadius;
            pState.vy = 0;
            if (!pState.isGrounded) {
              pState.scaleX = 1.3;
              pState.scaleY = 0.78;
              spawnParticles(pState.x, pState.y - 0.4, 0x00f2fe, 5, 0.05);
            }
            pState.isGrounded = true;
          } else if (pState.y + pBoxRadius >= botY && pState.y + pBoxRadius <= botY + 0.3 && pState.vy > 0) {
            pState.y = botY - pBoxRadius;
            pState.vy = 0;
          }
        }
      });

      // Spikes
      spikes.forEach(s => {
        const dist = Math.hypot(pState.x - s.position.x, pState.y - s.position.y);
        if (dist < 0.72 * (s.userData.scale || 1)) triggerDeath();
      });

      // Traps
      traps.forEach(t => {
        if (!t.triggered && t.check()) {
          t.triggered = true;
          t.action();
        }
      });

      // Flag
      if (flagGroup) {
        const flagDist = Math.hypot(pState.x - flagGroup.position.x, pState.y - (flagGroup.position.y + 0.8));
        if (flagDist < 1.15) triggerVictory();
      }

      // Void Falls
      if (pState.y < -6.5 || pState.y > 18.0) triggerDeath();

      // Kinematic recovery
      pState.scaleX += (1 - pState.scaleX) * 0.15;
      pState.scaleY += (1 - pState.scaleY) * 0.15;

      playerGroup.position.set(pState.x, pState.y, 0);
      playerGroup.scale.set(pState.scaleX, pState.scaleY, 1);
      playerGroup.rotation.z = -pState.vx * 1.2;

      if (Math.abs(pState.vx) > 0.02) {
        playerEye.position.x = pState.vx > 0 ? 0.22 : -0.22;
      }

      // Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.position.x += p.userData.vx;
        p.position.y += p.userData.vy;
        p.userData.vy += GRAVITY * 0.5;
        p.userData.life -= p.userData.decay;
        p.material.opacity = p.userData.life;
        if (p.userData.life <= 0) {
          scene.remove(p);
          particles.splice(i, 1);
        }
      }
    }

    function bindControls() {
      const setKey = (k, v) => keys[k] = v;
      const bindBtn = (id, k) => {
        const el = document.getElementById(id);
        el.onpointerdown = (e) => { e.preventDefault(); setKey(k, true); };
        el.onpointerup = (e) => { e.preventDefault(); setKey(k, false); };
        el.onpointercancel = (e) => { e.preventDefault(); setKey(k, false); };
      };

      bindBtn('btnLeft', 'left');
      bindBtn('btnRight', 'right');
      bindBtn('btnJump', 'jump');

      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft' || e.key === 'a') setKey('left', true);
        if (e.key === 'ArrowRight' || e.key === 'd') setKey('right', true);
        if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') setKey('jump', true);
      });

      window.addEventListener('keyup', (e) => {
        if (e.key === 'ArrowLeft' || e.key === 'a') setKey('left', false);
        if (e.key === 'ArrowRight' || e.key === 'd') setKey('right', false);
        if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') setKey('jump', false);
      });
    }

    function onResize() {
      const frame = document.getElementById('gameFrame');
      renderer.setSize(frame.clientWidth, frame.clientHeight);
      camera.aspect = 16 / 9;
      camera.updateProjectionMatrix();
    }

    function animate() {
      requestAnimationFrame(animate);
      updatePhysics();
      renderer.render(scene, camera);
    }

    window.onload = init3D;
  </script>
</body>
</html>
