<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Level Devil 3D - 100 Nightmare Levels</title>

  <!-- Three.js 3D Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    :root {
      --bg-dark: #0f1016;
      --door-gold: #ffd32a;
      --spike-red: #ff3838;
      --cyan: #00f2fe;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    body {
      background: var(--bg-dark);
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Top Instagram Header */
    .ig-banner {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      width: 90%;
      max-width: 420px;
      padding: 8px 16px;
      background: rgba(18, 19, 26, 0.9);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 50px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .ig-profile {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .ig-badge {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 15px;
    }

    .ig-handle {
      font-size: 13px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .verified-dot {
      width: 13px;
      height: 13px;
      background: #0095f6;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 8px;
    }

    .ig-btn {
      background: linear-gradient(135deg, #f58529, #dd2a7b, #8134af);
      color: #fff;
      text-decoration: none;
      font-size: 11px;
      font-weight: 800;
      padding: 6px 14px;
      border-radius: 20px;
    }

    /* HUD */
    .hud {
      position: absolute;
      top: 66px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 440px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
    }

    .hud-card {
      background: rgba(18, 20, 28, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      padding: 6px 14px;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }

    .level-title {
      font-size: 10px;
      color: var(--door-gold);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .hud-val {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 0.5px;
    }

    #trollMessage {
      position: absolute;
      top: 135px;
      left: 50%;
      transform: translateX(-50%) scale(0);
      background: rgba(255, 56, 56, 0.92);
      color: #fff;
      font-size: 14px;
      font-weight: 900;
      padding: 8px 22px;
      border-radius: 20px;
      z-index: 25;
      letter-spacing: 1px;
      box-shadow: 0 0 25px rgba(255, 56, 56, 0.8);
      transition: transform 0.22s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    #canvas3d {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    /* Mobile Controls */
    .controls {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: 92%;
      max-width: 440px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 25;
    }

    .ctrl-group {
      display: flex;
      gap: 12px;
    }

    .ctrl-btn {
      width: 65px;
      height: 65px;
      border-radius: 20px;
      background: rgba(25, 28, 40, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      font-size: 24px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
      cursor: pointer;
      backdrop-filter: blur(10px);
    }

    .ctrl-btn:active {
      transform: scale(0.92);
      background: rgba(255, 255, 255, 0.3);
    }

    .btn-jump {
      background: rgba(255, 56, 56, 0.35);
      border-color: var(--spike-red);
      width: 82px;
    }

    .btn-jump:active {
      background: var(--spike-red);
    }
  </style>
</head>
<body>

  <!-- Instagram Header -->
  <div class="ig-banner">
    <div class="ig-profile">
      <div class="ig-badge">S</div>
      <div>
        <div class="ig-handle">@_satish_official_16 <span class="verified-dot">✓</span></div>
        <div style="font-size:10px; color:rgba(255,255,255,0.6);">Level Devil 3D • 100 Levels</div>
      </div>
    </div>
    <a href="https://instagram.com/_satish_official_16" target="_blank" class="ig-btn">Follow ↗</a>
  </div>

  <!-- Game HUD -->
  <div class="hud">
    <div class="hud-card">
      <div class="level-title">Stage</div>
      <div class="hud-val" id="levelText" style="color:var(--door-gold);">LEVEL 1/100</div>
    </div>

    <div class="hud-card">
      <div class="level-title" style="color:var(--spike-red);">Deaths</div>
      <div class="hud-val" id="deathText" style="color:var(--spike-red);">0</div>
    </div>
  </div>

  <div id="trollMessage">😈 NICE TRY!</div>

  <!-- 3D Canvas -->
  <canvas id="canvas3d"></canvas>

  <!-- Controls -->
  <div class="controls">
    <div class="ctrl-group">
      <div class="ctrl-btn" id="btnLeft">◀</div>
      <div class="ctrl-btn" id="btnRight">▶</div>
    </div>
    <div class="ctrl-group">
      <div class="ctrl-btn btn-jump" id="btnJump">▲</div>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. SOUND FX SYNTHESIS
    // ==========================================
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;

      if (type === 'jump') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.exponentialRampToValueAtTime(360, now + 0.12);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
        osc.start(now); osc.stop(now + 0.12);
      } else if (type === 'die') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(35, now + 0.35);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
        osc.start(now); osc.stop(now + 0.35);
      } else if (type === 'win') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523, now);
        osc.frequency.setValueAtTime(659, now + 0.1);
        osc.frequency.setValueAtTime(783, now + 0.2);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
        osc.start(now); osc.stop(now + 0.35);
      } else if (type === 'troll') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(450, now);
        osc.frequency.linearRampToValueAtTime(150, now + 0.2);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
        osc.start(now); osc.stop(now + 0.2);
      }
    }

    // ==========================================
    // 2. THREE.JS SCENE SETUP
    // ==========================================
    let scene, camera, renderer;
    let playerMesh;
    let currentLevel = 1;
    let deaths = 0;
    let gravity = -0.016;
    let invertedControls = false;

    const platforms = [];
    const spikes = [];
    const traps = [];
    let doorMesh = null;

    const pState = {
      x: -9,
      y: 1.0,
      z: 0,
      vx: 0,
      vy: 0,
      speed: 0.14,
      jumpForce: 0.33,
      isGrounded: false,
      dead: false
    };

    const keys = { left: false, right: false, jump: false };

    function init3D() {
      const canvas = document.getElementById('canvas3d');
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0f1016);
      scene.fog = new THREE.Fog(0x0f1016, 22, 60);

      camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 4.5, 21);
      camera.lookAt(0, 0, 0);

      renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;

      const ambient = new THREE.AmbientLight(0xffffff, 0.65);
      scene.add(ambient);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
      dirLight.position.set(10, 20, 15);
      dirLight.castShadow = true;
      scene.add(dirLight);

      // Player Mesh
      playerMesh = new THREE.Group();
      const bodyGeo = new THREE.BoxGeometry(0.9, 0.9, 0.9);
      const bodyMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 });
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.castShadow = true;
      playerMesh.add(body);

      const eyeGeo = new THREE.BoxGeometry(0.16, 0.26, 0.1);
      const eyeMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
      const eyeL = new THREE.Mesh(eyeGeo, eyeMat);
      eyeL.position.set(0.18, 0.15, 0.46);
      const eyeR = eyeL.clone();
      eyeR.position.x = 0.42;
      playerMesh.add(eyeL);
      playerMesh.add(eyeR);
      scene.add(playerMesh);

      bindControls();
      loadLevel(1);
      window.addEventListener('resize', onResize);
      animate();
    }

    function createPlatform(x, y, w, h, depth = 2.4, color = 0x2e3240) {
      const geo = new THREE.BoxGeometry(w, h, depth);
      const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.7 });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(x, y, 0);
      mesh.receiveShadow = true;
      mesh.userData = { w, h, depth, falling: false, ghost: false };
      scene.add(mesh);
      platforms.push(mesh);
      return mesh;
    }

    function createSpike(x, y, scale = 1, pointingUp = true) {
      const geo = new THREE.ConeGeometry(0.35 * scale, 0.8 * scale, 4);
      const mat = new THREE.MeshStandardMaterial({ color: 0xff3838, roughness: 0.3 });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.rotation.y = Math.PI / 4;
      if (!pointingUp) mesh.rotation.z = Math.PI;
      mesh.position.set(x, y, 0);
      mesh.castShadow = true;
      mesh.userData = { scale, active: false, vy: 0 };
      scene.add(mesh);
      spikes.push(mesh);
      return mesh;
    }

    function createDoor(x, y) {
      const group = new THREE.Group();
      const frameMat = new THREE.MeshStandardMaterial({ color: 0xffd32a, metalness: 0.5, roughness: 0.2 });
      const insideMat = new THREE.MeshBasicMaterial({ color: 0x050508 });

      const frame = new THREE.Mesh(new THREE.BoxGeometry(1.2, 2.0, 0.4), frameMat);
      frame.castShadow = true;
      const inside = new THREE.Mesh(new THREE.BoxGeometry(0.9, 1.8, 0.42), insideMat);

      group.add(frame);
      group.add(inside);
      group.position.set(x, y + 1.0, 0);
      scene.add(group);
      doorMesh = group;
      return group;
    }

    // ==========================================
    // 3. 100 PROCEDURAL NIGHTMARE LEVELS ENGINE
    // ==========================================
    function clearCurrentLevel() {
      platforms.forEach(p => scene.remove(p));
      spikes.forEach(s => scene.remove(s));
      if (doorMesh) scene.remove(doorMesh);
      platforms.length = 0;
      spikes.length = 0;
      traps.length = 0;
      doorMesh = null;
    }

    function loadLevel(lvl) {
      clearCurrentLevel();
      currentLevel = lvl;
      document.getElementById('levelText').textContent = `LEVEL ${lvl}/100`;
      invertedControls = false;
      gravity = -0.016;
      camera.rotation.z = 0;

      pState.x = -9;
      pState.y = 1.0;
      pState.vx = 0;
      pState.vy = 0;
      pState.dead = false;
      playerMesh.visible = true;
      playerMesh.rotation.set(0, 0, 0);

      // Determine difficulty tiers & mechanic variations
      const tier = Math.min(10, Math.ceil(lvl / 10)); 
      const subVariant = (lvl - 1) % 10;

      // Base platforms
      createPlatform(-8, -0.5, 5, 1.5);

      if (subVariant === 0) {
        // Shifting void pit
        const movingTarget = createPlatform(4, -0.5, 8 + Math.max(0, 4 - tier), 1.5);
        createDoor(8.5, 0.25);
        traps.push({
          triggered: false,
          check: () => pState.x > -4.5,
          action: () => {
            popTrollText("VOID EXPANDED! 😈");
            movingTarget.position.x += 3.5 + (tier * 0.2);
          }
        });
      }
      else if (subVariant === 1) {
        // Multi-eruption floor spikes
        createPlatform(0, -0.5, 22, 1.5);
        createDoor(9, 0.25);
        traps.push({
          triggered: false,
          check: () => pState.x > -2.0,
          action: () => {
            popTrollText("SURPRISE SPIKES! 🌵");
            const count = 3 + Math.floor(tier * 0.6);
            for (let i = 0; i < count; i++) {
              createSpike(-0.5 + (i * 0.9), 0.65, 1.25);
            }
          }
        });
      }
      else if (subVariant === 2) {
        // Relocating and teleporting exit door
        createPlatform(0, -0.5, 22, 1.5);
        createDoor(2.5, 0.25);
        traps.push({
          triggered: false,
          check: () => pState.x > 0.8,
          action: () => {
            popTrollText("TOO SLOW! 🚪");
            doorMesh.position.x = 9.2;
            createSpike(2.5, 0.65, 1.3);
            if (tier > 4) {
              createSpike(5.0, 0.65, 1.3);
            }
          }
        });
      }
      else if (subVariant === 3) {
        // Collapsing bridge elevator
        const drop1 = createPlatform(-2.5, -0.5, 3.0, 1.0);
        const drop2 = createPlatform(3.0, -0.5, 3.0, 1.0);
        createPlatform(8, -0.5, 5, 1.5);
        createDoor(9, 0.25);

        traps.push({
          triggered: false,
          check: () => pState.x > -4.0 && pState.x < -1.0,
          action: () => { drop1.userData.falling = true; }
        });
        traps.push({
          triggered: false,
          check: () => pState.x > 1.5 && pState.x < 4.5,
          action: () => { drop2.userData.falling = true; }
        });
      }
      else if (subVariant === 4) {
        // Instant control inversion
        createPlatform(0, -0.5, 22, 1.5);
        createSpike(-0.5, 0.65, 1.2);
        createDoor(9, 0.25);

        traps.push({
          triggered: false,
          check: () => pState.x > -3.5,
          action: () => {
            popTrollText("CONTROLS REVERSED! 🔄");
            invertedControls = true;
            camera.rotation.z = 0.08 * (tier % 2 === 0 ? -1 : 1);
          }
        });
      }
      else if (subVariant === 5) {
        // Falling ceiling spikes
        createPlatform(0, -0.5, 22, 1.5);
        const top1 = createSpike(1.5, 7.5, 1.8, false);
        const top2 = createSpike(4.5, 7.5, 1.8, false);
        createDoor(9, 0.25);

        traps.push({
          triggered: false,
          check: () => pState.x > -0.5,
          action: () => {
            popTrollText("HEADS UP! ⚡");
            top1.userData.active = true;
          }
        });
        traps.push({
          triggered: false,
          check: () => pState.x > 2.8,
          action: () => { top2.userData.active = true; }
        });
      }
      else if (subVariant === 6) {
        // Ghost floor dissolution
        const ghost = createPlatform(0, -0.5, 7, 1.5, 2.4, 0x3d4357);
        createPlatform(8, -0.5, 5, 1.5);
        createDoor(9, 0.25);

        traps.push({
          triggered: false,
          check: () => pState.x > -3.0,
          action: () => {
            popTrollText("FAKE BRIDGE! 👻");
            ghost.userData.ghost = true;
            ghost.material.transparent = true;
            ghost.material.opacity = 0.3;
          }
        });
      }
      else if (subVariant === 7) {
        // Relentless charging sawblade
        createPlatform(0, -0.5, 22, 1.5);
        createDoor(9, 0.25);
        const chaser = createSpike(-10, 0.65, 2.2);

        traps.push({
          triggered: false,
          check: () => pState.x > -6.0,
          action: () => {
            popTrollText("OUTRUN IT! 🏃");
            chaser.userData.active = true;
            chaser.userData.isChaser = true;
            chaser.userData.speedMult = 1 + (tier * 0.08);
          }
        });
      }
      else if (subVariant === 8) {
        // Deceptive fake exit trap
        createPlatform(0, -0.5, 22, 1.5);
        createDoor(3.5, 0.25);

        traps.push({
          triggered: false,
          check: () => pState.x > 2.0,
          action: () => {
            popTrollText("EXPLOSIVE DECEIT! 💥");
            scene.remove(doorMesh);
            createSpike(3.5, 0.65, 1.6);
            createDoor(9.0, 0.25);
          }
        });
      }
      else {
        // Ceiling inversion anti-gravity
        createPlatform(-7, -0.5, 6, 1.5);
        createPlatform(2, 6.5, 14, 1.5);
        createDoor(8, 7.25);

        traps.push({
          triggered: false,
          check: () => pState.x > -3.5,
          action: () => {
            popTrollText("GRAVITY INVERSION! 🌀");
            gravity = 0.016;
            pState.vy = 0.22;
            playerMesh.rotation.x = Math.PI;
          }
        });
      }

      // Nightmare Tier 7-10 modifier: inject secondary traps on later levels
      if (tier >= 7 && subVariant !== 1 && subVariant !== 5) {
        const sneakyDrop = createSpike(6.5, 8.0, 1.6, false);
        traps.push({
          triggered: false,
          check: () => pState.x > 5.0,
          action: () => { sneakyDrop.userData.active = true; }
        });
      }
    }

    function popTrollText(msg) {
      playSound('troll');
      const box = document.getElementById('trollMessage');
      box.textContent = msg;
      box.style.transform = 'translateX(-50%) scale(1)';
      setTimeout(() => {
        box.style.transform = 'translateX(-50%) scale(0)';
      }, 1200);
    }

    function die() {
      if (pState.dead) return;
      pState.dead = true;
      playSound('die');
      deaths++;
      document.getElementById('deathText').textContent = deaths;

      playerMesh.visible = false;
      cameraShake();

      setTimeout(() => {
        loadLevel(currentLevel);
      }, 550);
    }

    function cameraShake() {
      const origX = camera.position.x;
      const origY = camera.position.y;
      let count = 0;
      const shake = setInterval(() => {
        camera.position.x = origX + (Math.random() - 0.5) * 0.7;
        camera.position.y = origY + (Math.random() - 0.5) * 0.7;
        count++;
        if (count > 6) {
          clearInterval(shake);
          camera.position.set(0, 4.5, 21);
        }
      }, 25);
    }

    // ==========================================
    // 4. PHYSICS & GAME LOOP
    // ==========================================
    function updatePhysics() {
      if (pState.dead) return;
      const moveLeft = invertedControls ? keys.right : keys.left;
      const moveRight = invertedControls ? keys.left : keys.right;

      if (moveLeft) pState.vx = -pState.speed;
      else if (moveRight) pState.vx = pState.speed;
      else pState.vx = 0;

      if (keys.jump && pState.isGrounded) {
        pState.vy = (gravity < 0) ? pState.jumpForce : -pState.jumpForce;
        pState.isGrounded = false;
        playSound('jump');
      }

      pState.vy += gravity;
      pState.x += pState.vx;
      pState.y += pState.vy;
      pState.isGrounded = false;

      // Platform collisions
      platforms.forEach(p => {
        if (p.userData.falling) p.position.y -= 0.14;
        if (p.userData.ghost) return;

        const halfW = p.userData.w / 2;
        const halfH = p.userData.h / 2;

        if (gravity < 0) {
          if (
            pState.x + 0.45 > p.position.x - halfW &&
            pState.x - 0.45 < p.position.x + halfW &&
            pState.y - 0.45 <= p.position.y + halfH &&
            pState.y - 0.45 >= p.position.y + halfH - 0.38 &&
            pState.vy <= 0
          ) {
            pState.y = p.position.y + halfH + 0.45;
            pState.vy = 0;
            pState.isGrounded = true;
          }
        } else {
          if (
            pState.x + 0.45 > p.position.x - halfW &&
            pState.x - 0.45 < p.position.x + halfW &&
            pState.y + 0.45 >= p.position.y - halfH &&
            pState.y + 0.45 <= p.position.y - halfH + 0.38 &&
            pState.vy >= 0
          ) {
            pState.y = p.position.y - halfH - 0.45;
            pState.vy = 0;
            pState.isGrounded = true;
          }
        }
      });

      // Spikes physics & collisions
      spikes.forEach(s => {
        if (s.userData.active) {
          if (s.userData.isChaser) {
            s.position.x += 0.085 * (s.userData.speedMult || 1);
            s.rotation.z += 0.16;
          } else {
            s.position.y -= 0.25;
          }
        }

        const dist = Math.hypot(pState.x - s.position.x, pState.y - s.position.y);
        if (dist < 0.85 * (s.userData.scale || 1)) {
          die();
        }
      });

      // Traps check
      traps.forEach(t => {
        if (!t.triggered && t.check()) {
          t.triggered = true;
          t.action();
        }
      });

      // Void death
      if (pState.y < -8 || pState.y > 16) {
        die();
      }

      // Exit Door Hit Check (Advance Level)
      if (doorMesh) {
        const doorDist = Math.hypot(pState.x - doorMesh.position.x, pState.y - doorMesh.position.y);
        if (doorDist < 1.1) {
          playSound('win');
          if (currentLevel >= 100) {
            alert("👑 LEGENDARY RUNNER! You beat all 100 levels of Level Devil 3D!");
            currentLevel = 1;
          } else {
            currentLevel++;
          }
          loadLevel(currentLevel);
        }
      }

      playerMesh.position.set(pState.x, pState.y, pState.z);
      if (pState.vx !== 0) {
        playerMesh.rotation.z = -pState.vx * 1.5;
      } else {
        playerMesh.rotation.z = 0;
      }
    }

    // ==========================================
    // 5. INPUT BINDINGS
    // ==========================================
    function bindControls() {
      const setKey = (k, state) => keys[k] = state;

      const bindBtn = (id, k) => {
        const el = document.getElementById(id);
        el.addEventListener('touchstart', (e) => { e.preventDefault(); setKey(k, true); }, { passive: false });
        el.addEventListener('touchend', (e) => { e.preventDefault(); setKey(k, false); }, { passive: false });
        el.addEventListener('mousedown', () => setKey(k, true));
        el.addEventListener('mouseup', () => setKey(k, false));
      };

      bindBtn('btnLeft', 'left');
      bindBtn('btnRight', 'right');
      bindBtn('btnJump', 'jump');

      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft' || e.key === 'a') setKey('left', true);
        if (e.key === 'ArrowRight' || e.key === 'd') setKey('right', true);
        if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') setKey('jump', true);
      });

      window.addEventListener('keyup', (e) => {
        if (e.key === 'ArrowLeft' || e.key === 'a') setKey('left', false);
        if (e.key === 'ArrowRight' || e.key === 'd') setKey('right', false);
        if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') setKey('jump', false);
      });
    }

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      updatePhysics();
      renderer.render(scene, camera);
    }

    window.onload = init3D;
  </script>
</body>
