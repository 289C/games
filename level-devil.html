<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Level Devil 3D - 100 Levels</title>

  <!-- Three.js 3D Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    :root {
      --bg: #07090e;
      --card-bg: rgba(18, 24, 38, 0.9);
      --border: rgba(255, 255, 255, 0.14);
      --cyan: #00f2fe;
      --pink: #ff007f;
      --gold: #ffd700;
      --red: #ff3838;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      background: radial-gradient(circle at 50% 10%, #151c30 0%, #06080d 100%);
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 10px 20px;
      overflow-x: hidden;
    }

    /* Pinned Instagram Header */
    .ig-header {
      width: 95%;
      max-width: 440px;
      margin-bottom: 10px;
      padding: 8px 16px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 50px;
      backdrop-filter: blur(14px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
    }

    .ig-profile {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .dp-frame {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      padding: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .dp-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    .ig-name {
      font-size: 13px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .verified {
      background: #0095f6;
      color: #fff;
      font-size: 8px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .follow-btn {
      background: linear-gradient(135deg, #f58529, #dd2a7b, #8134af);
      color: #fff;
      text-decoration: none;
      font-size: 11px;
      font-weight: 800;
      padding: 6px 14px;
      border-radius: 20px;
    }

    /* Game HUD */
    .hud-box {
      width: 95%;
      max-width: 440px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 10px 16px;
      margin-bottom: 10px;
    }

    .hud-stat {
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.5px;
    }

    /* Strict 16:9 YouTube Widescreen Container */
    .screen-16-9 {
      position: relative;
      width: min(95vw, 440px);
      height: calc(min(95vw, 440px) * (9 / 16));
      border: 2px solid rgba(255, 255, 255, 0.16);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9), 0 0 20px rgba(0, 242, 254, 0.1);
      background: #090a0f;
    }

    #canvas3d {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Troll Alert Message */
    #trollMsg {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%) scale(0);
      background: rgba(255, 56, 56, 0.95);
      color: #fff;
      font-size: 11px;
      font-weight: 900;
      padding: 4px 14px;
      border-radius: 20px;
      z-index: 20;
      letter-spacing: 0.5px;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 0 15px rgba(255, 56, 56, 0.8);
      white-space: nowrap;
    }

    /* On-Screen Mobile Controls */
    .controls-panel {
      width: 95%;
      max-width: 440px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 14px;
      padding: 0 4px;
    }

    .ctrl-group {
      display: flex;
      gap: 12px;
    }

    .ctrl-btn {
      width: 62px;
      height: 62px;
      border-radius: 18px;
      background: rgba(22, 28, 44, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      font-size: 24px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
    }

    .ctrl-btn:active {
      transform: scale(0.92);
      background: rgba(255, 255, 255, 0.25);
    }

    .btn-jump {
      width: 82px;
      background: linear-gradient(135deg, rgba(255, 56, 56, 0.8), #c0392b);
      border-color: rgba(255, 56, 56, 0.5);
    }

    .btn-jump:active {
      background: #ff3838;
    }
  </style>
</head>
<body>

  <!-- Top Instagram Header -->
  <header class="ig-header">
    <div class="ig-profile">
      <div class="dp-frame">
        <img src="Insta.jpg" alt="DP" class="dp-img" onerror="this.onerror=null; this.src='insta.jpg';" />
      </div>
      <div>
        <div class="ig-name">@_satish_official_16 <span class="verified">✓</span></div>
        <div style="font-size:9px; color:rgba(255,255,255,0.6);">Level Devil 3D • 100 Levels</div>
      </div>
    </div>
    <a href="https://instagram.com/_satish_official_16" target="_blank" class="follow-btn">Follow ↗</a>
  </header>

  <!-- Stage & Death Status Bar -->
  <div class="hud-box">
    <div class="hud-stat" style="color:var(--gold);" id="levelText">STAGE: LEVEL 1/100</div>
    <div class="hud-stat" style="color:var(--red);" id="deathText">DEATHS: 0</div>
  </div>

  <!-- 16:9 Screen Box -->
  <div class="screen-16-9" id="gameFrame">
    <div id="trollMsg">😈 VOID EXPANDED!</div>
    <canvas id="canvas3d"></canvas>
  </div>

  <!-- Responsive Controls -->
  <div class="controls-panel">
    <div class="ctrl-group">
      <div class="ctrl-btn" id="btnLeft">◀</div>
      <div class="ctrl-btn" id="btnRight">▶</div>
    </div>
    <div class="ctrl-group">
      <div class="ctrl-btn btn-jump" id="btnJump">▲</div>
    </div>
  </div>

  <script>
    // Audio Synthesizer
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq, type = 'sine', duration = 0.08, gainVal = 0.2) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      g.gain.setValueAtTime(gainVal, audioCtx.currentTime);
      g.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      osc.connect(g);
      g.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    // 3D Engine Setup
    let scene, camera, renderer;
    let playerMesh;
    let flagGroup = null;
    let currentLevel = 1;
    let deaths = 0;
    const gravity = -0.016;

    const platforms = [];
    const spikes = [];
    const traps = [];

    const pState = {
      x: -8.5,
      y: 1.0,
      z: 0,
      vx: 0,
      vy: 0,
      speed: 0.13,
      jumpForce: 0.32,
      isGrounded: false,
      dead: false
    };

    const keys = { left: false, right: false, jump: false };

    function init3D() {
      const frame = document.getElementById('gameFrame');
      const canvas = document.getElementById('canvas3d');

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x090a0f);

      camera = new THREE.PerspectiveCamera(50, 16 / 9, 0.1, 100);
      camera.position.set(0, 3.2, 19);
      camera.lookAt(0, 0, 0);

      renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(frame.clientWidth, frame.clientHeight);

      const ambient = new THREE.AmbientLight(0xffffff, 0.8);
      scene.add(ambient);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.7);
      dirLight.position.set(10, 20, 15);
      scene.add(dirLight);

      // Player Block Mesh
      playerMesh = new THREE.Group();
      const body = new THREE.Mesh(
        new THREE.BoxGeometry(0.85, 0.85, 0.85),
        new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 })
      );
      playerMesh.add(body);

      const eye = new THREE.Mesh(
        new THREE.BoxGeometry(0.14, 0.22, 0.08),
        new THREE.MeshBasicMaterial({ color: 0x111111 })
      );
      eye.position.set(0.18, 0.14, 0.44);
      playerMesh.add(eye);

      scene.add(playerMesh);

      bindControls();
      loadLevel(1);
      window.addEventListener('resize', onResize);
      animate();
    }

    function createPlatform(x, y, w, h, color = 0x242836) {
      const geo = new THREE.BoxGeometry(w, h, 2.2);
      const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.6 });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(x, y, 0);
      mesh.userData = { w, h, falling: false };
      scene.add(mesh);
      platforms.push(mesh);
      return mesh;
    }

    function createSpike(x, y, scale = 1, pointingUp = true) {
      const geo = new THREE.ConeGeometry(0.32 * scale, 0.75 * scale, 4);
      const mat = new THREE.MeshStandardMaterial({ color: 0xff3838, roughness: 0.3 });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.rotation.y = Math.PI / 4;
      if (!pointingUp) mesh.rotation.z = Math.PI;
      mesh.position.set(x, y, 0);
      mesh.userData = { scale, active: false };
      scene.add(mesh);
      spikes.push(mesh);
      return mesh;
    }

    function createFlag(x, y) {
      const group = new THREE.Group();
      const pole = new THREE.Mesh(
        new THREE.CylinderGeometry(0.06, 0.06, 2.4, 8),
        new THREE.MeshStandardMaterial({ color: 0xdddddd })
      );
      pole.position.y = 1.2;
      group.add(pole);

      const cloth = new THREE.Mesh(
        new THREE.PlaneGeometry(0.9, 0.6),
        new THREE.MeshStandardMaterial({ color: 0xffd32a, side: THREE.DoubleSide })
      );
      cloth.position.set(0.45, 1.9, 0);
      group.add(cloth);

      group.position.set(x, y, 0);
      scene.add(group);
      flagGroup = group;
      return group;
    }

    function clearLevel() {
      platforms.forEach(p => scene.remove(p));
      spikes.forEach(s => scene.remove(s));
      if (flagGroup) scene.remove(flagGroup);
      platforms.length = 0;
      spikes.length = 0;
      traps.length = 0;
      flagGroup = null;
    }

    // 100 Solvable Levels
    function loadLevel(lvl) {
      clearLevel();
      currentLevel = lvl;
      document.getElementById('levelText').textContent = `STAGE: LEVEL ${lvl}/100`;

      pState.x = -8.5;
      pState.y = 1.0;
      pState.vx = 0;
      pState.vy = 0;
      pState.dead = false;
      playerMesh.visible = true;

      // Base Platform
      createPlatform(-8.5, -0.5, 4.5, 1.4);

      if (lvl === 1) {
        // Solvable Platform Jump
        const bridge = createPlatform(3.5, -0.5, 8.5, 1.4);
        createFlag(7.0, 0.2);

        traps.push({
          triggered: false,
          check: () => pState.x > -5.5,
          action: () => {
            showTroll("VOID EXPANDED! 😈");
            bridge.position.x += 1.5; // Reachable leap
          }
        });
      } else if (lvl === 2) {
        // Fake high road, real lower bridge
        const fakeTop = createPlatform(0, 1.5, 6.0, 0.8);
        createPlatform(0, -2.5, 7.5, 0.8);
        createPlatform(8.0, -0.5, 4.5, 1.4);
        createFlag(8.5, 0.2);

        traps.push({
          triggered: false,
          check: () => pState.x > -2.5 && pState.y > 0.5,
          action: () => {
            showTroll("FAKE PATH! 💥");
            fakeTop.userData.falling = true;
          }
        });
      } else if (lvl === 3) {
        // Retreat to disarm
        createPlatform(0, -0.5, 20, 1.4);
        createFlag(8.0, 0.2);

        let disarmed = false;
        traps.push({
          triggered: false,
          check: () => pState.x > -2.0 && !disarmed,
          action: () => {
            showTroll("STEP BACK TO DISARM 🌵");
            for (let i = 0; i < 4; i++) createSpike(i * 0.9, 0.65, 1.2);
          }
        });

        traps.push({
          triggered: false,
          check: () => pState.x < -9.5,
          action: () => {
            showTroll("TRAP DISARMED! 🔓");
            disarmed = true;
            spikes.forEach(s => scene.remove(s));
            spikes.length = 0;
          }
        });
      } else {
        // Procedural Levels 4 to 100
        const variant = lvl % 3;
        if (variant === 0) {
          const step = createPlatform(0, -0.5, 3.8, 1.0);
          createPlatform(8.0, -0.5, 4.5, 1.4);
          createFlag(8.5, 0.2);
          traps.push({
            triggered: false,
            check: () => pState.x > -1.5,
            action: () => {
              showTroll("SINKING FLOOR! ⏱️");
              setTimeout(() => { step.userData.falling = true; }, 400);
            }
          });
        } else if (variant === 1) {
          createPlatform(0, -0.5, 20, 1.4);
          createFlag(8.0, 0.2);
          traps.push({
            triggered: false,
            check: () => pState.x > 3.0,
            action: () => {
              showTroll("FLAG LEAPED! 🚩");
              flagGroup.position.y += 2.2;
            }
          });
        } else {
          createPlatform(0, -0.5, 20, 1.4);
          const dropSpike = createSpike(2.0, 6.5, 1.5, false);
          createFlag(8.0, 0.2);
          traps.push({
            triggered: false,
            check: () => pState.x > -1.0,
            action: () => {
              showTroll("LOOK UP! ⚡");
              setTimeout(() => { dropSpike.userData.active = true; }, 400);
            }
          });
        }
      }
    }

    function showTroll(msg) {
      playBeep(240, 'triangle', 0.2);
      const box = document.getElementById('trollMsg');
      box.textContent = msg;
      box.style.transform = 'translateX(-50%) scale(1)';
      setTimeout(() => { box.style.transform = 'translateX(-50%) scale(0)'; }, 1300);
    }

    function die() {
      if (pState.dead) return;
      pState.dead = true;
      playBeep(120, 'sawtooth', 0.3, 0.4);
      deaths++;
      document.getElementById('deathText').textContent = `DEATHS: ${deaths}`;
      playerMesh.visible = false;
      setTimeout(() => { loadLevel(currentLevel); }, 400);
    }

    // Physics Engine
    function updatePhysics() {
      if (pState.dead) return;

      if (keys.left) pState.vx = -pState.speed;
      else if (keys.right) pState.vx = pState.speed;
      else pState.vx = 0;

      if (keys.jump && pState.isGrounded) {
        pState.vy = pState.jumpForce;
        pState.isGrounded = false;
        playBeep(320, 'square', 0.1);
      }

      pState.vy += gravity;
      pState.x += pState.vx;
      pState.y += pState.vy;
      pState.isGrounded = false;

      // Collisions
      platforms.forEach(p => {
        if (p.userData.falling) p.position.y -= 0.14;
        const halfW = p.userData.w / 2;
        const halfH = p.userData.h / 2;

        if (
          pState.x + 0.42 > p.position.x - halfW &&
          pState.x - 0.42 < p.position.x + halfW &&
          pState.y - 0.42 <= p.position.y + halfH &&
          pState.y - 0.42 >= p.position.y + halfH - 0.35 &&
          pState.vy <= 0
        ) {
          pState.y = p.position.y + halfH + 0.42;
          pState.vy = 0;
          pState.isGrounded = true;
        }
      });

      spikes.forEach(s => {
        if (s.userData.active) s.position.y -= 0.25;
        const dist = Math.hypot(pState.x - s.position.x, pState.y - s.position.y);
        if (dist < 0.8 * (s.userData.scale || 1)) die();
      });

      traps.forEach(t => {
        if (!t.triggered && t.check()) {
          t.triggered = true;
          t.action();
        }
      });

      if (flagGroup) {
        const flagDist = Math.hypot(pState.x - flagGroup.position.x, pState.y - (flagGroup.position.y + 0.9));
        if (flagDist < 1.2) {
          playBeep(660, 'sine', 0.25);
          currentLevel++;
          if (currentLevel > 100) {
            alert("👑 ALL 100 LEVELS COMPLETED!");
            currentLevel = 1;
          }
          loadLevel(currentLevel);
        }
      }

      if (pState.y < -7 || pState.y > 15) die();

      playerMesh.position.set(pState.x, pState.y, pState.z);
      playerMesh.rotation.z = pState.vx !== 0 ? -pState.vx * 1.4 : 0;
    }

    // Input Handlers
    function bindControls() {
      const setKey = (k, v) => keys[k] = v;
      const bind = (id, k) => {
        const el = document.getElementById(id);
        el.onpointerdown = (e) => { e.preventDefault(); setKey(k, true); };
        el.onpointerup = (e) => { e.preventDefault(); setKey(k, false); };
      };

      bind('btnLeft', 'left');
      bind('btnRight', 'right');
      bind('btnJump', 'jump');

      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft' || e.key === 'a') setKey('left', true);
        if (e.key === 'ArrowRight' || e.key === 'd') setKey('right', true);
        if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') setKey('jump', true);
      });

      window.addEventListener('keyup', (e) => {
        if (e.key === 'ArrowLeft' || e.key === 'a') setKey('left', false);
        if (e.key === 'ArrowRight' || e.key === 'd') setKey('right', false);
        if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') setKey('jump', false);
      });
    }

    function onResize() {
      const frame = document.getElementById('gameFrame');
      renderer.setSize(frame.clientWidth, frame.clientHeight);
      camera.aspect = 16 / 9;
      camera.updateProjectionMatrix();
    }

    function animate() {
      requestAnimationFrame(animate);
      updatePhysics();
      renderer.render(scene, camera);
    }

    window.onload = init3D;
  </script>
</body>
</html>
