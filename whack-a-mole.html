<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Whack-A-Mole Pro - Arcade Championship</title>

  <style>
    :root {
      --bg: #07090e;
      --card-bg: rgba(18, 24, 38, 0.92);
      --border: rgba(255, 255, 255, 0.14);
      --cyan: #00f2fe;
      --pink: #ff007f;
      --gold: #ffd700;
      --red: #ff3838;
      --green: #2ecc71;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      background: radial-gradient(circle at 50% 10%, #151c30 0%, #06080d 100%);
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 10px 30px;
      overflow-x: hidden;
    }

    /* Pinned Instagram Header */
    .ig-header {
      width: 95%;
      max-width: 440px;
      margin-bottom: 10px;
      padding: 8px 16px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 50px;
      backdrop-filter: blur(14px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
      z-index: 10;
    }

    .ig-profile {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .dp-frame {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      padding: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .dp-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    .ig-name {
      font-size: 13px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .verified {
      background: #0095f6;
      color: #fff;
      font-size: 8px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .follow-btn {
      background: linear-gradient(135deg, #f58529, #dd2a7b, #8134af);
      color: #fff;
      text-decoration: none;
      font-size: 11px;
      font-weight: 800;
      padding: 6px 14px;
      border-radius: 20px;
      box-shadow: 0 2px 10px rgba(221, 42, 123, 0.4);
    }

    /* Score & Timer HUD */
    .hud-box {
      width: 95%;
      max-width: 440px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 10px 16px;
      margin-bottom: 8px;
    }

    .hud-stat {
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.5px;
    }

    .combo-pill {
      background: rgba(255, 215, 0, 0.15);
      border: 1px solid var(--gold);
      color: var(--gold);
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 900;
    }

    /* Timer Countdown Bar */
    .timer-container {
      width: 95%;
      max-width: 440px;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .timer-bar {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, var(--cyan), var(--pink));
      transition: width 0.1s linear;
    }

    /* 3x3 Grid Board */
    .mole-arena {
      position: relative;
      width: min(94vw, 400px);
      height: min(94vw, 400px);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      padding: 14px;
      background: rgba(14, 18, 28, 0.9);
      border: 2px solid var(--border);
      border-radius: 24px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 25px rgba(0, 242, 254, 0.15);
    }

    /* Hole Structure */
    .hole {
      position: relative;
      background: radial-gradient(circle at 50% 30%, #151b29 0%, #080a10 75%);
      border: 2px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      cursor: pointer;
      box-shadow: inset 0 8px 16px rgba(0, 0, 0, 0.9);
    }

    .hole::after {
      content: '';
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 22px;
      background: #1a2233;
      border-top: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 0 0 18px 18px;
      z-index: 4;
    }

    /* Mole Character */
    .mole {
      position: absolute;
      bottom: -100%;
      width: 72%;
      height: 80%;
      border-radius: 30px 30px 10px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 8px;
      transition: bottom 0.18s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 2;
    }

    .mole.up {
      bottom: 12px;
    }

    /* Mole Types */
    .mole-normal {
      background: linear-gradient(180deg, #8d5b4c 0%, #5d3a30 100%);
      border: 2px solid #a76d5b;
    }

    .mole-gold {
      background: linear-gradient(180deg, #ffd700 0%, #e67e22 100%);
      border: 2px solid #fff;
      box-shadow: 0 0 16px rgba(255, 215, 0, 0.8);
    }

    .mole-bomb {
      background: linear-gradient(180deg, #2d3436 0%, #111 100%);
      border: 2px solid var(--red);
      box-shadow: 0 0 14px rgba(255, 56, 56, 0.7);
    }

    .mole-boss {
      background: linear-gradient(180deg, #4a69bd 0%, #1e3799 100%);
      border: 2px solid #6a89cc;
    }

    /* Face Elements */
    .mole-face {
      display: flex;
      gap: 12px;
      margin-top: 4px;
    }

    .mole-eye {
      width: 6px;
      height: 10px;
      background: #111;
      border-radius: 50%;
    }

    .mole-nose {
      width: 12px;
      height: 8px;
      background: #ff7675;
      border-radius: 6px;
      margin-top: 4px;
    }

    /* Floating Score Animations */
    .score-popup {
      position: absolute;
      font-weight: 900;
      font-size: 16px;
      pointer-events: none;
      animation: floatUp 0.6s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
      z-index: 30;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    }

    @keyframes floatUp {
      0% { transform: translate(-50%, 0) scale(0.6); opacity: 1; }
      100% { transform: translate(-50%, -45px) scale(1.1); opacity: 0; }
    }

    /* Screen Shake & Reset Button */
    .shake-anim {
      animation: screenShake 0.3s cubic-bezier(.36,.07,.19,.97) both;
    }

    @keyframes screenShake {
      10%, 90% { transform: translate3d(-3px, 0, 0); }
      20%, 80% { transform: translate3d(4px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
      40%, 60% { transform: translate3d(6px, 0, 0); }
    }

    .btn-start {
      margin-top: 14px;
      width: min(94vw, 400px);
      padding: 12px;
      border-radius: 16px;
      border: none;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
      background: linear-gradient(135deg, var(--cyan), #0072ff);
      color: #040814;
      box-shadow: 0 4px 18px rgba(0, 242, 254, 0.3);
    }
  </style>
</head>
<body>

  <!-- Top Instagram Header -->
  <header class="ig-header">
    <div class="ig-profile">
      <div class="dp-frame">
        <img src="Insta.jpg" alt="DP" class="dp-img" onerror="this.onerror=null; this.src='insta.jpg';" />
      </div>
      <div>
        <div class="ig-name">@_satish_official_16 <span class="verified">✓</span></div>
        <div style="font-size:9px; color:rgba(255,255,255,0.6);">Whack-A-Mole Championship</div>
      </div>
    </div>
    <a href="https://instagram.com/_satish_official_16" target="_blank" class="follow-btn">Follow ↗</a>
  </header>

  <!-- HUD Stats -->
  <div class="hud-box">
    <div class="hud-stat" style="color:var(--cyan);" id="scoreDisplay">SCORE: 0</div>
    <div class="combo-pill" id="comboDisplay">1x COMBO</div>
    <div class="hud-stat" style="color:var(--pink);" id="timeDisplay">TIME: 45s</div>
  </div>

  <!-- Decaying Timer Progress Bar -->
  <div class="timer-container">
    <div class="timer-bar" id="timerBar"></div>
  </div>

  <!-- 3x3 Arena -->
  <div class="mole-arena" id="arena">
    <div class="hole" id="hole0"><div class="mole mole-normal" onclick="whack(0)"></div></div>
    <div class="hole" id="hole1"><div class="mole mole-normal" onclick="whack(1)"></div></div>
    <div class="hole" id="hole2"><div class="mole mole-normal" onclick="whack(2)"></div></div>
    <div class="hole" id="hole3"><div class="mole mole-normal" onclick="whack(3)"></div></div>
    <div class="hole" id="hole4"><div class="mole mole-normal" onclick="whack(4)"></div></div>
    <div class="hole" id="hole5"><div class="mole mole-normal" onclick="whack(5)"></div></div>
    <div class="hole" id="hole6"><div class="mole mole-normal" onclick="whack(6)"></div></div>
    <div class="hole" id="hole7"><div class="mole mole-normal" onclick="whack(7)"></div></div>
    <div class="hole" id="hole8"><div class="mole mole-normal" onclick="whack(8)"></div></div>
  </div>

  <!-- Start / Reset Button -->
  <button class="btn-start" id="startBtn" onclick="startGame()">Start Championship 🔨</button>

  <script>
    // ==========================================
    // AUDIO SYNTHESIZER
    // ==========================================
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playTone(freq, type = 'sine', duration = 0.08, gainVal = 0.2) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      g.gain.setValueAtTime(gainVal, audioCtx.currentTime);
      g.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      osc.connect(g);
      g.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    const Sound = {
      hit: () => playTone(360, 'triangle', 0.1, 0.3),
      gold: () => { playTone(880, 'sine', 0.06); setTimeout(() => playTone(1320, 'sine', 0.1), 60); },
      bomb: () => playTone(90, 'sawtooth', 0.3, 0.45),
      bossHit: () => playTone(240, 'square', 0.08)
    };

    // ==========================================
    // GAME STATE & MOLE TYPES
    // ==========================================
    let score = 0;
    let combo = 1;
    let timeLeft = 45;
    let gameRunning = false;
    let timerInterval = null;
    let spawnTimeout = null;

    // Types: 'normal', 'gold', 'bomb', 'boss'
    const moleStates = Array(9).fill(null).map(() => ({
      active: false,
      type: 'normal',
      hp: 1
    }));

    function initHoleFaces() {
      for (let i = 0; i < 9; i++) {
        const m = document.querySelector(`#hole${i} .mole`);
        m.innerHTML = `
          <div class="mole-face">
            <div class="mole-eye"></div>
            <div class="mole-eye"></div>
          </div>
          <div class="mole-nose"></div>
        `;
      }
    }
    initHoleFaces();

    function startGame() {
      score = 0;
      combo = 1;
      timeLeft = 45;
      gameRunning = true;
      document.getElementById('scoreDisplay').textContent = 'SCORE: 0';
      document.getElementById('comboDisplay').textContent = '1x COMBO';
      document.getElementById('startBtn').textContent = 'Restart Match 🔁';

      clearInterval(timerInterval);
      clearTimeout(spawnTimeout);

      // Countdown loop
      timerInterval = setInterval(() => {
        timeLeft--;
        document.getElementById('timeDisplay').textContent = `TIME: ${timeLeft}s`;
        document.getElementById('timerBar').style.width = (timeLeft / 45 * 100) + '%';

        if (timeLeft <= 0) {
          endGame();
        }
      }, 1000);

      spawnLoop();
    }

    function endGame() {
      gameRunning = false;
      clearInterval(timerInterval);
      clearTimeout(spawnTimeout);
      document.querySelectorAll('.mole').forEach(m => m.classList.remove('up'));
      Sound.bomb();
      alert(`🏆 GAME OVER!\nFinal Championship Score: ${score}\nBest Combo: ${combo}x`);
      document.getElementById('startBtn').textContent = 'Play Again 🔨';
    }

    function spawnLoop() {
      if (!gameRunning) return;

      // Accelerate speed as time elapses (1100ms down to 450ms)
      const speedFactor = Math.max(450, 1100 - (45 - timeLeft) * 15);

      // Pick empty hole
      const availableHoles = [];
      moleStates.forEach((state, idx) => {
        if (!state.active) availableHoles.push(idx);
      });

      if (availableHoles.length > 0) {
        const holeIdx = availableHoles[Math.floor(Math.random() * availableHoles.length)];
        popMole(holeIdx, speedFactor);
      }

      spawnTimeout = setTimeout(spawnLoop, Math.random() * 300 + speedFactor * 0.7);
    }

    function popMole(holeIdx, peepDuration) {
      const state = moleStates[holeIdx];
      const moleEl = document.querySelector(`#hole${holeIdx} .mole`);

      // Determine archetype by odds
      const rand = Math.random();
      if (rand < 0.15) {
        state.type = 'gold';
        state.hp = 1;
        moleEl.className = 'mole mole-gold';
      } else if (rand < 0.35) {
        state.type = 'bomb';
        state.hp = 1;
        moleEl.className = 'mole mole-bomb';
      } else if (rand < 0.50) {
        state.type = 'boss';
        state.hp = 2; // Needs 2 hits
        moleEl.className = 'mole mole-boss';
      } else {
        state.type = 'normal';
        state.hp = 1;
        moleEl.className = 'mole mole-normal';
      }

      state.active = true;
      moleEl.classList.add('up');

      // Golden mole stays for less time
      const actualDuration = state.type === 'gold' ? peepDuration * 0.65 : peepDuration;

      setTimeout(() => {
        if (state.active) {
          moleEl.classList.remove('up');
          state.active = false;
        }
      }, actualDuration);
    }

    function whack(holeIdx) {
      if (!gameRunning) return;
      const state = moleStates[holeIdx];
      if (!state.active) return;

      const moleEl = document.querySelector(`#hole${holeIdx} .mole`);
      const holeRect = document.getElementById(`hole${holeIdx}`).getBoundingClientRect();

      state.hp--;

      // If boss mole needs another hit
      if (state.hp > 0) {
        Sound.bossHit();
        showScorePopup(holeRect, 'SHIELD HIT!', '#6a89cc');
        return;
      }

      state.active = false;
      moleEl.classList.remove('up');

      if (state.type === 'bomb') {
        // Bomb hit penalty
        Sound.bomb();
        combo = 1;
        score = Math.max(0, score - 250);
        showScorePopup(holeRect, '-250 💥', '#ff3838');
        triggerArenaShake();
      } else {
        // Valid targets
        let points = 100;
        if (state.type === 'gold') {
          points = 300;
          Sound.gold();
          showScorePopup(holeRect, `+${points * combo} GOLD! 🌟`, '#ffd700');
        } else if (state.type === 'boss') {
          points = 250;
          Sound.hit();
          showScorePopup(holeRect, `+${points * combo} SMASHED! 🛡️`, '#00f2fe');
        } else {
          Sound.hit();
          showScorePopup(holeRect, `+${points * combo}`, '#2ecc71');
        }

        score += points * combo;
        combo = Math.min(5, combo + 1);
      }

      document.getElementById('scoreDisplay').textContent = `SCORE: ${score}`;
      document.getElementById('comboDisplay').textContent = `${combo}x COMBO`;
    }

    function showScorePopup(rect, text, color) {
      const pop = document.createElement('div');
      pop.className = 'score-popup';
      pop.textContent = text;
      pop.style.color = color;
      pop.style.left = `${rect.left + rect.width / 2}px`;
      pop.style.top = `${rect.top + 20}px`;
      document.body.appendChild(pop);
      setTimeout(() => pop.remove(), 600);
    }

    function triggerArenaShake() {
      const arena = document.getElementById('arena');
      arena.classList.add('shake-anim');
      setTimeout(() => arena.classList.remove('shake-anim'), 320);
    }
  </script>
</body>
</html>
