<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TypeRacer - Firebase Edition</title>
    <style>
        :root {
            --primary: #4a90e2;
            --bg: #f8f9fa;
            --success: #2ecc71;
            --error: #e74c3c;
            --dark: #2c3e50;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--dark);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            width: 90%;
            max-width: 800px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        h1 { text-align: center; color: var(--primary); margin-bottom: 30px; }

        /* UI Screens */
        .screen { display: none; }
        .screen.active { display: block; }

        .btn-group { display: flex; gap: 15px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; }
        
        button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: var(--primary);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }

        button:hover { background: #357abd; transform: translateY(-2px); }
        button:disabled { background: #ccc; cursor: not-allowed; }

        input[type="text"] {
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
        }

        /* Racing Track */
        .track {
            background: #eee;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            position: relative;
        }

        .lane {
            height: 50px;
            border-bottom: 2px dashed #ddd;
            position: relative;
            display: flex;
            align-items: center;
        }

        .lane:last-child { border-bottom: none; }

        .car {
            position: absolute;
            font-size: 30px;
            transition: left 0.3s ease;
            z-index: 2;
        }

        .car-info {
            position: absolute;
            font-size: 10px;
            top: -15px;
            background: black;
            color: white;
            padding: 2px 5px;
            border-radius: 3px;
            white-space: nowrap;
        }

        /* Typing Area */
        #quote-display {
            font-size: 1.4rem;
            line-height: 1.6;
            margin: 20px 0;
            padding: 15px;
            background: #fdfdfd;
            border-left: 5px solid var(--primary);
            user-select: none;
        }

        .correct { color: var(--success); }
        .wrong { background-color: #ffdada; color: var(--error); text-decoration: underline; }
        .current { border-bottom: 3px solid var(--primary); }

        #typing-input {
            width: 100%;
            padding: 15px;
            font-size: 1.2rem;
            border: 2px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .room-badge {
            text-align: center;
            background: #eef5ff;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid var(--primary);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🏎️ Firebase TypeRacer</h1>

    <!-- Menu Screen -->
    <div id="screen-menu" class="screen active">
        <div class="btn-group">
            <button onclick="startSoloGame()">Single Player</button>
            <button onclick="showMultiplayer()">Play with Friends</button>
        </div>
    </div>

    <!-- Lobby Screen -->
    <div id="screen-lobby" class="screen">
        <div class="btn-group">
            <button onclick="createRoom()">Create New Room</button>
            <div style="display: flex; gap: 5px;">
                <input type="text" id="room-input" placeholder="Enter Room Code">
                <button onclick="joinRoom()">Join</button>
            </div>
        </div>
        <div id="lobby-info" style="display: none;">
            <div class="room-badge">
                Room Code: <strong id="display-code">----</strong>
            </div>
            <p id="player-count">Waiting for players...</p>
            <button id="start-btn" style="display: none;" onclick="hostStartGame()">Start Race</button>
        </div>
        <button onclick="location.reload()" style="background:#666; margin-top:20px;">Back</button>
    </div>

    <!-- Game Screen -->
    <div id="screen-game" class="screen">
        <div class="track" id="race-track">
            <!-- Cars will be injected here -->
        </div>
        <div id="quote-display"></div>
        <input type="text" id="typing-input" placeholder="Type the text above..." autocomplete="off">
        <div class="stats">
            <div>WPM: <span id="wpm">0</span></div>
            <div>Time: <span id="timer">0</span>s</div>
        </div>
    </div>
</div>

<!-- Firebase SDK -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
    import { getDatabase, ref, set, onValue, update, get, child } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";

    // Your Firebase Configuration
    const firebaseConfig = {
        apiKey: "AIzaSyBzLchy5M2fLne4c7Ghw1KNN8wVrlZdd8M",
        authDomain: "friendsgame-872f5.firebaseapp.com",
        databaseURL: "https://friendsgame-872f5-default-rtdb.firebaseio.com",
        projectId: "friendsgame-872f5",
        storageBucket: "friendsgame-872f5.firebasestorage.app",
        messagingSenderId: "522534013233",
        appId: "1:522534013233:web:f5faa6e6795023d0420810",
        measurementId: "G-PW5H3G97QR"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Game Variables
    const quotes = [
        "The quick brown fox jumps over the lazy dog.",
        "Programming is not about what you know, it is about what you can figure out.",
        "Success is a ladder that cannot be climbed with your hands in your pockets.",
        "Hard work beats talent when talent doesn't work hard.",
        "The only way to do great work is to love what you do."
    ];

    let myId = "player_" + Math.floor(Math.random() * 10000);
    let currentRoom = null;
    let targetQuote = "";
    let startTime = null;
    let timerInterval = null;
    let isMultiplayer = false;

    // --- Navigation Functions ---
    window.showMultiplayer = () => {
        switchScreen('screen-lobby');
    };

    function switchScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    // --- Multiplayer Logic ---
    window.createRoom = async () => {
        const roomCode = Math.random().toString(36).substring(2, 8).toUpperCase();
        currentRoom = roomCode;
        isMultiplayer = true;

        const roomRef = ref(db, 'rooms/' + roomCode);
        await set(roomRef, {
            status: 'waiting',
            quote: quotes[Math.floor(Math.random() * quotes.length)],
            players: {
                [myId]: { name: "Host", progress: 0, wpm: 0 }
            }
        });

        listenToRoom(roomCode);
        document.getElementById('lobby-info').style.display = 'block';
        document.getElementById('display-code').innerText = roomCode;
        document.getElementById('start-btn').style.display = 'block';
    };

    window.joinRoom = async () => {
        const roomCode = document.getElementById('room-input').value.toUpperCase();
        if (!roomCode) return alert("Enter a code!");

        const roomRef = ref(db, 'rooms/' + roomCode);
        const snapshot = await get(roomRef);

        if (snapshot.exists()) {
            currentRoom = roomCode;
            isMultiplayer = true;
            await update(ref(db, `rooms/${roomCode}/players/${myId}`), {
                name: "Guest",
                progress: 0,
                wpm: 0
            });
            listenToRoom(roomCode);
            document.getElementById('lobby-info').style.display = 'block';
            document.getElementById('display-code').innerText = roomCode;
            document.getElementById('start-btn').style.display = 'none';
        } else {
            alert("Room not found!");
        }
    };

    function listenToRoom(code) {
        onValue(ref(db, 'rooms/' + code), (snapshot) => {
            const data = snapshot.val();
            if (!data) return;

            // Update player count
            const players = data.players;
            const count = Object.keys(players).length;
            document.getElementById('player-count').innerText = `Players in lobby: ${count}`;

            // If game started by host
            if (data.status === 'racing' && !startTime) {
                targetQuote = data.quote;
                initGameUI(players);
            }

            // Sync Car Positions
            if (data.status === 'racing') {
                for (let id in players) {
                    const car = document.getElementById('car-' + id);
                    if (car) car.style.left = `calc(${players[id].progress}% - 40px)`;
                }
            }
        });
    }

    window.hostStartGame = () => {
        update(ref(db, 'rooms/' + currentRoom), { status: 'racing' });
    };

    // --- Solo Player Logic ---
    window.startSoloGame = () => {
        isMultiplayer = false;
        targetQuote = quotes[Math.floor(Math.random() * quotes.length)];
        const soloPlayers = { [myId]: { name: "You", progress: 0 } };
        initGameUI(soloPlayers);
    };

    // --- Core Racing Engine ---
    function initGameUI(playersData) {
        switchScreen('screen-game');
        const track = document.getElementById('race-track');
        track.innerHTML = '';

        // Create Lanes
        Object.keys(playersData).forEach(id => {
            const lane = document.createElement('div');
            lane.className = 'lane';
            lane.innerHTML = `
                <div class="car" id="car-${id}">
                    <span class="car-info">${playersData[id].name}</span>
                    🏎️
                </div>
            `;
            track.appendChild(lane);
        });

        renderQuote();
        setupTyping();
    }

    function renderQuote() {
        const display = document.getElementById('quote-display');
        display.innerHTML = '';
        targetQuote.split('').forEach(char => {
            const span = document.createElement('span');
            span.innerText = char;
            display.appendChild(span);
        });
    }

    function setupTyping() {
        const input = document.getElementById('typing-input');
        input.value = '';
        input.focus();
        startTime = new Date();
        
        timerInterval = setInterval(() => {
            const now = new Date();
            const sec = Math.floor((now - startTime) / 1000);
            document.getElementById('timer').innerText = sec;
        }, 1000);

        input.addEventListener('input', () => {
            const userVal = input.value;
            const spans = document.querySelectorAll('#quote-display span');
            let correctChars = 0;
            let errorFound = false;

            spans.forEach((span, i) => {
                const char = userVal[i];
                if (char == null) {
                    span.className = '';
                } else if (char === span.innerText && !errorFound) {
                    span.className = 'correct';
                    correctChars++;
                } else {
                    span.className = 'wrong';
                    errorFound = true;
                }
            });

            // Calculate Progress
            const progress = (correctChars / targetQuote.length) * 100;
            
            // Move Local Car
            document.getElementById('car-' + myId).style.left = `calc(${progress}% - 40px)`;

            // Sync to Firebase if Multiplayer
            if (isMultiplayer) {
                update(ref(db, `rooms/${currentRoom}/players/${myId}`), { progress: progress });
            }

            // Calculate WPM
            const words = userVal.trim().split(/\s+/).length;
            const timeMins = (new Date() - startTime) / 60000;
            const wpm = Math.round(words / timeMins) || 0;
            document.getElementById('wpm').innerText = wpm;

            // Finish
            if (correctChars === targetQuote.length) {
                clearInterval(timerInterval);
                input.disabled = true;
                alert(`🏁 Finished! Your speed: ${wpm} WPM`);
            }
        });
    }
</script>

</body>
</html>
