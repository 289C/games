<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS TypeRacer - Solo & Multiplayer</title>
    <!-- PeerJS for Multiplayer -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg: #f4f7f6;
            --card: #ffffff;
            --primary: #4a90e2;
            --correct: #2ecc71;
            --wrong: #e74c3c;
            --text: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: var(--card);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        h1 { text-align: center; color: var(--primary); }

        /* Racing Track */
        .track {
            margin: 20px 0;
            background: #eee;
            padding: 10px;
            border-radius: 8px;
            position: relative;
        }
        .car-row {
            height: 40px;
            display: flex;
            align-items: center;
            border-bottom: 1px dashed #ccc;
            position: relative;
        }
        .car-row:last-child { border: none; }
        .car {
            position: absolute;
            left: 0;
            transition: left 0.3s ease;
            font-size: 24px;
            white-space: nowrap;
        }
        .car-label { font-size: 12px; margin-left: 35px; color: #666; }

        /* Text Area */
        #quote-display {
            font-size: 1.5rem;
            line-height: 1.6;
            margin: 20px 0;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 8px;
            letter-spacing: 0.5px;
        }
        .correct { color: var(--correct); }
        .incorrect { background-color: #ffc9c9; color: var(--wrong); text-decoration: underline; }
        .current { border-bottom: 3px solid var(--primary); }

        #type-input {
            width: 100%;
            padding: 15px;
            font-size: 1.2rem;
            border: 2px solid #ddd;
            border-radius: 8px;
            outline: none;
            box-sizing: border-box;
        }
        #type-input:focus { border-color: var(--primary); }

        /* Stats */
        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
            font-weight: bold;
        }

        /* Lobby / UI Controls */
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background: var(--primary);
            color: white;
            font-weight: bold;
        }
        button:disabled { background: #ccc; }
        .multiplayer-box {
            background: #eef;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        .active { display: block; }
    </style>
</head>
<body>

<div class="container">
    <h1>🏎️ JS TypeRacer</h1>

    <div class="controls">
        <button id="solo-btn">Single Player</button>
        <button id="multi-btn">Play with Friends</button>
        <button id="reset-btn">Reset</button>
    </div>

    <!-- Multiplayer Lobby -->
    <div id="lobby" class="multiplayer-box">
        <p>Your ID: <strong id="my-id">...</strong></p>
        <div style="display:flex; gap:10px;">
            <input type="text" id="friend-id" placeholder="Paste Friend's ID here" style="flex:1; padding:5px;">
            <button id="connect-btn">Connect & Race</button>
        </div>
        <p id="conn-status" style="font-size: 0.9rem; color: #666; margin-top:10px;">Status: Waiting...</p>
    </div>

    <!-- The Track -->
    <div class="track">
        <div class="car-row">
            <div id="player-car" class="car">🏎️<span class="car-label">You</span></div>
        </div>
        <div class="car-row" id="opponent-row" style="display:none;">
            <div id="opponent-car" class="car">🏎️<span class="car-label">Friend</span></div>
        </div>
    </div>

    <div id="quote-display">Select a mode to start!</div>
    <input type="text" id="type-input" placeholder="Type here..." disabled>

    <div class="stats">
        <div>WPM: <span id="wpm">0</span></div>
        <div>Accuracy: <span id="accuracy">100</span>%</div>
        <div>Time: <span id="timer">0</span>s</div>
    </div>
</div>

<script>
    const quotes = [
        "The quick brown fox jumps over the lazy dog.",
        "To be or not to be, that is the question.",
        "Success is not final, failure is not fatal: it is the courage to continue that counts.",
        "In the middle of every difficulty lies opportunity.",
        "Believe you can and you're halfway there."
    ];

    let currentQuote = "";
    let startTime, timerInterval;
    let isRacing = false;
    let peer, conn;

    const quoteDisplay = document.getElementById('quote-display');
    const typeInput = document.getElementById('type-input');
    const wpmLabel = document.getElementById('wpm');
    const accuracyLabel = document.getElementById('accuracy');
    const timerLabel = document.getElementById('timer');
    const playerCar = document.getElementById('player-car');
    const opponentCar = document.getElementById('opponent-car');
    const opponentRow = document.getElementById('opponent-row');

    // --- Core Game Logic ---

    function startRace(quote) {
        currentQuote = quote || quotes[Math.floor(Math.random() * quotes.length)];
        renderQuote();
        typeInput.value = "";
        typeInput.disabled = false;
        typeInput.focus();
        isRacing = true;
        startTime = new Date();
        
        clearInterval(timerInterval);
        timerInterval = setInterval(updateStats, 100);
    }

    function renderQuote() {
        quoteDisplay.innerHTML = '';
        currentQuote.split('').forEach(char => {
            const span = document.createElement('span');
            span.innerText = char;
            quoteDisplay.appendChild(span);
        });
    }

    typeInput.addEventListener('input', () => {
        const inputChars = typeInput.value.split('');
        const quoteSpans = quoteDisplay.querySelectorAll('span');
        let correctCount = 0;
        let isError = false;

        quoteSpans.forEach((span, index) => {
            const char = inputChars[index];
            if (char == null) {
                span.className = '';
            } else if (char === span.innerText && !isError) {
                span.className = 'correct';
                correctCount++;
            } else {
                span.className = 'incorrect';
                isError = true;
            }
        });

        // Update Car Position
        const progress = (correctCount / currentQuote.length) * 100;
        playerCar.style.left = `calc(${progress}% - 30px)`;

        // Multiplayer: Sync progress
        if (conn && conn.open) {
            conn.send({ type: 'progress', value: progress });
        }

        // Finish Game
        if (correctCount === currentQuote.length) {
            finishRace();
        }
    });

    function updateStats() {
        const timeElapsed = (new Date() - startTime) / 1000;
        timerLabel.innerText = Math.floor(timeElapsed);
        
        const wordsTyped = typeInput.value.trim().split(/\s+/).length;
        const wpm = Math.round((wordsTyped / timeElapsed) * 60) || 0;
        wpmLabel.innerText = wpm;
    }

    function finishRace() {
        clearInterval(timerInterval);
        isRacing = false;
        typeInput.disabled = true;
        alert(`Finished! Your WPM: ${wpmLabel.innerText}`);
    }

    // --- Multiplayer Logic (PeerJS) ---

    document.getElementById('multi-btn').addEventListener('click', () => {
        document.getElementById('lobby').classList.toggle('active');
        initPeer();
    });

    function initPeer() {
        if (peer) return;
        peer = new Peer(); // Creates a unique ID automatically via PeerJS cloud

        peer.on('open', (id) => {
            document.getElementById('my-id').innerText = id;
            document.getElementById('conn-status').innerText = "Status: Online. Share ID with friend.";
        });

        // Receiving a connection
        peer.on('connection', (connection) => {
            conn = connection;
            setupConnListeners();
            opponentRow.style.display = 'block';
            document.getElementById('conn-status').innerText = "Status: Friend Connected!";
            
            // Host sends the quote to the guest
            const sharedQuote = quotes[Math.floor(Math.random() * quotes.length)];
            setTimeout(() => {
                conn.send({ type: 'start', quote: sharedQuote });
                startRace(sharedQuote);
            }, 1000);
        });
    }

    document.getElementById('connect-btn').addEventListener('click', () => {
        const friendId = document.getElementById('friend-id').value;
        if (!friendId) return;
        
        conn = peer.connect(friendId);
        setupConnListeners();
        opponentRow.style.display = 'block';
        document.getElementById('conn-status').innerText = "Status: Connecting...";
    });

    function setupConnListeners() {
        conn.on('open', () => {
            document.getElementById('conn-status').innerText = "Status: Connected! Waiting for host...";
        });

        conn.on('data', (data) => {
            if (data.type === 'start') {
                startRace(data.quote);
            } else if (data.type === 'progress') {
                opponentCar.style.left = `calc(${data.value}% - 30px)`;
            }
        });
    }

    // --- UI Button Handlers ---

    document.getElementById('solo-btn').addEventListener('click', () => {
        opponentRow.style.display = 'none';
        startRace();
    });

    document.getElementById('reset-btn').addEventListener('click', () => {
        location.reload();
    });

</script>
</body>
</html>
