<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TypeRush - High Performance Race</title>
    <style>
        :root {
            --primary: #00f0ff;
            --secondary: #ff007f;
            --bg: #0b0f19;
            --panel: #111827;
            --text: #ffffff;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }
        h1 {
            color: var(--primary);
            margin: 5px 0 15px 0;
            font-style: italic;
            text-transform: lowercase;
            letter-spacing: 3px;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
        }
        .container {
            width: 100%;
            max-width: 750px;
            background: var(--panel);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.08);
            position: relative;
        }
        .lobby, .game-screen {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .hidden { display: none !important; }
        
        button {
            background: linear-gradient(135deg, var(--primary), #0077ff);
            color: #000;
            border: none;
            padding: 14px 20px;
            font-weight: 800;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0, 240, 255, 0.3);
            transition: all 0.2s ease;
        }
        button:active { transform: scale(0.97); }
        
        input {
            padding: 14px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            background: #1f2937;
            color: #fff;
            font-size: 16px;
            flex: 1;
            outline: none;
        }
        input:focus { border-color: var(--primary); box-shadow: 0 0 8px rgba(0,240,255,0.3); }

        /* Animated High-Tech Race Track */
        .track {
            background: linear-gradient(180deg, #131b2e 0%, #0d1322 100%);
            border-radius: 12px;
            padding: 12px;
            position: relative;
            height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            border: 2px solid rgba(0, 240, 255, 0.2);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
            overflow: hidden;
        }
        .lane {
            border-bottom: 2px dashed rgba(255,255,255,0.15);
            position: relative;
            height: 40px;
            display: flex;
            align-items: center;
        }
        .car {
            position: absolute;
            left: 0%;
            font-size: 26px;
            transition: left 0.15s cubic-bezier(0.1, 0.7, 0.3, 1);
            filter: drop-shadow(0 0 5px rgba(255,255,255,0.5));
        }
        .car-label {
            position: absolute;
            right: 8px;
            font-size: 11px;
            font-weight: 700;
            background: rgba(0, 0, 0, 0.7);
            padding: 3px 8px;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* Stats Header Bar */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: bold;
            background: #1f2937;
            padding: 10px 15px;
            border-radius: 8px;
            border-left: 4px solid var(--primary);
        }

        /* Dynamic Typing Field Box */
        .text-display {
            background: #131b2e;
            padding: 18px;
            border-radius: 10px;
            font-size: 18px;
            line-height: 1.7;
            border: 1px solid rgba(255,255,255,0.1);
            max-height: 140px;
            overflow-y: auto;
        }
        .word {
            display: inline-block;
            margin-right: 6px;
            transition: color 0.1s;
        }
        .word.correct { color: #10b981; }
        .word.incorrect { color: #ef4444; text-decoration: underline; }
        .word.current {
            background: rgba(0, 240, 255, 0.2);
            border-radius: 4px;
            padding: 0 4px;
            border-bottom: 2px solid var(--primary);
        }

        /* Mobile Keyboard Trigger Input */
        textarea {
            width: 100%;
            height: 75px;
            background: #1f2937;
            color: #fff;
            border: 2px solid var(--primary);
            border-radius: 8px;
            padding: 12px;
            font-size: 16px;
            resize: none;
            outline: none;
            box-shadow: 0 0 10px rgba(0,240,255,0.2);
        }
    </style>
</head>
<body>

    <h1>typerush</h1>
    
    <div class="container">
        <!-- LOBBY SCREEN -->
        <div id="lobby" class="lobby">
            <h3>Multiplayer & Bot Arena</h3>
            <p style="color: #9ca3af; font-size: 14px; margin-top: 0;">Play with up to 5 friends using a room code or race against intelligent bots.</p>
            
            <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
                <button type="button" onclick="generateRoom()" style="flex: 1;">Generate Room Code</button>
                <span id="roomCodeDisplay" style="font-weight: bold; color: var(--primary); font-size: 20px; letter-spacing: 2px;"></span>
            </div>

            <div style="display: flex; gap: 10px;">
                <input type="text" id="joinCodeInput" placeholder="Enter Room Code (e.g. AB42)" maxlength="6">
                <button type="button" onclick="joinRoom()" style="background: linear-gradient(135deg, #10b981, #059669);">Join Room</button>
            </div>

            <button type="button" onclick="startRaceGame()" style="background: linear-gradient(135deg, #8b5cf6, #6d28d9); color: #fff;">Play with Bots (Solo)</button>
        </div>

        <!-- GAME RACING SCREEN -->
        <div id="gameScreen" class="game-screen hidden">
            <div class="stats-bar">
                <span id="wpmDisplay">⚡ WPM: 0</span>
                <span id="timerDisplay">⏱️ Time: 0.00s</span>
            </div>

            <div class="track" id="trackContainer"></div>

            <div class="text-display" id="textDisplay"></div>
            
            <!-- Tap here on mobile to bring up device keyboard -->
            <textarea id="typingInput" placeholder="Tap here and start typing fast..." disabled autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
        </div>
    </div>

<script>
    const sentences = [
        "that Canada is about 23.5 times bigger than California yet California has more people than all of Canada right now",
        "coding fast requires consistent practice focus and good finger placement on standard home row keys",
        "artificial intelligence and modern web frameworks make building real time browser multiplayer applications seamless"
    ];

    let currentText = "";
    let wordsArr = [];
    let wordIndex = 0;
    let startTime = null;
    let timerInterval = null;
    let isPlaying = false;
    let racers = [];

    function generateRoom() {
        const randomCode = Math.random().toString(36).substring(2, 6).toUpperCase();
        document.getElementById("roomCodeDisplay").innerText = `CODE: ${randomCode}`;
        
        // Smooth transition into game arena with bots simulation
        setTimeout(() => {
            startRaceGame();
        }, 1000);
    }

    function joinRoom() {
        const code = document.getElementById("joinCodeInput").value.trim();
        if (!code) {
            alert("Please type a valid room code first.");
            return;
        }
        alert(`Connected successfully to room: ${code.toUpperCase()}`);
        startRaceGame();
    }

    function startRaceGame() {
        document.getElementById("lobby").classList.add("hidden");
        document.getElementById("gameScreen").classList.remove("hidden");

        currentText = sentences[Math.floor(Math.random() * sentences.length)];
        wordsArr = currentText.split(" ");
        wordIndex = 0;

        const display = document.getElementById("textDisplay");
        display.innerHTML = wordsArr.map((w, i) => `<span class="word ${i === 0 ? 'current' : ''}">${w}</span>`).join("");

        // Up to 4-5 participants (You + 3 Smart Bots)
        racers = [
            { name: "You", progress: 0, speed: 0, type: "player", emoji: "🏎️️" },
            { name: "Bot 1 (Jaguar)", progress: 0, speed: 0.65, type: "bot", emoji: "🚙" },
            { name: "Bot 2 (Super)", progress: 0, speed: 0.58, type: "bot", emoji: "🚗" },
            { name: "Bot 3 (Viper)", progress: 0, speed: 0.52, type: "bot", emoji: "🏎️" }
        ];

        renderTrack();

        // Focus input to prompt mobile software keyboard
        setTimeout(() => {
            const inputField = document.getElementById("typingInput");
            inputField.removeAttribute("disabled");
            inputField.value = "";
            inputField.focus();
            
            startTime = Date.now();
            isPlaying = true;
            timerInterval = setInterval(gameLoop, 80);
        }, 800);
    }

    function renderTrack() {
        const trackContainer = document.getElementById("trackContainer");
        trackContainer.innerHTML = "";
        racers.forEach((racer, index) => {
            trackContainer.innerHTML += `
                <div class="lane">
                    <div class="car" id="car-${index}" style="left: 0%">${racer.emoji}</div>
                    <div class="car-label">#${index + 1} ${racer.name}</div>
                </div>
            `;
        });
    }

    const inputField = document.getElementById("typingInput");
    inputField.addEventListener("input", (e) => {
        if (!isPlaying) return;

        const typedValue = e.target.value;
        const currentWord = wordsArr[wordIndex];

        if (typedValue.endsWith(" ")) {
            const enteredWord = typedValue.trim();
            const wordSpans = document.getElementById("textDisplay").children;

            if (enteredWord === currentWord) {
                wordSpans[wordIndex].classList.remove("current", "incorrect");
                wordSpans[wordIndex].classList.add("correct");
            } else {
                wordSpans[wordIndex].classList.remove("current");
                wordSpans[wordIndex].classList.add("incorrect");
            }

            wordIndex++;
            inputField.value = ""; // Reset box for next word

            if (wordIndex < wordsArr.length) {
                wordSpans[wordIndex].classList.add("current");
                // Auto-scroll text view smoothly
                wordSpans[wordIndex].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            } else {
                finishGame();
            }

            racers[0].progress = (wordIndex / wordsArr.length) * 100;
        }
    });

    function gameLoop() {
        const elapsedTime = (Date.now() - startTime) / 1000;
        document.getElementById("timerDisplay").innerText = `⏱️ Time: ${elapsedTime.toFixed(2)}s`;

        const minutes = elapsedTime / 60;
        const wpm = minutes > 0 ? Math.round((wordIndex / minutes)) : 0;
        document.getElementById("wpmDisplay").innerText = `⚡ WPM: ${wpm}`;

        // Animate bots forward smoothly
        racers.forEach((racer, index) => {
            if (racer.type === "bot" && racer.progress < 100) {
                racer.progress += racer.speed * 0.35;
                if (racer.progress > 100) racer.progress = 100;
            }

            const carEl = document.getElementById(`car-${index}`);
            if (carEl) {
                carEl.style.left = `${Math.min(racer.progress, 88)}%`;
            }
        });

        if (racers[0].progress >= 100) {
            finishGame();
        }
    }

    function finishGame() {
        isPlaying = false;
        clearInterval(timerInterval);
        const inputField = document.getElementById("typingInput");
        inputField.setAttribute("disabled", "true");
        inputField.blur();
        alert("🏁 Race finished successfully! Check your stats.");
    }
</script>

</body>
</html>
