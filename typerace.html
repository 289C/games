<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FastFingers - Type Race</title>
    <style>
        :root {
            --primary: #8b5cf6;
            --secondary: #6d28d9;
            --accent: #00f0ff;
            --bg-overlay: rgba(11, 15, 25, 0.85);
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
            display: flex;
            flex-direction: column;
        }

        /* Top Navigation Bar */
        header {
            background-color: #3d1c1c;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 25px;
            border-bottom: 2px solid rgba(255,255,255,0.1);
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 900;
            font-size: 20px;
            letter-spacing: 1px;
            color: #fff;
            text-transform: uppercase;
        }
        .logo span { color: #f59e0b; }
        nav a {
            color: #ffffff;
            text-decoration: none;
            margin-left: 20px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
            transition: color 0.2s;
        }
        nav a:hover { color: #f59e0b; }

        /* Main Container */
        .main-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card-container {
            width: 100%;
            max-width: 650px;
            background: var(--bg-overlay);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
            border: 1px solid rgba(255,255,255,0.15);
        }

        .hidden { display: none !important; }

        /* Lobby Form Controls layout */
        .lobby-group {
            display: flex;
            gap: 12px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .btn-action {
            background: linear-gradient(135deg, #4338ca, #6d28d9);
            color: #fff;
            border: none;
            padding: 14px 22px;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            flex: 1;
            min-width: 140px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.4);
            box-shadow: 0 4px 12px rgba(67, 56, 202, 0.4);
            transition: transform 0.1s, opacity 0.2s;
        }
        .btn-action:active { transform: scale(0.98); }
        .btn-action.join {
            background: linear-gradient(135deg, #701a75, #a21caf);
            box-shadow: 0 4px 12px rgba(162, 28, 175, 0.4);
        }

        .input-box {
            background: #ffffff;
            color: #111;
            border: none;
            padding: 14px 16px;
            border-radius: 6px;
            font-size: 15px;
            flex: 2;
            outline: none;
            font-weight: 500;
        }
        .input-box::placeholder { color: #6b7280; }

        /* Game Race Arena UI */
        .game-screen { display: flex; flex-direction: column; gap: 20px; }
        
        .stats-header {
            display: flex;
            justify-content: space-between;
            font-size: 16px;
            font-weight: bold;
            background: rgba(17, 24, 39, 0.8);
            padding: 12px 18px;
            border-radius: 8px;
            border-left: 4px solid var(--accent);
        }

        /* Pure Friends Track (No Bots) */
        .track {
            background: rgba(13, 19, 34, 0.9);
            border-radius: 8px;
            padding: 12px;
            min-height: 130px;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            border: 1px solid rgba(0, 240, 255, 0.3);
        }
        .lane {
            position: relative;
            height: 32px;
            border-bottom: 1px dashed rgba(255,255,255,0.15);
            display: flex;
            align-items: center;
        }
        .car {
            position: absolute;
            left: 0%;
            font-size: 22px;
            transition: left 0.15s linear;
        }
        .racer-label {
            position: absolute;
            right: 8px;
            font-size: 11px;
            background: rgba(0,0,0,0.6);
            padding: 2px 6px;
            border-radius: 4px;
            color: #d1d5db;
        }

        /* Text Display & Typing Field */
        .text-display {
            background: rgba(15, 23, 42, 0.95);
            padding: 18px;
            border-radius: 8px;
            font-size: 18px;
            line-height: 1.7;
            max-height: 150px;
            overflow-y: auto;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .word { display: inline-block; margin-right: 6px; }
        .word.correct { color: #10b981; }
        .word.incorrect { color: #ef4444; text-decoration: underline; }
        .word.current { background: rgba(0, 240, 255, 0.25); border-radius: 3px; padding: 0 3px; }

        textarea {
            width: 100%;
            height: 75px;
            background: #1f2937;
            color: #fff;
            border: 2px solid var(--accent);
            border-radius: 8px;
            padding: 12px;
            font-size: 16px;
            resize: none;
            outline: none;
        }
    </style>
</head>
<body>

    <!-- Header styled like reference screenshot -->
    <header>
        <div class="logo">🖐️ <span>FASTFINGERS</span></div>
        <nav>
            <a href="#">HOME</a>
            <a href="#">COMPETE</a>
            <a href="#">CONTACT</a>
        </nav>
    </header>

    <div class="main-wrapper">
        <div class="card-container">
            
            <!-- LOBBY SCREEN -->
            <div id="lobbyScreen">
                <div class="lobby-group">
                    <button class="btn-action" onclick="startNewGame()">New Game</button>
                    <input type="text" id="usernameInput" class="input-box" placeholder="Your Username" value="Player 1">
                </div>

                <div class="lobby-group">
                    <button class="btn-action join" onclick="joinGame()">Join Game</button>
                    <input type="text" id="codeJoinInput" class="input-box" placeholder="Room Code (e.g. F29X)" maxlength="6">
                    <input type="text" id="joinUsernameInput" class="input-box" placeholder="Username">
                </div>
                
                <div id="roomCodeAlert" style="margin-top: 10px; color: var(--accent); font-weight: bold; text-align: center;"></div>
            </div>

            <!-- GAME RACING SCREEN -->
            <div id="gameScreen" class="game-screen hidden">
                <div class="stats-header">
                    <span id="wpmDisplay">⚡ WPM: 0</span>
                    <span id="roomInfoDisplay">Room: SOLO</span>
                    <span id="timerDisplay">⏱️ 0.00s</span>
                </div>

                <!-- Pure Multiplayer Friend Track -->
                <div class="track" id="trackContainer"></div>

                <!-- Dynamic Syntax Text Container -->
                <div class="text-display" id="textDisplay"></div>

                <!-- Mobile Keyboard Input Box -->
                <textarea id="typingInput" placeholder="Tap here to open keyboard and start typing..." disabled autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
            </div>

        </div>
    </div>

<script>
    // Diverse dynamic text syntax bank (new syntax generated every game)
    const syntaxBank = [
        "that Canada is about 23.5 times bigger than California yet California has more people than all of Canada right now",
        "asynchronous programming in modern JavaScript allows developers to handle network requests efficiently without blocking threads",
        "responsive web design ensures that applications scale seamlessly across mobile phones tablets and desktop monitors",
        "cybersecurity protocols protect sensitive user databases from malicious breaches through encryption and secure authentication",
        "artificial intelligence models leverage massive datasets to recognize complex patterns and automate repetitive workflows"
    ];

    let currentText = "";
    let wordsArr = [];
    let wordIndex = 0;
    let startTime = null;
    let timerInterval = null;
    let isPlaying = false;
    let activeRacers = [];

    function getRandomSentence() {
        return syntaxBank[Math.floor(Math.random() * syntaxBank.length)];
    }

    function startNewGame() {
        const username = document.getElementById("usernameInput").value.trim() || "Player";
        const randomRoomCode = Math.random().toString(36).substring(2, 6).toUpperCase();
        
        document.getElementById("roomInfoDisplay").innerText = `Room Code: ${randomRoomCode}`;
        document.getElementById("roomCodeAlert").innerText = `Room Created! Code: ${randomRoomCode}`;
        
        // Setup single/multiplayer session without bots
        activeRacers = [
            { name: username, progress: 0, emoji: "🏎️" },
            { name: "Friend (Waiting...)", progress: 0, emoji: "🚗" }
        ];

        setTimeout(() => {
            launchGameArena();
        }, 800);
    }

    function joinGame() {
        const code = document.getElementById("codeJoinInput").value.trim().toUpperCase();
        const username = document.getElementById("joinUsernameInput").value.trim() || "Guest";

        if (!code) {
            alert("Please enter a valid room code.");
            return;
        }

        document.getElementById("roomInfoDisplay").innerText = `Room: ${code}`;
        
        activeRacers = [
            { name: username, progress: 0, emoji: "🏎️" },
            { name: "Host Player", progress: 0, emoji: "🚙" }
        ];

        launchGameArena();
    }

    function launchGameArena() {
        document.getElementById("lobbyScreen").classList.add("hidden");
        document.getElementById("gameScreen").classList.remove("hidden");

        // Generate brand new unique syntax for this game round
        currentText = getRandomSentence();
        wordsArr = currentText.split(" ");
        wordIndex = 0;

        // Render syntax words
        const display = document.getElementById("textDisplay");
        display.innerHTML = wordsArr.map((w, i) => `<span class="word ${i === 0 ? 'current' : ''}">${w}</span>`).join("");

        renderTrackLanes();

        // Focus input to prompt mobile software keyboard automatically
        setTimeout(() => {
            const inputField = document.getElementById("typingInput");
            inputField.removeAttribute("disabled");
            inputField.value = "";
            inputField.focus();

            startTime = Date.now();
            isPlaying = true;
            timerInterval = setInterval(gameLoop, 100);
        }, 600);
    }

    function renderTrackLanes() {
        const trackContainer = document.getElementById("trackContainer");
        trackContainer.innerHTML = "";
        activeRacers.forEach((racer, idx) => {
            trackContainer.innerHTML += `
                <div class="lane">
                    <div class="car" id="racer-car-${idx}" style="left: 0%">${racer.emoji}</div>
                    <div class="racer-label">${racer.name}</div>
                </div>
            `;
        });
    }

    const inputField = document.getElementById("typingInput");
    inputField.addEventListener("input", (e) => {
        if (!isPlaying) return;

        const typedValue = e.target.value;
        const currentWord = wordsArr[wordIndex];

        if (typedValue.endsWith(" ")) {
            const enteredWord = typedValue.trim();
            const wordSpans = document.getElementById("textDisplay").children;

            if (enteredWord === currentWord) {
                wordSpans[wordIndex].classList.remove("current", "incorrect");
                wordSpans[wordIndex].classList.add("correct");
            } else {
                wordSpans[wordIndex].classList.remove("current");
                wordSpans[wordIndex].classList.add("incorrect");
            }

            wordIndex++;
            inputField.value = ""; // Clear input for next word

            if (wordIndex < wordsArr.length) {
                wordSpans[wordIndex].classList.add("current");
                wordSpans[wordIndex].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            } else {
                endGameSession();
            }

            // Update player track progress
            activeRacers[0].progress = (wordIndex / wordsArr.length) * 100;
        }
    });

    function gameLoop() {
        const elapsedTime = (Date.now() - startTime) / 1000;
        document.getElementById("timerDisplay").innerText = `⏱️️ ${elapsedTime.toFixed(2)}s`;

        const minutes = elapsedTime / 60;
        const wpm = minutes > 0 ? Math.round((wordIndex / minutes)) : 0;
        document.getElementById("wpmDisplay").innerText = `⚡ WPM: ${wpm}`;

        // Render car positioning on track
        activeRacers.forEach((racer, idx) => {
            const carEl = document.getElementById(`racer-car-${idx}`);
            if (carEl) {
                carEl.style.left = `${Math.min(racer.progress, 88)}%`;
            }
        });

        if (activeRacers[0].progress >= 100) {
            endGameSession();
        }
    }

    function endGameSession() {
        isPlaying = false;
        clearInterval(timerInterval);
        const inputField = document.getElementById("typingInput");
        inputField.setAttribute("disabled", "true");
        inputField.blur();
        alert("🏁 Race Complete! Great performance.");
    }
</script>

</body>
</html>
