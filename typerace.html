<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2-Player TypeRacer</title>
    <style>
        :root { --primary: #4a90e2; --bg: #f4f7f6; --success: #2ecc71; --error: #e74c3c; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); display: flex; justify-content: center; padding: 20px; margin: 0; }
        .container { background: white; width: 100%; max-width: 700px; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: var(--primary); }
        
        .screen { display: none; }
        .active { display: block; }

        .menu-grid { display: grid; gap: 15px; }
        button { padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; background: var(--primary); color: white; transition: 0.3s; }
        button:hover { opacity: 0.9; transform: translateY(-1px); }
        button:disabled { background: #ccc; }

        input { padding: 12px; border: 2px solid #ddd; border-radius: 8px; margin-bottom: 10px; width: 100%; box-sizing: border-box; }

        /* Racing Track */
        .track { background: #eee; padding: 15px; border-radius: 10px; margin: 20px 0; }
        .lane { height: 45px; position: relative; border-bottom: 1px dashed #ccc; display: flex; align-items: center; }
        .lane:last-child { border-bottom: none; }
        .car { position: absolute; font-size: 24px; transition: left 0.2s linear; z-index: 5; }
        .label { position: absolute; font-size: 10px; top: -12px; background: #333; color: white; padding: 2px 5px; border-radius: 3px; }

        /* Text Area */
        #text-display { font-size: 1.3rem; line-height: 1.6; margin-bottom: 15px; padding: 15px; background: #fafafa; border-radius: 8px; user-select: none; }
        .correct { color: var(--success); }
        .wrong { background: #ffcdd2; color: var(--error); }
        #typing-input { width: 100%; padding: 15px; font-size: 1.1rem; border: 2px solid #ddd; border-radius: 8px; }

        .status-box { background: #e3f2fd; padding: 15px; border-radius: 8px; text-align: center; margin-bottom: 15px; }
        .stats-row { display: flex; justify-content: space-around; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>🏎️ TypeRacer</h1>

    <!-- MAIN MENU -->
    <div id="menu-screen" class="screen active">
        <div class="menu-grid">
            <button onclick="startSinglePlayer()">Single Player Mode</button>
            <hr style="width: 100%; border: 0; border-top: 1px solid #eee;">
            <button onclick="showScreen('lobby-screen')" style="background: #673ab7;">Play with a Friend (2 Players)</button>
        </div>
    </div>

    <!-- LOBBY SCREEN -->
    <div id="lobby-screen" class="screen">
        <div class="menu-grid">
            <button onclick="createRoom()">Create New Room</button>
            <div style="margin-top: 10px;">
                <input type="text" id="join-code" placeholder="Enter Friend's Code">
                <button onclick="joinRoom()" style="width: 100%; background: #2ecc71;">Join Friend</button>
            </div>
            <button onclick="showScreen('menu-screen')" style="background:#777;">Back</button>
        </div>

        <div id="room-status" class="status-box" style="display:none; margin-top: 20px;">
            <p>Room Code: <strong id="display-code" style="font-size: 1.4rem; color: var(--primary);">---</strong></p>
            <p id="wait-msg">Waiting for friend to join...</p>
            <button id="start-btn" style="display:none; width: 100%;" onclick="triggerStart()">Start Race</button>
        </div>
    </div>

    <!-- GAME SCREEN -->
    <div id="game-screen" class="screen">
        <div class="track" id="track">
            <!-- Lanes injected here -->
        </div>
        <div id="text-display"></div>
        <input type="text" id="typing-input" autocomplete="off" placeholder="Wait for start..." disabled>
        
        <div class="stats-row">
            <div>WPM: <span id="stat-wpm">0</span></div>
            <div>Time: <span id="stat-time">0</span>s</div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
    import { getDatabase, ref, set, onValue, update, get } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";

    // YOUR FIREBASE CONFIG
    const firebaseConfig = {
        apiKey: "AIzaSyBzLchy5M2fLne4c7Ghw1KNN8wVrlZdd8M",
        authDomain: "friendsgame-872f5.firebaseapp.com",
        databaseURL: "https://friendsgame-872f5-default-rtdb.firebaseio.com",
        projectId: "friendsgame-872f5",
        storageBucket: "friendsgame-872f5.firebasestorage.app",
        messagingSenderId: "522534013233",
        appId: "1:522534013233:web:f5faa6e6795023d0420810"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const quotes = [
        "The best way to get started is to quit talking and begin doing.",
        "Don't let yesterday take up too much of today.",
        "You learn more from failure than from success.",
        "It's not whether you get knocked down, it's whether you get up.",
        "Whether you think you can or think you can't, you're right."
    ];

    let myId = "p" + Math.floor(Math.random() * 9999);
    let currentRoom = null;
    let targetQuote = "";
    let isMultiplayer = false;
    let startTime;
    let timerInterval;

    // --- Navigation ---
    window.showScreen = (id) => {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    };

    // --- Single Player Logic ---
    window.startSinglePlayer = () => {
        isMultiplayer = false;
        targetQuote = quotes[Math.floor(Math.random() * quotes.length)];
        setupGameUI({ [myId]: { name: "You", progress: 0 } });
        beginRace();
    };

    // --- Multiplayer Logic ---
    window.createRoom = async () => {
        const code = Math.random().toString(36).substring(2, 7).toUpperCase();
        currentRoom = code;
        isMultiplayer = true;

        await set(ref(db, `rooms/${code}`), {
            status: 'waiting',
            quote: quotes[Math.floor(Math.random() * quotes.length)],
            players: {
                [myId]: { name: "Host", progress: 0 }
            }
        });

        document.getElementById('room-status').style.display = 'block';
        document.getElementById('display-code').innerText = code;
        listenToRoom(code);
    };

    window.joinRoom = async () => {
        const code = document.getElementById('join-code').value.toUpperCase();
        if(!code) return;

        const roomRef = ref(db, `rooms/${code}`);
        const snap = await get(roomRef);

        if (snap.exists()) {
            const data = snap.val();
            const playerCount = Object.keys(data.players || {}).length;

            if (playerCount >= 2) {
                alert("Room is full! Only 2 players allowed.");
                return;
            }

            currentRoom = code;
            isMultiplayer = true;
            await update(ref(db, `rooms/${code}/players/${myId}`), { name: "Guest", progress: 0 });
            
            document.getElementById('room-status').style.display = 'block';
            document.getElementById('display-code').innerText = code;
            document.getElementById('wait-msg').innerText = "Connected! Waiting for Host to start...";
            listenToRoom(code);
        } else {
            alert("Room not found.");
        }
    };

    function listenToRoom(code) {
        onValue(ref(db, `rooms/${code}`), (snap) => {
            const data = snap.val();
            if (!data) return;

            const players = data.players;
            const count = Object.keys(players).length;

            // Host Logic: Show start button when Guest joins
            if (count === 2 && players[myId].name === "Host" && data.status === 'waiting') {
                document.getElementById('start-btn').style.display = 'block';
                document.getElementById('wait-msg').innerText = "Friend Joined! Ready to Race.";
            }

            // Sync Game Start
            if (data.status === 'racing' && !startTime) {
                targetQuote = data.quote;
                setupGameUI(players);
                beginRace();
            }

            // Sync Opponent Progress
            if (data.status === 'racing') {
                Object.keys(players).forEach(id => {
                    const car = document.getElementById(`car-${id}`);
                    if (car) car.style.left = `calc(${players[id].progress}% - 30px)`;
                });
            }
        });
    }

    window.triggerStart = () => {
        update(ref(db, `rooms/${currentRoom}`), { status: 'racing' });
    };

    // --- Game Engine ---
    function setupGameUI(players) {
        showScreen('game-screen');
        const track = document.getElementById('track');
        track.innerHTML = '';

        Object.keys(players).forEach(id => {
            const lane = document.createElement('div');
            lane.className = 'lane';
            lane.innerHTML = `
                <div class="car" id="car-${id}">
                    <span class="label">${players[id].name}</span>
                    🏎️
                </div>`;
            track.appendChild(lane);
        });

        const display = document.getElementById('text-display');
        display.innerHTML = '';
        targetQuote.split('').forEach(char => {
            const span = document.createElement('span');
            span.innerText = char;
            display.appendChild(span);
        });
    }

    function beginRace() {
        const input = document.getElementById('typing-input');
        input.disabled = false;
        input.value = '';
        input.focus();
        startTime = new Date();

        timerInterval = setInterval(() => {
            const elapsed = Math.floor((new Date() - startTime) / 1000);
            document.getElementById('stat-time').innerText = elapsed;
        }, 1000);

        input.addEventListener('input', handleTyping);
    }

    function handleTyping() {
        const input = document.getElementById('typing-input');
        const val = input.value;
        const spans = document.querySelectorAll('#text-display span');
        let correctCount = 0;
        let error = false;

        spans.forEach((span, i) => {
            const char = val[i];
            if (char == null) {
                span.className = '';
            } else if (char === span.innerText && !error) {
                span.className = 'correct';
                correctCount++;
            } else {
                span.className = 'wrong';
                error = true;
            }
        });

        const progress = (correctCount / targetQuote.length) * 100;
        
        // Update Local Car
        document.getElementById(`car-${myId}`).style.left = `calc(${progress}% - 30px)`;

        // Sync to Firebase
        if (isMultiplayer) {
            update(ref(db, `rooms/${currentRoom}/players/${myId}`), { progress: progress });
        }

        // Stats
        const words = val.trim().split(/\s+/).length;
        const mins = (new Date() - startTime) / 60000;
        document.getElementById('stat-wpm').innerText = Math.round(words / mins) || 0;

        // Finish
        if (correctCount === targetQuote.length) {
            clearInterval(timerInterval);
            input.disabled = true;
            alert("Finished! WPM: " + document.getElementById('stat-wpm').innerText);
            location.reload(); 
        }
    }
</script>
</body>
</html>
