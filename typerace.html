<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TypeRacer Pro: Categories & Custom</title>
    <style>
        :root {
            --primary: #4a90e2; --bg: #f4f7f6; --card: #ffffff; --text: #333;
            --track: #e0e0e0; --success: #2ecc71; --error: #e74c3c; --accent: #f39c12;
        }
        [data-theme="dark"] {
            --bg: #1a1a2e; --card: #16213e; --text: #e9e9e9; --track: #0f3460; --primary: #4ecca3;
        }

        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; padding: 20px; margin: 0; transition: 0.3s; }
        .container { background: var(--card); width: 100%; max-width: 800px; padding: 30px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); position: relative; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .screen { display: none; }
        .active { display: block; }

        /* Buttons & Inputs */
        button { padding: 12px 20px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; background: var(--primary); color: white; transition: 0.2s; }
        button:hover { filter: brightness(1.1); transform: translateY(-2px); }
        select, input, textarea { 
            padding: 12px; border: 2px solid var(--track); border-radius: 10px; 
            background: var(--card); color: var(--text); width: 100%; box-sizing: border-box; margin-bottom: 10px;
        }

        /* Avatar & Categories */
        .grid-options { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: 15px 0; }
        .avatar-picker { display: flex; gap: 10px; justify-content: center; margin-bottom: 15px; }
        .avatar-opt { font-size: 1.8rem; cursor: pointer; padding: 8px; border-radius: 10px; border: 2px solid transparent; }
        .avatar-opt.selected { border-color: var(--primary); background: rgba(74, 144, 226, 0.1); }

        /* Track */
        .track { background: var(--track); padding: 15px; border-radius: 15px; margin: 20px 0; position: relative; }
        .lane { height: 50px; position: relative; border-bottom: 1px dashed rgba(0,0,0,0.1); display: flex; align-items: center; }
        .car { position: absolute; font-size: 28px; transition: left 0.3s linear; z-index: 10; }
        .label { position: absolute; font-size: 10px; top: -15px; background: var(--primary); color: white; padding: 2px 5px; border-radius: 4px; }
        .finish-line { position: absolute; right: 0; top: 0; bottom: 0; width: 20px; background: repeating-linear-gradient(black 0 5px, white 5px 10px); opacity: 0.2; }

        /* Typing Area */
        #text-display { font-size: 1.3rem; line-height: 1.6; padding: 20px; background: rgba(0,0,0,0.03); border-radius: 12px; margin-bottom: 15px; min-height: 80px; }
        .correct { color: var(--success); }
        .wrong { background: var(--error); color: white; }
        #typing-input { font-size: 1.2rem; border-width: 3px; }

        /* Modal Scoreboard */
        .modal-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 1000; 
        }
        .modal { background: var(--card); padding: 30px; border-radius: 20px; width: 90%; max-width: 500px; text-align: center; }
        .score-row { display: flex; justify-content: space-between; padding: 15px; border-bottom: 1px solid var(--track); }
        .winner { color: var(--success); font-weight: bold; font-size: 1.5rem; margin-bottom: 20px; }

        .countdown-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); font-size: 6rem; font-weight: 900; color: var(--primary); z-index: 100; display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>🏎️ TypeRacer Pro</h2>
        <button onclick="toggleTheme()">🌓</button>
    </div>

    <!-- MENU SCREEN -->
    <div id="menu-screen" class="screen active">
        <div class="avatar-picker">
            <div class="avatar-opt selected" onclick="pickAvatar(this, '🏎️')">🏎️</div>
            <div class="avatar-opt" onclick="pickAvatar(this, '🚀')">🚀</div>
            <div class="avatar-opt" onclick="pickAvatar(this, '🏍️')">🏍️</div>
            <div class="avatar-opt" onclick="pickAvatar(this, '🦄')">🦄</div>
            <div class="avatar-opt" onclick="pickAvatar(this, '🛸')">🛸</div>
        </div>

        <label>Select Category:</label>
        <select id="category-select">
            <option value="easy">Easy (Short Sentences)</option>
            <option value="hard">Hard (Advanced Vocabulary)</option>
            <option value="coding">Coding (JS/HTML/CSS Snippets)</option>
            <option value="movies">Famous Movie Quotes</option>
            <option value="custom">-- Custom Text --</option>
        </select>

        <textarea id="custom-text" placeholder="Paste your custom text here (only used if Custom category is selected)..." style="height: 80px; display: none;"></textarea>

        <div class="grid-options">
            <button onclick="startMode('solo')">Solo Practice</button>
            <button onclick="showScreen('lobby-screen')" style="background: #673ab7;">Play Friend</button>
        </div>
    </div>

    <!-- LOBBY SCREEN -->
    <div id="lobby-screen" class="screen">
        <input type="text" id="join-code" placeholder="Enter Room Code">
        <div class="grid-options">
            <button onclick="createRoom()">Create Room</button>
            <button onclick="joinRoom()" style="background:#2ecc71;">Join Room</button>
        </div>
        <div id="room-status" style="display:none; text-align:center; margin-top:20px; padding:15px; border-radius:10px; background:rgba(0,0,0,0.05);">
            <p>Room: <strong id="display-code" style="letter-spacing:2px; font-size:1.2rem;">---</strong></p>
            <p id="wait-msg">Waiting for opponent...</p>
            <button id="start-btn" style="display:none; width:100%; background:#f39c12;" onclick="hostTriggerCountdown()">START 3-2-1 COUNTDOWN</button>
        </div>
        <button onclick="location.reload()" style="background:#777; width:100%; margin-top:10px;">Back</button>
    </div>

    <!-- GAME SCREEN -->
    <div id="game-screen" class="screen" style="position:relative;">
        <div id="count-num" class="countdown-overlay">3</div>
        <div class="track" id="track"></div>
        <div id="text-display"></div>
        <input type="text" id="typing-input" autocomplete="off" disabled placeholder="Wait for GO!">
        <div style="display:flex; justify-content: space-around; margin-top:15px; font-weight:bold;">
            <div>WPM: <span id="stat-wpm">0</span></div>
            <div>Acc: <span id="stat-acc">100</span>%</div>
        </div>
    </div>
</div>

<!-- SCOREBOARD MODAL -->
<div id="score-modal" class="modal-overlay">
    <div class="modal">
        <div id="winner-text" class="winner">Race Finished!</div>
        <div id="scoreboard-content"></div>
        <button onclick="location.reload()" style="margin-top:20px; width:100%;">Play Again</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
    import { getDatabase, ref, set, onValue, update, get, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBzLchy5M2fLne4c7Ghw1KNN8wVrlZdd8M",
        authDomain: "friendsgame-872f5.firebaseapp.com",
        databaseURL: "https://friendsgame-872f5-default-rtdb.firebaseio.com",
        projectId: "friendsgame-872f5",
        storageBucket: "friendsgame-872f5.firebasestorage.app",
        messagingSenderId: "522534013233",
        appId: "1:522534013233:web:f5faa6e6795023d0420810"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const quoteLib = {
        easy: ["Life is short.", "The sky is blue.", "I love to code.", "Type fast to win."],
        hard: ["Phenomenal cosmic power, itty bitty living space.", "The juxtaposition of complex algorithms is daunting.", "Inquisitive minds explore the depths of philosophy."],
        coding: ["for(let i=0; i<arr.length; i++) { console.log(arr[i]); }", "document.getElementById('app').innerHTML = 'Hello';", "<div class='flex-container'></div>"],
        movies: ["May the Force be with you.", "I'm going to make him an offer he can't refuse.", "Here's looking at you, kid."]
    };

    let myId = "p" + Math.floor(Math.random() * 9999);
    let myAvatar = "🏎️";
    let currentRoom = null;
    let targetQuote = "";
    let isHost = false;
    let startTime, timerInterval;
    let totalCharsPressed = 0;
    let errorCount = 0;

    // --- Logic ---
    window.toggleTheme = () => {
        const t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', t);
    };

    document.getElementById('category-select').onchange = (e) => {
        document.getElementById('custom-text').style.display = e.target.value === 'custom' ? 'block' : 'none';
    };

    window.pickAvatar = (el, icon) => {
        document.querySelectorAll('.avatar-opt').forEach(o => o.classList.remove('selected'));
        el.classList.add('selected');
        myAvatar = icon;
    };

    window.showScreen = (id) => {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    };

    // --- Multiplayer ---
    window.createRoom = async () => {
        const cat = document.getElementById('category-select').value;
        const custom = document.getElementById('custom-text').value;
        const quote = cat === 'custom' ? custom : quoteLib[cat][Math.floor(Math.random()*quoteLib[cat].length)];
        
        if(!quote) return alert("Please enter custom text first.");

        const code = Math.random().toString(36).substring(2, 7).toUpperCase();
        currentRoom = code; isHost = true;
        await set(ref(db, `rooms/${code}`), {
            status: 'waiting',
            quote: quote,
            players: { [myId]: { name: "Host", avatar: myAvatar, progress: 0, wpm: 0, acc: 100, finished: false } }
        });
        document.getElementById('room-status').style.display = 'block';
        document.getElementById('display-code').innerText = code;
        listenRoom(code);
    };

    window.joinRoom = async () => {
        const code = document.getElementById('join-code').value.toUpperCase().trim();
        const snap = await get(ref(db, `rooms/${code}`));
        if (snap.exists()) {
            currentRoom = code; isHost = false;
            await update(ref(db, `rooms/${code}/players/${myId}`), { name: "Guest", avatar: myAvatar, progress: 0, wpm: 0, acc: 100, finished: false });
            document.getElementById('room-status').style.display = 'block';
            document.getElementById('display-code').innerText = code;
            listenRoom(code);
        } else alert("Room not found");
    };

    function listenRoom(code) {
        onValue(ref(db, `rooms/${code}`), (snap) => {
            const data = snap.val(); if (!data) return;
            const players = data.players;
            
            if (isHost && Object.keys(players).length === 2 && data.status === 'waiting') {
                document.getElementById('start-btn').style.display = 'block';
                document.getElementById('wait-msg').innerText = "Friend joined!";
            }

            if (data.status === 'countdown' && !startTime) {
                targetQuote = data.quote;
                startRaceSequence(players);
            }

            if (data.status === 'racing' || data.status === 'finished') {
                Object.keys(players).forEach(id => {
                    const c = document.getElementById(`car-${id}`);
                    if (c) c.style.left = `calc(${players[id].progress}% - 35px)`;
                });
            }

            // Show scoreboard when both finish
            const allFinished = Object.values(players).every(p => p.finished);
            if (allFinished) showScoreboard(players);
        });
    }

    window.hostTriggerCountdown = () => update(ref(db, `rooms/${currentRoom}`), { status: 'countdown' });

    // --- Game Logic ---
    window.startMode = (mode) => {
        const cat = document.getElementById('category-select').value;
        const custom = document.getElementById('custom-text').value;
        targetQuote = cat === 'custom' ? custom : quoteLib[cat][Math.floor(Math.random()*quoteLib[cat].length)];
        if(!targetQuote) return alert("Enter custom text");
        startRaceSequence({ [myId]: { name: "You", avatar: myAvatar, progress: 0 } });
    };

    function startRaceSequence(players) {
        showScreen('game-screen');
        const tr = document.getElementById('track'); tr.innerHTML = '<div class="finish-line"></div>';
        Object.keys(players).forEach(id => {
            const lane = document.createElement('div'); lane.className = 'lane';
            lane.innerHTML = `<div class="car" id="car-${id}"><span class="label">${players[id].name}</span>${players[id].avatar}</div>`;
            tr.appendChild(lane);
        });

        const td = document.getElementById('text-display'); td.innerHTML = '';
        targetQuote.split('').forEach(c => { const s = document.createElement('span'); s.innerText = c; td.appendChild(s); });

        const countDiv = document.getElementById('count-num');
        countDiv.style.display = 'block';
        let c = 3;
        const t = setInterval(() => {
            if(c > 0) countDiv.innerText = c;
            else if(c === 0) { countDiv.innerText = "GO!"; initInput(); }
            else { countDiv.style.display = 'none'; clearInterval(t); }
            c--;
        }, 1000);
    }

    function initInput() {
        const inp = document.getElementById('typing-input');
        inp.disabled = false; inp.value = ''; inp.focus();
        startTime = new Date();
        timerInterval = setInterval(() => {
            document.getElementById('stat-time').innerText = Math.floor((new Date() - startTime)/1000);
        }, 1000);
        inp.oninput = handleTyping;
    }

    function handleTyping() {
        const inp = document.getElementById('typing-input');
        const spans = document.querySelectorAll('#text-display span');
        let correct = 0, error = false;
        totalCharsPressed++;

        spans.forEach((s, i) => {
            const char = inp.value[i];
            if (char == null) s.className = '';
            else if (char === s.innerText && !error) { s.className = 'correct'; correct++; }
            else { s.className = 'wrong'; if(i === inp.value.length-1) errorCount++; error = true; }
        });

        const prog = (correct / targetQuote.length) * 100;
        const wpm = Math.round((inp.value.length / 5) / ((new Date() - startTime) / 60000)) || 0;
        const acc = Math.max(0, Math.round(((totalCharsPressed - errorCount) / totalCharsPressed) * 100));
        
        document.getElementById('stat-wpm').innerText = wpm;
        document.getElementById('stat-acc').innerText = acc;

        if (currentRoom) {
            update(ref(db, `rooms/${currentRoom}/players/${myId}`), { progress: prog, wpm: wpm, acc: acc, finished: correct === targetQuote.length });
        } else {
            document.getElementById(`car-${myId}`).style.left = `calc(${prog}% - 35px)`;
            if(correct === targetQuote.length) showScoreboard({ [myId]: { name: "You", wpm, acc } });
        }

        if (correct === targetQuote.length) {
            clearInterval(timerInterval);
            inp.disabled = true;
            if(currentRoom) update(ref(db, `rooms/${currentRoom}`), { status: 'finished' });
        }
    }

    function showScoreboard(players) {
        const modal = document.getElementById('score-modal');
        const content = document.getElementById('scoreboard-content');
        modal.style.display = 'flex';
        content.innerHTML = '';
        
        let sorted = Object.values(players).sort((a,b) => b.wpm - a.wpm);
        document.getElementById('winner-text').innerText = sorted[0].name + " Wins!";

        sorted.forEach(p => {
            content.innerHTML += `
                <div class="score-row">
                    <span>${p.avatar} <strong>${p.name}</strong></span>
                    <span>${p.wpm} WPM / ${p.acc}% Acc</span>
                </div>`;
        });
    }
</script>
</body>
</html>
