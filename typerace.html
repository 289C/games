<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FastFingers - Type Race</title>
    <style>
        :root {
            --primary: #8b5cf6;
            --accent: #00f0ff;
            --bg-overlay: rgba(11, 15, 25, 0.88);
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
            display: flex;
            flex-direction: column;
        }

        /* Top Navigation Bar */
        header {
            background-color: #3d1c1c;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 25px;
            border-bottom: 2px solid rgba(255,255,255,0.1);
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 900;
            font-size: 20px;
            letter-spacing: 1px;
            color: #fff;
            text-transform: uppercase;
        }
        .logo span { color: #f59e0b; }
        nav a {
            color: #ffffff;
            text-decoration: none;
            margin-left: 20px;
            font-size: 14px;
            font-weight: 600;
            transition: color 0.2s;
        }
        nav a:hover { color: #f59e0b; }

        /* Main Container */
        .main-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card-container {
            width: 100%;
            max-width: 650px;
            background: var(--bg-overlay);
            backdrop-filter: blur(12px);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
            border: 1px solid rgba(255,255,255,0.15);
        }
        .hidden { display: none !important; }

        /* Lobby Form Controls */
        .lobby-group {
            display: flex;
            gap: 12px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .btn-action {
            background: linear-gradient(135deg, #4338ca, #6d28d9);
            color: #fff;
            border: none;
            padding: 14px 22px;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            flex: 1;
            min-width: 140px;
            box-shadow: 0 4px 12px rgba(67, 56, 202, 0.4);
        }
        .btn-action.join {
            background: linear-gradient(135deg, #701a75, #a21caf);
            box-shadow: 0 4px 12px rgba(162, 28, 175, 0.4);
        }
        .input-box {
            background: #ffffff;
            color: #111;
            border: none;
            padding: 14px 16px;
            border-radius: 6px;
            font-size: 15px;
            flex: 2;
            outline: none;
            font-weight: 500;
        }
        .input-box::placeholder { color: #6b7280; }

        /* Game Race Arena UI */
        .game-screen { display: flex; flex-direction: column; gap: 18px; }
        .stats-header {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            font-size: 13px;
            font-weight: bold;
            background: rgba(17, 24, 39, 0.85);
            padding: 10px 14px;
            border-radius: 8px;
            border-left: 4px solid var(--accent);
            text-align: center;
        }

        /* Pure Friends Track (No Bots) */
        .track {
            background: rgba(13, 19, 34, 0.9);
            border-radius: 8px;
            padding: 10px;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            border: 1px solid rgba(0, 240, 255, 0.3);
        }
        .lane {
            position: relative;
            height: 30px;
            border-bottom: 1px dashed rgba(255,255,255,0.15);
            display: flex;
            align-items: center;
        }
        .car {
            position: absolute;
            left: 0%;
            font-size: 20px;
            transition: left 0.15s linear;
        }
        .racer-label {
            position: absolute;
            right: 8px;
            font-size: 11px;
            background: rgba(0,0,0,0.6);
            padding: 2px 6px;
            border-radius: 4px;
            color: #d1d5db;
        }

        /* Text Display & Typing Field */
        .text-display {
            background: rgba(15, 23, 42, 0.95);
            padding: 16px;
            border-radius: 8px;
            font-size: 17px;
            line-height: 1.7;
            max-height: 140px;
            overflow-y: auto;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .word { display: inline-block; margin-right: 6px; }
        .word.correct { color: #10b981; }
        .word.incorrect { color: #ef4444; text-decoration: underline; }
        .word.current { background: rgba(0, 240, 255, 0.25); border-radius: 3px; padding: 0 3px; }

        textarea {
            width: 100%;
            height: 75px;
            background: #1f2937;
            color: #fff;
            border: 2px solid var(--accent);
            border-radius: 8px;
            padding: 12px;
            font-size: 16px;
            resize: none;
            outline: none;
        }

        /* Result Modal Overlay */
        .result-box {
            background: rgba(17, 24, 39, 0.95);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            border: 2px solid var(--accent);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">🖐️ <span>FASTFINGERS</span></div>
        <nav>
            <a href="#">HOME</a>
            <a href="#">COMPETE</a>
            <a href="#">CONTACT</a>
        </nav>
    </header>

    <div class="main-wrapper">
        <div class="card-container">
            
            <!-- LOBBY SCREEN -->
            <div id="lobbyScreen">
                <div class="lobby-group">
                    <button class="btn-action" onclick="generateNewGame()">New Game</button>
                    <input type="text" id="usernameInput" class="input-box" placeholder="Your Username" value="Player 1">
                </div>

                <div class="lobby-group">
                    <button class="btn-action join" onclick="joinGameCode()">Join Game</button>
                    <input type="text" id="codeJoinInput" class="input-box" placeholder="Room Code (e.g. F29X)" maxlength="6">
                    <input type="text" id="joinUsernameInput" class="input-box" placeholder="Username">
                </div>
                
                <div id="roomCodeAlert" style="margin-top: 10px; color: var(--accent); font-weight: bold; text-align: center;"></div>
            </div>

            <!-- GAME RACING SCREEN -->
            <div id="gameScreen" class="game-screen hidden">
                <div class="stats-header">
                    <span id="wpmDisplay">⚡ WPM: 0</span>
                    <span id="accDisplay">🎯 Acc: 100%</span>
                    <span id="mistakeDisplay">❌ Errors: 0</span>
                    <span id="timerDisplay">⏱️ 0.00s</span>
                </div>

                <div class="track" id="trackContainer"></div>

                <div class="text-display" id="textDisplay"></div>

                <textarea id="typingInput" placeholder="Tap here to open keyboard and start typing..." disabled autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
                
                <div id="resultModal" class="result-box hidden">
                    <h3>🎉 Race Finished!</h3>
                    <p id="finalStatsText"></p>
                    <button class="btn-action" onclick="location.reload()">Play Again</button>
                </div>
            </div>

        </div>
    </div>

<script>
    const syntaxBank = [
        "that Canada is about 23.5 times bigger than California yet California has more people than all of Canada right now",
        "asynchronous programming in modern JavaScript allows developers to handle network requests efficiently without blocking threads",
        "responsive web design ensures that applications scale seamlessly across mobile phones tablets and desktop monitors",
        "cybersecurity protocols protect sensitive user databases from malicious breaches through encryption and secure authentication",
        "artificial intelligence models leverage massive datasets to recognize complex patterns and automate repetitive workflows"
    ];

    let currentText = "";
    let wordsArr = [];
    let wordIndex = 0;
    let startTime = null;
    let timerInterval = null;
    let isPlaying = false;
    let totalMistakes = 0;
    let totalTypedChars = 0;
    let activeRacers = [];

    function generateNewGame() {
        const username = document.getElementById("usernameInput").value.trim() || "Player 1";
        const randomRoomCode = Math.random().toString(36).substring(2, 6).toUpperCase();
        
        document.getElementById("roomCodeAlert").innerText = `Room Generated! Code: ${randomRoomCode} (Share with friends)`;
        
        activeRacers = [
            { name: username, progress: 0, emoji: "🏎️" },
            { name: "Friend Slot", progress: 0, emoji: "🚗" }
        ];

        setTimeout(launchGameArena, 700);
    }

    function joinGameCode() {
        const code = document.getElementById("codeJoinInput").value.trim().toUpperCase();
        const username = document.getElementById("joinUsernameInput").value.trim() || "Guest";

        if (!code) {
            alert("Please enter a valid room code to join.");
            return;
        }

        activeRacers = [
            { name: username, progress: 0, emoji: "🏎️" },
            { name: "Room Host", progress: 0, emoji: "🚙" }
        ];

        launchGameArena();
    }

    function launchGameArena() {
        document.getElementById("lobbyScreen").classList.add("hidden");
        document.getElementById("gameScreen").classList.remove("hidden");

        // Fresh syntax generated for each game instance
        currentText = syntaxBank[Math.floor(Math.random() * syntaxBank.length)];
        wordsArr = currentText.split(" ");
        wordIndex = 0;
        totalMistakes = 0;
        totalTypedChars = 0;

        const display = document.getElementById("textDisplay");
        display.innerHTML = wordsArr.map((w, i) => `<span class="word ${i === 0 ? 'current' : ''}">${w}</span>`).join("");

        renderTrackLanes();

        setTimeout(() => {
            const inputField = document.getElementById("typingInput");
            inputField.removeAttribute("disabled");
            inputField.value = "";
            inputField.focus();

            startTime = Date.now();
            isPlaying = true;
            timerInterval = setInterval(gameLoop, 100);
        }, 500);
    }

    function renderTrackLanes() {
        const trackContainer = document.getElementById("trackContainer");
        trackContainer.innerHTML = "";
        activeRacers.forEach((racer, idx) => {
            trackContainer.innerHTML += `
                <div class="lane">
                    <div class="car" id="racer-car-${idx}" style="left: 0%">${racer.emoji}</div>
                    <div class="racer-label">${racer.name}</div>
                </div>
            `;
        });
    }

    const inputField = document.getElementById("typingInput");
    inputField.addEventListener("input", (e) => {
        if (!isPlaying) return;

        const typedValue = e.target.value;
        const currentWord = wordsArr[wordIndex];

        if (typedValue.endsWith(" ")) {
            const enteredWord = typedValue.trim();
            const wordSpans = document.getElementById("textDisplay").children;
            totalTypedChars += enteredWord.length + 1;

            if (enteredWord === currentWord) {
                wordSpans[wordIndex].classList.remove("current", "incorrect");
                wordSpans[wordIndex].classList.add("correct");
            } else {
                wordSpans[wordIndex].classList.remove("current");
                wordSpans[wordIndex].classList.add("incorrect");
                totalMistakes++;
            }

            wordIndex++;
            inputField.value = "";

            if (wordIndex < wordsArr.length) {
                wordSpans[wordIndex].classList.add("current");
                wordSpans[wordIndex].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            } else {
                endGameSession();
            }

            activeRacers[0].progress = (wordIndex / wordsArr.length) * 100;
        }
    });

    function gameLoop() {
        const elapsedTime = (Date.now() - startTime) / 1000;
        document.getElementById("timerDisplay").innerText = `⏱ ${elapsedTime.toFixed(1)}s`;

        const minutes = elapsedTime / 60;
        const wpm = minutes > 0 ? Math.round((wordIndex / minutes)) : 0;
        document.getElementById("wpmDisplay").innerText = `⚡ WPM: ${wpm}`;

        // Accuracy Calculation
        const totalChecked = wordIndex;
        const correctWords = totalChecked - totalMistakes;
        const accuracy = totalChecked > 0 ? Math.max(0, Math.round((correctWords / totalChecked) * 100)) : 100;
        
        document.getElementById("accDisplay").innerText = `🎯 Acc: ${accuracy}%`;
        document.getElementById("mistakeDisplay").innerText = `❌ Errors: ${totalMistakes}`;

        activeRacers.forEach((racer, idx) => {
            const carEl = document.getElementById(`racer-car-${idx}`);
            if (carEl) {
                carEl.style.left = `${Math.min(racer.progress, 88)}%`;
            }
        });

        if (activeRacers[0].progress >= 100) {
            endGameSession();
        }
    }

    function endGameSession() {
        if (!isPlaying) return;
        isPlaying = false;
        clearInterval(timerInterval);

        const inputField = document.getElementById("typingInput");
        inputField.setAttribute("disabled", "true");
        inputField.blur();

        const elapsedTime = (Date.now() - startTime) / 1000;
        const minutes = elapsedTime / 60;
        const finalWpm = minutes > 0 ? Math.round((wordsArr.length / minutes)) : 0;
        const accuracy = Math.max(0, Math.round(((wordsArr.length - totalMistakes) / wordsArr.length) * 100));
        
        // Final Points calculation formula based on speed, accuracy, and spelling penalties
        const finalPoints = Math.max(0, Math.round((finalWpm * accuracy) - (totalMistakes * 15)));

        document.getElementById("typingInput").classList.add("hidden");
        document.getElementById("resultModal").classList.remove("hidden");
        document.getElementById("finalStatsText").innerHTML = `
            Speed: <b>${finalWpm} WPM</b><br>
            Accuracy: <b>${accuracy}%</b><br>
            Spelling Errors: <b>${totalMistakes}</b><br>
            Total Score Points: <b style="color: var(--accent); font-size: 20px;">${finalPoints} pts</b>
        `;
    }
</script>

</body>
</html>
