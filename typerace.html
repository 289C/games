<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS TypeRacer</title>
    <style>
        :root {
            --primary: #4a90e2;
            --success: #2ecc71;
            --error: #e74c3c;
            --bg: #f4f7f6;
            --track: #dfe6e9;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        /* Racing Track Styling */
        .track-container {
            position: relative;
            height: 60px;
            background: var(--track);
            border-radius: 30px;
            margin-bottom: 30px;
            overflow: hidden;
            border: 2px solid #ccc;
        }

        #car {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            font-size: 30px;
            transition: left 0.2s linear;
            z-index: 2;
        }

        .finish-line {
            position: absolute;
            right: 10px;
            top: 0;
            bottom: 0;
            width: 10px;
            background: repeating-linear-gradient(45deg, #000, #000 5px, #fff 5px, #fff 10px);
        }

        /* Stats Section */
        .stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .stat-box span { color: var(--primary); }

        /* Quote & Input Area */
        #quote-display {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            line-height: 1.6;
            font-size: 1.25rem;
            margin-bottom: 20px;
            min-height: 80px;
            border: 1px solid #eee;
        }

        /* Highlighting Logic */
        .correct { color: var(--success); }
        .incorrect { background-color: rgba(231, 76, 60, 0.2); color: var(--error); }
        .current { border-bottom: 3px solid var(--primary); }

        #input-field {
            width: 100%;
            padding: 15px;
            font-size: 1.1rem;
            border: 2px solid #ddd;
            border-radius: 8px;
            outline: none;
            box-sizing: border-box;
        }

        #input-field:focus { border-color: var(--primary); }

        button {
            margin-top: 20px;
            padding: 10px 25px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
        }

        button:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <div class="container">
        <div class="stats">
            <div class="stat-box">WPM: <span id="wpm">0</span></div>
            <div class="stat-box">Accuracy: <span id="accuracy">100%</span></div>
            <div class="stat-box">Time: <span id="timer">0s</span></div>
        </div>

        <div class="track-container">
            <div id="car">🏎️</div>
            <div class="finish-line"></div>
        </div>

        <div id="quote-display">Press "Start Race" to begin...</div>
        
        <input type="text" id="input-field" placeholder="Type here..." disabled>
        
        <div style="text-align: center;">
            <button id="start-btn">Start Race</button>
        </div>
    </div>

    <script>
        const quotes = [
            "The quick brown fox jumps over the lazy dog.",
            "Success is not final, failure is not fatal: it is the courage to continue that counts.",
            "In the middle of every difficulty lies opportunity.",
            "Programming isn't about what you know; it's about what you can figure out.",
            "The only way to do great work is to love what you do."
        ];

        const quoteDisplay = document.getElementById('quote-display');
        const inputField = document.getElementById('input-field');
        const startBtn = document.getElementById('start-btn');
        const wpmDisplay = document.getElementById('wpm');
        const accuracyDisplay = document.getElementById('accuracy');
        const timerDisplay = document.getElementById('timer');
        const car = document.getElementById('car');

        let timer = 0;
        let interval = null;
        let isPlaying = false;
        let currentQuote = "";
        let mistakes = 0;

        // Start/Reset Game
        startBtn.addEventListener('click', () => {
            resetGame();
            startGame();
        });

        function resetGame() {
            clearInterval(interval);
            timer = 0;
            mistakes = 0;
            isPlaying = false;
            inputField.value = "";
            inputField.disabled = false;
            wpmDisplay.innerText = "0";
            accuracyDisplay.innerText = "100%";
            timerDisplay.innerText = "0s";
            car.style.left = "0%";
            startBtn.innerText = "Restart Race";
        }

        function startGame() {
            // Select random quote
            currentQuote = quotes[Math.floor(Math.random() * quotes.length)];
            
            // Render quote as spans for individual highlighting
            quoteDisplay.innerHTML = '';
            currentQuote.split('').forEach(char => {
                const span = document.createElement('span');
                span.innerText = char;
                quoteDisplay.appendChild(span);
            });

            inputField.focus();
            isPlaying = true;
            
            // Start Timer
            interval = setInterval(() => {
                timer++;
                timerDisplay.innerText = timer + "s";
                calculateWPM();
            }, 1000);
        }

        // Handle Typing
        inputField.addEventListener('input', () => {
            const arrayQuote = quoteDisplay.querySelectorAll('span');
            const arrayValue = inputField.value.split('');
            
            let correctCount = 0;
            mistakes = 0;

            arrayQuote.forEach((span, index) => {
                const char = arrayValue[index];
                if (char == null) {
                    span.classList.remove('correct', 'incorrect', 'current');
                } else if (char === span.innerText) {
                    span.classList.add('correct');
                    span.classList.remove('incorrect', 'current');
                    correctCount++;
                } else {
                    span.classList.add('incorrect');
                    span.classList.remove('correct', 'current');
                    mistakes++;
                }

                // Add indicator for where the user is typing
                if (index === arrayValue.length) span.classList.add('current');
            });

            // Move Car
            const progress = (correctCount / currentQuote.length) * 90; // max 90% to avoid hitting wall
            car.style.left = progress + "%";

            // Accuracy Calculation
            const accuracy = Math.max(0, Math.round(((arrayValue.length - mistakes) / arrayValue.length) * 100));
            accuracyDisplay.innerText = (arrayValue.length > 0 ? accuracy : 100) + "%";

            // End Game Check
            if (correctCount === currentQuote.length) {
                endGame();
            }
        });

        function calculateWPM() {
            if (timer > 0) {
                // Formula: (Characters / 5) / (Time in Minutes)
                const words = inputField.value.length / 5;
                const minutes = timer / 60;
                const wpm = Math.round(words / minutes);
                wpmDisplay.innerText = wpm;
            }
        }

        function endGame() {
            clearInterval(interval);
            inputField.disabled = true;
            isPlaying = false;
            alert(`Race Finished! Final WPM: ${wpmDisplay.innerText}`);
        }
    </script>
</body>
</html>
