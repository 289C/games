<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Wishes Studio - All Categories</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }
    body {
      background: #0d0f18;
      color: #fff;
      min-height: 100vh;
      padding: 24px 14px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      touch-action: pan-y;
    }

    /* Top Category Header Pill */
    .top-header {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 10px 24px;
      border-radius: 30px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .top-header h1 {
      font-size: 1.1rem;
      color: #66fcf1;
      letter-spacing: 0.5px;
    }

    /* Game Card Grid Layout */
    .wishes-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      width: 100%;
      max-width: 480px;
    }

    .wish-card {
      background: #151722;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 16px 12px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: #fff;
      position: relative;
      transition: transform 0.2s, border-color 0.2s;
    }
    .wish-card:hover {
      transform: translateY(-3px);
      border-color: rgba(102, 252, 241, 0.4);
    }

    /* Floating Corner Badges */
    .card-badge {
      position: absolute;
      top: 10px;
      right: 12px;
      font-size: 0.62rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 12px;
      color: #fff;
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }
    .badge-pink { background: linear-gradient(135deg, #ff007f, #7928ca); }
    .badge-gold { background: linear-gradient(135deg, #f7971e, #ffd200); color: #000; }
    .badge-cyan { background: linear-gradient(135deg, #00d2ff, #005bea); }
    .badge-orange { background: linear-gradient(135deg, #f857a6, #ff5858); }
    .badge-green { background: linear-gradient(135deg, #11998e, #38ef7d); }

    /* App-Like Icon Box */
    .card-icon-box {
      width: 95px;
      height: 95px;
      border-radius: 18px;
      margin-top: 10px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.8rem;
      background: #1e2130;
      box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.5);
    }
    .card-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: #e0e0e0;
      text-align: center;
    }

    /* Bottom Home Return */
    .bottom-back {
      margin-top: 28px;
      color: #888;
      font-size: 0.85rem;
      text-decoration: none;
      transition: color 0.2s;
    }
    .bottom-back:hover {
      color: #66fcf1;
    }
  </style>
</head>
<body>

  <div class="top-header">
    <span>✨</span>
    <h1>Select Wishing Category</h1>
  </div>

  <div class="wishes-grid">
    <!-- Birthday Wishes -->
    <a href="birthday.html" class="wish-card">
      <span class="card-badge badge-pink">3D CAKE</span>
      <div class="card-icon-box">🎂</div>
      <span class="card-title">Birthday Wishes</span>
    </a>

    <!-- Anniversary Wishes -->
    <a href="anniversary.html" class="wish-card">
      <span class="card-badge badge-gold">ROMANTIC</span>
      <div class="card-icon-box">🥂</div>
      <span class="card-title">Anniversary 3D</span>
    </a>

    <!-- Wedding Wishes -->
    <a href="wedding.html" class="wish-card">
      <span class="card-badge badge-cyan">SPECIAL</span>
      <div class="card-icon-box">💍</div>
      <span class="card-title">Wedding Wishes</span>
    </a>

    <!-- Festival Wishes -->
    <a href="festival.html" class="wish-card">
      <span class="card-badge badge-orange">FESTIVE</span>
      <div class="card-icon-box">✨</div>
      <span class="card-title">Festival 3D</span>
    </a>

    <!-- Exam & Success Wishes -->
    <a href="success.html" class="wish-card">
      <span class="card-badge badge-green">GOALS</span>
      <div class="card-icon-box">🚀</div>
      <span class="card-title">Exam & Success</span>
    </a>

    <!-- Friendship Wishes -->
    <a href="friendship.html" class="wish-card">
      <span class="card-badge badge-pink">FRIENDS</span>
      <div class="card-icon-box">🎈</div>
      <span class="card-title">Friendship Wishes</span>
    </a>
  </div>

  <a href="../index.html" class="bottom-back">← Back to Arcade Home</a>

  <script>
    // Hardware & Android Gesture Back Navigation -> returns to Home (../index.html)
    history.pushState(null, null, location.href);
    window.onpopstate = function () {
      window.location.href = "../index.html";
    };

    // Scroll up / Swipe down back gesture at top of page
    let touchStartY = 0;
    window.addEventListener('touchstart', e => {
      touchStartY = e.touches[0].clientY;
    }, { passive: true });

    window.addEventListener('touchend', e => {
      let touchEndY = e.changedTouches[0].clientY;
      if (window.scrollY === 0 && touchEndY - touchStartY > 140) {
        window.location.href = "../index.html";
      }
    }, { passive: true });
  </script>
</body>
</html>
