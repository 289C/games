<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Wishes Studio ✨</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #0b0f19;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 14px 40px;
      overflow-x: hidden;
    }

    /* Top Pill Header */
    .header-pill {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 12px 28px;
      border-radius: 30px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .header-pill h1 {
      font-size: 1.15rem;
      font-weight: 700;
      background: linear-gradient(90deg, #ffdd59, #48dbfb, #ff9ff3);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 0.5px;
    }

    /* 2-Column Responsive Grid */
    .grid-container {
      width: 100%;
      max-width: 440px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    /* Card Design Matching Your App Screenshot */
    .category-card {
      position: relative;
      background: #111827;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 24px 12px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: #ffffff;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.45);
      transition: transform 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease;
      overflow: hidden;
      aspect-ratio: 1 / 1.08;
    }

    .category-card:active {
      transform: scale(0.96);
    }

    .category-card:hover {
      transform: translateY(-4px);
      border-color: rgba(255, 255, 255, 0.25);
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.6);
    }

    /* Top-Right Badge */
    .card-badge {
      position: absolute;
      top: 10px;
      right: 12px;
      font-size: 0.6rem;
      font-weight: 800;
      padding: 3px 9px;
      border-radius: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    /* Badge Themes */
    .badge-proposal { background: linear-gradient(135deg, #ff007f, #c2185b); }
    .badge-cake     { background: linear-gradient(135deg, #7b1fa2, #e91e63); }
    .badge-couple   { background: linear-gradient(135deg, #d4af37, #f59e0b); }
    .badge-wedding  { background: linear-gradient(135deg, #00b4d8, #0077b6); }
    .badge-festive  { background: linear-gradient(135deg, #ff4757, #ff6b81); }
    .badge-goals    { background: linear-gradient(135deg, #10b981, #059669); }
    .badge-friends  { background: linear-gradient(135deg, #ec4899, #8b5cf6); }

    /* Center Emoji Icon */
    .card-icon {
      font-size: 2.8rem;
      margin-bottom: 12px;
      filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.4));
      transition: transform 0.2s ease;
    }

    .category-card:hover .card-icon {
      transform: scale(1.12);
    }

    /* Bottom Centered Title */
    .card-title {
      font-size: 0.88rem;
      font-weight: 600;
      color: #e5e7eb;
      text-align: center;
      line-height: 1.25;
    }
  </style>
</head>
<body>

  <!-- Header Banner matching Screenshot -->
  <div class="header-pill">
    <h1>✨ Select Wishing Category</h1>
  </div>

  <!-- 2-Column Category Grid -->
  <div class="grid-container">

    <!-- 1. CRUSH PROPOSAL -->
    <a href="crush/index.html" class="category-card" onclick="tapFx()">
      <span class="card-badge badge-proposal">PROPOSAL</span>
      <div class="card-icon">💖</div>
      <div class="card-title">Crush Proposal</div>
    </a>

    <!-- 2. BIRTHDAY WISHES -->
    <a href="birthday/index.html" class="category-card" onclick="tapFx()">
      <span class="card-badge badge-cake">3D CAKE</span>
      <div class="card-icon">🎂</div>
      <div class="card-title">Birthday Wishes</div>
    </a>

    <!-- 3. ANNIVERSARY WISHES -->
    <a href="anniversary/index.html" class="category-card" onclick="tapFx()">
      <span class="card-badge badge-couple">COUPLE</span>
      <div class="card-icon">🥂</div>
      <div class="card-title">Anniversary Wishes</div>
    </a>

    <!-- 4. WEDDING WISHES -->
    <a href="wedding/index.html" class="category-card" onclick="tapFx()">
      <span class="card-badge badge-wedding">SPECIAL</span>
      <div class="card-icon">💍</div>
      <div class="card-title">Wedding Wishes</div>
    </a>

    <!-- 5. FESTIVAL 3D -->
    <a href="festival/index.html" class="category-card" onclick="tapFx()">
      <span class="card-badge badge-festive">FESTIVE</span>
      <div class="card-icon">✨</div>
      <div class="card-title">Festival 3D</div>
    </a>

    <!-- 6. EXAM & SUCCESS -->
    <a href="exam/index.html" class="category-card" onclick="tapFx()">
      <span class="card-badge badge-goals">GOALS</span>
      <div class="card-icon">🚀</div>
      <div class="card-title">Exam & Success</div>
    </a>

    <!-- 7. FRIENDSHIP -->
    <a href="friendship/index.html" class="category-card" onclick="tapFx()">
      <span class="card-badge badge-friends">FRIENDS</span>
      <div class="card-icon">🎈</div>
      <div class="card-title">Friendship Day</div>
    </a>

  </div>

  <script>
    function tapFx() {
      if (window.confetti) {
        confetti({
          particleCount: 45,
          spread: 60,
          origin: { y: 0.85 }
        });
      }
    }
  </script>
</body>
</html>
