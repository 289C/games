<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Festival Greetings & Menu 🪔✨ | Satish</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body, html {
      width: 100%;
      min-height: 100vh;
      background: #060914;
      color: #ffffff;
      overflow-x: hidden;
    }

    .festival-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 70px 16px 40px;
      background: radial-gradient(circle at 50% 15%, #201a08 0%, #0b0904 55%, #030201 100%);
      position: relative;
    }

    /* Ambient Floating Particles */
    .ambient-particle {
      position: absolute;
      pointer-events: none;
      font-size: 1.15rem;
      animation: floatDrift 7s linear infinite;
      z-index: 1;
      filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.6));
    }
    @keyframes floatDrift {
      0% { transform: translateY(105vh) rotate(0deg) scale(0.7); opacity: 0; }
      20% { opacity: 0.9; }
      80% { opacity: 0.9; }
      100% { transform: translateY(-8vh) rotate(360deg) scale(1.15); opacity: 0; }
    }

    /* Top Nav Bar */
    .top-bar {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 50;
    }
    .pill-btn {
      background: rgba(255, 215, 0, 0.15);
      border: 1px solid rgba(255, 215, 0, 0.4);
      color: #fff2b2;
      padding: 7px 16px;
      border-radius: 20px;
      font-size: 0.8rem;
      cursor: pointer;
      text-decoration: none;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 15px rgba(255, 215, 0, 0.2);
    }

    .container {
      width: 100%;
      max-width: 410px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      z-index: 10;
    }

    /* Glassmorphic Menu Card */
    .menu-card {
      background: linear-gradient(165deg, rgba(255, 255, 255, 0.06) 0%, rgba(20, 14, 5, 0.92) 100%);
      border: 1.5px solid rgba(255, 215, 0, 0.45);
      border-radius: 28px;
      padding: 24px 18px;
      box-shadow: 0 20px 45px rgba(0,0,0,0.7), 0 0 25px rgba(255, 215, 0, 0.18);
      backdrop-filter: blur(16px);
      text-align: center;
    }

    .card-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      color: #ffd700;
      margin-bottom: 4px;
      text-shadow: 0 0 12px rgba(255, 215, 0, 0.4);
    }
    .card-sub {
      font-size: 0.78rem;
      color: #ffe8a3;
      margin-bottom: 16px;
    }

    /* Festival Banner Options */
    .banner-option {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 215, 0, 0.3);
      border-radius: 18px;
      padding: 14px 16px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .banner-option:active {
      transform: scale(0.97);
      border-color: #ffd700;
    }

    .banner-info {
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
    }
    .banner-icon {
      font-size: 1.8rem;
      background: rgba(255, 215, 0, 0.15);
      padding: 8px;
      border-radius: 12px;
    }
    .banner-text h4 {
      font-size: 0.88rem;
      font-weight: 700;
      color: #fff2b2;
    }
    .banner-text p {
      font-size: 0.7rem;
      color: #d1b880;
    }
    .arrow-icon {
      font-size: 1.1rem;
      color: #ffd700;
      font-weight: 700;
    }

    /* Social Contact Box */
    .social-box {
      margin-top: 10px;
      background: rgba(0, 0, 0, 0.4);
      border: 1.5px solid rgba(255, 215, 0, 0.3);
      border-radius: 20px;
      padding: 16px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .social-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #fff;
      padding: 11px 16px;
      border-radius: 18px;
      font-size: 0.8rem;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }
  </style>
</head>
<body>

  <!-- BACKGROUND MUSIC AUDIO ELEMENT -->
  <audio id="bg-music" src="../1.mp3" loop preload="auto"></audio>

  <div class="festival-wrapper" id="main-wrap">
    
    <!-- Top Action Bar -->
    <div class="top-bar">
      <a href="../index.html" class="pill-btn">← Main Hub</a>
      <span class="pill-btn" id="stage-tag" onclick="toggleMusic()" style="cursor: pointer;" title="Toggle Music">🎵 Music</span>
    </div>

    <div class="container">
      
      <!-- MENU HEADER CARD -->
      <div class="menu-card">
        <div style="font-size: 2.5rem; margin-bottom: 4px;">🪔✨</div>
        <h2 class="card-title">Festival Hub & Menu</h2>
        <p class="card-sub">Choose a celebration banner or explore the feast menu curated by Satish</p>

        <!-- FESTIVAL BANNER OPTIONS -->
        <a href="menu.html" class="banner-option">
          <div class="banner-info">
            <span class="banner-icon">🍽️</span>
            <div class="banner-text">
              <h4>Festival Feast Menu</h4>
              <p>Explore traditional recipes & royal dishes</p>
            </div>
          </div>
          <span class="arrow-icon">➔</span>
        </a>

        <!-- SOCIAL CONTACT & DM SECTION -->
        <div class="social-box">
          <span style="font-size: 0.8rem; color: #ffd700; font-weight: 700;">💬 Connect with Satish</span>

          <!-- WhatsApp Button -->
          <a href="https://wa.me/9281267188?text=Hi%20Satish,%20I%20saw%20your%20festival%20website!" target="_blank" class="social-btn" style="background: linear-gradient(135deg, #25d366, #128c7e);">
            <span style="font-size: 1.1rem;">💬</span>
            <span>WhatsApp: 9281267188</span>
          </a>

          <!-- Instagram Button with Insta.jpg Logo -->
          <a href="https://instagram.com/_satish_official_16" target="_blank" class="social-btn" style="background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045);">
            <img src="../Insta.jpg" alt="Instagram Logo" style="width: 22px; height: 22px; border-radius: 50%; object-fit: cover; border: 1px solid #fff;" onerror="this.src='https://placehold.co/40x40/900/fff?text=IG';" />
            <span>IG: @_satish_official_16</span>
          </a>
        </div>

      </div>

    </div>

  </div>

  <!-- FIREBASE VISITOR TRACKER[span_0](start_span)[span_0](end_span) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script>
    const firebaseConfig = {
      databaseURL: "https://friendsgame-872f5-default-rtdb.firebaseio.com/"
    };
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    firebase.database().ref('visitors').push({
      page: window.location.pathname,
      time: new Date().toLocaleString(),
      device: navigator.userAgent
    });
  </script>

  <script>
    // BACKGROUND MUSIC CONTROLLER
    const bgMusic = document.getElementById('bg-music');
    bgMusic.volume = 0.6;
    let musicStarted = false;

    window.addEventListener('click', () => {
      if (!musicStarted) {
        bgMusic.play().then(() => {
          musicStarted = true;
          document.getElementById('stage-tag').innerText = "🔊 Playing 1.mp3";
        }).catch(e => {});
      }
    }, { once: true });

    function toggleMusic() {
      if (bgMusic.paused) {
        bgMusic.play();
        document.getElementById('stage-tag').innerText = "🔊 Playing 1.mp3";
      } else {
        bgMusic.pause();
        document.getElementById('stage-tag').innerText = "🔇 Music Paused";
      }
    }

    // AMBIENT FESTIVAL PARTICLES
    const wrap = document.getElementById('main-wrap');
    const icons = ['✨', '🪔', '⭐', '🎉', '🌟'];
    for (let i = 0; i < 14; i++) {
      const p = document.createElement('div');
      p.className = 'ambient-particle';
      p.innerText = icons[Math.floor(Math.random() * icons.length)];
      p.style.left = Math.random() * 100 + 'vw';
      p.style.animationDelay = (Math.random() * 6) + 's';
      p.style.animationDuration = (6 + Math.random() * 4) + 's';
      wrap.appendChild(p);
    }
  </script>
</body>
</html>
