<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Make a Wish & Blow the Candle! 🎂✨</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      width: 100%;
      min-height: 100%;
      background: #060914;
      color: #ffffff;
      overflow-x: hidden;
    }

    /* Ambient Festive Radial Glow */
    .party-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 14px 44px;
      background: radial-gradient(circle at 50% 18%, #142850 0%, #0c1833 55%, #050b18 100%);
      position: relative;
      overflow: hidden;
    }

    /* Top Nav Bar */
    .top-bar {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      z-index: 50;
    }
    .pill-btn {
      background: rgba(0, 180, 216, 0.15);
      border: 1px solid rgba(0, 180, 216, 0.4);
      color: #bbf2f6;
      padding: 7px 16px;
      border-radius: 20px;
      font-size: 0.8rem;
      cursor: pointer;
      text-decoration: none;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 15px rgba(0, 180, 216, 0.2);
    }

    /* Core Cute Card */
    .cake-stage-card {
      width: 100%;
      max-width: 390px;
      background: linear-gradient(165deg, #0e1a30 0%, #0a1324 100%);
      border: 1.5px solid rgba(0, 180, 216, 0.35);
      border-radius: 32px;
      padding: 34px 20px 28px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 35px rgba(0, 180, 216, 0.25);
      text-align: center;
      position: relative;
      animation: popCard 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popCard {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    .card-heading {
      font-family: 'Playfair Display', serif;
      font-size: 1.7rem;
      color: #caf0f8;
      margin-bottom: 6px;
      text-shadow: 0 0 15px rgba(0, 180, 216, 0.4);
    }
    .card-desc {
      font-size: 0.82rem;
      color: #90e0ef;
      margin-bottom: 24px;
    }

    /* 3D BIRTHDAY CAKE STAGE */
    .cake-container {
      position: relative;
      width: 250px;
      height: 220px;
      margin: 0 auto 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
    }

    /* Candle Element */
    .candle {
      position: absolute;
      top: 15px;
      width: 14px;
      height: 48px;
      background: repeating-linear-gradient(45deg, #ff4081, #ff4081 6px, #ffffff 6px, #ffffff 12px);
      border-radius: 6px 6px 0 0;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      z-index: 5;
    }
    .wick {
      position: absolute;
      top: -10px;
      left: 5px;
      width: 4px;
      height: 10px;
      background: #2b2b2b;
      border-radius: 2px;
    }

    /* Flickering Flame */
    .flame {
      position: absolute;
      top: -30px;
      left: 0px;
      width: 14px;
      height: 24px;
      background: radial-gradient(circle, #fff700 0%, #ff6d00 65%, rgba(255, 0, 0, 0.2) 100%);
      border-radius: 50% 50% 35% 35% / 70% 70% 35% 35%;
      box-shadow: 0 0 20px #ffea00, 0 0 35px #ff9100;
      animation: flicker 0.12s infinite alternate ease-in-out;
      transform-origin: 50% 90%;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }
    @keyframes flicker {
      0% { transform: scale(1) rotate(-2deg); }
      100% { transform: scale(1.1) rotate(2deg); }
    }

    /* Smoke Particle when Blown Out */
    .smoke {
      position: absolute;
      top: -32px;
      left: 3px;
      font-size: 1.2rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }

    /* 3D Cake Tiers */
    .cake-tier-top {
      width: 140px;
      height: 52px;
      background: linear-gradient(180deg, #ff9ebb 0%, #f72585 100%);
      border-radius: 18px 18px 6px 6px;
      box-shadow: inset 0 6px 10px rgba(255, 255, 255, 0.4), 0 4px 10px rgba(0, 0, 0, 0.3);
      position: relative;
      z-index: 4;
    }
    /* Frosting drips */
    .cake-tier-top::after {
      content: "";
      position: absolute;
      bottom: -6px;
      left: 0;
      right: 0;
      height: 10px;
      background: radial-gradient(circle, #ffffff 65%, transparent 70%);
      background-size: 20px 14px;
    }

    .cake-tier-bottom {
      width: 210px;
      height: 68px;
      background: linear-gradient(180deg, #ffd166 0%, #f4a261 100%);
      border-radius: 20px 20px 10px 10px;
      box-shadow: inset 0 6px 12px rgba(255, 255, 255, 0.35), 0 8px 20px rgba(0, 0, 0, 0.4);
      margin-top: -6px;
      position: relative;
      z-index: 3;
    }

    .cake-plate {
      width: 250px;
      height: 16px;
      background: linear-gradient(180deg, #e0e1dd 0%, #778da9 100%);
      border-radius: 50%;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
      margin-top: -5px;
      z-index: 2;
    }

    /* Audio Sensor Gauge */
    .meter-container {
      width: 100%;
      margin: 12px 0 16px;
    }
    .meter-bar-wrap {
      width: 180px;
      height: 7px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      margin: 0 auto;
      overflow: hidden;
    }
    .meter-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #00b4d8, #f72585);
      border-radius: 10px;
      transition: width 0.08s ease;
    }
    .status-text {
      font-size: 0.78rem;
      color: #ffd166;
      font-weight: 600;
      margin-top: 8px;
    }

    /* Interactive Buttons */
    .btn-action {
      width: 100%;
      padding: 13px;
      border-radius: 25px;
      border: none;
      background: linear-gradient(135deg, #00b4d8, #0077b6);
      color: #fff;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0, 180, 216, 0.4);
      transition: transform 0.15s, box-shadow 0.15s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-action:active { transform: scale(0.97); }

    .btn-alt {
      background: none;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #caf0f8;
      font-size: 0.78rem;
      padding: 8px 14px;
      border-radius: 18px;
      cursor: pointer;
      margin-top: 10px;
    }

    /* SUCCESS CELEBRATION BOX */
    #celebration-box {
      display: none;
      animation: popCard 0.45s ease forwards;
    }
  </style>
</head>
<body>

  <div class="party-wrapper">
    <div class="top-bar">
      <a href="index.html" class="pill-btn">← Back to Hub</a>
      <span class="pill-btn">🎂 Slot 1</span>
    </div>

    <!-- MAIN INTERACTIVE CAKE CARD -->
    <div class="cake-stage-card" id="cake-card">
      <h2 class="card-heading">Make a Secret Wish! ✨</h2>
      <p class="card-desc" id="mic-instruction">Blow into your microphone to blow out the candle! 🌬️</p>

      <!-- 3D LAYERED CAKE -->
      <div class="cake-container">
        <div class="candle">
          <div class="wick"></div>
          <div class="flame" id="flame-element"></div>
          <div class="smoke" id="smoke-element">💨</div>
        </div>
        <div class="cake-tier-top"></div>
        <div class="cake-tier-bottom"></div>
        <div class="cake-plate"></div>
      </div>

      <!-- AUDIO LEVEL GAUGE -->
      <div class="meter-container" id="meter-box">
        <div class="meter-bar-wrap">
          <div class="meter-fill" id="meter-fill"></div>
        </div>
        <p class="status-text" id="status-label">Tap button below to start microphone</p>
      </div>

      <!-- PRIMARY ACTION BUTTON -->
      <button class="btn-action" id="btn-mic-toggle" onclick="initMicSensor()">
        <span>🎙️ Enable Mic to Blow</span>
      </button>

      <!-- FALLBACK BUTTON (IF NO MIC PERMISSION) -->
      <button class="btn-alt" onclick="blowCandleManual()">
        Tap to blow manually 👆
      </button>
    </div>

    <!-- REVEALED WISH & CELEBRATION SCREEN -->
    <div class="cake-stage-card" id="celebration-box">
      <div style="font-size: 4rem; margin-bottom: 10px;">🎉🥳🎂</div>
      <h2 class="card-heading">Wish Sealed Forever!</h2>
      <p class="card-desc">May your year ahead be loaded with smiles, success, and endless joy! 💖</p>
      
      <a href="slot2.html" class="btn-action" style="text-decoration: none; margin-top: 10px;">
        <span>Open Birthday Gift 🎁 ➔</span>
      </a>
    </div>
  </div>

  <script>
    let audioContext = null;
    let analyser = null;
    let microphone = null;
    let isCandleLit = true;
    let isListening = false;

    // --- SYNTHETIC WEB AUDIO SFX ---
    let sfxCtx = null;
    function playSfx(type) {
      try {
        if (!sfxCtx) sfxCtx = new (window.AudioContext || window.webkitAudioContext)();
        const now = sfxCtx.currentTime;
        const osc = sfxCtx.createOscillator();
        const gain = sfxCtx.createGain();
        osc.connect(gain);
        gain.connect(sfxCtx.destination);

        if (type === 'extinguish') {
          // Soft puff sound
          osc.type = 'sine';
          osc.frequency.setValueAtTime(140, now);
          osc.frequency.exponentialRampToValueAtTime(40, now + 0.3);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
          osc.start(now);
          osc.stop(now + 0.3);
        } else if (type === 'cheer') {
          [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
            const o = sfxCtx.createOscillator();
            const g = sfxCtx.createGain();
            o.connect(g); g.connect(sfxCtx.destination);
            o.type = 'triangle';
            o.frequency.value = freq;
            g.gain.setValueAtTime(0.18, now + (i * 0.09));
            g.gain.exponentialRampToValueAtTime(0.01, now + (i * 0.09) + 0.5);
            o.start(now + (i * 0.09));
            o.stop(now + (i * 0.09) + 0.5);
          });
        }
      } catch (e) {}
    }

    // --- MICROPHONE DETECTION LOGIC ---
    async function initMicSensor() {
      if (isListening || !isCandleLit) return;

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 256;

        microphone = audioContext.createMediaStreamSource(stream);
        microphone.connect(analyser);

        isListening = true;
        document.getElementById('btn-mic-toggle').style.display = 'none';
        document.getElementById('status-label').innerText = "Now BLOW hard into your mic! 🌬️";

        monitorMicVolume();
      } catch (err) {
        alert("Microphone permission denied. You can tap the manual button below!");
        document.getElementById('status-label').innerText = "Mic blocked. Use manual button below.";
      }
    }

    function monitorMicVolume() {
      if (!isCandleLit || !isListening) return;

      const dataArray = new Uint8Array(analyser.frequencyBinCount);
      analyser.getByteFrequencyData(dataArray);

      let sum = 0;
      for (let i = 0; i < dataArray.length; i++) {
        sum += dataArray[i];
      }
      const averageVolume = sum / dataArray.length;

      // Update fill gauge
      const percent = Math.min(100, (averageVolume / 45) * 100);
      document.getElementById('meter-fill').style.width = percent + '%';

      // Threshold trigger: blowing air causes sudden broad frequency energy (usually > 40-50)
      if (averageVolume > 48) {
        extinguishCandle();
        return;
      }

      requestAnimationFrame(monitorMicVolume);
    }

    // --- CANDLE EXTINGUISH & CELEBRATION ---
    function blowCandleManual() {
      if (!isCandleLit) return;
      extinguishCandle();
    }

    function extinguishCandle() {
      isCandleLit = false;
      isListening = false;

      // Extinguish Flame Animation
      const flame = document.getElementById('flame-element');
      const smoke = document.getElementById('smoke-element');
      flame.style.opacity = '0';
      flame.style.transform = 'scale(0.2)';
      smoke.style.opacity = '1';

      playSfx('extinguish');

      // Vibrate phone if supported
      if (navigator.vibrate) navigator.vibrate([100, 50, 100]);

      // Confetti & Celebration Transition
      setTimeout(() => {
        playSfx('cheer');
        confetti({
          particleCount: 120,
          spread: 90,
          colors: ['#00b4d8', '#f72585', '#ffd166', '#ffffff']
        });

        document.getElementById('cake-card').style.display = 'none';
        document.getElementById('celebration-box').style.display = 'block';
      }, 700);
    }
  </script>
</body>
</html>
