<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Birthday 3D Studio - Create Wish</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body {
      background: radial-gradient(circle at top, #2b1055, #0b0c10);
      color: #fff; min-height: 100vh; padding: 30px 16px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .container {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 105, 180, 0.35);
      border-radius: 22px; width: 100%; max-width: 480px; padding: 26px 20px;
      backdrop-filter: blur(14px); box-shadow: 0 15px 35px rgba(0, 0, 0, 0.55);
    }
    .back-nav { color: #ff758c; text-decoration: none; font-size: 0.88rem; font-weight: 600; display: inline-block; margin-bottom: 14px; }
    .header-box { text-align: center; margin-bottom: 20px; }
    .header-box h1 { font-size: 1.7rem; color: #ff758c; }
    .header-box p { font-size: 0.85rem; color: #ccc; margin-top: 4px; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 0.82rem; color: #e0e0e0; margin-bottom: 6px; font-weight: 600; }
    input, textarea {
      width: 100%; padding: 11px 13px; border-radius: 12px;
      border: 1px solid #3d3a4d; background: #171524; color: #fff; font-size: 0.92rem; outline: none;
    }
    input:focus, textarea:focus { border-color: #ff758c; }
    
    /* File Upload Styling */
    .file-dropzone {
      border: 2px dashed #ff758c; border-radius: 12px; padding: 16px;
      text-align: center; cursor: pointer; background: rgba(255, 117, 140, 0.05);
      transition: background 0.2s;
    }
    .file-dropzone:hover { background: rgba(255, 117, 140, 0.15); }
    .preview-container {
      display: flex; gap: 8px; overflow-x: auto; margin-top: 10px; padding-bottom: 5px;
    }
    .preview-thumb {
      width: 60px; height: 60px; border-radius: 8px; object-fit: cover;
      border: 1px solid #ff758c; flex-shrink: 0;
    }

    .btn-launch {
      width: 100%; padding: 14px; border-radius: 25px; border: none;
      background: linear-gradient(135deg, #ff758c, #ff4081);
      color: #fff; font-weight: 700; font-size: 1rem; cursor: pointer;
      margin-top: 12px; box-shadow: 0 4px 18px rgba(255, 64, 129, 0.45);
    }
    .btn-launch:hover { opacity: 0.95; }
    .status-msg { font-size: 0.8rem; color: #ffe600; text-align: center; margin-top: 8px; display: none; }
  </style>
</head>
<body>

  <div class="container">
    <a href="../index.html" class="back-nav">← Back to Arcade</a>

    <div class="header-box">
      <h1>Birthday 3D Studio 🎂</h1>
      <p>Set up an interactive mic blow cake & 3D memory frames</p>
    </div>

    <div class="form-group">
      <label>Birthday Person's Name *</label>
      <input type="text" id="b-name" placeholder="e.g. Rahul" required />
    </div>

    <div class="form-group">
      <label>Your Name (Sender) *</label>
      <input type="text" id="b-from" placeholder="e.g. Satish" required />
    </div>

    <!-- Gallery Media Picker (Multiple Images & Videos) -->
    <div class="form-group">
      <label>Select Memories from Phone Gallery (Images & Videos)</label>
      <div class="file-dropzone" onclick="document.getElementById('media-input').click()">
        <p style="font-size: 0.85rem; color: #ff758c; font-weight: bold;">📁 Tap here to select from Gallery</p>
        <span style="font-size: 0.75rem; color: #aaa;">Select as many photos or videos as you like</span>
        <input type="file" id="media-input" accept="image/*,video/*" multiple style="display:none;" onchange="handleMediaSelect(event)" />
      </div>
      <div class="preview-container" id="preview-box"></div>
    </div>

    <div class="form-group">
      <label>Birthday Note</label>
      <textarea id="b-note" rows="3">Happy Birthday! May your day be packed with smiles, cake, and extraordinary moments! Keep shining bright! 🎂✨</textarea>
    </div>

    <p id="status-text" class="status-msg">Saving media to 3D engine...</p>
    <button class="btn-launch" id="launch-btn" onclick="saveAndStart3D()">Preview 3D Wish ➔</button>
  </div>

  <script>
    let selectedMedia = [];

    function handleMediaSelect(e) {
      const files = Array.from(e.target.files);
      const previewBox = document.getElementById('preview-box');
      previewBox.innerHTML = '';
      selectedMedia = [];

      files.forEach((file) => {
        const reader = new FileReader();
        reader.onload = (event) => {
          const isVideo = file.type.startsWith('video');
          selectedMedia.push({ data: event.target.result, isVideo: isVideo, name: file.name });

          if (!isVideo) {
            const img = document.createElement('img');
            img.src = event.target.result;
            img.className = 'preview-thumb';
            previewBox.appendChild(img);
          } else {
            const vidThumb = document.createElement('div');
            vidThumb.className = 'preview-thumb';
            vidThumb.style.background = '#222';
            vidThumb.style.display = 'flex';
            vidThumb.style.alignItems = 'center';
            vidThumb.style.justifyContent = 'center';
            vidThumb.style.fontSize = '1.2rem';
            vidThumb.innerText = '🎬';
            previewBox.appendChild(vidThumb);
          }
        };
        reader.readAsDataURL(file);
      });
    }

    // Save to IndexedDB so 3D scene can load infinite media without size limits
    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open("Wish3DDB", 1);
        req.onupgradeneeded = (e) => {
          e.target.result.createObjectStore("mediaStore", { keyPath: "id" });
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function saveAndStart3D() {
      const name = document.getElementById('b-name').value.trim();
      const from = document.getElementById('b-from').value.trim();
      const note = document.getElementById('b-note').value.trim();

      if (!name || !from) {
        alert("Please enter both the birthday person's name and your name!");
        return;
      }

      const status = document.getElementById('status-text');
      status.style.display = 'block';
      status.innerText = "Preparing 3D experience...";

      try {
        const db = await openDB();
        const tx = db.transaction("mediaStore", "readwrite");
        const store = tx.objectStore("mediaStore");
        store.put({
          id: "currentWish",
          receiver: name,
          sender: from,
          message: note,
          mediaList: selectedMedia
        });

        tx.oncomplete = () => {
          // If birthday.html is in /occasions/, wish3d.html is at ../wish3d.html
          window.location.href = "../wish3d.html?type=birthday";
        };
      } catch (err) {
        // Fallback standard redirection
        window.location.href = `../wish3d.html?type=birthday&name=${encodeURIComponent(name)}&from=${encodeURIComponent(from)}&note=${encodeURIComponent(note)}`;
      }
    }
  </script>
</body>
</html>
