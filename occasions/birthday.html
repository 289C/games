<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Birthday 3D Celebration</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #0b0c10; color: #fff; }
    
    #canvas-container { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }
    
    /* Top Bar */
    .top-bar {
      position: absolute; top: 16px; left: 16px; right: 16px;
      display: flex; justify-content: space-between; align-items: center; z-index: 25;
    }
    .btn-icon {
      background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff; padding: 7px 14px; border-radius: 20px; font-size: 0.8rem;
      cursor: pointer; backdrop-filter: blur(8px); text-decoration: none;
      display: inline-flex; align-items: center; gap: 6px;
    }

    /* HUD */
    .hud {
      position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
      z-index: 10; text-align: center; pointer-events: none; width: 90%; max-width: 500px;
    }
    .hud h1 { font-size: 1.55rem; color: #66fcf1; text-shadow: 0 0 12px rgba(102, 252, 241, 0.6); }
    .hud p { font-size: 0.82rem; color: #c5c6c7; margin-top: 4px; }

    /* Stage 1 Controls */
    .controls {
      position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
      z-index: 10; display: flex; gap: 12px;
    }
    .btn-action {
      padding: 11px 22px; border: none; border-radius: 25px;
      background: linear-gradient(135deg, #45a29e, #66fcf1); color: #0b0c10;
      font-weight: 700; cursor: pointer; font-size: 0.88rem; transition: transform 0.2s;
    }
    .btn-action:hover { transform: scale(1.04); }

    /* Stage 2 Tap-to-Reveal Memory Cards Overlay */
    #reveal-grid-layer {
      position: absolute; inset: 0; z-index: 20; display: none;
      align-items: center; justify-content: center; padding: 75px 16px 85px;
      overflow-y: auto; background: rgba(11, 12, 16, 0.75); backdrop-filter: blur(6px);
    }
    .memory-cards-container {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px;
      width: 100%; max-width: 440px; margin: auto;
    }
    .mem-card {
      position: relative; width: 100%; aspect-ratio: 1/1;
      border-radius: 16px; overflow: hidden; border: 1.5px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 10px 25px rgba(0,0,0,0.5); cursor: pointer; background: #1a1c29;
    }
    .mem-card img, .mem-card video {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .mystery-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(135deg, #ff4081, #7928ca);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity 0.4s ease, transform 0.4s ease; z-index: 2;
    }
    .mystery-overlay span { font-size: 2.2rem; }
    .mystery-overlay p { font-size: 0.75rem; font-weight: bold; margin-top: 5px; color: #fff; letter-spacing: 0.5px; }
    .revealed .mystery-overlay { opacity: 0; pointer-events: none; transform: scale(1.1); }
    .hd-badge {
      position: absolute; bottom: 6px; right: 6px; background: rgba(0,0,0,0.6);
      border-radius: 6px; padding: 2px 6px; font-size: 0.65rem; color: #66fcf1;
      display: none; z-index: 3;
    }
    .revealed .hd-badge { display: block; }

    /* Next to Balloon Button */
    .gallery-footer {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      z-index: 22; display: none;
    }

    /* Fullscreen High-Quality Lightbox */
    #hq-lightbox {
      position: fixed; inset: 0; z-index: 99; background: rgba(0,0,0,0.92);
      backdrop-filter: blur(14px); display: none; align-items: center; justify-content: center;
      padding: 16px;
    }
    #hq-lightbox-content {
      max-width: 95%; max-height: 85vh; border-radius: 16px;
      box-shadow: 0 0 35px rgba(102, 252, 241, 0.4); object-fit: contain;
    }
    .close-lightbox {
      position: absolute; top: 20px; right: 22px; font-size: 2rem; color: #fff;
      cursor: pointer; background: rgba(255,255,255,0.15); width: 44px; height: 44px;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
    }

    /* Note Modal (Stage 3 Balloons) */
    #note-modal {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.8);
      background: rgba(20, 20, 30, 0.95); border: 1px solid #66fcf1; border-radius: 16px;
      padding: 22px; text-align: center; z-index: 30; max-width: 320px; width: 85%;
      box-shadow: 0 0 30px rgba(102, 252, 241, 0.3); opacity: 0; pointer-events: none;
      transition: 0.3s;
    }
    #note-modal.active { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }

    /* Stage 4 Final Card & Reply Box */
    #final-view {
      position: absolute; bottom: 6%; left: 50%; transform: translateX(-50%);
      text-align: center; z-index: 25; background: rgba(15, 17, 26, 0.88);
      border: 1px solid rgba(255, 105, 180, 0.4); backdrop-filter: blur(14px);
      padding: 20px 22px; border-radius: 20px; display: none; width: 90%; max-width: 440px;
      max-height: 80vh; overflow-y: auto; box-shadow: 0 15px 40px rgba(0,0,0,0.7);
    }
    .reply-box {
      margin-top: 14px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.12);
      text-align: left;
    }
    .reply-box label { font-size: 0.78rem; color: #66fcf1; font-weight: bold; margin-bottom: 5px; display: block; }
    .reply-box input {
      width: 100%; padding: 10px 12px; border-radius: 12px; border: 1px solid #333;
      background: #11131c; color: #fff; font-size: 0.86rem; outline: none; margin-bottom: 8px;
    }
    .btn-reply {
      width: 100%; padding: 11px; border-radius: 20px; border: none;
      background: #25d366; color: #fff; font-weight: 700; font-size: 0.88rem;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
    }

    /* Admin Password & Edit Drawer */
    .admin-modal-overlay {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85);
      z-index: 100; display: none; align-items: center; justify-content: center; padding: 18px;
    }
    .admin-modal {
      background: #171822; border: 1px solid #ff758c; border-radius: 20px;
      width: 100%; max-width: 420px; padding: 24px; position: relative;
    }
    .admin-modal h3 { color: #ff758c; font-size: 1.2rem; margin-bottom: 8px; }
    .admin-modal p { font-size: 0.8rem; color: #aaa; margin-bottom: 16px; }
    .form-group { margin-bottom: 12px; text-align: left; }
    .form-group label { display: block; font-size: 0.78rem; color: #ccc; margin-bottom: 4px; font-weight: 600; }
    .admin-modal input, .admin-modal textarea {
      width: 100%; padding: 10px 12px; border-radius: 10px;
      border: 1px solid #333; background: #222433; color: #fff; font-size: 0.88rem; outline: none;
    }
    .file-btn {
      border: 1.5px dashed #ff758c; padding: 10px; border-radius: 10px;
      text-align: center; cursor: pointer; color: #ff758c; font-size: 0.8rem;
    }
    .btn-save {
      width: 100%; padding: 12px; border-radius: 20px; border: none;
      background: linear-gradient(135deg, #ff758c, #ff4081); color: #fff;
      font-weight: 700; cursor: pointer; margin-top: 10px; font-size: 0.9rem;
    }
    .close-modal { position: absolute; top: 16px; right: 18px; background: none; border: none; color: #888; font-size: 1.3rem; cursor: pointer; }
  </style>
</head>
<body>

  <!-- Top Controls -->
  <div class="top-bar">
    <button class="btn-icon" onclick="goBackStep()">← Back</button>
    <button class="btn-icon" onclick="openPasswordPrompt()">🔒 Edit Wish</button>
  </div>

  <div id="canvas-container"></div>

  <!-- HUD -->
  <div class="hud">
    <h1 id="stage-title">Stage 1: Blow the Candles 🎂</h1>
    <p id="stage-sub">Blow into your microphone or tap manual blow!</p>
  </div>

  <!-- Stage 1 Controls -->
  <div class="controls" id="cake-controls">
    <button class="btn-action" id="mic-btn" onclick="startMicDetection()">Enable Mic 🎙️</button>
    <button class="btn-action" onclick="extinguishCandles()">Manual Blow 💨</button>
  </div>

  <!-- Stage 2: Tap-to-Reveal Grid & HD Lightbox Trigger -->
  <div id="reveal-grid-layer">
    <div class="memory-cards-container" id="cards-grid"></div>
  </div>
  <div class="gallery-footer" id="gallery-footer">
    <button class="btn-action" style="background:#ff007f; color:#fff;" onclick="finishGalleryStage()">Pop Balloons 🎈</button>
  </div>

  <!-- Fullscreen HD Image/Video Viewer -->
  <div id="hq-lightbox" onclick="closeLightbox()">
    <span class="close-lightbox">&times;</span>
    <div id="lightbox-media-wrapper"></div>
  </div>

  <!-- Balloon Surprise Modal -->
  <div id="note-modal">
    <h3 style="color:#ffe600; margin-bottom:8px;">Surprise Note! 🎈</h3>
    <p id="modal-text" style="margin-bottom:14px;"></p>
    <button class="btn-action" onclick="closeModal()">Next</button>
  </div>

  <!-- Stage 4 Final Card & Reply System -->
  <div id="final-view">
    <h2 id="final-receiver" style="color:#ff007f; margin-bottom:6px;"></h2>
    <p id="final-message" style="margin-bottom: 10px; color: #ddd; font-size:0.9rem; line-height:1.5;"></p>
    <p id="final-sender" style="color: #66fcf1; font-weight: bold; font-size:0.85rem;"></p>

    <!-- Reply Section for Recipient -->
    <div class="reply-box">
      <label>💌 Send a Thank You Reply to Sender:</label>
      <input type="text" id="reply-input" placeholder="Type your sweet reply..." value="Thank you so much! Loved this 3D surprise! ❤️🎉" />
      <button class="btn-reply" onclick="sendWhatsAppReply()">
        <span>Reply on WhatsApp</span> 📲
      </button>
    </div>
  </div>

  <!-- Password Prompt Modal -->
  <div class="admin-modal-overlay" id="password-modal">
    <div class="admin-modal" style="max-width:340px;">
      <button class="close-modal" onclick="closeAdminModals()">&times;</button>
      <h3>Enter Admin Password 🔐</h3>
      <p>Only the creator can edit this wish.</p>
      <div class="form-group">
        <input type="password" id="admin-pass" placeholder="Enter password..." />
      </div>
      <button class="btn-save" onclick="verifyPassword()">Unlock Studio</button>
    </div>
  </div>

  <!-- Customizer Drawer Modal -->
  <div class="admin-modal-overlay" id="editor-modal">
    <div class="admin-modal">
      <button class="close-modal" onclick="closeAdminModals()">&times;</button>
      <h3>Customize Birthday 3D 🎨</h3>
      <p>Add memory photos and change celebration details</p>

      <div class="form-group">
        <label>Birthday Person's Name</label>
        <input type="text" id="edit-to" />
      </div>

      <div class="form-group">
        <label>Your Name (Sender)</label>
        <input type="text" id="edit-from" />
      </div>

      <div class="form-group">
        <label>Select Memories from Phone (Infinite Photos/Videos)</label>
        <div class="file-btn" onclick="document.getElementById('edit-files').click()">
          📁 Pick Images/Videos from Gallery
          <input type="file" id="edit-files" accept="image/*,video/*" multiple style="display:none;" onchange="handleAdminFiles(event)" />
        </div>
        <p id="file-count" style="font-size:0.75rem; color:#66fcf1; margin-top:4px;"></p>
      </div>

      <div class="form-group">
        <label>Personal Birthday Message</label>
        <textarea id="edit-msg" rows="3"></textarea>
      </div>

      <button class="btn-save" onclick="saveAdminChanges()">Save & Reload 3D ➔</button>
    </div>
  </div>

  <script>
    const ADMIN_PASSWORD = "satish123";

    let wishData = {
      receiver: "Rahul",
      sender: "Satish",
      message: "Happy Birthday! Wishing you a magnificent year packed with unstoppable success, good health, and joyful moments! Keep glowing! 🎂⭐",
      media: [
        { data: 'https://images.unsplash.com/photo-1513151233558-d860c5398176?w=1200&auto=format&fit=crop&q=85', isVideo: false },
        { data: 'https://images.unsplash.com/photo-1492684223066-81342ee5ff30?w=1200&auto=format&fit=crop&q=85', isVideo: false },
        { data: 'https://images.unsplash.com/photo-1464349095431-e9a21285b5f3?w=1200&auto=format&fit=crop&q=85', isVideo: false },
        { data: 'https://images.unsplash.com/photo-1530103862676-de8c9debad1d?w=1200&auto=format&fit=crop&q=85', isVideo: false }
      ]
    };

    // Load saved custom data
    const saved = localStorage.getItem("birthday_custom_wish");
    if (saved) {
      try { wishData = JSON.parse(saved); } catch(e){}
    }

    // Step-by-Step Back Navigation
    let currentStage = 1;
    history.pushState(null, null, location.href);
    window.onpopstate = function () { goBackStep(); };

    let touchStartY = 0;
    window.addEventListener('touchstart', e => { touchStartY = e.touches[0].clientY; }, { passive: true });
    window.addEventListener('touchend', e => {
      let touchEndY = e.changedTouches[0].clientY;
      if (touchEndY - touchStartY > 140) goBackStep();
    }, { passive: true });

    function goBackStep() {
      if (document.getElementById('hq-lightbox').style.display === 'flex') {
        closeLightbox();
        return;
      }
      if (currentStage > 1) {
        currentStage--;
        updateStageUI();
      } else {
        window.location.href = "index.html";
      }
    }

    // Three.js Setup
    let scene, camera, renderer, cakeGroup, balloonsGroup = [];
    let candleLights = [], flameMeshes = [], isBlownOut = false;
    let audioContext, analyser, microphone;

    function init3D() {
      const container = document.getElementById('canvas-container');
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 4, 12);
      camera.lookAt(0, 1.2, 0);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      container.appendChild(renderer.domElement);

      scene.add(new THREE.AmbientLight(0xffffff, 0.85));
      const spot = new THREE.SpotLight(0xffffff, 1.2);
      spot.position.set(5, 12, 10);
      scene.add(spot);

      buildCake();
      updateStageUI();
      animate();
    }

    function buildCake() {
      cakeGroup = new THREE.Group();
      candleLights = []; flameMeshes = []; isBlownOut = false;

      const plate = new THREE.Mesh(new THREE.CylinderGeometry(3.6, 3.2, 0.2, 32), new THREE.MeshStandardMaterial({ color: 0xdddddd }));
      cakeGroup.add(plate);

      const tier1 = new THREE.Mesh(new THREE.CylinderGeometry(3, 3, 1.5, 32), new THREE.MeshStandardMaterial({ color: 0xff4081 }));
      tier1.position.y = 0.85; cakeGroup.add(tier1);

      const tier2 = new THREE.Mesh(new THREE.CylinderGeometry(2, 2, 1.2, 32), new THREE.MeshStandardMaterial({ color: 0xfff0f5 }));
      tier2.position.y = 2.2; cakeGroup.add(tier2);

      [[-0.7, 0], [0.7, 0], [0, 0.7], [0, -0.7]].forEach(([x, z]) => {
        const stick = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.8, 16), new THREE.MeshStandardMaterial({ color: 0x48dbfb }));
        stick.position.set(x, 3.2, z); cakeGroup.add(stick);

        const flame = new THREE.Mesh(new THREE.SphereGeometry(0.12, 16, 16), new THREE.MeshBasicMaterial({ color: 0xffa502 }));
        flame.scale.set(1, 1.8, 1); flame.position.set(x, 3.7, z); cakeGroup.add(flame); flameMeshes.push(flame);

        const light = new THREE.PointLight(0xff7700, 1.5, 4);
        light.position.set(x, 3.8, z); cakeGroup.add(light); candleLights.push(light);
      });

      scene.add(cakeGroup);
    }

    async function startMicDetection() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();
        microphone = audioContext.createMediaStreamSource(stream);
        microphone.connect(analyser);
        analyser.fftSize = 256;
        document.getElementById('mic-btn').innerText = "Mic Active 🎙️";
        listenBlow();
      } catch (e) { alert("Mic unavailable. Tap 'Manual Blow'!"); }
    }

    function listenBlow() {
      if (isBlownOut || currentStage !== 1) return;
      const data = new Uint8Array(analyser.frequencyBinCount);
      analyser.getByteFrequencyData(data);
      let sum = data.reduce((a, b) => a + b, 0);
      if (sum / data.length > 65) return extinguishCandles();
      requestAnimationFrame(listenBlow);
    }

    function extinguishCandles() {
      if (isBlownOut) return;
      isBlownOut = true;
      flameMeshes.forEach(f => f.scale.set(0, 0, 0));
      candleLights.forEach(l => l.intensity = 0);
      confetti({ particleCount: 100, spread: 80, origin: { y: 0.6 } });
      setTimeout(() => { currentStage = 2; updateStageUI(); }, 1200);
    }

    // --- STAGE UI UPDATE ---
    function updateStageUI() {
      document.getElementById('cake-controls').style.display = 'none';
      document.getElementById('reveal-grid-layer').style.display = 'none';
      document.getElementById('gallery-footer').style.display = 'none';
      document.getElementById('final-view').style.display = 'none';

      if (currentStage === 1) {
        document.getElementById('stage-title').innerText = `Happy Birthday ${wishData.receiver}! 🎂`;
        document.getElementById('stage-sub').innerText = "Blow directly into microphone or tap manual blow!";
        document.getElementById('cake-controls').style.display = 'flex';
        if (cakeGroup) cakeGroup.position.y = 0;
        balloonsGroup.forEach(b => scene.remove(b));
      } else if (currentStage === 2) {
        document.getElementById('stage-title').innerText = "Stage 2: Tap to Reveal Memories 📸";
        document.getElementById('stage-sub').innerText = "Tap each mystery card to uncover & view full HD photo!";
        document.getElementById('reveal-grid-layer').style.display = 'flex';
        document.getElementById('gallery-footer').style.display = 'block';
        if (cakeGroup) cakeGroup.position.y = -12;
        buildMemoryCards();
      } else if (currentStage === 3) {
        document.getElementById('stage-title').innerText = "Stage 3: Pop the Balloons 🎈";
        document.getElementById('stage-sub').innerText = "Tap balloons to open surprise wishes!";
        spawnBalloons();
      } else if (currentStage === 4) {
        document.getElementById('stage-title').innerText = "Celebration Complete! ✨";
        document.getElementById('stage-sub').innerText = "";
        document.getElementById('final-receiver').innerText = `To ${wishData.receiver},`;
        document.getElementById('final-message').innerText = wishData.message;
        document.getElementById('final-sender').innerText = `— With love, ${wishData.sender}`;
        document.getElementById('final-view').style.display = 'block';
        confetti({ particleCount: 80, spread: 90 });
      }
    }

    // --- TAP-TO-REVEAL MEMORY CARDS ---
    function buildMemoryCards() {
      const grid = document.getElementById('cards-grid');
      grid.innerHTML = '';

      wishData.media.forEach((item, idx) => {
        const card = document.createElement('div');
        card.className = 'mem-card';
        card.id = `mem-card-${idx}`;

        let mediaElement = item.isVideo 
          ? `<video src="${item.data}" loop muted playsinline></video>`
          : `<img src="${item.data}" alt="Memory" loading="lazy" />`;

        card.innerHTML = `
          ${mediaElement}
          <div class="mystery-overlay">
            <span>🎁</span>
            <p>Tap to Reveal</p>
          </div>
          <span class="hd-badge">HD View 🔍</span>
        `;

        card.onclick = () => handleCardTap(card, item);
        grid.appendChild(card);
      });
    }

    function handleCardTap(card, item) {
      if (!card.classList.contains('revealed')) {
        card.classList.add('revealed');
        const vid = card.querySelector('video');
        if (vid) vid.play();
        confetti({ particleCount: 35, spread: 50 });
      } else {
        openLightbox(item);
      }
    }

    // --- FULL-SCREEN HD LIGHTBOX ---
    function openLightbox(item) {
      const box = document.getElementById('hq-lightbox');
      const wrapper = document.getElementById('lightbox-media-wrapper');
      wrapper.innerHTML = '';

      if (item.isVideo) {
        const vid = document.createElement('video');
        vid.src = item.data;
        vid.controls = true;
        vid.autoplay = true;
        vid.id = 'hq-lightbox-content';
        wrapper.appendChild(vid);
      } else {
        const img = document.createElement('img');
        img.src = item.data;
        img.id = 'hq-lightbox-content';
        wrapper.appendChild(img);
      }
      box.style.display = 'flex';
    }

    function closeLightbox() {
      const box = document.getElementById('hq-lightbox');
      const vid = box.querySelector('video');
      if (vid) vid.pause();
      box.style.display = 'none';
    }

    function finishGalleryStage() {
      currentStage = 3;
      updateStageUI();
    }

    // --- BALLOONS STAGE 3 ---
    function spawnBalloons() {
      balloonsGroup.forEach(b => scene.remove(b));
      balloonsGroup = [];
      const colors = [0xff4757, 0x2ed573, 0x1e90ff];
      const wishes = [
        "May every ambition of yours turn into gold! 🚀",
        "Keep that charming smile glowing bright! ✨",
        "Enjoy the absolute biggest slice of cake today! 🍰"
      ];

      [-2.8, 0, 2.8].forEach((x, i) => {
        const node = new THREE.Group();
        const geo = new THREE.SphereGeometry(1, 32, 32); 
        geo.scale(1, 1.25, 1);
        node.add(new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: colors[i], roughness: 0.3 })));
        const string = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 2.2, 8), new THREE.MeshBasicMaterial({ color: 0xffffff }));
        string.position.y = -2; 
        node.add(string);
        node.position.set(x, -0.2, 0);
        node.userData = { msg: wishes[i] };
        scene.add(node);
        balloonsGroup.push(node);
      });
    }

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    window.addEventListener('pointerdown', e => {
      if (currentStage !== 3) return;
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const hits = raycaster.intersectObjects(scene.children, true);
      if (hits.length > 0) {
        let obj = hits[0].object;
        while (obj.parent && obj.parent !== scene) obj = obj.parent;
        const idx = balloonsGroup.indexOf(obj);
        if (idx > -1) {
          confetti({ particleCount: 50, spread: 60 });
          document.getElementById('modal-text').innerText = obj.userData.msg;
          document.getElementById('note-modal').classList.add('active');
          scene.remove(obj);
          balloonsGroup.splice(idx, 1);
          if (balloonsGroup.length === 0) setTimeout(() => { currentStage = 4; updateStageUI(); }, 1000);
        }
      }
    });

    function closeModal() {
      document.getElementById('note-modal').classList.remove('active');
    }

    // --- REPLY ON WHATSAPP SYSTEM ---
    function sendWhatsAppReply() {
      const replyMsg = document.getElementById('reply-input').value.trim();
      if (!replyMsg) return alert("Please type a quick reply!");
      const text = encodeURIComponent(`Hi ${wishData.sender}! ${replyMsg}`);
      window.open(`https://api.whatsapp.com/send?text=${text}`, '_blank');
    }

    // --- ADMIN CONTROLS ---
    function openPasswordPrompt() {
      document.getElementById('password-modal').style.display = 'flex';
      document.getElementById('admin-pass').value = '';
    }

    function verifyPassword() {
      if (document.getElementById('admin-pass').value === ADMIN_PASSWORD) {
        document.getElementById('password-modal').style.display = 'none';
        document.getElementById('editor-modal').style.display = 'flex';
        document.getElementById('edit-to').value = wishData.receiver;
        document.getElementById('edit-from').value = wishData.sender;
        document.getElementById('edit-msg').value = wishData.message;
      } else {
        alert("Incorrect password! Access denied.");
      }
    }

    function closeAdminModals() {
      document.getElementById('password-modal').style.display = 'none';
      document.getElementById('editor-modal').style.display = 'none';
    }

    let tempMedia = [];
    function handleAdminFiles(e) {
      const files = Array.from(e.target.files);
      tempMedia = [];
      files.forEach(f => {
        const r = new FileReader();
        r.onload = ev => {
          tempMedia.push({ data: ev.target.result, isVideo: f.type.startsWith('video') });
          document.getElementById('file-count').innerText = `${tempMedia.length} files selected`;
        };
        r.readAsDataURL(f);
      });
    }

    function saveAdminChanges() {
      wishData.receiver = document.getElementById('edit-to').value.trim() || wishData.receiver;
      wishData.sender = document.getElementById('edit-from').value.trim() || wishData.sender;
      wishData.message = document.getElementById('edit-msg').value.trim() || wishData.message;
      if (tempMedia.length > 0) wishData.media = tempMedia;

      localStorage.setItem("birthday_custom_wish", JSON.stringify(wishData));
      alert("Celebration updated successfully! 🎉");
      closeAdminModals();
      location.reload();
    }

    function animate() {
      requestAnimationFrame(animate);
      if (currentStage === 1 && !isBlownOut) candleLights.forEach(l => l.intensity = 1.2 + Math.sin(Date.now() * 0.02) * 0.3);
      if (currentStage === 3) balloonsGroup.forEach((b, i) => { b.position.y += Math.sin(Date.now() * 0.003 + i) * 0.005; b.rotation.y += 0.008; });
      if (renderer) renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      if (!camera || !renderer) return;
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    window.onload = init3D;
  </script>
</body>
</html>
