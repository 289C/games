<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>FIBA 3D Basketball Pro - Arcade Arena</title>

  <!-- Three.js 3D Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    :root {
      --bg: #07090e;
      --card-bg: rgba(18, 24, 38, 0.92);
      --border: rgba(255, 255, 255, 0.14);
      --cyan: #00f2fe;
      --pink: #ff007f;
      --gold: #ffd700;
      --orange: #ff793f;
      --green: #2ecc71;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      background: radial-gradient(circle at 50% 10%, #151c30 0%, #06080d 100%);
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 10px 20px;
      overflow-x: hidden;
    }

    /* Pinned Instagram Header */
    .ig-header {
      width: 95%;
      max-width: 440px;
      margin-bottom: 10px;
      padding: 8px 16px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 50px;
      backdrop-filter: blur(14px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
      z-index: 10;
    }

    .ig-profile {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .dp-frame {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      padding: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .dp-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    .ig-name {
      font-size: 13px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .verified {
      background: #0095f6;
      color: #fff;
      font-size: 8px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .follow-btn {
      background: linear-gradient(135deg, #f58529, #dd2a7b, #8134af);
      color: #fff;
      text-decoration: none;
      font-size: 11px;
      font-weight: 800;
      padding: 6px 14px;
      border-radius: 20px;
      box-shadow: 0 2px 10px rgba(221, 42, 123, 0.4);
    }

    /* Game HUD */
    .hud-box {
      width: 95%;
      max-width: 440px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 10px 16px;
      margin-bottom: 8px;
    }

    .hud-stat {
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.5px;
    }

    .combo-pill {
      background: rgba(255, 215, 0, 0.15);
      border: 1px solid var(--gold);
      color: var(--gold);
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 900;
    }

    /* Decaying Shot Clock */
    .timer-container {
      width: 95%;
      max-width: 440px;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .timer-bar {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, var(--cyan), var(--orange));
      transition: width 0.1s linear;
    }

    /* 16:9 3D Arena Window */
    .screen-16-9 {
      position: relative;
      width: min(95vw, 440px);
      height: calc(min(95vw, 440px) * (9 / 16));
      border: 2px solid rgba(255, 255, 255, 0.16);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9), 0 0 25px rgba(255, 121, 63, 0.2);
      background: #040508;
      touch-action: none;
    }

    #canvas3d {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Swipe Trajectory Line Visual */
    .swipe-hint {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.65);
      padding: 4px 14px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      font-size: 11px;
      font-weight: 800;
      color: #fff;
      pointer-events: none;
      letter-spacing: 0.5px;
    }

    /* Floating Score Popup */
    .score-popup {
      position: absolute;
      font-weight: 900;
      font-size: 18px;
      pointer-events: none;
      animation: floatUp 0.7s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
      z-index: 30;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
    }

    @keyframes floatUp {
      0% { transform: translate(-50%, 0) scale(0.6); opacity: 1; }
      100% { transform: translate(-50%, -50px) scale(1.15); opacity: 0; }
    }

    /* Shot Zone Pill */
    .zone-indicator {
      width: 95%;
      max-width: 440px;
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
      padding: 0 4px;
    }

    .btn-reset {
      width: 95%;
      max-width: 440px;
      padding: 12px;
      border-radius: 16px;
      border: none;
      font-size: 13px;
      font-weight: 900;
      cursor: pointer;
      background: linear-gradient(135deg, var(--orange), #c0392b);
      color: #fff;
      box-shadow: 0 4px 18px rgba(255, 121, 63, 0.3);
      margin-top: 12px;
    }
  </style>
</head>
<body>

  <!-- Top Instagram Header -->
  <header class="ig-header">
    <div class="ig-profile">
      <div class="dp-frame">
        <img src="Insta.jpg" alt="DP" class="dp-img" onerror="this.onerror=null; this.src='insta.jpg';" />
      </div>
      <div>
        <div class="ig-name">@_satish_official_16 <span class="verified">✓</span></div>
        <div style="font-size:9px; color:rgba(255,255,255,0.6);">FIBA Basketball 3D Stadium</div>
      </div>
    </div>
    <a href="https://instagram.com/_satish_official_16" target="_blank" class="follow-btn">Follow ↗</a>
  </header>

  <!-- Match Stats HUD -->
  <div class="hud-box">
    <div class="hud-stat" style="color:var(--orange);" id="scoreDisplay">SCORE: 0</div>
    <div class="combo-pill" id="comboDisplay">1x STREAK</div>
    <div class="hud-stat" style="color:var(--cyan);" id="shotClock">SHOT CLOCK: 24s</div>
  </div>

  <div class="timer-container">
    <div class="timer-bar" id="clockBar"></div>
  </div>

  <!-- 3D Stadium Screen -->
  <div class="screen-16-9" id="gameFrame">
    <div class="swipe-hint" id="swipeHint">👆 SWIPE UP TO SHOOT</div>
    <canvas id="canvas3d"></canvas>
  </div>

  <div class="zone-indicator">
    <span style="font-size:11px; font-weight:800; color:var(--gold);" id="zoneText">📍 ZONE: 2-POINTER (MID-RANGE)</span>
    <span style="font-size:11px; font-weight:800; color:#fff;" id="shotsCount">SHOTS: 0</span>
  </div>

  <button class="btn-reset" onclick="resetMatch()">Restart Match 🏀</button>

  <script>
    // ==============================================
    // AUDIO SYNTHESIZER FOR BASKETBALL SFX
    // ==============================================
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playTone(freq, type = 'sine', duration = 0.08, gainVal = 0.2) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      g.gain.setValueAtTime(gainVal, audioCtx.currentTime);
      g.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(g);
      g.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    const SFX = {
      bounce: () => playTone(120, 'sine', 0.12, 0.4),
      rimClank: () => { playTone(540, 'triangle', 0.09, 0.35); setTimeout(() => playTone(320, 'sine', 0.15), 30); },
      swish: () => {
        playTone(920, 'sine', 0.08, 0.25);
        setTimeout(() => playTone(1200, 'triangle', 0.12, 0.3), 50);
      },
      cheer: () => {
        for (let i = 0; i < 4; i++) {
          setTimeout(() => playTone(400 + Math.random() * 300, 'sine', 0.15, 0.15), i * 60);
        }
      },
      buzzer: () => playTone(150, 'sawtooth', 0.35, 0.4)
    };

    // ==============================================
    // THREE.JS 3D STADIUM ARCHITECTURE
    // ==============================================
    let scene, camera, renderer;
    let ballMesh, hoopMesh, backboardMesh, netMesh;
    const spectators = [];

    // FIBA Rule Variables
    let score = 0;
    let streak = 1;
    let totalShots = 0;
    let shotClock = 24;
    let clockInterval = null;
    let isShooting = false;
    let shotScored = false;
    let currentZone = 2; // 2-pointer or 3-pointer

    // Physics parameters
    const hoopPos = new THREE.Vector3(0, 3.05, -7.5); // FIBA standard regulation height ratio
    const ballRadius = 0.32;
    const rimRadius = 0.58;

    const ballPhys = {
      pos: new THREE.Vector3(0, 0.32, 0),
      vel: new THREE.Vector3(0, 0, 0),
      rotVel: new THREE.Vector3(0, 0, 0),
      gravity: -0.019,
      inFlight: false
    };

    function init3D() {
      const frame = document.getElementById('gameFrame');
      const canvas = document.getElementById('canvas3d');

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x060810);
      scene.fog = new THREE.FogExp2(0x060810, 0.02);

      camera = new THREE.PerspectiveCamera(46, 16 / 9, 0.1, 100);
      camera.position.set(0, 2.4, 4.2);
      camera.lookAt(0, 2.6, -7.5);

      renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(frame.clientWidth, frame.clientHeight);
      renderer.shadowMap.enabled = true;

      // Arena Floodlighting
      const ambient = new THREE.AmbientLight(0xffffff, 0.65);
      scene.add(ambient);

      const courtLight = new THREE.DirectionalLight(0xfffaed, 0.9);
      courtLight.position.set(0, 14, -2);
      scene.add(courtLight);

      const rimHighlight = new THREE.PointLight(0xff793f, 1.4, 12);
      rimHighlight.position.set(0, 3.5, -7.2);
      scene.add(rimHighlight);

      buildCourt();
      buildHoop();
      buildStadiumStands();
      buildBall();
      bindSwipeControls();

      startShotClock();
      window.addEventListener('resize', onResize);
      animate();
    }

    // 1. High-Gloss Hardwood Court
    function buildCourt() {
      const floorGeo = new THREE.PlaneGeometry(16, 26);
      const floorMat = new THREE.MeshStandardMaterial({
        color: 0xd38d5f, // Polished maple wood
        roughness: 0.35,
        metalness: 0.1
      });
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.rotation.x = -Math.PI / 2;
      floor.position.set(0, 0, -6);
      scene.add(floor);

      // Key Lane & Perimeter Markings
      const keyGeo = new THREE.PlaneGeometry(3.6, 5.8);
      const keyMat = new THREE.MeshBasicMaterial({ color: 0x1e3799 });
      const keyLane = new THREE.Mesh(keyGeo, keyMat);
      keyLane.rotation.x = -Math.PI / 2;
      keyLane.position.set(0, 0.01, -7.0);
      scene.add(keyLane);
    }

    // 2. Regulation Hoop, Net, & Backboard
    function buildHoop() {
      // Backboard
      const bbGeo = new THREE.BoxGeometry(2.4, 1.6, 0.08);
      const bbMat = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        roughness: 0.2,
        transparent: true,
        opacity: 0.85
      });
      backboardMesh = new THREE.Mesh(bbGeo, bbMat);
      backboardMesh.position.set(0, 3.6, -8.1);
      scene.add(backboardMesh);

      // Inner Red Target Square
      const targetGeo = new THREE.PlaneGeometry(0.8, 0.6);
      const targetMat = new THREE.MeshBasicMaterial({ color: 0xff3838, side: THREE.DoubleSide });
      const target = new THREE.Mesh(targetGeo, targetMat);
      target.position.set(0, 3.45, -8.04);
      scene.add(target);

      // Metallic Rim
      const rimGeo = new THREE.TorusGeometry(rimRadius, 0.04, 10, 24);
      const rimMat = new THREE.MeshStandardMaterial({
        color: 0xff3838,
        metalness: 0.8,
        roughness: 0.2
      });
      hoopMesh = new THREE.Mesh(rimGeo, rimMat);
      hoopMesh.rotation.x = Math.PI / 2;
      hoopMesh.position.copy(hoopPos);
      scene.add(hoopMesh);

      // Hanging Net (Cylinder approximation)
      const netGeo = new THREE.CylinderGeometry(rimRadius, 0.38, 0.85, 12, 1, true);
      const netMat = new THREE.MeshBasicMaterial({
        color: 0xffffff,
        wireframe: true,
        transparent: true,
        opacity: 0.7
      });
      netMesh = new THREE.Mesh(netGeo, netMat);
      netMesh.position.set(hoopPos.x, hoopPos.y - 0.42, hoopPos.z);
      scene.add(netMesh);
    }

    // 3. Multi-Tier Crowd Stadium
    function buildStadiumStands() {
      const standColors = [0x2c3e50, 0x1e272e, 0x34495e];
      const fanColors = [0x00f2fe, 0xff007f, 0xffd700, 0x2ecc71, 0xffffff, 0xe74c3c];

      // Behind the backboard stadium tiers
      for (let tier = 0; tier < 6; tier++) {
        const tierGeo = new THREE.BoxGeometry(22, 0.8, 1.8);
        const tierMat = new THREE.MeshStandardMaterial({ color: standColors[tier % standColors.length] });
        const step = new THREE.Mesh(tierGeo, tierMat);
        step.position.set(0, 1.2 + tier * 0.9, -10.5 - tier * 1.5);
        scene.add(step);

        // Populate Spectator Crowd Humans
        for (let i = -8; i <= 8; i += 1.6) {
          const crowdGroup = new THREE.Group();
          
          // Human Body
          const bodyGeo = new THREE.BoxGeometry(0.5, 0.6, 0.4);
          const bodyMat = new THREE.MeshStandardMaterial({ color: fanColors[Math.floor(Math.random() * fanColors.length)] });
          const body = new THREE.Mesh(bodyGeo, bodyMat);

          // Human Head
          const headGeo = new THREE.SphereGeometry(0.2, 8, 8);
          const headMat = new THREE.MeshStandardMaterial({ color: 0xf3a683 });
          const head = new THREE.Mesh(headGeo, headMat);
          head.position.y = 0.45;

          crowdGroup.add(body);
          crowdGroup.add(head);

          crowdGroup.position.set(i + (Math.random() * 0.4), 1.8 + tier * 0.9, -10.5 - tier * 1.5);
          crowdGroup.userData = { baseY: crowdGroup.position.y, jumping: false, jumpPhase: Math.random() * Math.PI };
          scene.add(crowdGroup);
          spectators.push(crowdGroup);
        }
      }
    }

    // 4. 3D Basketball
    function buildBall() {
      const ballGeo = new THREE.SphereGeometry(ballRadius, 24, 24);
      const ballMat = new THREE.MeshStandardMaterial({
        color: 0xd35400, // Rich basketball leather
        roughness: 0.4,
        metalness: 0.05
      });
      ballMesh = new THREE.Mesh(ballGeo, ballMat);

      // Rib Ribbons
      const ribMat = new THREE.MeshBasicMaterial({ color: 0x111111, wireframe: true });
      const ribs = new THREE.Mesh(new THREE.SphereGeometry(ballRadius + 0.005, 12, 12), ribMat);
      ballMesh.add(ribs);

      scene.add(ballMesh);
      resetBallPosition();
    }

    function resetBallPosition() {
      // Pick dynamic shooting zones (Mid-range vs 3-Pointer)
      const isThreePointer = Math.random() > 0.55;
      currentZone = isThreePointer ? 3 : 2;

      document.getElementById('zoneText').textContent = isThreePointer 
        ? "📍 ZONE: 3-POINTER (DOWNTOWN)" 
        : "📍 ZONE: 2-POINTER (MID-RANGE)";

      const spawnZ = isThreePointer ? 1.2 : -0.8;
      const spawnX = (Math.random() - 0.5) * 3.2;

      ballPhys.pos.set(spawnX, ballRadius + 0.1, spawnZ);
      ballPhys.vel.set(0, 0, 0);
      ballPhys.rotVel.set(0, 0, 0);
      ballPhys.inFlight = false;
      shotScored = false;
      isShooting = false;

      ballMesh.position.copy(ballPhys.pos);
      document.getElementById('swipeHint').style.display = 'block';
    }

    // ==============================================
    // SWIPE CONTROLS & TRAJECTORY MECHANICS
    // ==============================================
    let touchStartX = 0, touchStartY = 0, touchStartTime = 0;

    function bindSwipeControls() {
      const frame = document.getElementById('gameFrame');

      const start = (clientX, clientY) => {
        if (ballPhys.inFlight) return;
        touchStartX = clientX;
        touchStartY = clientY;
        touchStartTime = performance.now();
      };

      const end = (clientX, clientY) => {
        if (ballPhys.inFlight) return;
        const deltaX = clientX - touchStartX;
        const deltaY = touchStartY - clientY; // Upward swipe is positive
        const deltaTime = Math.max(30, performance.now() - touchStartTime);

        if (deltaY > 30) {
          shootBall(deltaX, deltaY, deltaTime);
        }
      };

      frame.addEventListener('pointerdown', e => start(e.clientX, e.clientY));
      frame.addEventListener('pointerup', e => end(e.clientX, e.clientY));
    }

    function shootBall(deltaX, deltaY, deltaTime) {
      document.getElementById('swipeHint').style.display = 'none';
      ballPhys.inFlight = true;
      totalShots++;
      document.getElementById('shotsCount').textContent = `SHOTS: ${totalShots}`;

      // Calculate loft, arc, and trajectory velocity
      const power = Math.min(1.4, (deltaY / deltaTime) * 1.8);
      const angleH = (deltaX / window.innerWidth) * 4.2;

      ballPhys.vel.x = (hoopPos.x - ballPhys.pos.x) * 0.045 + angleH * 0.035;
      ballPhys.vel.y = 0.38 * power;
      ballPhys.vel.z = -0.32 * power;

      // Realistic Backspin
      ballPhys.rotVel.set(-0.25, 0, 0);
      SFX.bounce();
    }

    // ==============================================
    // GAME LOOP & COLLISION PHYSICS
    // ==============================================
    function updatePhysics() {
      if (ballPhys.inFlight) {
        ballPhys.vel.y += ballPhys.gravity;
        ballPhys.pos.add(ballPhys.vel);

        ballMesh.rotation.x += ballPhys.rotVel.x;
        ballMesh.rotation.y += ballPhys.rotVel.y;
        ballMesh.position.copy(ballPhys.pos);

        // 1. Backboard Collision
        if (
          ballPhys.pos.z <= -7.9 &&
          ballPhys.pos.z >= -8.15 &&
          Math.abs(ballPhys.pos.x) < 1.2 &&
          ballPhys.pos.y >= 2.8 &&
          ballPhys.pos.y <= 4.4
        ) {
          ballPhys.vel.z = Math.abs(ballPhys.vel.z) * 0.55;
          ballPhys.vel.y *= 0.8;
          SFX.rimClank();
        }

        // 2. Rim Ring Collision & Scoring
        const distToRimCenter = Math.hypot(ballPhys.pos.x - hoopPos.x, ballPhys.pos.z - hoopPos.z);

        // Ball crossing hoop plane downward
        if (
          !shotScored &&
          ballPhys.pos.y <= hoopPos.y &&
          ballPhys.pos.y >= hoopPos.y - 0.4 &&
          distToRimCenter < rimRadius * 0.85 &&
          ballPhys.vel.y < 0
        ) {
          registerBasket(distToRimCenter < 0.28);
        } else if (
          distToRimCenter < rimRadius + ballRadius &&
          distToRimCenter > rimRadius - 0.1 &&
          Math.abs(ballPhys.pos.y - hoopPos.y) < 0.2
        ) {
          // Clank off rim
          ballPhys.vel.y = Math.abs(ballPhys.vel.y) * 0.5;
          ballPhys.vel.x += (Math.random() - 0.5) * 0.08;
          SFX.rimClank();
        }

        // 3. Ground Bounce or Miss Reset
        if (ballPhys.pos.y <= ballRadius) {
          ballPhys.pos.y = ballRadius;
          ballPhys.vel.y = -ballPhys.vel.y * 0.45;
          SFX.bounce();

          if (Math.abs(ballPhys.vel.y) < 0.05) {
            if (!shotScored) {
              streak = 1;
              document.getElementById('comboDisplay').textContent = `1x STREAK`;
            }
            setTimeout(resetBallPosition, 500);
          }
        }
      }

      // Animate Cheering Crowd
      spectators.forEach(fan => {
        if (fan.userData.jumping) {
          fan.userData.jumpPhase += 0.15;
          fan.position.y = fan.userData.baseY + Math.abs(Math.sin(fan.userData.jumpPhase)) * 0.35;
        }
      });
    }

    function registerBasket(isSwish) {
      shotScored = true;
      let points = currentZone * streak;
      if (isSwish) {
        points += 1;
        SFX.swish();
        showScorePopup(`SWISH! +${points} 🎯`, '#00f2fe');
      } else {
        SFX.swish();
        showScorePopup(`+${points} POINTS! 🏀`, '#ffd700');
      }

      score += points;
      streak = Math.min(5, streak + 1);
      shotClock = 24; // Reset 24-second shot clock

      document.getElementById('scoreDisplay').textContent = `SCORE: ${score}`;
      document.getElementById('comboDisplay').textContent = `${streak}x STREAK`;

      // Trigger Crowd Cheering & Jumping
      SFX.cheer();
      spectators.forEach(fan => {
        fan.userData.jumping = true;
        setTimeout(() => { fan.userData.jumping = false; fan.position.y = fan.userData.baseY; }, 2000);
      });

      setTimeout(resetBallPosition, 900);
    }

    function startShotClock() {
      clearInterval(clockInterval);
      shotClock = 24;
      clockInterval = setInterval(() => {
        shotClock--;
        document.getElementById('shotClock').textContent = `SHOT CLOCK: ${shotClock}s`;
        document.getElementById('clockBar').style.width = (shotClock / 24 * 100) + '%';

        if (shotClock <= 0) {
          SFX.buzzer();
          streak = 1;
          document.getElementById('comboDisplay').textContent = `1x STREAK`;
          showScorePopup(`SHOT CLOCK VIOLATION! 🚨`, '#ff3838');
          resetBallPosition();
          shotClock = 24;
        }
      }, 1000);
    }

    function resetMatch() {
      score = 0;
      streak = 1;
      totalShots = 0;
      document.getElementById('scoreDisplay').textContent = 'SCORE: 0';
      document.getElementById('comboDisplay').textContent = '1x STREAK';
      document.getElementById('shotsCount').textContent = 'SHOTS: 0';
      resetBallPosition();
      startShotClock();
    }

    function showScorePopup(text, color) {
      const frame = document.getElementById('gameFrame');
      const pop = document.createElement('div');
      pop.className = 'score-popup';
      pop.textContent = text;
      pop.style.color = color;
      pop.style.left = '50%';
      pop.style.top = '40%';
      frame.appendChild(pop);
      setTimeout(() => pop.remove(), 700);
    }

    function onResize() {
      const frame = document.getElementById('gameFrame');
      renderer.setSize(frame.clientWidth, frame.clientHeight);
      camera.aspect = 16 / 9;
      camera.updateProjectionMatrix();
    }

    function animate() {
      requestAnimationFrame(animate);
      updatePhysics();
      renderer.render(scene, camera);
    }

    window.onload = init3D;
  </script>
</body>
</html>
