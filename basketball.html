<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tap-Tap Hoops</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;touch-action:none}
html,body{height:100%;overflow:hidden;background:#08090d;color:#fff;font-family:system-ui,sans-serif}
#game{height:100%;width:100%;max-width:560px;margin:auto;position:relative;overflow:hidden;background:radial-gradient(circle,#3e4042,#232527 72%)}
canvas{position:absolute;inset:0;width:100%;height:100%}
.top{height:58px;position:absolute;z-index:5;inset:0 0 auto;background:#090910f2;display:flex;align-items:center;padding:7px 8px;gap:8px}
.ig{display:flex;align-items:center;gap:8px;flex:1;color:#fff;text-decoration:none}
.dp{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:900;background:linear-gradient(45deg,#f09433,#dc2743,#bc1888);border:2px solid #fff6}
.ig b{font-size:11px}.ig small{display:block;color:#aaa;font-size:9px}
.btn{border:0;border-radius:10px;padding:9px 11px;color:#fff;background:#292c34;font-weight:900}
.exit{background:linear-gradient(135deg,#7346ff,#5630d8)}
.hud{position:absolute;z-index:4;top:70px;left:12%;right:12%;text-align:center}
.bar{height:10px;background:#65676a;border-radius:99px;overflow:hidden;box-shadow:0 4px #111}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff9d00,#ffd21a);transform-origin:left}
.score{font-size:58px;line-height:1;font-weight:1000;text-shadow:0 4px #111;margin-top:8px}.best{font-size:11px;color:#ddd}
.side{position:absolute;right:10px;top:70px;z-index:6;display:flex;gap:6px}.side button{font-size:18px;padding:7px 10px}
.tip{position:absolute;z-index:3;left:50%;top:43%;transform:translate(-50%,-50%);text-align:center;pointer-events:none}
.tip strong{font:900 21px Georgia}.tip span{display:block;font-size:11px;color:#ddd;margin-top:5px}.hide{opacity:0}
.flash{position:absolute;inset:0;z-index:8;background:#fff;opacity:0;pointer-events:none}.flash.go{animation:f .2s}@keyframes f{0%{opacity:.6}100%{opacity:0}}
.toast{position:absolute;z-index:9;top:25%;left:50%;transform:translate(-50%,-50%);font-size:28px;font-weight:1000;opacity:0;text-shadow:0 3px #111;white-space:nowrap}
.toast.go{animation:t .7s}@keyframes t{0%{opacity:0;transform:translate(-50%,-20%) scale(.7)}20%,75%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-75%) scale(1.1)}}
.layer{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:#060810e8;backdrop-filter:blur(8px);padding:20px;text-align:center}.layer.show{display:flex}
.card{width:min(90%,390px);background:#121622;border:1px solid #fff2;border-radius:26px;padding:28px;box-shadow:0 20px 80px #000}
.card h1{font-size:32px}.big{font-size:62px;font-weight:1000;color:#ffd21a}.card p{color:#aaa;margin:5px 0 18px}
.card button{width:100%;padding:14px;border:0;border-radius:14px;background:linear-gradient(135deg,#ff9d00,#ff3f9f);color:#fff;font-weight:1000;font-size:16px}
.pausebox button{background:linear-gradient(135deg,#7346ff,#18bfff)}
</style>
</head>
<body>
<div id="game">
<canvas id="c"></canvas>
<div class="top">
<a class="ig" href="https://instagram.com/_satish_official_16" target="_blank" rel="noopener">
<div class="dp">S</div><div><b>@_satish_official_16 ↗</b><small>Follow on Instagram</small></div>
</a>
<button class="btn exit" id="exit">🚪 Exit</button>
</div>
<div class="hud"><div class="bar"><i id="time"></i></div><div class="score" id="score">0</div><div class="best" id="best">BEST: 0</div></div>
<div class="side"><button class="btn" id="sound">🔊</button><button class="btn" id="pause">Ⅱ</button></div>
<div class="tip" id="tip"><strong>TAP-TAP HOOPS</strong><span>Tap to shoot • Score through the hoop!</span></div>
<div class="flash" id="flash"></div><div class="toast" id="toast"></div>
<div class="layer" id="pauseLayer"><div class="card pausebox"><h1>PAUSED</h1><p>Your run is waiting.</p><button id="resume">RESUME</button></div></div>
<div class="layer" id="over"><div class="card"><h1>🏀 GAME OVER</h1><div class="big" id="final">0</div><p id="finalText">Beat your best score!</p><button id="again">PLAY AGAIN</button></div></div>
</div>
<script>
const c=document.querySelector('#c'),x=c.getContext('2d');let W,H,D=1;
function size(){D=Math.min(devicePixelRatio||1,2);W=c.clientWidth;H=c.clientHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}addEventListener('resize',size);size();
const S={score:0,best:+localStorage.tapHoopsBest||0,time:100,combo:0,playing:true,paused:false,sound:true,shake:0,p:[],trail:[],tip:true};
document.querySelector('#best').textContent='BEST: '+S.best;let ball,hoop;
function reset(){ball={x:W*.22,y:H*.78,vx:0,vy:0,r:17,active:false,scored:false};hoop={x:W*.78,y:H*.53,w:96,dir:1,s:.65};S.trail=[]}reset();
function snd(f,d=.08,type='sine'){if(!S.sound)return;try{let A=snd.A||(snd.A=new AudioContext()),o=A.createOscillator(),g=A.createGain();o.type=type;o.frequency.value=f;g.gain.value=.06;g.gain.exponentialRampToValueAtTime(.001,A.currentTime+d);o.connect(g);g.connect(A.destination);o.start();o.stop(A.currentTime+d)}catch(e){}}
function burst(px,py,n=26){for(let i=0;i<n;i++){let a=Math.random()*6.28,q=1+Math.random()*5;S.p.push({x:px,y:py,vx:Math.cos(a)*q,vy:Math.sin(a)*q-2,life:1,r:2+Math.random()*4})}}
function toast(t){let e=document.querySelector('#toast');e.textContent=t;e.classList.remove('go');void e.offsetWidth;e.classList.add('go')}
function shoot(){if(!S.playing||S.paused||ball.active)return;if(S.tip){document.querySelector('#tip').classList.add('hide');S.tip=false}
let dx=hoop.x-ball.x,dy=hoop.y+8-ball.y,p=Math.max(10,Math.min(18,Math.hypot(dx,dy)/48));
ball.vx=dx/(p*4);ball.vy=dy/(p*4)-p*.62;ball.active=true;ball.scored=false;S.trail=[];snd(260,.05,'triangle')}
function moveHoopAfterScore(){
  // Move the basket to a new position after every successful shot.
  const oldX = hoop.x, oldY = hoop.y;
  let newX, newY;
  do {
    newX = W * (.57 + Math.random() * .27);
    newY = H * (.38 + Math.random() * .22);
  } while (Math.abs(newX-oldX) < W*.12 && Math.abs(newY-oldY) < H*.08);

  hoop.x = newX;
  hoop.y = newY;
  hoop.dir = Math.random() > .5 ? 1 : -1;
  hoop.s = Math.min(1.15, .55 + S.score * .025);

  burst(hoop.x, hoop.y, 18);
  toast('🎯 NEW BASKET!');
}

function score(){
  if(ball.scored)return;
  ball.scored=true;
  S.score++;S.combo++;S.time=Math.min(100,S.time+8);S.shake=4;
  burst(hoop.x,hoop.y+22);snd(660);setTimeout(()=>snd(880,.1),55);

  document.querySelector('#score').textContent=S.score;
  toast(S.combo>=3?'🔥 '+S.combo+'X COMBO!':'🏀 SWISH! +1');
  let f=document.querySelector('#flash');
  f.classList.remove('go');void f.offsetWidth;f.classList.add('go');

  if(S.score>S.best){
    S.best=S.score;
    localStorage.tapHoopsBest=S.best;
    document.querySelector('#best').textContent='BEST: '+S.best;
  }

  // Let the ball pass through the net, then move the basket.
  setTimeout(()=>{
    if(!S.playing || S.paused)return;
    moveHoopAfterScore();
    reset();
  },420);
}
function miss(){S.combo=0;S.time-=12;S.shake=7;snd(120,.18,'sawtooth');toast('MISS!')}
function update(dt){if(!S.playing||S.paused)return;hoop.x+=hoop.dir*hoop.s;if(hoop.x>W*.84)hoop.dir=-1;if(hoop.x<W*.56)hoop.dir=1;
S.time-=dt*1.7;document.querySelector('#time').style.width=Math.max(0,S.time)+'%';
if(ball.active){ball.vy+=18*dt;ball.x+=ball.vx*dt*60;ball.y+=ball.vy*dt*60;ball.vx*=.997;ball.vy*=.997;S.trail.push({x:ball.x,y:ball.y});if(S.trail.length>14)S.trail.shift();
let L=hoop.x-hoop.w/2,R=hoop.x+hoop.w/2,Y=hoop.y;if(!ball.scored&&ball.vy>0&&ball.y>Y-10&&ball.y<Y+22&&ball.x>L+10&&ball.x<R-10)score();
if(ball.y>H+70||ball.x<-70||ball.x>W+70){if(!ball.scored)miss();reset()}}
S.p.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.vy+=.15;q.life-=dt*1.7});S.p=S.p.filter(q=>q.life>0);S.shake*=.86;if(S.time<=0)gameOver()}
function court(){x.fillStyle='#292b2d';x.fillRect(0,0,W,H);let g=x.createRadialGradient(W/2,H/2,10,W/2,H/2,W*.75);g.addColorStop(0,'#444647');g.addColorStop(1,'#242628');x.fillStyle=g;x.fillRect(0,58,W,H-58);x.fillStyle='#202225';x.fillRect(0,H-75,W,75)}
function hoopDraw(){let q=hoop;x.save();x.translate(q.x,q.y);x.fillStyle='#eee';x.fillRect(q.w*.52,-75,17,190);x.fillStyle='#c78318';x.fillRect(q.w*.52+17,-8,75,12);x.fillRect(q.w*.52+8,55,23,65);
x.strokeStyle='#149ff0';x.lineWidth=7;x.beginPath();x.ellipse(0,0,q.w*.5,14,0,0,6.283);x.stroke();x.strokeStyle='#fff';x.lineWidth=2;
for(let i=-4;i<=4;i++){x.beginPath();x.moveTo(i*11,-1);x.lineTo(i*8,58);x.stroke()}for(let j=1;j<5;j++){x.beginPath();x.moveTo(-38+j*18,10+j*5);x.quadraticCurveTo(0,56+j*2,38-j*18,10+j*5);x.stroke()}x.restore()}
function ballDraw(){S.trail.forEach((q,i)=>{x.fillStyle='rgba(255,164,0,'+(i/S.trail.length*.18)+')';x.beginPath();x.arc(q.x,q.y,ball.r*(i/S.trail.length),0,6.283);x.fill()});
let g=x.createRadialGradient(ball.x-6,ball.y-8,2,ball.x,ball.y,ball.r+5);g.addColorStop(0,'#ffd45a');g.addColorStop(.45,'#ff9d00');g.addColorStop(1,'#ed5d00');x.fillStyle=g;x.beginPath();x.arc(ball.x,ball.y,ball.r,0,6.283);x.fill();
x.strokeStyle='#612c00';x.lineWidth=2.2;x.beginPath();x.arc(ball.x,ball.y,ball.r*.88,-.7,2.3);x.stroke();x.beginPath();x.arc(ball.x-4,ball.y,ball.r*.8,-1.2,1.2);x.stroke();x.beginPath();x.moveTo(ball.x-ball.r*.95,ball.y+3);x.quadraticCurveTo(ball.x,ball.y-10,ball.x+ball.r*.9,ball.y-3);x.stroke()}
function draw(){court();x.save();if(S.shake>1)x.translate((Math.random()-.5)*S.shake,(Math.random()-.5)*S.shake);hoopDraw();S.p.forEach(q=>{x.globalAlpha=q.life;x.fillStyle='#ffd21a';x.beginPath();x.arc(q.x,q.y,q.r*q.life,0,6.283);x.fill()});x.globalAlpha=1;ballDraw();x.restore()}
let last=0;function loop(t){let dt=Math.min(.035,(t-last)/1000||.016);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
function gameOver(){if(!S.playing)return;S.playing=false;document.querySelector('#final').textContent=S.score;document.querySelector('#finalText').textContent=S.score>=S.best?'🏆 New personal best!':'Keep tapping — beat your best!';document.querySelector('#over').classList.add('show');snd(90,.3,'sawtooth')}
function restart(){S.score=0;S.time=100;S.combo=0;S.playing=true;S.paused=false;S.tip=true;document.querySelector('#score').textContent=0;document.querySelector('#tip').classList.remove('hide');document.querySelector('#over').classList.remove('show');document.querySelector('#pauseLayer').classList.remove('show');reset()}
document.querySelector('#game').addEventListener('pointerdown',e=>{if(e.target.closest('.top,.side,.card'))return;shoot()});
document.querySelector('#again').onclick=restart;document.querySelector('#resume').onclick=()=>{S.paused=false;document.querySelector('#pauseLayer').classList.remove('show')};
document.querySelector('#pause').onclick=()=>{if(S.playing){S.paused=!S.paused;document.querySelector('#pauseLayer').classList.toggle('show',S.paused)}};
document.querySelector('#sound').onclick=()=>{S.sound=!S.sound;document.querySelector('#sound').textContent=S.sound?'🔊':'🔇'};
document.querySelector('#exit').onclick=()=>location.href='index.html';
</script>
</body>
</html>
